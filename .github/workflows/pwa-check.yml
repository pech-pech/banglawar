name: PWA check
on:
  pull_request:
    paths: ['pages/**', 'tools/**', '.github/workflows/pwa-check.yml']
  push:
    branches: [main]
    paths: ['pages/**', 'tools/**', '.github/workflows/pwa-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 tools/check_pwa.py pages
