<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moonstep - Ink and Moonlight</title>
<style>html,body{margin:0;background:#d9cfb8}canvas{display:block;width:344px;height:882px}</style></head>
<body><canvas id="c"></canvas>
<script>
(function(){
var W=344,H=882,DPR=window.devicePixelRatio||1,TAU=Math.PI*2;
var cv=document.getElementById('c');cv.width=W*DPR;cv.height=H*DPR;
var g=cv.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
var seed=7;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
var INK='#15171f',INK2='rgba(21,23,31,';
var PAPER='#f0e7d1';

// ---- paper
g.fillStyle=PAPER;g.fillRect(0,0,W,H);
var pg=g.createRadialGradient(W/2,H*0.45,60,W/2,H*0.5,H*0.75);
pg.addColorStop(0,'rgba(255,250,232,.55)');pg.addColorStop(1,'rgba(176,150,104,.32)');
g.fillStyle=pg;g.fillRect(0,0,W,H);
for(var i=0;i<5200;i++){g.fillStyle=rnd()<.5?'rgba(120,96,60,'+(rnd()*.10).toFixed(3)+')':'rgba(255,255,248,'+(rnd()*.22).toFixed(3)+')';g.fillRect(rnd()*W,rnd()*H,rnd()<.1?2:1,1)}
g.lineWidth=.5;for(i=0;i<70;i++){var fx=rnd()*W,fy=rnd()*H,fa=rnd()*TAU,fl=4+rnd()*10;g.strokeStyle='rgba(110,86,52,'+(.05+rnd()*.07).toFixed(3)+')';g.beginPath();g.moveTo(fx,fy);g.quadraticCurveTo(fx+Math.cos(fa)*fl/2+2,fy+Math.sin(fa)*fl/2-2,fx+Math.cos(fa)*fl,fy+Math.sin(fa)*fl);g.stroke()}
// faint wash clouds
for(i=0;i<5;i++){var cx=rnd()*W,cy=rnd()*H*.7,cr=60+rnd()*70,cg=g.createRadialGradient(cx,cy,0,cx,cy,cr);cg.addColorStop(0,'rgba(120,140,175,.07)');cg.addColorStop(1,'rgba(120,140,175,0)');g.fillStyle=cg;g.fillRect(cx-cr,cy-cr,cr*2,cr*2)}

// wobbly closed path
function wob(cx,cy,r,amp,n,ph){g.beginPath();var N=n||40;for(var k=0;k<=N;k++){var a=k/N*TAU,rr=r+Math.sin(a*3+ph)*amp+Math.sin(a*7+ph*2)*amp*.5;var x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;k?g.lineTo(x,y):g.moveTo(x,y)}g.closePath()}

function moonGlow(cx,cy,R,r,s){ // silver-blue halo
  var gl=g.createRadialGradient(cx,cy,r*.8,cx,cy,R);
  gl.addColorStop(0,'rgba(170,196,238,'+(.55*s)+')');gl.addColorStop(.45,'rgba(190,208,238,'+(.22*s)+')');gl.addColorStop(1,'rgba(200,215,240,0)');
  g.fillStyle=gl;g.beginPath();g.arc(cx,cy,R,0,TAU);g.fill();
}
function ring(cx,cy,R,a,col,dash){g.save();g.setLineDash(dash||[1,5]);g.lineCap='round';g.lineWidth=1.3;g.strokeStyle=col.replace('A',a);wob(cx,cy,R,.8,60,cx);g.stroke();g.restore()}

function planet(cx,cy,r,o){
  o=o||{};var ph=cx*.13+cy*.07;
  moonGlow(cx,cy,r*2.3,r,o.glow||1);
  // ink wash fill: lit from upper-left (moon side) pale, dark lower-right
  g.save();wob(cx,cy,r,1.4,48,ph);g.clip();
  var wg=g.createRadialGradient(cx-r*.4,cy-r*.45,r*.1,cx+r*.1,cy+r*.1,r*1.25);
  var c=o.tone||[[226,232,244],[142,152,176],[52,58,78]];
  wg.addColorStop(0,'rgb('+c[0]+')');wg.addColorStop(.55,'rgb('+c[1]+')');wg.addColorStop(1,'rgb('+c[2]+')');
  g.fillStyle=wg;g.fillRect(cx-r-4,cy-r-4,r*2+8,r*2+8);
  // wash blotches
  for(var i=0;i<6;i++){var a=rnd()*TAU,d=rnd()*r*.8,br=r*(.25+rnd()*.3);var bg=g.createRadialGradient(cx+Math.cos(a)*d,cy+Math.sin(a)*d,0,cx+Math.cos(a)*d,cy+Math.sin(a)*d,br);bg.addColorStop(0,'rgba(30,36,60,.18)');bg.addColorStop(1,'rgba(30,36,60,0)');g.fillStyle=bg;g.fillRect(cx-r,cy-r,r*2,r*2)}
  // grain: stipple denser in shadow
  var n=Math.floor(r*r*.55);
  for(i=0;i<n;i++){var px=cx+(rnd()*2-1)*r,py=cy+(rnd()*2-1)*r;var sh=((px-cx)*.6+(py-cy)*.8)/r;if(rnd()<.5+sh*.45){g.fillStyle=INK2+(.12+rnd()*.35).toFixed(2)+')';g.fillRect(px,py,1,1)}}
  // hatching craters
  var cr=o.craters||[[-.35,-.1,.28],[.3,.35,.22],[.1,-.5,.16],[-.1,.5,.15]];
  cr.forEach(function(q,qi){var qx=cx+q[0]*r,qy=cy+q[1]*r,qr=q[2]*r;
    g.beginPath();g.ellipse(qx,qy,qr,qr*.82,-.4,0,TAU);g.fillStyle='rgba(40,48,76,.14)';g.fill();
    g.save();g.beginPath();g.ellipse(qx,qy,qr,qr*.82,-.4,0,TAU);g.clip();
    g.strokeStyle=INK2+'.55)';g.lineWidth=.7;
    for(var h=-qr*2;h<qr*2;h+=2.3){g.beginPath();g.moveTo(qx+h-qr,qy+qr);g.lineTo(qx+h+qr,qy-qr);g.stroke()}
    g.restore();
    g.beginPath();g.ellipse(qx,qy,qr,qr*.82,-.4,0,TAU);g.lineWidth=1.1;g.strokeStyle=INK2+'.8)';g.stroke();
    // lit rim highlight on far side
    g.beginPath();g.ellipse(qx,qy,qr+1.4,qr*.82+1.4,-.4,Math.PI*.9,Math.PI*1.55);g.lineWidth=1;g.strokeStyle='rgba(250,250,255,.7)';g.stroke();
  });
  // terminator hatching along shadow edge
  g.strokeStyle=INK2+'.4)';g.lineWidth=.8;
  for(i=0;i<r*1.1;i++){var t=-.2+i/(r*1.1)*1.7,ang=t*Math.PI,ex=cx+Math.cos(ang)*r*.98,ey=cy+Math.sin(ang)*r*.98;
    if(Math.sin(ang)<.1&&Math.cos(ang)<.2)continue;g.beginPath();g.moveTo(ex,ey);g.lineTo(ex-Math.cos(ang)*(3+rnd()*r*.35)-2,ey-Math.sin(ang)*(3+rnd()*r*.35)-1);g.stroke()}
  g.restore();
  // double wobbly ink outline
  g.lineJoin='round';g.strokeStyle=INK;g.lineWidth=2.4;wob(cx,cy,r,1.2,60,ph);g.stroke();
  g.lineWidth=.8;g.strokeStyle=INK2+'.55)';wob(cx,cy,r+2.2,1.6,60,ph+2);g.stroke();
}

// ---- tide (black ink), drawn after bodies so we layer thumb zone atop; bodies first
var TIDE=766;
// bodies ---------------------------------------------------------
var bodies=[
 {x:150,y:660,r:40,R:92,k:'start'},
 {x:246,y:470,r:32,R:84,k:'spin'},
 {x:86,y:318,r:28,R:78,k:'crumble'},
 {x:236,y:168,r:30,R:86,k:'repel'}
];
// influence rings first
bodies.forEach(function(b){
  ring(b.x,b.y,b.R,'.4)',b.k==='repel'?'rgba(150,50,36,A':'rgba(21,23,31,A',[1,6]);
});
// fix color helper (rgba strings with A)
// (rings drawn above use replace('A',a): handled by passing prefix + 'A')

planet(bodies[0].x,bodies[0].y,bodies[0].r);
// spin
(function(){var b=bodies[1];planet(b.x,b.y,b.r,{tone:[[232,230,222],[158,152,150],[66,58,62]],craters:[[-.4,-.15,.26],[.3,.3,.24],[.05,-.5,.15]]});
 g.save();g.lineCap='round';g.strokeStyle='#8a5a14';g.lineWidth=3;
 for(var n=0;n<3;n++){var a=.5+n*TAU/3;g.beginPath();g.moveTo(b.x+Math.cos(a)*(b.r-7),b.y+Math.sin(a)*(b.r-7));g.lineTo(b.x+Math.cos(a)*(b.r+5),b.y+Math.sin(a)*(b.r+5));g.stroke();
  var ca=a+.24,cr=b.r+13,tx=-Math.sin(ca),ty=Math.cos(ca),px=b.x+Math.cos(ca)*cr,py=b.y+Math.sin(ca)*cr;g.lineWidth=2;g.beginPath();g.moveTo(px-Math.cos(ca)*4-tx*4,py-Math.sin(ca)*4-ty*4);g.lineTo(px+tx*4,py+ty*4);g.lineTo(px+Math.cos(ca)*4-tx*4,py+Math.sin(ca)*4-ty*4);g.stroke();g.lineWidth=3}
 g.restore()})();
// crumble: smaller, cracked, dashed
(function(){var b=bodies[2];planet(b.x,b.y,b.r*.88,{tone:[[222,224,232],[150,156,172],[70,74,90]],craters:[[-.3,.1,.3],[.35,-.25,.2]]});
 g.save();g.beginPath();g.rect(b.x-b.r*2,b.y-b.r*2,b.r*4,b.r*4);g.restore();
 g.strokeStyle=INK;g.lineWidth=1.3;g.lineCap='round';
 [[ -6,-22,4,-8,-3,4],[8,-18,12,-4,5,10],[-20,6,-8,10,-2,22]].forEach(function(c){g.beginPath();g.moveTo(b.x+c[0],b.y+c[1]);g.lineTo(b.x+c[2],b.y+c[3]);g.lineTo(b.x+c[4],b.y+c[5]);g.stroke()});
 g.setLineDash([5,5]);g.lineWidth=1.2;g.strokeStyle=INK2+'.6)';wob(b.x,b.y,b.r+1,1.5,50,3);g.stroke();g.setLineDash([]);
 // falling flecks
 for(var i=0;i<9;i++){g.fillStyle=INK2+'.5)';var fx=b.x-20+rnd()*40,fy=b.y+b.r*.6+rnd()*26;g.fillRect(fx,fy,1+rnd()*2,1+rnd()*2)}})();
// repel: warm vermilion-grey, pulse rings, spikes
(function(){var b=bodies[3];
 for(var i=0;i<3;i++){g.beginPath();g.arc(b.x,b.y,b.r+8+i*14,0,TAU);g.lineWidth=2-i*.5;g.strokeStyle='rgba(160,52,36,'+(.5-i*.15).toFixed(2)+')';g.setLineDash(i?[2,5]:[]);g.stroke();g.setLineDash([])}
 planet(b.x,b.y,b.r,{glow:.5,tone:[[238,214,200],[176,120,104],[84,36,34]],craters:[[-.3,-.2,.25],[.3,.3,.2],[.1,-.5,.14]]});
 g.strokeStyle='#8e2a1c';g.lineWidth=3;g.lineCap='round';
 for(i=0;i<4;i++){var a=i*TAU/4+Math.PI/4;g.beginPath();g.moveTo(b.x+Math.cos(a)*(b.r+3),b.y+Math.sin(a)*(b.r+3));g.lineTo(b.x+Math.cos(a)*(b.r+11),b.y+Math.sin(a)*(b.r+11));g.stroke()}})();

// ---- assist arc (dotted ink) start->spin
var S=bodies[0],P=bodies[1],rx=196,ry=548;
var arc=[[150,620],[158,596],[172,574],[196,548],[216,524],[228,508],[238,494],[244,486]];
// runner is on arc at (196,548); dots go forward (future) plus faint past
(function(){
 function dot(x,y,a,s){g.beginPath();g.arc(x,y,s,0,TAU);g.fillStyle=INK2+a+')';g.fill()}
 // smooth interpolation
 var pts=[];for(var i=0;i<arc.length-1;i++)for(var t=0;t<1;t+=.25)pts.push([arc[i][0]+(arc[i+1][0]-arc[i][0])*t,arc[i][1]+(arc[i+1][1]-arc[i][1])*t]);
 pts.forEach(function(p,i){var future=p[1]<ry;dot(p[0],p[1],future?'.85':'.25',future?2.1:1.4)});
 // landing mark: ink circle + wash
 g.beginPath();g.arc(244,484,8,0,TAU);g.fillStyle='rgba(180,205,245,.55)';g.fill();g.lineWidth=1.6;g.strokeStyle=INK;g.stroke();
})();

// ---- runner: silver moon-pearl with ink outline + streak
(function(){
 var dx=.55,dy=-.83;
 g.lineCap='round';g.strokeStyle=INK2+'.55)';g.lineWidth=2.6;g.beginPath();g.moveTo(rx,ry);g.quadraticCurveTo(rx-dx*10-3,ry-dy*10,rx-dx*26,ry-dy*26);g.stroke();
 g.strokeStyle=INK2+'.25)';g.lineWidth=5;g.beginPath();g.moveTo(rx-dx*8,ry-dy*8);g.lineTo(rx-dx*32,ry-dy*32);g.stroke();
 moonGlow(rx,ry,30,9,1.5);
 var rg=g.createRadialGradient(rx-3,ry-3,1,rx,ry,10);rg.addColorStop(0,'#ffffff');rg.addColorStop(1,'#bcd0ee');
 g.beginPath();g.arc(rx,ry,9,0,TAU);g.fillStyle=rg;g.fill();g.lineWidth=2.2;g.strokeStyle=INK;g.stroke();
 // charge ring (ink gold)
 g.beginPath();g.arc(rx,ry,15,0,TAU);g.lineWidth=2;g.strokeStyle='rgba(138,90,20,.75)';g.stroke();
})();

// ---- tide: black ink
(function(){
 // soft bleed above edge
 var bl=g.createLinearGradient(0,TIDE-26,0,TIDE);bl.addColorStop(0,'rgba(21,23,31,0)');bl.addColorStop(1,'rgba(21,23,31,.22)');g.fillStyle=bl;g.fillRect(0,TIDE-26,W,26);
 g.beginPath();g.moveTo(0,H);g.lineTo(0,TIDE);
 for(var x=0;x<=W;x+=4){var y=TIDE+Math.sin(x*.045)*5+Math.sin(x*.13+1)*2.6+Math.sin(x*.31)*1.2;g.lineTo(x,y)}
 g.lineTo(W,H);g.closePath();g.fillStyle='#0d0f16';g.fill();
 // drips
 for(var i=0;i<9;i++){var dxp=14+i*37+rnd()*10,dl=6+rnd()*16;g.fillStyle='#0d0f16';g.fillRect(dxp,TIDE-2,3,dl);g.beginPath();g.arc(dxp+1.5,TIDE-2+dl,2.4,0,TAU);g.fill()}
 // splatter above
 for(i=0;i<40;i++){g.fillStyle='rgba(13,15,22,'+(.4+rnd()*.5).toFixed(2)+')';g.beginPath();g.arc(rnd()*W,TIDE-4-rnd()*20,rnd()*1.6+.3,0,TAU);g.fill()}
 // dry-brush streaks + grain inside
 for(i=0;i<260;i++){g.fillStyle=rnd()<.6?'rgba(70,84,118,'+(rnd()*.25).toFixed(2)+')':'rgba(0,0,0,.3)';g.fillRect(rnd()*W,TIDE+6+rnd()*(H-TIDE),1+rnd()*10,.6)}
 // moonlit shimmer lines on ink
 g.lineCap='round';g.strokeStyle='rgba(160,186,230,.35)';g.lineWidth=1;
 for(i=0;i<5;i++){var yy=TIDE+14+i*13,xx=40+rnd()*220;g.beginPath();g.moveTo(xx,yy);g.lineTo(xx+20+rnd()*40,yy);g.stroke()}
})();

// ---- thumb zone: silver brush ring on ink + paper edge label
(function(){
 var cx=W/2,cy=832;
 g.save();g.setLineDash([2,6]);g.lineCap='round';g.lineWidth=1.6;g.strokeStyle='rgba(188,208,240,.6)';wob(cx,cy,34,.8,50,1);g.stroke();g.restore();
 g.beginPath();g.arc(cx,cy,26,0,TAU);var tg=g.createRadialGradient(cx,cy,2,cx,cy,26);tg.addColorStop(0,'rgba(188,208,240,.22)');tg.addColorStop(1,'rgba(188,208,240,0)');g.fillStyle=tg;g.fill();
 g.fillStyle='rgba(205,220,245,.75)';g.font='italic 12px Georgia, serif';g.textAlign='center';g.fillText('hold  ·  aim  ·  release',cx,cy-46);
 g.fillStyle='rgba(205,220,245,.55)';g.beginPath();g.arc(cx,cy,3,0,TAU);g.fill();
})();

// ---- HUD pill
(function(){
 var pw=140,ph=38,px=W/2-pw/2,py=18;
 g.save();g.shadowColor='rgba(21,23,31,.28)';g.shadowBlur=6;g.shadowOffsetY=2;
 g.beginPath();g.roundRect(px,py,pw,ph,19);g.fillStyle='#f8f1dd';g.fill();g.restore();
 g.beginPath();g.roundRect(px,py,pw,ph,19);g.lineWidth=2;g.strokeStyle=INK;g.stroke();
 g.beginPath();g.roundRect(px+3,py+3,pw-6,ph-6,16);g.lineWidth=.7;g.strokeStyle=INK2+'.5)';g.stroke();
 g.fillStyle=INK;g.font='700 19px Georgia, "Times New Roman", serif';g.textAlign='left';g.textBaseline='middle';g.fillText('1,284',px+16,py+ph/2+1);
 g.font='italic 12px Georgia, serif';g.fillStyle=INK2+'.7)';g.fillText('m',px+68,py+ph/2+3);
 // medal seal: silver moon with ink ring
 var mx=px+pw-24,my=py+ph/2;
 var mg=g.createRadialGradient(mx-3,my-3,1,mx,my,12);mg.addColorStop(0,'#fff');mg.addColorStop(1,'#a9bcdc');
 g.beginPath();g.arc(mx,my,11,0,TAU);g.fillStyle=mg;g.fill();g.lineWidth=2;g.strokeStyle=INK;g.stroke();
 g.beginPath();g.arc(mx+3,my-1,8.5,-1.3,1.3);g.lineWidth=1.4;g.strokeStyle=INK2+'.8)';g.stroke(); // crescent hint
 g.fillStyle=INK;g.font='700 8px Georgia, serif';g.textAlign='center';g.fillText('II',mx-2,my+1);
 g.fillStyle=INK2+'.7)';g.font='italic 10px Georgia, serif';g.fillText('Silver',px+pw/2+6,py+ph+13);
 g.textAlign='left';
})();

// vignette
var vg=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.7);vg.addColorStop(0,'rgba(60,40,20,0)');vg.addColorStop(1,'rgba(60,40,20,.2)');g.fillStyle=vg;g.fillRect(0,0,W,H);
})();
</script></body></html>
