<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moonstep look: Neon Vector</title>
<style>html,body{margin:0;background:#04050d}canvas{display:block;width:344px;height:882px}</style></head>
<body><canvas id="c" width="688" height="1764"></canvas>
<script>
(function(){
var c=document.getElementById('c'),g=c.getContext('2d'),W=344,H=882,TAU=Math.PI*2;
g.setTransform(2,0,0,2,0,0);
// seeded deterministic rng for stars
var sd=12345;function rnd(){sd=(sd*1664525+1013904223)>>>0;return sd/4294967296;}
// background: dark navy gradient + faint grid
var bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#050818');bg.addColorStop(0.7,'#0a1030');bg.addColorStop(1,'#1a0a3a');
g.fillStyle=bg;g.fillRect(0,0,W,H);
for(var i=0;i<70;i++){var x=rnd()*W,y=rnd()*H,a=0.15+rnd()*0.5;g.fillStyle='rgba(160,200,255,'+a.toFixed(2)+')';g.fillRect(x,y,rnd()<.2?2:1,1.2);}
g.strokeStyle='rgba(80,120,255,0.05)';g.lineWidth=1;
for(var gy=0;gy<H;gy+=42){g.beginPath();g.moveTo(0,gy+.5);g.lineTo(W,gy+.5);g.stroke();}
for(var gx=0;gx<W;gx+=43){g.beginPath();g.moveTo(gx+.5,0);g.lineTo(gx+.5,H);g.stroke();}

function glow(col,blur){g.shadowColor=col;g.shadowBlur=blur;}
function noglow(){g.shadowBlur=0;g.shadowColor='transparent';}
function ring(x,y,r,col,lw,blur,dash,alpha){g.save();g.globalCompositeOperation='lighter';g.globalAlpha=alpha==null?1:alpha;
 glow(col,blur);g.strokeStyle=col;g.lineWidth=lw;g.setLineDash(dash||[]);g.beginPath();g.arc(x,y,r,0,TAU);g.stroke();
 // hot core
 noglow();g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=Math.max(1,lw*.35);g.stroke();g.restore();}
function field(x,y,R,col,a){g.save();g.globalCompositeOperation='lighter';
 var rg=g.createRadialGradient(x,y,R*.2,x,y,R);rg.addColorStop(0,col.replace('A',a*.25));rg.addColorStop(1,col.replace('A',0));
 g.fillStyle=rg;g.beginPath();g.arc(x,y,R,0,TAU);g.fill();
 g.strokeStyle=col.replace('A',a*.35);g.lineWidth=1;g.setLineDash([2,5]);g.beginPath();g.arc(x,y,R,0,TAU);g.stroke();g.restore();}
function body(x,y,r,R,col,fcol){
 field(x,y,R,fcol,.8);
 g.save();g.fillStyle='rgba(6,10,30,.85)';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.restore();
 ring(x,y,r,col,2.5,16);
 // inner wireframe: latitude/longitude lines
 g.save();g.globalCompositeOperation='lighter';g.strokeStyle=col;g.globalAlpha=.28;g.lineWidth=1;
 g.beginPath();g.arc(x,y,r,0,TAU);g.clip();
 g.beginPath();g.ellipse(x,y,r*.45,r,0,0,TAU);g.stroke();
 g.beginPath();g.ellipse(x,y,r*.85,r*.3,0,0,TAU);g.stroke();
 g.beginPath();g.moveTo(x-r,y);g.lineTo(x+r,y);g.stroke();g.restore();}

// planets
// 1 normal (top)
body(112,168,30,92,'#35e6ff','rgba(53,230,255,A)');
// 2 repel
(function(){var x=244,y=318,r=24,R=84,col='#ff4fa0';
 body(x,y,r,R,col,'rgba(255,79,160,A)');
 for(var k=1;k<=2;k++)ring(x,y,r+k*20,col,1.5,8,[],.55-k*.2);
 g.save();g.globalCompositeOperation='lighter';glow(col,10);g.strokeStyle='#ffd0e6';g.lineWidth=2.5;g.lineCap='round';
 for(var q=0;q<4;q++){var a=q*TAU/4+Math.PI/4;g.beginPath();g.moveTo(x+Math.cos(a)*(r+4),y+Math.sin(a)*(r+4));g.lineTo(x+Math.cos(a)*(r+13),y+Math.sin(a)*(r+13));g.stroke();}
 g.restore();})();
// 3 crumble (dashed, partially eroded)
(function(){var x=84,y=470,r=26,R=82,col='#b8ff3c';
 field(x,y,R,'rgba(184,255,60,A)',.7);
 g.save();g.fillStyle='rgba(6,10,30,.85)';g.beginPath();g.arc(x,y,r-4,0,TAU);g.fill();g.restore();
 ring(x,y,r-4,col,2.5,14,[7,5]);
 ring(x,y,r,col,1,6,[2,5],.6);
 g.save();g.globalCompositeOperation='lighter';g.fillStyle=col;glow(col,8);
 [[x+30,y-22,2],[x+36,y-8,1.5],[x-34,y+18,2],[x+22,y+34,1.5],[x-26,y-30,1.5]].forEach(function(p){g.beginPath();g.arc(p[0],p[1],p[2],0,TAU);g.fill();});g.restore();})();
// 4 spin (amber with chevrons)
(function(){var x=236,y=600,r=30,R=90,col='#ffb02e';
 body(x,y,r,R,col,'rgba(255,176,46,A)');
 g.save();g.globalCompositeOperation='lighter';glow(col,12);g.strokeStyle='#ffe3a0';g.lineCap='round';
 for(var n=0;n<3;n++){var a=0.6+n*TAU/3;
  g.lineWidth=3;g.beginPath();g.moveTo(x+Math.cos(a)*(r-8),y+Math.sin(a)*(r-8));g.lineTo(x+Math.cos(a)*(r+5),y+Math.sin(a)*(r+5));g.stroke();
  var ca=a+.24,cr=r+13,tx=-Math.sin(ca),ty=Math.cos(ca),px=x+Math.cos(ca)*cr,py=y+Math.sin(ca)*cr;
  g.lineWidth=2;g.beginPath();g.moveTo(px-Math.cos(ca)*4-tx*4,py-Math.sin(ca)*4-ty*4);g.lineTo(px+tx*4,py+ty*4);g.lineTo(px+Math.cos(ca)*4-tx*4,py+Math.sin(ca)*4-ty*4);g.stroke();}
 g.restore();})();
// 5 start body (bottom-left)
body(96,706,36,100,'#a07bff','rgba(160,123,255,A)');
// start marker: small ticks
g.save();g.globalCompositeOperation='lighter';g.fillStyle='#d9c9ff';glow('#a07bff',8);g.beginPath();g.arc(96,706,3,0,TAU);g.fill();g.restore();

// tide: synthwave band
(function(){var ty=770;
 var tg=g.createLinearGradient(0,ty,0,H);tg.addColorStop(0,'rgba(255,40,150,.55)');tg.addColorStop(.35,'rgba(120,20,160,.75)');tg.addColorStop(1,'rgba(30,8,70,.95)');
 g.fillStyle=tg;g.fillRect(0,ty,W,H-ty);
 // perspective grid
 g.save();g.beginPath();g.rect(0,ty,W,H-ty);g.clip();g.globalCompositeOperation='lighter';g.strokeStyle='rgba(255,90,200,.55)';g.lineWidth=1;
 var vx=W/2;
 for(var i=-9;i<=9;i++){g.beginPath();g.moveTo(vx+i*10,ty);g.lineTo(vx+i*62,H);g.stroke();}
 for(var j=1;j<=7;j++){var yy=ty+Math.pow(j/7,1.8)*(H-ty);g.beginPath();g.moveTo(0,yy);g.lineTo(W,yy);g.stroke();}
 g.restore();
 // sun disc w/ stripes peeking
 g.save();g.beginPath();g.rect(0,ty,W,H-ty);g.clip();
 var sg=g.createLinearGradient(0,ty,0,ty+70);sg.addColorStop(0,'rgba(255,220,90,.0)');sg.addColorStop(1,'rgba(255,60,140,.0)');
 g.restore();
 // sinusoidal glowing surface line
 g.save();g.globalCompositeOperation='lighter';
 for(var p=0;p<3;p++){g.strokeStyle=p?'#ff5fb0':'#ffffff';g.globalAlpha=p?1:.8;glow('#ff2e93',p?22:6);g.lineWidth=p?3:1.2;
  g.beginPath();for(var x=0;x<=W;x+=4){var y=ty+Math.sin(x*.045)*3+Math.sin(x*.11+1)*1.5;if(x)g.lineTo(x,y);else g.moveTo(x,y);}g.stroke();}
 g.restore();
 // faint rise glow above
 var up=g.createLinearGradient(0,ty-60,0,ty);up.addColorStop(0,'rgba(255,40,150,0)');up.addColorStop(1,'rgba(255,40,150,.22)');
 g.fillStyle=up;g.fillRect(0,ty-60,W,60);
})();

// assist arc: from start body rim through runner toward spin body
var P0=[128,682],P1=[168,600],P2=[236,566]; // control points
function qb(t,i){return (1-t)*(1-t)*P0[i]+2*(1-t)*t*P1[i]+t*t*P2[i];}
g.save();g.globalCompositeOperation='lighter';
for(var k=0;k<=14;k++){var t=k/14;if(t<.22)continue;var ax=qb(t,0),ay=qb(t,1);var fa=1-t*.45;
 g.fillStyle='rgba(120,255,235,'+(fa*.9).toFixed(2)+')';glow('#3dffe0',8);g.beginPath();g.arc(ax,ay,2.2,0,TAU);g.fill();}
// landing marker
noglow();ring(236,566,7,'#3dffe0',2,10);g.restore();

// trail
g.save();g.globalCompositeOperation='lighter';
var RX=qb(.2,0),RY=qb(.2,1),dx=qb(.22,0)-qb(.18,0),dy=qb(.22,1)-qb(.18,1),m=Math.hypot(dx,dy);dx/=m;dy/=m;
for(var i=0;i<18;i++){var tt=.2-i*.011;if(tt<0)break;var tx=qb(tt,0),ty2=qb(tt,1),al=(1-i/18);
 glow('#00ffe0',10);g.fillStyle='rgba(0,255,230,'+(al*.45).toFixed(2)+')';g.beginPath();g.arc(tx,ty2,6.5*al+1,0,TAU);g.fill();}
g.restore();
// runner: additive glow orb
g.save();g.globalCompositeOperation='lighter';
var rg=g.createRadialGradient(RX,RY,0,RX,RY,36);rg.addColorStop(0,'rgba(255,255,255,.95)');rg.addColorStop(.18,'rgba(120,255,240,.7)');rg.addColorStop(.5,'rgba(0,200,255,.25)');rg.addColorStop(1,'rgba(0,120,255,0)');
g.fillStyle=rg;g.beginPath();g.arc(RX,RY,36,0,TAU);g.fill();
glow('#00ffe0',18);g.fillStyle='#ffffff';g.beginPath();g.arc(RX,RY,8,0,TAU);g.fill();
g.fillStyle='#e8fffc';g.beginPath();g.arc(RX,RY,8,0,TAU);g.fill();
// charge ring
g.strokeStyle='rgba(255,230,120,.8)';g.lineWidth=2;glow('#ffd36b',10);g.beginPath();g.arc(RX,RY,15,0,TAU);g.stroke();
g.restore();

// HUD pill
(function(){var w=156,h=40,x=(W-w)/2,y=18,r=20;
 g.save();g.fillStyle='rgba(8,12,36,.78)';g.beginPath();g.roundRect(x,y,w,h,r);g.fill();
 g.globalCompositeOperation='lighter';glow('#35e6ff',12);g.strokeStyle='#35e6ff';g.lineWidth=1.5;g.beginPath();g.roundRect(x,y,w,h,r);g.stroke();
 noglow();g.globalCompositeOperation='source-over';
 g.font='700 22px "Segoe UI",Roboto,Helvetica,Arial,sans-serif';g.textBaseline='middle';g.textAlign='left';
 glow('#35e6ff',8);g.fillStyle='#eaffff';g.fillText('1240',x+16,y+h/2+1);
 g.font='600 11px "Segoe UI",Roboto,Helvetica,Arial,sans-serif';g.fillStyle='#8ab';noglow();g.fillText('m',x+16+g.measureText('1240').width*0+ 58,y+h/2+4);
 // medal chip
 var mx=x+w-34,my=y+h/2;glow('#ffd36b',10);g.fillStyle='#ffd36b';g.beginPath();g.arc(mx,my,10,0,TAU);g.fill();noglow();
 g.fillStyle='#3a2600';g.font='800 11px Arial';g.textAlign='center';g.fillText('G',mx,my+1);
 g.restore();})();

// thumb zone
(function(){var x=14,y=796,w=W-28,h=70;
 g.save();g.setLineDash([4,5]);g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=1;g.beginPath();g.roundRect(x,y,w,h,18);g.stroke();
 g.setLineDash([]);g.fillStyle='rgba(255,255,255,.06)';g.beginPath();g.roundRect(x,y,w,h,18);g.fill();
 g.fillStyle='rgba(255,255,255,.75)';g.font='600 12px "Segoe UI",Roboto,Arial,sans-serif';g.textAlign='center';g.textBaseline='middle';
 g.shadowColor='#ff2e93';g.shadowBlur=8;g.fillText('HOLD TO CHARGE  •  RELEASE TO JUMP',W/2,y+h/2);g.restore();})();

// scanline vignette
g.save();var vg=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.7);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,10,.5)');g.fillStyle=vg;g.fillRect(0,0,W,H);g.restore();
})();
</script></body></html>
