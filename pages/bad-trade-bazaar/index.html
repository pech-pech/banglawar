<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bad Trade Bazaar</title>
<meta name="pgs-build" content="__PGS_BUILD__">
<script src="../_shared/update.js" defer></script>
<meta name="theme-color" content="#1a0f0a">
<meta name="color-scheme" content="dark">
<meta name="description" content="Trade bazaar goods for one day. Profit buys power. Losses teach lessons.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="day.css">
</head>
<body data-screen="start">

<!-- shared art, drawn once, reused with <use> (CSS/SVG only, no network) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffb347" stop-opacity=".65"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
    <g id="art-awning">
      <path d="M0 0h43v38a21.5 14 0 01-43 0z" fill="#b8322a"/><path d="M43 0h43v38a21.5 14 0 01-43 0z" fill="#f0dcae"/>
      <path d="M86 0h43v38a21.5 14 0 01-43 0z" fill="#b8322a"/><path d="M129 0h43v38a21.5 14 0 01-43 0z" fill="#f0dcae"/>
      <path d="M172 0h43v38a21.5 14 0 01-43 0z" fill="#b8322a"/><path d="M215 0h43v38a21.5 14 0 01-43 0z" fill="#f0dcae"/>
      <path d="M258 0h43v38a21.5 14 0 01-43 0z" fill="#b8322a"/><path d="M301 0h43v38a21.5 14 0 01-43 0z" fill="#f0dcae"/>
      <path d="M0 1h344" stroke="#5a1a14" stroke-width="3"/>
    </g>
    <g id="art-stall">
      <g><line x1="48" y1="0" x2="48" y2="26" stroke="#6b4a2a" stroke-width="2"/><circle cx="48" cy="40" r="27" fill="url(#glow)"/><rect x="39" y="26" width="18" height="26" rx="6" fill="#ffb347" stroke="#7a3f10" stroke-width="2"/><rect x="42" y="32" width="12" height="14" rx="4" fill="#fff0b0"/></g>
      <g><line x1="172" y1="0" x2="172" y2="48" stroke="#6b4a2a" stroke-width="2"/><circle cx="172" cy="62" r="33" fill="url(#glow)"/><rect x="163" y="48" width="18" height="26" rx="6" fill="#ffb347" stroke="#7a3f10" stroke-width="2"/><rect x="166" y="54" width="12" height="14" rx="4" fill="#fff0b0"/></g>
      <g><line x1="296" y1="0" x2="296" y2="22" stroke="#6b4a2a" stroke-width="2"/><circle cx="296" cy="36" r="27" fill="url(#glow)"/><rect x="287" y="22" width="18" height="26" rx="6" fill="#ffb347" stroke="#7a3f10" stroke-width="2"/><rect x="290" y="28" width="12" height="14" rx="4" fill="#fff0b0"/></g>
      <rect x="0" y="150" width="344" height="88" fill="#2a1a10"/><path d="M0 150h344" stroke="#7a5230" stroke-width="3"/>
      <g fill="#8a5a2c" stroke="#3b2310" stroke-width="2"><rect x="18" y="164" width="70" height="50" rx="3"/><rect x="104" y="172" width="58" height="42" rx="3"/><rect x="248" y="162" width="76" height="52" rx="3"/></g>
      <g fill="#e8923a"><circle cx="40" cy="160" r="9"/><circle cx="58" cy="158" r="9"/><circle cx="74" cy="161" r="9"/></g>
      <g fill="#6fbf73"><circle cx="268" cy="158" r="9"/><circle cx="288" cy="156" r="9"/><circle cx="306" cy="159" r="9"/></g>
      <g fill="#f5c542" stroke="#7a5a00" stroke-width="1.5"><circle cx="180" cy="200" r="8"/><circle cx="198" cy="204" r="8"/><circle cx="214" cy="198" r="8"/></g>
      <g transform="rotate(-2 172 110)"><rect x="70" y="96" width="204" height="40" rx="3" fill="#f3e6c4" stroke="#8b6b3a" stroke-width="2"/><circle cx="86" cy="116" r="5" fill="#2b1608"/><path d="M104 122l22-14 18 10 24-16 22 12 30-14" fill="none" stroke="#8a1f17" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g>
    </g>
  </defs>
</svg>

<div id="dev-badge" hidden>DEV</div>

<!-- ============ START ============ -->
<main id="screen-start" class="screen active">
  <div class="start-art" aria-hidden="true">
    <svg viewBox="0 0 344 238" preserveAspectRatio="xMidYMid slice"><use href="#art-stall"/><use href="#art-awning"/></svg>
  </div>
  <h1 id="title">Bad Trade Bazaar</h1>
  <p class="tagline">Trade bazaar goods for one day. Profit buys power. Losses teach lessons.</p>
  <button type="button" id="btn-play" class="btn big">Play</button>
  <button type="button" id="btn-settings-start" class="btn secondary">Settings</button>
  <div id="build-id">btb-lessons-1</div>
  <div style="text-align:center;font:700 10px/1.2 var(--sans);color:var(--cream2);opacity:.6"><span data-pgs-build></span></div>
</main>

<!-- ============ MORNING (filled by ui-day.js) ============ -->
<main id="screen-morning" class="screen"></main>

<!-- ============ RUN ============ -->
<main id="screen-run" class="screen">
  <div class="hud">
    <div class="timer"><span class="lbl">TIME</span><span id="hud-timer" class="v">3:00</span></div>
    <div class="cash"><span class="lbl">CASH</span><span id="hud-cash" class="v">$100.00</span></div>
    <button type="button" id="btn-settings" class="gear" aria-label="Settings">
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zm8.5 4.2v-1.4l-2-.6a6.8 6.8 0 00-.6-1.4l1-1.8-1-1-1.8 1a6.8 6.8 0 00-1.4-.6l-.6-2h-1.4l-.6 2a6.8 6.8 0 00-1.4.6l-1.8-1-1 1 1 1.8c-.3.4-.5.9-.6 1.4l-2 .6v1.4l2 .6c.1.5.3 1 .6 1.4l-1 1.8 1 1 1.8-1c.4.3.9.5 1.4.6l.6 2h1.4l.6-2c.5-.1 1-.3 1.4-.6l1.8 1 1-1-1-1.8c.3-.4.5-.9.6-1.4z" fill="none" stroke="#ffd77a" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="hud2"><span id="hud-day">Day 1</span><span id="hud-lots">Lots 3/3 free</span></div>
  <div id="banner" role="img" aria-label="Bad Trade Bazaar">
    <svg viewBox="0 0 344 52" preserveAspectRatio="xMidYMid slice"><use href="#art-awning"/><rect x="42" y="8" width="260" height="30" rx="6" fill="#2b1608" stroke="#f5c542" stroke-width="2"/><text x="172" y="30" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="20" letter-spacing="1.5" fill="#ffd77a">BAD TRADE BAZAAR</text></svg>
  </div>
  <div id="build-strip">
    <div class="slot power" id="strip-power-0"></div><div class="slot power" id="strip-power-1"></div><div class="slot power" id="strip-power-2"></div>
    <div class="slot lesson" id="strip-lesson-0"></div><div class="slot lesson" id="strip-lesson-1"></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div class="rows">
    <div class="row" id="row-0">
      <div class="info">
        <div class="line1"><span class="stock-name">Good</span><span class="kind"></span></div>
        <div class="line2"><span class="price" id="price-0">$0.00</span><span class="held" id="lots-0">No lots</span></div>
        <canvas class="spark" id="spark-0" width="200" height="60"></canvas>
      </div>
      <div class="btns">
        <button type="button" class="bs buy" id="buy-0"><span class="face">BUY</span><span class="chip" hidden></span></button>
        <button type="button" class="bs sell" id="sell-0" data-loss="0"><span class="face">SELL</span><span class="chip" hidden></span></button>
      </div>
    </div>
    <div class="row" id="row-1">
      <div class="info">
        <div class="line1"><span class="stock-name">Good</span><span class="kind"></span></div>
        <div class="line2"><span class="price" id="price-1">$0.00</span><span class="held" id="lots-1">No lots</span></div>
        <canvas class="spark" id="spark-1" width="200" height="60"></canvas>
      </div>
      <div class="btns">
        <button type="button" class="bs buy" id="buy-1"><span class="face">BUY</span><span class="chip" hidden></span></button>
        <button type="button" class="bs sell" id="sell-1" data-loss="0"><span class="face">SELL</span><span class="chip" hidden></span></button>
      </div>
    </div>
    <div class="row" id="row-2">
      <div class="info">
        <div class="line1"><span class="stock-name">Good</span><span class="kind"></span></div>
        <div class="line2"><span class="price" id="price-2">$0.00</span><span class="held" id="lots-2">No lots</span></div>
        <canvas class="spark" id="spark-2" width="200" height="60"></canvas>
      </div>
      <div class="btns">
        <button type="button" class="bs buy" id="buy-2"><span class="face">BUY</span><span class="chip" hidden></span></button>
        <button type="button" class="bs sell" id="sell-2" data-loss="0"><span class="face">SELL</span><span class="chip" hidden></span></button>
      </div>
    </div>
  </div>
</main>

<!-- ============ END (filled by ui-day.js) ============ -->
<main id="screen-end" class="screen"></main>

<!-- ============ SHOP (filled by ui-day.js) ============ -->
<main id="screen-shop" class="screen"></main>

<!-- ============ SETTINGS OVERLAY ============ -->
<div id="settings" role="dialog" aria-modal="true" aria-label="Settings">
  <header class="set-hdr"><h2>Settings</h2><button type="button" id="btn-settings-close" class="btn secondary sq" aria-label="Close settings">✕</button></header>
  <div id="settings-body"></div>
</div>

<script type="module" src="ui.js"></script>
</body>
</html>
