<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chart School</title>
<meta name="pgs-build" content="__PGS_BUILD__">
<script src="../_shared/update.js" defer></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0e14">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Stock Terminal UI v2: pro trading app look. Shared tokens. Makers: link this, do NOT edit. */
:root{
  --bg:#0b0e14; --surface:#131722; --surface2:#1c2230; --line:#2a3040; --grid:#1d2330;
  --text:#e6e9ef; --dim:#8a93a6; --faint:#5c667a;
  --x:#3d8bfd; --o:#f59f3a;            /* X / rising = blue, O / falling = orange. Never red vs green. */
  --accent:#5ad1b3; --warn:#f5c542; --bad:#ef6b6b;
  --r:10px; --pad:12px; --btn:52px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 var(--sans);-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.dim{color:var(--dim)} .faint{color:var(--faint)} .up{color:var(--x)} .down{color:var(--o)} .ok{color:var(--accent)} .warn{color:var(--warn)}
.cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad)}
.btn{height:var(--btn);border-radius:var(--r);border:1px solid var(--line);background:var(--surface2);color:var(--text);font:600 15px var(--sans);padding:0 14px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06241d}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.chip.fresh{border-color:var(--text);color:var(--text)} .chip.fresh.buy{border-color:var(--x);color:var(--x)} .chip.fresh.sell{border-color:var(--o);color:var(--o)} .chip.stale{color:var(--dim)}
/* fresh chips: ring by direction (buy blue, sell orange) plus the word 'this week'; mint is reserved for the primary button and OK checks */
.chip{font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg>button{flex:1;height:48px;background:var(--surface);color:var(--text);border:0;border-right:1px solid var(--line);font:600 14px var(--sans)}
.seg>button:last-child{border-right:0}
.seg>button.on{background:var(--surface2);box-shadow:inset 0 0 0 2px var(--text)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.bar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 12px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.dev{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:1px 6px}
.sheet{background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 12px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}

/* Chart School page CSS: merged from mockups desk/reading/marked/evidence (class names kept) + shell. pro.css supplies tokens. */
:root{--ts:1;--barh:76px}
html{overflow-x:hidden}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;max-width:900px;margin:0 auto;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#main{padding:0 8px calc(var(--barh) + 20px + env(safe-area-inset-bottom));min-width:0;zoom:var(--ts)}
#main>*{min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;height:28px;font-size:12px;color:var(--dim);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:6px;height:56px}
.ib{flex:none;width:48px;height:48px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;padding:0}
.ib svg{width:18px;height:18px;stroke:var(--text);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ttl{flex:1;min-width:0;padding-left:4px;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;font-size:12px;font-weight:400;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.stack{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.card{margin-bottom:8px}
.stack>.card{margin-bottom:0}
/* desk */
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.ar{padding:5px 0;border-bottom:1px solid var(--line)}.ar:last-child{border-bottom:0;padding-bottom:0}
.t1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm{font-size:14px;font-weight:600}.rt{font-size:14px;white-space:nowrap}.rt b{font-weight:700}
.bd{position:relative;height:8px;border-radius:4px;background:var(--surface2);margin:4px 0 3px}
.band{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.pt{position:absolute;top:-3px;width:3px;height:14px;margin-left:-1.5px;background:var(--text);border-radius:1px}
.few .band{background:transparent;border:1.5px dashed var(--dim)}
.few .pt{background:var(--dim)}
.t2{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.tf{color:var(--warn);font-weight:600}
.next .big{display:flex;justify-content:space-between;align-items:flex-end;margin:2px 0 8px}
.next .code{font-size:30px;font-weight:700;line-height:1}
.next .meta{font-size:12px;color:var(--dim);text-align:right;line-height:1.35}
.steps{display:flex;gap:4px;align-items:center;margin:6px 0}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--dim);flex:none}
.wk{flex:1;height:16px;border-radius:8px;border:1.5px dashed var(--dim);display:grid;place-items:center;font-size:11px;color:var(--dim)}
.list{font-size:12px;color:var(--dim);line-height:1.5}
.base{display:flex;gap:10px;align-items:flex-start}
.base svg{flex:none;margin-top:2px}
.base p{margin:0;font-size:14px}
/* chips, P&F, panes */
.chips{display:flex;gap:6px;margin:2px 0 8px;flex-wrap:wrap}
.chip{height:26px;padding:0 10px;white-space:nowrap}.chip svg{width:10px;height:10px}
.pf{padding:0;overflow:hidden}
.cs{display:flex;gap:5px;padding:8px 8px 6px;flex-wrap:wrap}
.cs span{height:22px;padding:0 7px;border:1px solid var(--line);border-radius:11px;font-size:11px;font-weight:600;line-height:20px;color:var(--dim);white-space:nowrap}
.cs.sp{justify-content:space-between;align-items:center;padding:8px 10px 6px;font-size:12px;color:var(--dim);flex-wrap:nowrap}
.cs.sp span,.cs .key,.cs .key span{height:auto;padding:0;border:0;border-radius:0;font-size:inherit;line-height:inherit;font-weight:inherit}
.cs b{color:var(--text);font-weight:600}
.cs .key{display:inline-flex;align-items:center;gap:5px}
.cs .key svg{width:14px;height:14px}
.pf svg,.pane svg,.pfwrap svg{display:block;max-width:100%}
.pfwrap{width:100%}
.pane{padding:8px 0 6px}
.ph{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;padding:0 12px}
.ph .t{font-weight:600}.ph .t i{font-style:normal;font-weight:400;color:var(--dim);margin-left:4px}.ph .v{font-weight:700}
.tax{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);padding:0 48px 0 12px}
.leg{font-size:11px;color:var(--dim);padding:2px 12px 0}
.lg{display:flex;flex-direction:column;gap:5px;padding:8px 12px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.lg span{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lg svg{width:26px;height:12px;flex:none}
.line1{padding:9px 12px;border-top:1px solid var(--line);font-size:14px;line-height:1.35}.line1 b{font-weight:700}
/* question, options, stepper */
.q h2{margin:0 0 4px;font-size:16px}
.q p{margin:0 0 10px;font-size:13px;color:var(--dim)}
.cap2{font-size:12px;color:var(--dim);margin:0 0 4px}
.pick{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:2px solid var(--text);border-radius:8px;font-size:13px;font-weight:600;margin-bottom:10px}
.pick i{width:12px;height:12px;border:2px solid var(--text);border-radius:2px;display:inline-block}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.opts.one{grid-template-columns:1fr}
.opts button,.opt{min-height:56px;height:56px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface2);color:var(--text);font:600 14px var(--sans);padding:0 8px;line-height:1.2;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.opts button.on,.opt.on{box-shadow:inset 0 0 0 2px var(--text);background:var(--surface)}
.opts button.on::before,.opt.on::before{content:"\2713";font-weight:700}
.seg>button{min-height:56px;height:56px}
.seg>button.on::before{content:"\2713 ";font-weight:700}
.stp{display:flex;align-items:center;gap:8px}
.stp .btn{flex:none;width:56px;height:56px;padding:0;font-size:24px;line-height:1}
.stp .qty{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:700;height:56px;line-height:54px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.stp .qty small{font-size:12px;font-weight:400;color:var(--dim);margin-left:4px}
/* marks row + marked + evidence */
.dots{display:flex;gap:6px;padding:8px 0 6px;margin:0}
.dots .d{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim)}
.dots .d svg{width:30px;height:30px;display:block;margin:0}
.dots .d i{font-style:normal;font-size:11px;font-weight:600;color:var(--dim)}
.dots .d.w i{color:var(--o)}
.dots .d span{white-space:normal;text-align:center;hyphens:manual;line-height:1.15;overflow-wrap:anywhere}
.dots .d.cur{color:var(--text);font-weight:700}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg svg{flex:none;width:28px;height:28px;margin-top:1px}
.msg p{margin:0;font-size:15px;line-height:1.4}.msg p b{font-weight:700}
.cmp .row{font-size:14px;padding:6px 0}.cmp .row .num{font-weight:700}
.po{display:flex;align-items:center;gap:10px;min-height:48px}
.po svg{flex:none;width:20px;height:20px}
.po .t{flex:1;font-size:14px;line-height:1.3}.po .t b{font-weight:700}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}.sh b{font-size:17px}
.mk{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-height:44px;padding:4px 0;border-bottom:1px solid var(--line);font-size:14px}
.mk:last-of-type{border-bottom:0}
.mk svg{flex:none;width:24px;height:24px}
.mk .n{flex:1;min-width:0}
.mk .r{flex:1 1 100%;padding-left:34px;text-align:left}
.mk .r span{display:block}
.mk .r{font-size:12px;font-weight:600;white-space:normal;overflow-wrap:anywhere}
.mk.bad .r{color:var(--o)}.mk.good .r{color:var(--x)}
.ev{font-size:14px;line-height:1.4;color:var(--dim)}.ev b{color:var(--text);font-weight:600}
.key2{display:flex;gap:14px;font-size:12px;color:var(--dim);margin:0 0 6px;align-items:center;flex-wrap:wrap}
.key2 span{display:inline-flex;align-items:center;gap:5px}.key2 svg{width:16px;height:16px}
.ttl .l1{font-size:20px;font-weight:700;line-height:24px;white-space:nowrap}
.ttl .l2{font-size:12px;line-height:16px;color:var(--dim);white-space:nowrap}
/* fixed bottom bar (VQA 5: bg + top divider on every screen, pinned) */
.bar{position:fixed;left:0;right:0;bottom:0;max-width:900px;margin:0 auto;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px;z-index:5}
.bar:empty{display:none}
.bar .btn{flex:1;min-width:0;height:56px;padding:0 8px;display:grid;place-items:center;white-space:nowrap}
.bar .btn.primary{flex:1.6}
.bar .btn.out{background:transparent}
.bar .btn:disabled{opacity:.45}
.btn.out{background:transparent}
.btn{min-height:48px}
/* modal: full-height scrollable sheet */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.modal.on{display:block}
.modal .panel{background:var(--surface);min-height:100%;max-width:900px;margin:0 auto;padding:14px 12px calc(24px + env(safe-area-inset-bottom));border:0;border-radius:0;box-sizing:border-box;zoom:var(--ts)}
.panel h2{margin:0 0 8px;font-size:18px}.panel h3{margin:14px 0 6px;font-size:14px;color:var(--dim)}
.panel p{margin:0 0 8px;font-size:14px;line-height:1.4}
.panel .btn{margin:4px 4px 4px 0}
.panel input[type=text],.panel input[type=number],.panel select{height:48px;min-width:0;max-width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--text);font:14px var(--sans);padding:0 10px}
.panel label{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;font-size:14px;border-bottom:1px solid var(--line)}
.panel .trow{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--line)}
.panel input[type=checkbox]{width:24px;height:24px}
.panel pre,.panel textarea{max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}
/* high contrast */
body.hc{--text:#fff;--dim:#d0d6e2;--faint:#a9b1c3;--line:#7a859c;--grid:#2e384c;--surface:#0f1320;--surface2:#232b3e}
body.hc .card,body.hc .btn,body.hc .ib{border-color:var(--line)}
body.hc .btn.primary{color:#000}
/* narrow (Fold cover 344) */
@media (max-width:380px){.opts button,.opt{font-size:13px}.ttl{font-size:17px}.dots{gap:3px}.dots .d span{font-size:10px}}
/* v2: sector pane, options, call, horizon slider, return text */
.secp{margin-top:0}
.optgrid{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.optgrid.two{display:grid;grid-template-columns:1fr 1fr}
.optgrid .opt{height:56px;justify-content:flex-start;text-align:left;white-space:normal;line-height:1.15}
.optgrid .opt.on{box-shadow:inset 0 0 0 2px var(--text);background:var(--surface2)}
.btn.wide{width:100%;height:48px;background:transparent}
/* v2 call card (mockup call.html) */
.callc{padding:10px 12px 8px}
.callc .st{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.callc .st b{font-size:16px;font-weight:700}
.callc .st small{display:block;font-size:12px;color:var(--dim);white-space:nowrap}
.callc .st .rr{text-align:right;white-space:nowrap}
.callc .st .rr b{display:inline-flex;align-items:center;gap:5px}
.tri{width:10px;height:10px;flex:none}
.callc .seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.callc .seg>button{flex:1;height:56px;min-width:0;border:0;border-right:1px solid var(--line);border-radius:0;background:var(--surface);color:var(--text);font:600 16px var(--sans);padding:0 6px}
.callc .seg>button:last-child{border-right:0}
.callc .seg>button:first-child{border-radius:9px 0 0 9px}.callc .seg>button:last-child{border-radius:0 9px 9px 0}
.callc .seg>button.on{background:var(--surface2);box-shadow:inset 0 0 0 2px var(--text);border-right-color:transparent}
.callc .seg>button:has(+ button.on){border-right-color:transparent}
.callc .seg>button.on::before{content:"\2713\00a0"}
.callc .hzh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin:10px 0 2px}
.callc .hzh .v{white-space:nowrap}
.callc .hzh .v b{font-size:22px;font-weight:700;line-height:1}
.callc .hzh .v small{font-size:12px;color:var(--dim);margin-left:6px}
.sl{display:grid;grid-template-columns:48px 1fr 48px;column-gap:8px;align-items:center}
.sl .btn{width:48px;height:56px;min-width:0;padding:0;font-size:24px;line-height:1}
.sl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;min-width:0;height:56px;margin:0;background:transparent;touch-action:pan-y}
.sl input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--text) 0,var(--text) var(--p,43%),var(--surface2) var(--p,43%));border:1px solid var(--line)}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;margin-top:-15px;border-radius:50%;background:var(--text);border:4px solid var(--bg);box-shadow:0 0 0 2px var(--text)}
.sl input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--surface2);border:1px solid var(--line)}
.sl input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--text)}
.sl input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--text);border:4px solid var(--bg);box-shadow:0 0 0 2px var(--text)}
.sl input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tk{grid-column:2;display:flex;justify-content:space-between;padding:0 12px;margin-top:-8px;font-size:11px;color:var(--dim)}
.tk span{width:12px;text-align:center}.tk span.on{color:var(--text);font-weight:700}
/* v2 chart header row: tags + up/down key */
.cs.tg{justify-content:space-between;align-items:center;flex-wrap:nowrap;gap:6px;padding:8px 10px 6px}
.cs .tags{display:flex;gap:5px;min-width:0;overflow:hidden;height:auto;padding:0;border:0;border-radius:0;line-height:normal}
.cs .tags span{flex:none}
.cs .key{font-size:11px;color:var(--dim);white-space:nowrap;gap:4px}
.cs .key svg{width:12px;height:12px;flex:none}
.cs .key svg+span{margin-right:4px}
.retc{padding:10px 12px}
.retl{font-size:16px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.retw{font-size:13px;margin-top:2px;color:var(--dim)}
.retw .rb{display:inline-block;padding:1px 8px;border-radius:10px;border:1.5px solid var(--dim);font-weight:700;color:var(--text)}
.retc.pos{border-left:4px solid var(--x)}.retc.pos .rb{border-color:var(--x)}
.retc.neg{border-left:4px dashed var(--o)}.retc.neg .rb{border-color:var(--o);border-style:dashed}
.retc.flat{border-left:4px dotted var(--dim)}
.ret.pos,.ret.neg{font-weight:700}
/* integrator: return colours used by screens-a (retCls good/bad on totals and trade rows) */
.code.good,b.good,span.good{color:var(--x)}.code.bad,b.bad,span.bad{color:var(--o)}
.mk .r b{font-weight:700}
/* integrator: top line never wraps (build stamp can be long) */
.top{gap:8px;white-space:nowrap;overflow:hidden}
.top>span:first-child{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.top>span.num{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px}
/* integrator: runend trade list, one line per trade */
.trl{display:flex;align-items:center;gap:10px;min-height:40px;border-bottom:1px solid var(--line);font-size:14px}
.trl:last-child{border-bottom:0}
.trl .n{flex:1;min-width:0}.trl .w{color:var(--dim);font-size:13px}.trl b{min-width:64px;text-align:right}
/* integrator: summary call/return card spans the width */
.po{flex-wrap:wrap}.po>.sh,.po>.dim{flex:1 1 100%}.po>.sh{margin:0}
/* v2 run end (mockup runend.html) */
.hero{padding:12px}
.hero .big{display:flex;align-items:flex-end;gap:10px;margin:4px 0 2px}
.hero .n{font-size:52px;font-weight:700;line-height:1;letter-spacing:-.01em}
.hero .w{display:flex;flex-direction:column;gap:2px;padding-bottom:5px;font-size:14px;line-height:1.2}
.hero .w b{display:inline-flex;align-items:center;gap:5px;font-size:15px}
.hero .w .tri{width:12px;height:12px}
.hero svg.eq{display:block;margin:8px 0 2px;max-width:100%}
.hero .brow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:6px;font-size:14px}.hero .brow b{font-weight:700}
.tl{padding:10px 12px 4px}
.tl .th,.tl .tr{display:grid;grid-template-columns:18px 44px 68px 1fr 70px;column-gap:6px;align-items:center}
.tl .th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding-bottom:4px;border-bottom:1px solid var(--line)}

<script>
/* Chart School ui-kit: helpers, header, bottom bar, marks, delegated clicks. Plain script, no modules. */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
window.ACT = window.ACT || {};
var ICON_BACK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
var ICON_GEAR='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>';
function header(title, sub, opts){
  opts = opts || {};
  var dev = '', build = (typeof BUILD !== 'undefined') ? BUILD : '';
  try{ if(typeof tweaked === 'function' && tweaked()) dev = '<span class="dev">DEV ' + esc((typeof S !== 'undefined' && S && S.seed) || (typeof T !== 'undefined' && T && T.seed) || '') + '</span> '; }catch(e){}
  var h = '<div class="top"><span>Chart School · Trading desk</span><span class="num bld">' + dev + esc(build) + '</span></div><div class="hd">';
  if(!opts.root) h += '<button class="ib" data-act="back" aria-label="Back">' + ICON_BACK + '</button>';
  h += '<div class="ttl">' + esc(title) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div>';

  return h + '</div>';
}
function bar(buttons){
  var el = $('bar'); if(!el) return;
  el.innerHTML = (buttons || []).map(function(b){
    return '<button class="btn ' + (b.kind === 'primary' ? 'primary' : 'out') + '" data-act="' + esc(b.act) + '"' + (b.disabled ? ' disabled' : '') + '>' + esc(b.label) + '</button>';
  }).join('');
}
/* marks: right = circle + tick, wrong = rounded square + X, open = dashed circle, skipped = dash; text label under each (VQA 2, 6) */
function markSvg(kind){
  if(kind === 'right') return '<svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="rgba(61,139,253,.2)" stroke="var(--x)" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="var(--x)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if(kind === 'wrong') return '<svg viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="2" width="24" height="24" rx="5" fill="rgba(245,159,58,.2)" stroke="var(--o)" stroke-width="2"/><path d="M9 9L19 19M19 9L9 19" stroke="var(--o)" stroke-width="2.4" stroke-linecap="round"/></svg>';
  if(kind === 'skip') return '<svg viewBox="0 0 28 28" aria-hidden="true"><path d="M7 14h14" stroke="var(--dim)" stroke-width="2.4" stroke-linecap="round"/></svg>';
  return '<svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11.5" fill="none" stroke="var(--dim)" stroke-width="2" stroke-dasharray="4 3"/></svg>';
}
function marks(reads){
  var nm = (typeof CSE !== 'undefined' && CSE.NAMES) || {};
  return '<div class="dots">' + (reads || []).map(function(r){
    var k = r.skipped ? 'skip' : r.ok === true ? 'right' : r.ok === false ? 'wrong' : 'open';
    var lab = {right:'Right', wrong:'Marked', skip:'Skipped', open:'Open'}[k];
    return '<div class="d ' + (k === 'wrong' ? 'w' : '') + '">' + markSvg(k) + '<i>' + lab + '</i><span>' + esc(nm[r.type] || r.type || '') + '</span></div>';
  }).join('') + '</div>';
}
function closeModal(){ var m = $('modal'); if(m) m.classList.remove('on'); }
document.addEventListener('click', function(ev){
  var t = ev.target; if(!t || !t.closest) return;
  var el = t.closest('[data-act],[data-opt]'); if(!el || el.disabled) return;
  try{
    if(el.dataset.act != null){ var f = window.ACT[el.dataset.act]; if(typeof f === 'function') f(el); }
    else if(el.dataset.opt != null && typeof window.ACT.opt === 'function') window.ACT.opt(el.dataset.opt, el);
  }catch(e){ if(window.console) console.error(e); }

<script>
"use strict";
// Chart School engine (global CSE; module.exports in node). Single source of the charting conventions C1-C7.
// Ported from gen-items.js (floor/ceil, first column, R2/R2b, R5-R7 identical); R3 is 3-way (Dorsey BSL/BRL), R4 follows C6.
var CSE=(function(){
var LB=Math.log(1.02),REV=3;
function boxOf(p){return Math.floor(Math.log(p)/LB+1e-9)}
function boxUp(p){return Math.ceil(Math.log(p)/LB-1e-9)}
function priceOf(b){return Math.exp(b*LB)}
function disp(p){var v=p*100;return v>=100?String(Math.round(v)):v.toFixed(1)}
var dp=function(b){return disp(priceOf(b))};
var OPTIONS={
 R1:["Double top buy","Triple top buy","Double bottom sell","Triple bottom sell","No signal"],
 R3:["Uptrend, 3+ boxes above support","Uptrend, near support","Downtrend, below resistance"],
 R5:["Above 70","50 to 70","30 to 50","Below 30"],
 R6:["Positive rising","Positive falling","Negative rising","Negative falling"],
 R7:["Bearish","Bullish","None"]};
OPTIONS.S1=OPTIONS.R1.slice();
OPTIONS.S2=["Sector uptrend, 3+ boxes above support","Sector uptrend, near support","Sector downtrend, below resistance"];
var TYPES=["R1","R2","R2b","R3","R4","R5","R6","R7","S1","S2"];
var KINDS={R1:"opt",R2:"step",R2b:"step",R3:"opt",R4:"step",R5:"opt",R6:"opt",R7:"opt",S1:"opt",S2:"opt"};
var NAMES={S1:"Sector signal",S2:"Sector trend",R1:"Signal",R2:"Support / resistance",R2b:"Support / resistance",R3:"Trend line",R4:"Vertical count",R5:"RSI",R6:"MACD",R7:"Divergence"};

function pnf(bars){
 var cols=[],colOfWeek=[],cells=[],c=null;
 function fill(col,a,b,wk){for(var x=a;x<=b;x++)cells.push({col:col,box:x,week:wk})}
 for(var i=0;i<bars.length;i++){
  var x=bars[i],hb=boxOf(x.h),lb=boxUp(x.l);
  if(!c){c={d:1,lo:lb,hi:hb,start:i,end:i,sig:0,sigName:null,sigWeek:null};if(c.lo>c.hi)c.lo=c.hi;cols.push(c);fill(0,c.lo,c.hi,i)}
  else if(c.d===1){ // X column: high first (Dorsey order)
   if(hb>c.hi){fill(cols.length-1,c.hi+1,hb,i);c.hi=hb}
   else if(lb<=c.hi-REV){c={d:-1,hi:c.hi-1,lo:lb,start:i,end:i,sig:0,sigName:null,sigWeek:null};cols.push(c);fill(cols.length-1,c.lo,c.hi,i)}
  }else{
   if(lb<c.lo){fill(cols.length-1,lb,c.lo-1,i);c.lo=lb}
   else if(hb>=c.lo+REV){c={d:1,lo:c.lo+1,hi:hb,start:i,end:i,sig:0,sigName:null,sigWeek:null};cols.push(c);fill(cols.length-1,c.lo,c.hi,i)}
  }
  var j=cols.length-1;c.end=i;
  if(j>=2&&!c.sig){var p=cols[j-2],pp=cols[j-4];
   if(c.d===1&&c.hi>p.hi){c.sig=1;c.sigWeek=i;c.sigName=(pp&&pp.hi===p.hi)?"Triple top buy":"Double top buy"}
   else if(c.d===-1&&c.lo<p.lo){c.sig=-1;c.sigWeek=i;c.sigName=(pp&&pp.lo===p.lo)?"Triple bottom sell":"Double bottom sell"}}
  colOfWeek.push(j);
 }
 return{cols:cols,colOfWeek:colOfWeek,cells:cells};
}
function ema(a,n){var k=2/(n+1),e=a[0],o=[];for(var i=0;i<a.length;i++){e=a[i]*k+e*(1-k);o.push(e)}return o}
function rsi(c,n){n=n||14;var o=[50],ag=0,al=0;for(var i=1;i<c.length;i++){var d=c[i]-c[i-1],g=Math.max(d,0),l=Math.max(-d,0);
 if(i<=n){ag+=g/n;al+=l/n}else{ag=(ag*(n-1)+g)/n;al=(al*(n-1)+l)/n}o.push(al===0?100:100-100/(1+ag/al))}return o}
function macd(c){var f=ema(c,12),s=ema(c,26),m=f.map(function(x,i){return x-s[i]}),sg=ema(m,9);return{macd:m,signal:sg,hist:m.map(function(x,i){return x-sg[i]})}}

// C5: Dorsey Bullish Support Line / Bearish Resistance Line, 1 box per column, flipping when broken. Causal over the shipped columns.
function trend(eng){
 var cols=eng.cols,J=cols.length-1,j,a=-1,b=-1;
 if(J<0)return{segs:[],active:null};
 for(j=0;j<=J;j++){var c=cols[j];
  if(c.d===-1&&(a<0||c.lo<cols[a].lo))a=j;
  if(c.d===1&&(b<0||c.hi>cols[b].hi))b=j}
 var segs=[],cur;
 if(a>=0&&(b<0||a<b))cur={kind:"BSL",col0:a,box0:cols[a].lo-1};
 else cur={kind:"BRL",col0:b,box0:cols[b].hi+1};
 for(;;){
  var brk=-1;
  for(j=cur.col0+1;j<=J;j++){var q=cols[j];
   if(cur.kind==="BSL"){if(q.d===-1&&q.lo<=cur.box0+(j-cur.col0)){brk=j;break}}
   else if(q.d===1&&q.hi>=cur.box0-(j-cur.col0)){brk=j;break}}
  if(brk<0){segs.push({kind:cur.kind,col0:cur.col0,box0:cur.box0,col1:J});break}
  segs.push({kind:cur.kind,col0:cur.col0,box0:cur.box0,col1:brk});
  var best=-1;
  for(j=cur.col0;j<=brk;j++){var w=cols[j];
   if(cur.kind==="BSL"){if(w.d===1&&(best<0||w.hi>=cols[best].hi))best=j}
   else if(w.d===-1&&(best<0||w.lo<=cols[best].lo))best=j}
  cur=cur.kind==="BSL"?{kind:"BRL",col0:best,box0:cols[best].hi+1}:{kind:"BSL",col0:best,box0:cols[best].lo-1};
 }
 var l=segs[segs.length-1];
 return{segs:segs,active:{kind:l.kind,col0:l.col0,box0:l.box0}};
}

function readAll(bars){
 var out={R1:null,R2:null,R2b:null,R3:null,R4:null,R5:null,R6:null,R7:null,disc:{}};
 var n=bars.length,E=pnf(bars),cols=E.cols,J=cols.length-1,cl=bars.map(function(b){return b.c});
 var bc=boxOf(bars[n-1].c);
 // R1: last 3 columns incl. current, later column wins
 var sig="No signal",sj=null;
 for(var j=Math.max(0,J-2);j<=J;j++){if(cols[j].sig){sig=cols[j].sigName;sj=j}}
 out.R1={answer:sig,col:sj};
 // R2 / R2b: most recent completed O / X column
 var oi=-1,xi=-1;
 for(j=J-1;j>=0&&(oi<0||xi<0);j--){if(cols[j].d===-1&&oi<0)oi=j;if(cols[j].d===1&&xi<0)xi=j}
 if(oi>=0)out.R2={answer:cols[oi].lo,col:oi};else out.disc.R2="no completed O column";
 if(xi>=0)out.R2b={answer:cols[xi].hi,col:xi};else out.disc.R2b="no completed X column";
 // R3: Dorsey trend line (BSL / BRL), 3-way
 var T=trend(E),act=T.active,line=act.kind==="BSL"?act.box0+(J-act.col0):act.box0-(J-act.col0),d=bc-line;
 out.R3={answer:act.kind==="BRL"?OPTIONS.R3[2]:d>=3?OPTIONS.R3[0]:OPTIONS.R3[1],kind:act.kind,lineAtCur:line,closeBox:bc,d:d,segs:T.segs};
 // R4 (C6): count the buy SIGNAL column
 if(sig.indexOf("buy")>=0){
  if(sj<=1)out.disc.R4="signal column index <= 1";
  else{var sc=cols[sj],cnt=sc.hi-sc.lo+1;out.R4={answer:sc.lo+3*cnt,col:sj,boxes:cnt,from:sc.lo}}
 }else out.disc.R4="R1 not a buy";
 // R5
 var rs=rsi(cl),r=rs[n-1],m=Math.min(Math.abs(r-70),Math.abs(r-50),Math.abs(r-30));
 if(m<1)out.disc.R5="within 1.0 of 30/50/70";
 else out.R5={answer:r>70?OPTIONS.R5[0]:r>50?OPTIONS.R5[1]:r>30?OPTIONS.R5[2]:OPTIONS.R5[3],value:r};
 // R6
 var h=macd(cl).hist,h0=h[n-1],h1=n>1?h[n-2]:h[n-1],bx=priceOf(bc+1)-priceOf(bc);
 if(Math.abs(h0)<0.02*bx)out.disc.R6="|hist| < 0.02 box";
 else if(Math.abs(h0-h1)<0.005*bx)out.disc.R6="|hist change| < 0.005 box";
 else out.R6={answer:(h0>0?"Positive":"Negative")+(h0>h1?" rising":" falling"),hist:h0,prev:h1};
 // R7
 var bear=null,bull=null;
 for(var q=0;q<2;q++){var t=n-1-q;if(t<12)continue;var hp=-1,lp=-1;
  for(var k=t-12;k<t;k++){if(hp<0||cl[k]>=cl[hp])hp=k;if(lp<0||cl[k]<=cl[lp])lp=k}
  if(bear===null&&cl[t]>cl[hp]&&rs[t]<rs[hp])bear={t:t,ref:hp};
  if(bull===null&&cl[t]<cl[lp]&&rs[t]>rs[lp])bull={t:t,ref:lp}}
 if(bear&&bull)out.disc.R7="bearish and bullish both";
 else out.R7=bear?{answer:"Bearish",t:bear.t,ref:bear.ref}:bull?{answer:"Bullish",t:bull.t,ref:bull.ref}:{answer:"None",t:null,ref:null};
 return out;
}

// Sector reads: S1 = R1 logic, S2 = R3 logic on the sector chart. secBars = [{h,l,c}] or [[h,l,c]].
function readSector(secBars){
 var out={S1:null,S2:null};
 if(!secBars||!secBars.length)return out;
 var b=secBars.map(function(x){return Array.isArray(x)?{h:x[0],l:x[1],c:x[2]}:x});
 var r=readAll(b),k=r.R3.kind;
 out.S1={answer:r.R1.answer,col:r.R1.col};
 out.S2={answer:k==="BRL"?OPTIONS.S2[2]:r.R3.d>=3?OPTIONS.S2[0]:OPTIONS.S2[1],kind:k,segs:r.R3.segs,lineAtCur:r.R3.lineAtCur,closeBox:r.R3.closeBox,d:r.R3.d};
 return out;
}

function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// 3 distinct reading types: stock reads first, sector read last (V2, V3).
function pickReads(sheet,rng,prevTypes){
 rng=rng||mulberry(1);
 var prev=prevTypes||[],ans=sheet.ans||null,has=function(t){return!ans||ans[t]!=null};
 var stock=["R1",sheet.r2key||"R2","R3","R4","R5","R6","R7"].filter(has);
 var sec=["S1","S2"].filter(function(t){return ans&&ans[t]!=null});
 function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
 var wantSec=rng()<0.67&&sec.length>0,out=[],steps=0;
 var secPick=null;
 if(wantSec){var sf=sec.filter(function(t){return prev.indexOf(t)<0});if(!sf.length)sf=sec;secPick=shuf(sf)[0]}
 var need=3-(secPick?1:0);
 var fresh=shuf(stock.filter(function(t){return prev.indexOf(t)<0})),old=shuf(stock.filter(function(t){return prev.indexOf(t)>=0}));
 function take(list,strict){for(var i=0;i<list.length&&out.length<need;i++){var t=list[i];if(out.indexOf(t)>=0)continue;
  if(KINDS[t]==="step"&&steps>=1&&strict)continue;if(KINDS[t]==="step")steps++;out.push(t)}}
 take(fresh,true);take(old,true);take(fresh,false);take(old,false);
 if(secPick)out.push(secPick);
 return out;
}

var RULES={
 R1:{title:"Signal",lines:[
  "Each box is 2%, and a column turns after a 3-box reversal, using the weekly high and low.",
  "A buy signal is an X column that rises at least 1 box above the top of the X column two columns back.",
  "It is a triple top buy when the X column four back has the same top as the one two back. Otherwise it is a double top buy.",
  "A sell signal is the mirror: an O column that falls at least 1 box below the bottom of the O column two back.",
  "Look at the last 3 columns, including the current one. The latest signal wins. If none fired, the reading is No signal."]},
 R2:{title:"Support",lines:[
  "Find the most recent completed O column. A completed column is any column except the current, last one.",
  "Its lowest box is the support box.",
  "Each box is 2%. Pick the row of that lowest box."]},
 R2b:{title:"Resistance",lines:[
  "Find the most recent completed X column. A completed column is any column except the current, last one.",
  "Its highest box is the resistance box.",
  "Each box is 2%. Pick the row of that highest box."]},
 R3:{title:"Trend line",lines:[
  "The support line rises 45 degrees, 1 box for every column. It starts 1 box under the lowest O box, if that comes before the highest X box.",
  "When an O column reaches the support line, the line is broken. The resistance line takes over from 1 box above the highest X box since the support line began, and falls 1 box per column.",
  "When an X column reaches the resistance line, it is broken, and a support line takes over from 1 box under the lowest O box since then. Lines flip back and forth like this.",
  "Read the line that is active at the current column. Support line with the close 3 or more boxes above it is Uptrend, 3+ boxes above support. Closer than that is Uptrend, near support. A resistance line is Downtrend, below resistance."]},
 R4:{title:"Vertical count",lines:[
  "Find the buy signal column. Count its boxes, low to high.",
  "Multiply by 3. Add that many boxes above the column's lowest box.",
  "Each box is 2%, so the objective is counted in boxes, not in price points.",
  "If the signal column is still the current column, the count is provisional until it ends."]},
 R5:{title:"RSI",lines:[
  "RSI uses 14 weekly closes with Wilder smoothing. The first value is set to 50.",
  "Read the last value on the pane header against the lines at 30, 50 and 70.",
  "Above 70, 50 to 70, 30 to 50, or Below 30.",
  "Sheets are not drawn when the value sits within 1.0 of a line."]},
 R6:{title:"MACD",lines:[
  "MACD is the 12-week average minus the 26-week average of closes. The signal line is a 9-week average of that.",
  "The histogram is MACD minus the signal line.",
  "Positive or Negative is the sign of the histogram this week.",
  "Rising or falling compares it with last week. Sheets are not drawn when either is almost flat."]},
 R7:{title:"Divergence",lines:[
  "Compare this week, or last week, with the 12 closes before it.",
  "Bearish: the close is above all 12 prior closes, but RSI is lower than RSI at the highest prior close.",
  "Bullish: the close is below all 12 prior closes, but RSI is higher than RSI at the lowest prior close.",
  "If neither is true, the reading is None."]}
};

RULES.S1={title:"Sector signal",lines:RULES.R1.lines.map(function(l){return l}).concat(["Read this on the sector chart, not the stock chart."])};
RULES.S2={title:"Sector trend",lines:RULES.R3.lines.concat(["Read this on the sector chart, not the stock chart."])};

function plural(n,w){return n+" "+w+(n===1?"":"es")}
function bandRsi(v){return v>70?"above 70":v>50?"between 50 and 70":v>30?"between 30 and 50":"below 30"}
function explain(type,reads,given,secReads){
 if(type==="S1"||type==="S2"){
  var q=(secReads&&secReads[type])||(reads&&reads[type]);if(!q)return "No engine reading for this sheet.";
  var sok=given===q.answer,sp=sok?"Right: ":"Marked: ";
  if(type==="S1"){
   if(q.answer==="No signal")return sp+"no signal fired on the sector chart in the last 3 columns"+(sok?".":", you marked "+given+".");
   return sp+(sok?"the sector chart shows "+q.answer+" in column "+(q.col+1)+".":"the sector chart shows "+q.answer+" in column "+(q.col+1)+", you marked "+given+".")}
  var tl=q.kind==="BRL"?"the sector resistance line is active"+(q.lineAtCur!=null?" at "+dp(q.lineAtCur):"")+(q.closeBox!=null?" and the close is at "+dp(q.closeBox):""):
   "the sector support line is active"+(q.lineAtCur!=null?" at "+dp(q.lineAtCur):"")+(q.d!=null?" and the close is "+(q.d>=1?plural(q.d,"box")+" above it":"on it or under it"):"");
  return sp+tl+(sok?".":", so the sector reading is "+q.answer+".")}
 var r=reads&&reads[type];if(!r)return "No engine reading for this sheet.";
 var ok=given===r.answer,pre=ok?"Right: ":"Marked: ",e;
 if(type==="R1"){
  if(r.answer==="No signal")e=ok?"no signal fired in the last 3 columns.":"no signal fired in the last 3 columns, you marked "+given+".";
  else e=ok?r.answer+" in column "+(r.col+1)+".":"the engine reading is "+r.answer+" in column "+(r.col+1)+", you marked "+given+".";
  return pre+e}
 if(type==="R2"||type==="R2b"){
  var what=type==="R2"?"The most recent completed O column ends at its lowest box, ":"The most recent completed X column ends at its highest box, ";
  if(ok)return "Right: "+what.replace("ends at","has").replace(", ","")+" "+dp(r.answer)+".";
  var df=Math.abs(given-r.answer);return "Marked: off by "+plural(df,"box")+". "+what+dp(r.answer)+"."}

function twBuiltin(i) { twApplySet(BUILTIN_PRESETS[i].set); }

  try { twApplySet(JSON.parse(atob(v.slice(15)))); } catch (e) { var m = $("tw_msg"); if (m) m.textContent = "Preset code could not be read."; }
}
function twNewSession() {

}
function twResetJournal() {

function twClose() { var m = $("modal"); if (m) m.classList.remove("on"); }

function openTweaks() {
  var P = userPresets(), names = Object.keys(P), rows = "";
  Object.keys(DEFAULTS).forEach(function (k) {
    var lab = twEsc(TWEAK_LABELS[k] || k), ch = T[k] !== DEFAULTS[k], ctl;
    if (TWEAK_BOOL.indexOf(k) >= 0) {
      ctl = '<div class="seg"><button class="btn' + (T[k] ? "" : " primary") + '" onclick="twSet(\'' + k + '\',0)" aria-pressed="' + (!T[k]) + '">Off</button>' +
        '<button class="btn' + (T[k] ? " primary" : "") + '" onclick="twSet(\'' + k + '\',1)" aria-pressed="' + (!!T[k]) + '">On</button></div>';
    } else if (k === "readingOrder") {
      ctl = '<div class="seg"><button class="btn' + (T[k] === "fixed" ? " primary" : "") + '" onclick="twSet(\'' + k + '\',\'fixed\')">Fixed</button>' +
        '<button class="btn' + (T[k] === "shuffled" ? " primary" : "") + '" onclick="twSet(\'' + k + '\',\'shuffled\')">Shuffled</button></div>';
    } else {
      var rg = { horizonDefault: [3, 10], runTrades: [1, 50], runCharts: [1, 100], sectorHeight: [80, 300], chartCols: [8, 40] }[k];
      ctl = '<input id="tw_' + k + '" type="number" inputmode="decimal"' + (rg ? ' min="' + rg[0] + '" max="' + rg[1] + '"' : '') + ' step="' + (k === "textSize" ? "0.05" : "1") + '" value="' + twEsc(T[k]) + '" onchange="twNum(\'' + k + '\')" style="width:100%;min-height:48px">';
    }
    rows += '<div class="card" style="margin:6px 0"><div style="display:flex;justify-content:space-between;gap:8px"><b>' + lab + '</b><span class="dim">' +
      (ch ? "changed · default " + twEsc(DEFAULTS[k]) : "default") + '</span></div>' + ctl + '</div>';
  });
  var built = BUILTIN_PRESETS.map(function (p, i) { return '<button class="btn" onclick="twBuiltin(' + i + ')">' + twEsc(p.name) + '</button>'; }).join("");
  var user = names.map(function (n, i) {
    return '<div class="row"><span style="flex:2;align-self:center">' + twEsc(n) + '</span><button class="btn" onclick="twLoadUser(' + i + ')">Load</button><button class="btn" onclick="twDelUser(' + i + ')">Delete</button></div>';
  }).join("");
  $("modalBody").innerHTML =
    '<div class="card"><b>Settings</b><div class="dim" style="margin-top:4px">Build ' + twEsc(buildId()) + ' · seed ' + twEsc(T.seed) +
    (tweaked() ? ' · <b>DEV</b> (settings differ from defaults)' : '') + '<br>Changes apply live.</div></div>' + rows +
    '<div class="card"><b>Seed</b><div class="dim">A new seed or a new run reshuffles the chart order. Your record, journal and best run are kept.</div>' +
    '<div class="row"><button class="btn primary" onclick="twNewSession()">New run with this seed</button></div></div>' +
    '<div class="card"><b>Presets</b><div class="row seg">' + built + '</div>' + user +
    '<div class="row"><button class="btn" onclick="twSavePreset()">Save preset</button><button class="btn" onclick="twCopyPreset()">Copy preset code</button><button class="btn" onclick="copyReport()">Copy report</button></div>' +
    '<div class="row"><input id="tw_code" type="text" placeholder="CSCHOOL-PRESET:..." style="flex:2;min-height:48px"><button class="btn" onclick="twLoadCode()">Load code</button></div>' +
    '<div id="tw_msg" class="dim"></div></div>' +
    '<div class="card"><b>Journal</b><div class="row"><button class="btn" onclick="twResetJournal()">Reset journal</button></div></div>' +
    '<div class="row"><button class="btn primary" onclick="twClose()">Close</button></div>';
  $("modal").classList.add("on");

<script>
/* chart.js (Maker CHART): pure inline SVG P&F chart + RSI + MACD panes. Globals: drawPnf, drawRsi, drawMacd.
   Look copied from the locked mockups (reading/marked/evidence). Colours only via CSS vars from pro.css.
   Applied VQA fixes: 9 support line is --accent everywhere, 8 no value pills inside panes (values live in the pane header),
   10 price-axis labels are never covered by pills (a pill replaces the label at its row, pills are spread apart). */
(function (root) {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var AX = 48; // right gutter for price axis (same in all three charts so columns line up)

  function el(p, tag, a, txt) {
    var e = document.createElementNS(NS, tag);
    for (var k in a) if (a[k] != null) e.setAttribute(k, a[k]);
    if (txt != null) e.textContent = txt;
    if (p) p.appendChild(e);
    return e;
  }
  function f1(n) { return Math.round(n * 10) / 10; }
  function priceOf(b) { return (root.CSE && root.CSE.priceOf) ? root.CSE.priceOf(b) : Math.pow(1.02, b); }
  function disp(b) {
    var p = priceOf(b);
    if (root.CSE && root.CSE.disp) return String(root.CSE.disp(p));
    var v = p * 100;
    return v >= 100 ? String(Math.round(v)) : v.toFixed(1);
  }
  function hostW(host) { var w = host.clientWidth || (host.getBoundingClientRect && host.getBoundingClientRect().width) || 344; return Math.max(200, Math.round(w)); }
  function clear(host) { while (host.firstChild) host.removeChild(host.firstChild); }
  function pill(g, W, y, txt, bg, fg, stroke) {
    txt = String(txt);
    var w = Math.round(txt.length * 6.1 + 8);
    el(g, "rect", { x: W - 2 - w, y: f1(y - 8.5), width: w, height: 17, rx: 4, fill: bg, stroke: stroke || "none", "stroke-width": 1 });
    el(g, "text", { x: f1(W - 2 - w / 2), y: f1(y + 0.5), "text-anchor": "middle", "dominant-baseline": "central", "font-size": 11, "font-weight": 700, fill: fg, "font-variant-numeric": "tabular-nums" }, txt);
  }

  /* ---------------------------------------------------------------- P&F */
  function drawPnf(host, opt) {
    opt = opt || {};
    var eng = opt.eng || { cols: [], cells: [] };
    var cols = eng.cols || [];
    var nCols = cols.length;
    var NCAP = Math.max(4, opt.cols || 24); // T.chartCols: max columns shown
    var ovs = opt.overlays || [];
    var W = hostW(host);
    var pw = W - AX;
    var HT = Math.max(100, +opt.height || 300), compact = !!opt.compact, TT = opt.title ? 20 : 0;
    var FS = 11; // axis font (v2 mockups: 11px on both charts)
    var AXH = compact ? 20 : 24; // column axis strip under the plot
    var CELL = +opt.cell || (compact ? 11 : 15), MINC = Math.min(CELL, +opt.minCell || (compact ? 6 : 8));
    var MAXPH = +opt.maxPlotH || (HT - 6 - TT - AXH); // plot height budget (rows x cell)
    var MARG = opt.margin != null ? +opt.margin : 1;   // empty boxes above / below the marks
    clear(host);
    if (!nCols) { var s0 = el(host, "svg", { width: W, height: 40, viewBox: "0 0 " + W + " 40", role: "img", "aria-label": "Empty point and figure chart" }); return s0; }

    // week each box was first filled (for "new" drawing)
    var wk = {};
    (eng.cells || []).forEach(function (q) { wk[q.col + ":" + q.box] = q.week; });

    // v2 sizing: fixed SQUARE cells (15 stock, 11 sector). Show the last columns that fit the width, crop the rows to the
    // box range of those columns (+MARG). If the rows do not fit the height budget: fewer columns first, then smaller cells.
    var needN = 0; // columns an overlay points at must stay in view
    ovs.forEach(function (o) { if ((o.k === "col" || o.k === "sig" || o.k === "exit") && o.col != null && o.col >= 0 && o.col < nCols) needN = Math.max(needN, nCols - o.col); });
    if (opt.keepCol != null && opt.keepCol >= 0 && opt.keepCol < nCols) needN = Math.max(needN, nCols - opt.keepCol);
    var first, lo, hi, top, bot, rows, c, N, j;
    function rangeFor(n) {
      var f = Math.max(0, nCols - n), l = Infinity, h = -Infinity, k;
      for (k = f; k < nCols; k++) { l = Math.min(l, cols[k].lo); h = Math.max(h, cols[k].hi); }
      function inc(b) { if (b == null || isNaN(b)) return; l = Math.min(l, b); h = Math.max(h, b); }
      ovs.forEach(function (o) { if (o.k === "close" || o.k === "entry") inc(o.box); }); // other overlays never widen the range (edge markers instead)
      inc(opt.pick);
      return { first: f, lo: l, hi: h, top: h + MARG, bot: l - MARG, rows: h - l + 1 + 2 * MARG };
    }
    // N = columns shown; c = min(CELL, height budget / rows). Take the most columns that keep c >= GOOD; otherwise the
    // column count with the biggest cells (ties: more columns). Volatile charts trade history for legible boxes.
    var GOOD = +opt.goodCell || Math.round(CELL * 0.8), NMIN = Math.max(1, +opt.minCols || 10);
    var fit = Math.max(1, Math.min(NCAP, Math.floor(pw / CELL + 1e-6))), nHi = Math.max(1, Math.min(fit, nCols));
    var nLo = Math.min(nHi, NMIN);
    if (needN > nHi) { nHi = needN; nLo = needN; }
    nLo = Math.max(nLo, Math.min(needN, nHi));
    var R = null, nn, bestC = -1, cand = [];
    for (nn = nHi; nn >= nLo; nn--) {
      var q = rangeFor(nn), cq = Math.min(CELL, pw / nn, MAXPH / q.rows);
      cand.push({ q: q, c: cq, n: nn });
      if (cq > bestC) bestC = cq;
    }
    var want = bestC >= GOOD ? GOOD : bestC * 0.85; // most columns whose cells are near the best size
    for (nn = 0; nn < cand.length; nn++) if (cand[nn].c >= want - 1e-6) { R = cand[nn].q; c = cand[nn].c; N = cand[nn].n; break; }
    c = Math.floor(c * 2) / 2; // half-pixel steps
    if (c < MINC) c = opt.fitHeight ? Math.max(3, Math.min(MINC, MAXPH / R.rows)) : Math.min(MINC, pw / N); // under MINC: grow taller, or (fitHeight) stay in budget
    // cells came out smaller than CELL: fill spare width with older columns that need no new rows
    var fitC = Math.min(NCAP, Math.floor(pw / c + 1e-6));
    while (R.first > 0 && nCols - R.first < fitC && cols[R.first - 1].lo >= R.lo && cols[R.first - 1].hi <= R.hi) R.first--;
    N = nCols - R.first;
    first = R.first; lo = R.lo; hi = R.hi; top = R.top; bot = R.bot; rows = R.rows;
    var ch = c;
    var nTop = 0, nBot = 0;
    ovs.forEach(function (o) { if (o.k === "row" || o.k === "line") { if (o.box > top) nTop++; else if (o.box < bot) nBot++; } });
    var STRIP = 17;
    var ph = rows * ch, OY = 6 + TT + STRIP * nTop, H = Math.round(OY + ph + AXH + STRIP * nBot + (nBot ? 2 : 0));
    var XO = pw - N * c; // slack on the left so the last column meets the axis
    function ty(b) { return (top - b) * ch; }       // top edge of box b
    function cy(b) { return ty(b) + ch / 2; }
    function cx(j) { return pw - (nCols - j) * c; }  // left edge of column j; the last column always meets the axis

    var s = el(host, "svg", { "data-cell": f1(c), "data-rows": rows, width: W, height: H, viewBox: "0 0 " + W + " " + H, role: "img",
      "aria-label": "Point and figure chart, " + nCols + " columns, box 2 percent, last " + disp(cols[nCols - 1].d === 1 ? cols[nCols - 1].hi : cols[nCols - 1].lo) });
    if (opt.title) el(s, "text", { x: 10, y: 11, "dominant-baseline": "central", "font-size": 12, "font-weight": 600, fill: "var(--dim)" }, opt.title);
    var g = el(s, "g", { transform: "translate(0," + OY + ")" });

    // grid
    var i, r;
    for (i = 0; i <= N; i++) el(g, "line", { x1: f1(XO + i * c + 0.5), y1: 0, x2: f1(XO + i * c + 0.5), y2: f1(ph), stroke: "var(--grid)", "stroke-width": 1 });
    for (r = 0; r <= rows; r++) el(g, "line", { x1: f1(XO), y1: f1(r * ch + 0.5), x2: f1(pw), y2: f1(r * ch + 0.5), stroke: "var(--grid)", "stroke-width": 1 });
    el(g, "line", { x1: f1(pw + 0.5), y1: 0, x2: f1(pw + 0.5), y2: f1(ph), stroke: "var(--line)", "stroke-width": 1 });

    // column axis: tick + number every 5 columns (10 on the compact sector chart), "col" at the left
    var every = compact ? 10 : 5, ly0 = ph + (compact ? 14 : 17), minTickX = Infinity;
    for (j = first; j < nCols; j++) {
      var n1 = j + 1, x = cx(j) + c / 2;
      if (opt.showColNums) {
        el(g, "text", { x: f1(x), y: f1(ph + 15), "text-anchor": "middle", "font-size": c < 12 ? 8 : FS, fill: "var(--dim)", "font-variant-numeric": "tabular-nums" }, n1);
      } else if (n1 % every === 0) {
        el(g, "line", { x1: f1(x + 0.5), y1: f1(ph), x2: f1(x + 0.5), y2: f1(ph + 4), stroke: "var(--dim)", "stroke-width": 1 });
        el(g, "text", { x: f1(x), y: f1(ly0), "text-anchor": "middle", "font-size": FS, fill: "var(--dim)", "font-variant-numeric": "tabular-nums" }, n1);
        minTickX = Math.min(minTickX, x);
      }
    }
    if (!opt.showColNums && minTickX > 34) el(g, "text", { x: 6, y: f1(ly0), "font-size": FS, fill: "var(--dim)" }, "col");

    // trend lines (Dorsey BSL/BRL): line box at column j = box0 +/- (j - col0), through box centres; square cells => true 45 degrees
    ovs.forEach(function (o) {
      if (o.k !== "trend") return;
      (o.segs || []).forEach(function (sg, si, sa) {
        var act = si === sa.length - 1;
        var up = sg.kind === "BSL", pts = [], jj, ja = Math.max(sg.col0, first), jb = Math.min(sg.col1, nCols - 1), jf = null, jl = null;
        for (jj = ja; jj <= jb; jj++) {
          var lb = sg.box0 + (up ? 1 : -1) * (jj - sg.col0);
          if (lb < bot || lb > top) continue;
          if (jf == null) jf = jj;
          jl = jj;
          pts.push(f1(cx(jj) + c / 2) + "," + f1(cy(lb)));
        }
        if (pts.length < 2) return;
        var clr = up ? "var(--accent)" : "var(--o)";
        el(g, "polyline", { points: pts.join(" "), fill: "none", stroke: clr, "stroke-width": act ? 1.5 : 1, "stroke-opacity": act ? 1 : 0.45, "stroke-dasharray": up ? null : "5 3", "stroke-linecap": "round", "stroke-linejoin": "round" });
        if (!act) return;
        // label beside the line (below support, above resistance), kept inside the plot: clear of the price axis and the left edge
        var lbl = up ? "support" : "resistance", hw = lbl.length * 6.2 * 0.7071 / 2 + 2, off = 8;
        var xmin = Math.max(XO, cx(jf) + c / 2) + hw - off, xmax = Math.min(pw, cx(jl) + c / 2) - hw - off;
        var xm = cx(jf + (jl - jf) * 0.5) + c / 2;
        if (xmax >= xmin) xm = Math.max(xmin, Math.min(xmax, xm)); else xm = Math.min(xm, pw - hw - off);
        function lyAt(x0) { var m0 = (x0 - c / 2 - pw) / c + nCols; return cy(sg.box0 + (up ? 1 : -1) * (m0 - sg.col0)) + (up ? off : -off); }
        if (xmax >= xmin && (lyAt(xm) < hw || lyAt(xm) > ph - hw)) { // keep it inside the plot vertically too: slide along the line
          var bx2 = null;
          for (var xs = xmin; xs <= xmax + 0.01; xs += c / 2) { var yv = lyAt(xs); if (yv >= hw && yv <= ph - hw && (bx2 == null || Math.abs(xs - xm) < Math.abs(bx2 - xm))) bx2 = xs; }
          if (bx2 != null) xm = bx2;
        }
        var lx = xm + off, ly = lyAt(xm);
        el(g, "text", { x: f1(lx), y: f1(ly), transform: "rotate(" + (up ? -45 : 45) + " " + f1(lx) + " " + f1(ly) + ")", "text-anchor": "middle", "dominant-baseline": "central", "font-size": 11, "font-weight": 600, fill: clr }, lbl);
      });
    });

    // boxes
    var gl = Math.min(c, ch), ins = Math.max(Math.min(2.5, gl * 0.3), gl * 0.2); // small cells keep a visible glyph (no negative radius)
    for (j = first; j < nCols; j++) {
      var col = cols[j], isX = col.d === 1, clr = isX ? "var(--x)" : "var(--o)";
      for (var b = col.lo; b <= col.hi; b++) {
        var bx = cx(j), by = ty(b);
        var fresh = opt.newFrom != null && wk[j + ":" + b] != null && wk[j + ":" + b] >= opt.newFrom;
        var gx = bx + (c - gl) / 2, gy = by + (ch - gl) / 2;
        if (fresh) el(g, "rect", { x: f1(bx + 1.5), y: f1(by + 1.5), width: f1(Math.max(0.5, c - 2)), height: f1(Math.max(0.5, ch - 2)), fill: clr, "fill-opacity": 0.22, stroke: clr, "stroke-width": 1 });
        if (isX) {
          el(g, "path", { d: "M" + f1(gx + ins + 1) + " " + f1(gy + ins + 1) + "L" + f1(gx + gl - ins) + " " + f1(gy + gl - ins) + "M" + f1(gx + gl - ins) + " " + f1(gy + ins + 1) + "L" + f1(gx + ins + 1) + " " + f1(gy + gl - ins),
            stroke: clr, "stroke-width": fresh ? 2.2 : 1.8, "stroke-linecap": "round", fill: "none" });
        } else {
          el(g, "circle", { cx: f1(bx + c / 2 + 0.5), cy: f1(by + ch / 2 + 0.5), r: f1(Math.max(0.8, (gl - 2 * ins) / 2)), stroke: clr, "stroke-width": fresh ? 2.2 : 1.8, fill: "none" });
        }
      }
    }

    // overlays
    var edgeN = { 1: 0, "-1": 0 }, placed = [];
    function freeY(y0, dir) { var yy = y0, t = 0; while (t++ < 12 && placed.some(function (p) { return Math.abs(p - yy) < 14; })) yy += dir * 14; placed.push(yy); return yy; }
    var pills = []; // {y, txt, bg, fg, stroke}
    var lineYs = [];
    ovs.forEach(function (o) {
      var eng2 = o.style !== "pick";
      if (o.k === "row" || o.k === "line") {
        var off = o.box > top ? 1 : (o.box < bot ? -1 : 0);
        if (off) { // off-chart marker: text strip outside the plot, no line, no axis pill
          var ac = eng2 ? "var(--text)" : "var(--dim)", k2 = edgeN[off]++;
          var sy = off > 0 ? -STRIP * (nTop - k2) + STRIP / 2 : ph + 26 + STRIP * k2 + STRIP / 2 + 1;
          var tt = (o.label || ("objective " + disp(o.box))) + ", off chart " + (off > 0 ? "\u2191" : "\u2193");
          el(g, "text", { x: f1(pw - 2), y: f1(sy), "text-anchor": "end", "dominant-baseline": "central", "font-size": 11, "font-weight": eng2 ? 700 : 400, fill: ac, "font-style": eng2 ? null : "italic" }, tt);
          return;
        }
        var y = cy(o.box);
        if (o.k === "row") {
          el(g, "rect", { x: 0.5, y: f1(ty(o.box) + 0.5), width: f1(pw - 1), height: f1(Math.max(0.5, ch - 1)), rx: 2, fill: eng2 ? "var(--text)" : "none", "fill-opacity": 0.1,
            stroke: eng2 ? "var(--text)" : "var(--dim)", "stroke-width": eng2 ? 1.6 : 1.3, "stroke-dasharray": eng2 ? null : "1.5 3" });
        } else {
          el(g, "line", eng2 ? { x1: 0, y1: f1(y), x2: f1(pw), y2: f1(y), stroke: "var(--text)", "stroke-width": 1.8, "stroke-dasharray": "6 3.5" }
            : { x1: 0, y1: f1(y), x2: f1(pw), y2: f1(y), stroke: "var(--dim)", "stroke-width": 1.5, "stroke-dasharray": "1.5 4", "stroke-linecap": "round" });
        }
        if (o.label) el(g, "text", { x: f1(pw - 5), y: f1(freeY(eng2 ? y - (o.k === "row" ? ch / 2 + 7 : 10) : y + (o.k === "row" ? ch / 2 + 7 : 10), eng2 ? -1 : 1)), "text-anchor": "end", "dominant-baseline": "central",
          "font-size": eng2 ? 12 : 11, "font-weight": eng2 ? 700 : 400, fill: eng2 ? "var(--text)" : "var(--dim)" }, o.label);
        pills.push({ y: y, box: o.box, txt: disp(o.box), bg: eng2 ? "var(--text)" : "var(--bg)", fg: eng2 ? "var(--bg)" : "var(--dim)", stroke: eng2 ? null : "var(--dim)" });
      } else if (o.k === "col") {
        var cc = cols[o.col]; if (!cc || o.col < first) return;
        var rx = cx(o.col), nb = cc.hi - cc.lo + 1;

  function sgn(v) { v = Math.round((num(v) || 0) * 1000); return v > 0 ? 1 : v < 0 ? -1 : 0; }
  /* run return after each trade: step line, one dot per trade, end pill. No zero line (return only, no baseline). */

    var d = 'M' + x(0).toFixed(1) + ' ' + y(0).toFixed(1);
    for (var i = 1; i <= n; i++) d += 'H' + x(i).toFixed(1) + 'V' + y(cum[i]).toFixed(1);

  }

  window.renderRunEnd = function () {

        '<span class="h">' + esc(t.h || '?') + ' weeks</span><span class="mb" aria-hidden="true"><span class="' + (r >= 0 ? 'p' : 'm') + '" style="width:' + w + '%"></span></span>' +
        '<b class="ret ' + (g > 0 ? 'up' : g < 0 ? 'down' : '') + '">' + (g > 0 ? UP : g < 0 ? DN : '') + esc(fmtRet(r) || '--') + '</b></div>';
    }).join('') : '<p class="dim" style="margin:0">No trades in this run.</p>';

      (best ? '<b>' + esc(fmtRet(best.ret)) + '</b> <span class="dim">&middot; ' + nb + ' trade' + (nb === 1 ? '' : 's') + '</span>' : '<span class="dim">none yet</span>') + '</span></div>';
    $('main').innerHTML = header('Run complete', tr.length + ' trade' + (tr.length === 1 ? '' : 's') + ' · ' + (run.charts || 0) + ' charts seen', {}) +
      '<div class="stack"><section class="card hero" aria-label="Run result"><div class="cap">Total return</div>' +
      '<div class="big"><span class="n num ' + (sg > 0 ? 'up' : sg < 0 ? 'down' : '') + '">' + esc(fmtRet(total) || '+0.0%') + '</span>' +
      '<span class="w"><b class="' + (sg > 0 ? 'up' : sg < 0 ? 'down' : 'dim') + '">' + (sg > 0 ? UP : sg < 0 ? DN : '') + (sg > 0 ? 'gain' : sg < 0 ? 'loss' : 'flat') + '</b>' +
      '<span class="dim num">' + tr.length + ' trade' + (tr.length === 1 ? '' : 's') + '</span></span></div>' +
      '<div id="eq"></div>' + bestRow + '</section>' +

  window.renderJournal = function () {
    var list = (S.journal || []).slice().reverse();

      return '<section class="card"><div class="sh"><b>' + esc(e.code) + '</b><span class="dim num">' + right + ' right of ' + (e.reads || []).length + '</span></div>' +
        marks(e.reads || []) +

    }).join('') : '<section class="card"><p style="margin:0">No charts in the journal yet. Finish a chart and it is listed here.</p></section>';

      R.lines.map(function (l) { return '<p style="margin:0 0 8px">' + esc(l) + '</p>'; }).join('') +
      '<div style="margin-top:12px"><button class="btn primary" style="width:100%;height:56px" data-act="close-modal">Close</button></div>';
    $('modal').classList.add('on');
  };

  window.ACT = window.ACT || {};
  ACT['open-sheet'] = function () {
    // A finished run starts a fresh one (admin default).
    if (S.run && S.run.done && typeof newRun === 'function') newRun((S.run.seed | 0) + 1);

  ACT['new-run'] = function () {

  ACT.journal = function () { go('journal'); };
  ACT.desk = function () { go('desk'); };
  ACT['copy-report'] = function () { copyReport(); };
  ACT.finish = function () { finishSheet(); };
  ACT['close-modal'] = function () { closeModal(); };
  ACT.rule = function () {
    var r = curRead && curRead();
    if (r) openRule(r.type);
  };
})();

<script>
/* screens-b.js (Maker SCR-B): reading, marked, call, outcome. Plain browser script. */
(function () {
  window.ACT = window.ACT || {};
  window.UI = window.UI || { key: null, pick: null, timer: null };

  var QUESTION = {
    R1: ["Signal: what do the last 3 columns show?", "Look for a double or triple top or bottom break."],
    R2: ["Support: which box is the low of the last completed O column?", "Set the box, or tap a row on the chart."],
    R2b: ["Resistance: which box is the high of the last completed X column?", "Set the box, or tap a row on the chart."],

    R5: ["RSI(14): which band is it in?", "Read the RSI pane."],
    R6: ["MACD(12,26,9): what is the histogram doing?", "Sign, and direction against last week."],
    R7: ["Divergence: do price and RSI disagree?", "Compare the latest swing in price with RSI at the same points."],
    S1: ["Sector signal: what do the last 3 columns of the sector chart show?", "Read the lower chart. Look for a double or triple top or bottom break."],
    S2: ["Sector trend: which line is active on the sector chart?", "Read the lower chart. Support rises, resistance falls."]
  };
  var STEPPER = { R2: 1, R2b: 1, R4: 1 };
  function isStep(type) {

    return !!STEPPER[type];
  }
  function isSec(type) { return type === "S1" || type === "S2"; }
  function fmtPct(r) { return retTxt(r, 1); } /* store: signed, 1 decimal */
  function retWord(r) {

  }
  function retCls(r) {

  }

  function toBars(a) {
    return (a || []).map(function (b) {
      return Array.isArray(b) ? { h: b[0], l: b[1], c: b[2] } : { h: b.h, l: b.l, c: b.c };

  function ctx() {

  }

  }
  function keepScroll(fn) { var y = window.scrollY || 0; fn(); try { window.scrollTo(0, y); } catch (e) {} }
  function safe(host, fn) {
    try { fn(); } catch (e) { if (host) host.innerHTML = '<div class="dim" style="padding:12px">Chart unavailable.</div>'; }
  }
  function clearTimer() { if (UI.timer) { clearTimeout(UI.timer); UI.timer = null; } }

  var ICON_OK = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="var(--x)" fill-opacity=".2" stroke="var(--x)" stroke-width="1.5"/><path d="M7 12.5l3.5 3.5L17 9" fill="none" stroke="var(--x)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_NO = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" fill="var(--o)" fill-opacity=".2" stroke="var(--o)" stroke-width="1.5"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" fill="none" stroke="var(--o)" stroke-width="2.2" stroke-linecap="round"/></svg>';
  var ICON_SKIP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" stroke="var(--dim)" stroke-width="2.2" stroke-linecap="round"/></svg>';
  var TICK = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="var(--text)" stroke-width="2"/><path d="M7 12.5l3.5 3.5L17 9" fill="none" stroke="var(--text)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function chipsRow() {
    return '<div class="cs"><span>Box 2%</span><span>3-box reversal</span><span>Weekly</span><span>High/Low</span></div>';
  }
  function fmtHist(h) { var v = h * 100; return (v >= 0 ? "+" : "-") + Math.abs(v).toFixed(2); }

  /* panes: returns HTML; draw() afterwards */
  function paneHtml(show, closes) {
    var out = "";
    if (show.rsi) {
      var r = CSE.rsi(closes);
      out += '<div class="card pane"><div class="ph"><span class="t">RSI <i>14</i></span><span class="v num">' +
        esc(String(Math.round(r[r.length - 1]))) + '</span></div><div id="rsi"></div><div class="tax"><span>26 wks</span><span>now</span></div></div>';
    }

        esc(fmtHist(h)) + '</span></div><div id="macd"></div><div class="leg">Solid line MACD, dashed line signal, bars histogram</div><div class="tax"><span>26 wks</span><span>now</span></div></div>';
    }
    return out;
  }
  function paneShow(type) {
    return { rsi: !!(T.showRsi || type === "R5" || type === "R7"), macd: !!(T.showMacd || type === "R6") };
  }
  function drawPanes(show, closes, opt) {
    opt = opt || {};
    if (show.rsi) { var a = $("rsi"); safe(a, function () { drawRsi(a, closes, { newFrom: opt.newFrom == null ? null : opt.newFrom, mark: opt.rsiMark || null }); }); }
    if (show.macd) { var b = $("macd"); safe(b, function () { drawMacd(b, closes, { newFrom: opt.newFrom == null ? null : opt.newFrom }); }); }
  }
  function drawChart(c, o) {
    var host = $("pf");
    safe(host, function () {
      var op = {
        bars: o.bars || c.bars, eng: o.eng || c.eng, newFrom: o.newFrom == null ? null : o.newFrom,
        cols: T.chartCols || 24, showColNums: !!T.showColNums, overlays: o.overlays || [],
        pick: o.pick == null ? null : o.pick, onRow: o.onRow || null, height: o.height || 300,

  function drawSector(c, o) {

    o = o || {};

    safe(host, function () {
      drawPnf(host, {
        bars: o.bars || c.sec.bars, eng: o.eng || c.sec.eng, newFrom: o.newFrom == null ? null : o.newFrom,
        cols: T.chartCols || 24, showColNums: false, overlays: o.overlays || [],
        height: sh, compact: true, title: "Sector · " + c.sec.name,
        cell: 11, minCell: o.minCell || 6, fitHeight: !!o.fitHeight, maxPlotH: o.maxPlotH || Math.max(66, sh - 46) /* v2: 11px cells, cropped like the stock chart */
      });
    });
  }
  function showSector(c, type) { return !!(c.sec && (T.showSector || isSec(type))); }
  function secPane(c, type) {
    return showSector(c, type) ? '<div class="card pf secp"><div class="pfwrap" id="pfs"></div></div>' : "";
  }
  function trendOv(eng) { try { return { k: "trend", segs: CSE.trend(eng).segs }; } catch (e) { return null; } }
  function subLine(c) { return "Week " + c.bars.length + ", box 2%, last " + esc(CSE.disp(c.close)); }

  /* ---------- reading ---------- */
  window.renderReading = function () {
    sync();
    clearTimer();
    var c = ctx(), rd = curRead(), type = rd.type, n = S.cur.reads.length;
    var stepper = isStep(type);
    if (stepper && UI.pick == null) UI.pick = c.closeBox;
    var q = QUESTION[type] || [CSE.NAMES[type], ""];
    var show = paneShow(type);
    var closes = c.bars.map(function (b) { return b.c; });

    var h = header(esc(S.cur.code) + " · Reading " + (S.cur.i + 1) + " of " + n, subLine(c), { gear: true });

    var qhtml = '<div class="card q"><h2>' + esc(q[0]) + '</h2><p>' + esc(q[1]) + '</p>';
    if (stepper) {

      qhtml += '<div class="cap2">' + esc(lab) + '</div><div class="stp" style="margin-bottom:10px">' +
        '<button class="btn" id="stepDown" data-act="step-down" aria-label="Lower one box">&minus;</button>' +
        '<span class="qty num" id="stepVal">' + esc(CSE.disp(CSE.priceOf(UI.pick))) + '<small>your pick</small></span>' +
        '<button class="btn" id="stepUp" data-act="step-up" aria-label="Higher one box">+</button></div>';

      var opts = (CSE.OPTIONS && CSE.OPTIONS[type]) || [];

      secPane(c, type) + paneHtml(show, closes) + qhtml + '</div>';

    if (stepper) ov.push({ k: "row", box: UI.pick, label: "your pick", style: "pick" });

    bar([

  function stepBy(d) {

  /* ---------- marked ---------- */
  window.renderMarked = function () {

    var c = ctx(), rd = curRead(), type = rd.type, n = S.cur.reads.length;

    var pillTxt = rd.skipped ? "Skipped" : (rd.ok ? "Right" : "Marked");

      (rd.ok ? '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 5.5L4 8L8.5 2" fill="none" stroke="' + pillClr + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        : '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 2L8 8M8 2L2 8" stroke="' + pillClr + '" stroke-width="2" stroke-linecap="round"/></svg>') +
      esc(pillTxt) + '</span>';
    var h = header(esc(S.cur.code) + " · Reading " + (S.cur.i + 1) + " of " + n, subLine(c), { pill: pill });

    var ov = [{ k: "close", box: c.closeBox }];
    var given = rd.given;
    if (type === "R1") {

    } else if ((type === "R2" || type === "R2b") && ans) {
      ov.push({ k: "row", box: ans.answer, label: "engine " + CSE.disp(CSE.priceOf(ans.answer)), style: "engine" });
      if (typeof given === "number") ov.push({ k: "row", box: given, label: "your row", style: "pick" });
    } else if (type === "R3" && ans) {
      var t3 = trendOv(c.eng); if (t3) ov.push(t3);
    } else if (type === "R4" && ans) {
      ov.push({ k: "col", col: ans.col, label: ans.boxes + " boxes" });
      ov.push({ k: "line", box: ans.answer, label: "engine objective " + CSE.disp(CSE.priceOf(ans.answer)), style: "engine" });
      if (typeof given === "number") ov.push({ k: "line", box: given, label: "your objective", style: "pick" });
    }
    var sov = [];
    if (c.sec) {
      if (type === "S1" && SR.S1 && SR.S1.col != null && SR.S1.answer !== "No signal") {
        sov.push({ k: "sig", col: SR.S1.col, label: /sell/.test(SR.S1.answer) ? "Sell" : "Buy" });
      }
      if (isSec(type)) { var t4 = trendOv(c.sec.eng); if (t4) sov.push(t4); }
    }

    var chip = "";
    if (type === "R1" && R.R1 && R.R1.answer !== "No signal") {
      var sell = /sell/.test(R.R1.answer), fresh = R.R1.col === nCols - 1;
      chip = '<div class="chips"><span class="chip fresh ' + (sell ? "sell" : "buy") + '">' + esc(R.R1.answer + (fresh ? ", this week" : "")) + '</span></div>';
