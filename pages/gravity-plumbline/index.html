<body>
<canvas id="game"></canvas>
<script>
(function(){
const PL = (globalThis.PL = globalThis.PL || {});
(function () {
  'use strict';
  const C = (PL.C = { DT: 1 / 120, G: 1500, CAP: 700, DIVE_CAP: 900, DIVE_ADD: 250, DIVE_BOOST_T: 0.3, DIVE_CD: 0.5, CHARGES: 2, HALF: 11, FRIC: 900, DRAG: 0.35, DRAG_AFTER: 0.3, BOUNCE_SIDE: 0.15, BUFFER: 0.08, CRUMBLE_T: 0.35, GATE_V: 120, RESPAWN_T: 0.3 });
  const DIRS = (PL.DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]);
  const DT = C.DT, H = C.HALF;
  const CRUMBLE_TICKS = Math.round(C.CRUMBLE_T / DT);
  const DEAD_TICKS = Math.round(C.RESPAWN_T / DT);
  const BUFFER_TICKS = Math.round(C.BUFFER / DT); // 10: pending flip survives age<=10 ticks
  const DIVE_CD_TICKS = Math.round(C.DIVE_CD / DT); // 60
  const DIVE_BOOST_TICKS = Math.round(C.DIVE_BOOST_T / DT); // 36
  const EPS = 1e-6;

  PL.newState = function (room) {
    const s = {
      room, t: 0, x: room.start.x, y: room.start.y, vx: 0, vy: 0, g: room.start.g,
      charges: C.CHARGES, grounded: false, airT: 0, diveCd: 0, diveBoost: 0, pending: null,
      crumbleS: (room.crumbles || []).map(() => ({ st: 0, timer: 0 })),
      dead: 0, won: false, flips: 0, lastLandSpeed: 0, events: [],
    };
    // spawn grounded if the start sits on a surface (no spurious 'land' on tick 1)
    const d = DIRS[s.g];
    s.x += d[0]; s.y += d[1];
    s.grounded = buildSolids(s, 0, 0).some((o) => overlapX(s, o.r) > EPS && overlapY(s, o.r) > EPS);
    s.x -= d[0]; s.y -= d[1];
    return s;
  };

  function crusherRect(c, t) {
    const s = Math.sin(2 * Math.PI * (t * DT) / 2.4 + c.phase) * c.amp;
    return [c.r[0] + c.ax * s, c.r[1] + c.ay * s, c.r[2], c.r[3]];
  }

  // internal solids: {r, cr (crumble index or -1)}
  function buildSolids(s, vx, vy) {
    const room = s.room, out = [];
    for (const r of room.walls) out.push({ r, cr: -1 });
    (room.crumbles || []).forEach((r, i) => { if (s.crumbleS[i].st !== 2) out.push({ r, cr: i }); });
    for (const g of (room.gates || [])) {
      if (overlaps(s, g.r)) continue; // latch: a gate never turns solid around a bob already inside it
      const dd = DIRS[g.dir];
      if (vx * dd[0] + vy * dd[1] < C.GATE_V) out.push({ r: g.r, cr: -1, gate: true });
    }
    for (const c of (room.crushers || [])) out.push({ r: crusherRect(c, s.t), cr: -1 });
    return out;
  }
  // gate state uses post-gravity velocity, matching PL.step
  PL.solids = function (s) {
    const d = DIRS[s.g];
    return buildSolids(s, s.vx + d[0] * C.G * DT, s.vy + d[1] * C.G * DT).map((o) => o.r);
  };

  function overlapX(s, r) { return Math.min(s.x + H, r[0] + r[2]) - Math.max(s.x - H, r[0]); }
  function overlapY(s, r) { return Math.min(s.y + H, r[1] + r[3]) - Math.max(s.y - H, r[1]); }
  function overlaps(s, r) { return overlapX(s, r) > 0 && overlapY(s, r) > 0; }

  // move one axis (0=x,1=y); returns hit info
  function moveAxis(s, ax, solids, hit) {
    if (ax === 0) s.x += s.vx * DT; else s.y += s.vy * DT;
    for (const o of solids) {
      const r = o.r;
      const ox = overlapX(s, r), oy = overlapY(s, r);
      if (!(ox > EPS && oy > EPS)) continue;
      // resolve on the axis of least penetration only (x pass yields to y when oy<ox, y pass yields when ox<oy)
      if (ax === 0 ? oy < ox : ox < oy) continue;
      const v = ax === 0 ? s.vx : s.vy;
      const c = ax === 0 ? s.x : s.y;
      const lo = ax === 0 ? r[0] : r[1], len = ax === 0 ? r[2] : r[3];
      // push out along the side of minimum penetration (not velocity sign) so moving solids cannot teleport the bob through
      const pPos = (c + H) - lo, pNeg = (lo + len) - (c - H);
      const sign = pPos < pNeg ? 1 : pPos > pNeg ? -1 : (v >= 0 ? 1 : -1);
      const np = sign > 0 ? lo - H : lo + len + H;
      if (ax === 0) s.x = np; else s.y = np;
      const gsign = DIRS[s.g][ax];
      if (gsign === sign) {
        // landing on gravity side
        hit.ground = true;
        hit.speed = Math.max(hit.speed, Math.abs(v));
        if (ax === 0) s.vx = 0; else s.vy = 0;
        if (o.cr >= 0) hit.crumbles.push(o.cr);
      } else if (v !== 0 && Math.sign(v) === sign) {
        if (ax === 0) s.vx = -C.BOUNCE_SIDE * s.vx; else s.vy = -C.BOUNCE_SIDE * s.vy;
      }
    }
  }

  function doFlip(s, dir) {
    s.g = dir; s.flips++; s.events.push('flip'); s.grounded = false;
  }

  function applyInput(s, inp) {
    if (inp.k === 'flip') {
      if (!Number.isInteger(inp.dir) || inp.dir < 0 || inp.dir > 3 || inp.dir === s.g) return;
      if (s.grounded) doFlip(s, inp.dir);
      else if (s.charges > 0) { s.charges--; doFlip(s, inp.dir); }
      else s.pending = { dir: inp.dir, age: 0 }; // age in ticks
    } else if (inp.k === 'dive') {
      if (s.diveCd > 0) return;
      if (!s.grounded) { if (s.charges <= 0) return; s.charges--; }
      const d = DIRS[s.g];
      s.vx += d[0] * C.DIVE_ADD; s.vy += d[1] * C.DIVE_ADD;
      s.diveBoost = DIVE_BOOST_TICKS; s.diveCd = DIVE_CD_TICKS; s.events.push('dive');
    }
  }

  function die(s) { if (!s.dead) { s.dead = DEAD_TICKS; s.events.push('death'); } }

  PL.step = function (s, inputs) {
    s.events.length = 0;
    if (s.won) return;
    if (s.dead > 0) { s.dead--; s.t++; return; }
    if (inputs) for (const i of inputs) applyInput(s, i);

    // timers
    if (s.diveCd > 0) s.diveCd--;
    if (s.diveBoost > 0) s.diveBoost--;
    if (s.pending) { s.pending.age++; if (s.pending.age > BUFFER_TICKS) s.pending = null; }

    // forces
    const d = DIRS[s.g];
    s.vx += d[0] * C.G * DT; s.vy += d[1] * C.G * DT;
    if (s.grounded) {
      s.airT = 0;
      if (d[0] === 0) s.vx = fric(s.vx); else s.vy = fric(s.vy);
    } else {
      s.airT += DT;
      if (s.airT > C.DRAG_AFTER) {
        const k = 1 - C.DRAG * DT;
        if (d[0] === 0) s.vx *= k; else s.vy *= k;
      }
    }
    const cap = s.diveBoost > 0 ? C.DIVE_CAP : C.CAP;
    s.vx = Math.max(-cap, Math.min(cap, s.vx));
    s.vy = Math.max(-cap, Math.min(cap, s.vy));

    // move
    const solids = buildSolids(s, s.vx, s.vy);
    const hit = { ground: false, speed: 0, crumbles: [] };
    moveAxis(s, 0, solids, hit);
    moveAxis(s, 1, solids, hit);

    const was = s.grounded;
    s.grounded = hit.ground;
    if (hit.ground) {
      if (!was) {
        s.lastLandSpeed = hit.speed; s.airT = 0; s.events.push('land');
        s.charges = C.CHARGES;
        if (s.pending) { const p = s.pending; s.pending = null; if (p.dir !== s.g) { doFlip(s, p.dir); s.grounded = false; } }
      } else s.charges = C.CHARGES;
    }
    // decrement first, then trigger: a newly triggered crumble keeps the full CRUMBLE_TICKS
    s.crumbleS.forEach((c) => {
      if (c.st === 1 && --c.timer <= 0) { c.st = 2; c.timer = 0; s.events.push('crumble'); }
    });
    if (hit.ground) {
      for (const i of hit.crumbles) if (s.crumbleS[i].st === 0) { s.crumbleS[i].st = 1; s.crumbleS[i].timer = CRUMBLE_TICKS; }
    }

    // crush check against solids at this tick
    const now = buildSolids(s, s.vx, s.vy);
    for (const o of now) {
      if (o.gate) continue; // gates only block entry, never crush
      if (overlaps(s, o.r) && Math.min(overlapX(s, o.r), overlapY(s, o.r)) > 1) { die(s); break; }
    }
    // spikes
    if (!s.dead) {
      const h = H - 3;
      for (const sp of s.room.spikes || []) {
        const r = sp.r;
        if (s.x + h > r[0] && s.x - h < r[0] + r[2] && s.y + h > r[1] && s.y - h < r[1] + r[3]) { die(s); break; }
      }
    }
    if (!s.dead && (s.x < -40 || s.y < -40 || s.x > s.room.w + 40 || s.y > s.room.h + 40)) die(s);
    if (!s.dead) {
      const e = s.room.exit;
      if (Math.hypot(s.x - e.x, s.y - e.y) < 18) { s.won = true; s.events.push('win'); }
    }
    s.t++;
  };

  function fric(v) {
    const a = C.FRIC * DT;
    return Math.abs(v) <= a ? 0 : v - Math.sign(v) * a;
  }

  PL.hash = function (s) {
    const a = [s.x, s.y, s.vx, s.vy, s.g, s.charges, s.t, s.flips, s.dead, s.won ? 1 : 0];
    a.push(s.grounded ? 1 : 0, s.diveCd, s.diveBoost, s.airT, s.pending ? s.pending.dir + ':' + s.pending.age : '-');
    for (const c of s.crumbleS) a.push(c.st, c.timer);
    return a.join(',');
  };

  PL.replay = function (room, log) {
    const s = PL.newState(room);
    const end = (log.length ? log[log.length - 1].tick : 0) + 600;
    let i = 0;
    while (s.t < end && !s.won && !s.dead) {
      const inp = [];
      while (i < log.length && log[i].tick <= s.t) { inp.push({ k: log[i].k, dir: log[i].dir }); i++; }
      PL.step(s, inp);
    }
    return { state: s, hash: PL.hash(s) };
  };
})();

})();
(function(){
// rooms.js - Plumbline: seeded RNG + 3 hardcoded rooms (336x500, border walls 12 px included).
// Node-loadable, no DOM. Seed only picks per-room x-mirror and crusher phase.
//
// Geometry notes: G 1500, cap 700, bob box 22 (half 11), flip keeps velocity.
// A ledge with top at T puts a grounded bob at y = T - 11. Fly lines use that y.
// Solutions below are written for the UNMIRRORED layout; when a room is mirrored swap
// left<->right (gravity dir 1<->3) and x -> 336 - x. Times are seconds from first input.
//
// ROOM 1  "Arc Carry" (teach: flip mid-fall bends a carried speed into an arc)
//   Start on left pillar (40,109). Pit with floor spikes below the gap; spikes on the right
//   wall at y 80-120 sit on the lazy line (flip right and hold).
//   Solution (2 flips, ~1.0 s): t=0.00 swipe RIGHT (free, grounded) -> bob sweeps over the gap;
//   t=0.31..0.46 swipe DOWN (costs 1 charge; before bob x~185) -> arc lands on the right block
//   around x 265-313. If landing is past the exit, swipe LEFT (free) to slide back through it.
//   Too late = right-wall spikes; never flipping right = pit spikes.
//
// ROOM 2  "Charge Banking" (teach: landing refills charges; crumble ledge; Dive-tap gate)
//   Start on top-left ledge (40,79). Wall spikes at y 40-90 on the right wall.
//   Solution (3 flips + 1 dive, ~3 s): t=0 swipe RIGHT (free); t=0.31..0.45 swipe DOWN
//   (1 charge) -> land on the crumble ledge (right, y 200, charges refill to 2, it breaks 0.35 s
//   after landing and below it are floor spikes). Immediately (<0.3 s) swipe LEFT (free) -> bob
//   flies along the 26 px tall corridor and stops on the plug at its end (x 111). Swipe DOWN (free,
//   grounded): bob rests on the one-way gate floor (needs 120 px/s down; corridor is too short
//   to build it). TAP = Dive (+250) -> bob drops through the gate, lands x~111 on the safe left
//   part of the lower floor (spikes start x 124). Swipe LEFT (free) -> slide into the exit.
//
// ROOM 3  "Rhythm Press" (teach: crusher rhythm + Late Flip)
//   Start on the left ledge (40,119). A press plate (ay, amp 50, period 2.4 s, phase from seed)
//   closes onto a slab; the 22 px bob fits the gap only while sin(phase_t) < ~0.56 (about 60 %).
//   Solution (3 flips, ~4-5 s incl. waiting): watch the plate, swipe RIGHT (free) so bob
//   passes x~117..223 (arrives ~0.33 s after the swipe) while the gap is open; bob hits right wall (grounded);
//   swipe DOWN (free) and fall along the wall at ~600-700 px/s; at about y 190-230 (t~0.3 s after
//   the wall) swipe LEFT (1 charge) to carry speed sideways, then LATE swipe DOWN (1 charge) in the
//   last ~0.2 s so the arc drops onto the left shelf (top y 430, x 12-220). Floor spikes x 220-324
//   punish the lazy straight fall. Swipe LEFT (free) to slide into the exit.

const PL = (globalThis.PL = globalThis.PL || {});

PL.mulberry32 = function (seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

(function () {
  const W = 336, H = 500, B = 12;
  const border = () => [[0, 0, W, B], [0, H - B, W, B], [0, 0, B, H], [W - B, 0, B, H]];

  function base() {
    return [
      { // Room 1: Arc Carry
        name: 'Arc Carry',
        teach: 'Flip mid-fall: your speed turns into a sideways arc over the gap.',
        start: { x: 40, y: 109, g: 2 },
        walls: border().concat([[12, 120, 90, 368], [190, 200, 134, 288]]),
        spikes: [{ r: [102, 472, 88, 16] }, { r: [312, 80, 12, 40] }],
        crumbles: [], gates: [], crushers: [],
        exit: { x: 285, y: 189 },
      },
      { // Room 2: Charge Banking
        name: 'Charge Banking',
        teach: 'Landing refills charges. The ledge crumbles; tap to Dive through the gate.',
        start: { x: 40, y: 79, g: 2 },
        walls: border().concat([
          [12, 90, 90, 14],      // start ledge
          [100, 150, 126, 24],   // corridor ceiling
          [88, 150, 12, 58],     // corridor end plug
          [12, 450, 312, 38],    // lower floor
        ]),
        spikes: [{ r: [312, 40, 12, 50] }, { r: [124, 436, 200, 14] }],
        crumbles: [[226, 200, 98, 12]],
        gates: [{ r: [100, 200, 126, 8], dir: 2 }],
        crushers: [],
        exit: { x: 40, y: 439 },
      },
      { // Room 3: Rhythm Press
        name: 'Rhythm Press',
        teach: 'Slip through when the press opens, then flip late to land tight.',
        start: { x: 40, y: 119, g: 2 },
        walls: border().concat([
          [12, 130, 100, 14],    // start ledge
          [128, 132, 84, 14],    // press slab
          [12, 430, 208, 58],    // landing shelf
        ]),
        spikes: [{ r: [220, 472, 104, 16] }],
        crumbles: [], gates: [],
        crushers: [{ r: [128, 60, 84, 20], ax: 0, ay: 1, amp: 50, phase: 0 }],
        exit: { x: 50, y: 419 },
      },
    ];
  }

  const mr = (r) => [W - r[0] - r[2], r[1], r[2], r[3]];

  function mirror(room) {
    room.start.x = W - room.start.x;
    room.exit.x = W - room.exit.x;
    room.walls = room.walls.map(mr);
    room.spikes = room.spikes.map((s) => ({ r: mr(s.r) }));
    room.crumbles = room.crumbles.map(mr);
    room.gates = room.gates.map((g) => ({ r: mr(g.r), dir: g.dir === 1 ? 3 : g.dir === 3 ? 1 : g.dir }));
    room.crushers = room.crushers.map((c) => ({ r: mr(c.r), ax: c.ax, ay: c.ay, amp: c.amp, phase: c.phase }));
    room.mirrored = true;
  }

  PL.buildRooms = function (seed) {
    const rng = PL.mulberry32(seed);
    const rooms = base();
    for (const room of rooms) {
      const m = rng() < 0.5;
      const phase = rng() * Math.PI * 2;
      room.w = W; room.h = H;
      room.mirrored = false;
      for (const c of room.crushers) c.phase = phase;
      if (m) mirror(room);
    }
    return rooms;
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = PL;

})();
(function(){
// camera.js - Plumbline camera (pure, Node-loadable, deterministic).
// Per frame: (1) scale first (zoom spring, ZOOM_T), (2) look-ahead target,
// (3) soft room clamp + soft bob band (bob below the HUD, at/above 55% H, led
// LEAD s along the motion), (4) critically damped spring on the error with the
// target velocity fed forward, camera acceleration rate-limited to ACC
// (5 px/frame step change at 60 fps), (5) hard guarantees: room clamp (never
// moves further out than target/last frame), bob on screen and above 55% H.
// Horizontal: locked to the room centre while the visible width >= room.w - 8
// (always for the 336 px room); follows only when zoomed in tighter.
// Vertical: if the room fits between HUD (120 css px, frame.hudTop) and the
// strip line at rest scale, it is top-aligned under the HUD; else it scrolls.
// Measured sight ahead at cap speed 700 px/s, bob at room centre, camera settled
// (from src/test/camera-test.js; "screen" = to canvas edge, "play" = to the
// strip line y=0.6H when moving down, else same as screen):
//   view     dir    screen s  play s
//   344x882  up     0.89      0.89
//   344x882  right  0.34      0.34
//   344x882  down   1.15      0.44
//   344x882  left   0.34      0.34
//   475x638  up     0.46      0.46
//   475x638  right  0.34      0.34
//   475x638  down   0.63      0.26
//   475x638  left   0.34      0.34
// Sideways is bounded by the 336 px room box: with x locked the far wall is
// always on screen, so right/left is "time to the wall", not a camera limit.
// Jitter (test/camera-check2.js, falling bob, 60 fps / 120 Hz / 0.1 s hitch):
// max camera step change 5.0 px/frame (limit 6), was 16.4.
const PL = (globalThis.PL = globalThis.PL || {});

PL.CAM = {
  ROOM_W: 336, MAX_W: 480, CAP: 700,
  LOOK_WIDE: 0.35, LOOK_TALL: 0.25, WIDE_ASPECT: 0.6,
  BOB_MAX_Y: 0.55, BOB_MIN_Y: 0.12, SIDE_PAD: 16, R: 11,
  OVER: 40, POS_T: 0.15, ZOOM_T: 0.45, MAX_DT: 0.1,
  // soft bob band margin (screen px) + blend width (room px); camera accel
  // limit (screen px/s^2): 18000 = 5 px/frame step change at 60 fps.
  SOFT_PAD: 28, SOFT_K: 48, ACC: 18000, LEAD: 0.25,
  // HUD band at the top (css px); horizontal lock when the view shows the
  // room width (visible width >= room.w - LOCK_SLACK).
  HUD: 120, LOCK_SLACK: 8, STRIP_Y: 0.6, ROOM_PAD: 16, TGT_SLACK: 40,
};

// Critically damped smoothing (stable for any dt). s = {v}
function smooth(cur, target, s, T, dt) {
  const w = 2 / T, x = w * dt;
  const e = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
  const ch = cur - target, tmp = (s.v + w * ch) * dt;
  s.v = (s.v - w * tmp) * e;
  return target + (ch + tmp) * e;
}

function roomDims(state) {
  const r = state && state.room;
  return { w: (r && r.w) || 336, h: (r && r.h) || 500 };
}

function targets(state, view) {
  const K = PL.CAM;
  const sp = Math.min(K.CAP, Math.hypot(state.vx || 0, state.vy || 0));
  const visW = K.ROOM_W + (K.MAX_W - K.ROOM_W) * (sp / K.CAP);
  const look = view.W / view.H > K.WIDE_ASPECT ? K.LOOK_WIDE : K.LOOK_TALL;
  return { visW, cx: state.x + (state.vx || 0) * look, cy: state.y + (state.vy || 0) * look };
}

// Smooth max/min: continuous, >= max (<= min), off by at most k/2 at the seam.
function softMax(a, b, k) { return (a + b + Math.sqrt((a - b) * (a - b) + k * k)) / 2; }
function softMin(a, b, k) { return (a + b - Math.sqrt((a - b) * (a - b) + k * k)) / 2; }

// Per-axis limits for camera centre c given bob p: bob screen pos in [sMin,sMax].
// screen = (p - c)*s + half  ->  c in [p - (sMax-half)/s, p - (sMin-half)/s]
function bobRange(p, s, half, sMin, sMax) {
  return [p - (sMax - half) / s, p - (sMin - half) / s];
}

// Bob screen bands for this frame's scale (pad = extra soft margin, screen px).
// Soft band keeps the bob below the HUD; the hard band only below 12% H.
// lockX: horizontal is locked, so x only has to stay on screen.
function bands(view, s, pad, lockX) {
  const K = PL.CAM, rr = K.R * s;
  const top = pad > 0 ? Math.max(K.BOB_MIN_Y * view.H, K.HUD) : K.BOB_MIN_Y * view.H;
  const sp = lockX ? 0 : K.SIDE_PAD;
  return {
    x: lockX ? [rr + 1e-6, view.W - rr - 1e-6] : [sp + rr + pad, view.W - sp - rr - pad],
    y: [top + rr + pad, K.BOB_MAX_Y * view.H - rr - pad],
  };
}

// Target for one axis, from the FINAL scale: look-ahead -> room clamp ->
// bob band as a soft limit (bob wins over the room).
