<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Plumbline</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;left:0;top:0;width:100vw;width:100dvw;height:100vh;height:100dvh;display:block;background:#000;touch-action:none}
</style>

<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<canvas id="game"></canvas>
<script>
(function(){
const PL = (globalThis.PL = globalThis.PL || {});
(function () {
  'use strict';
  const C = (PL.C = { DT: 1 / 120, G: 1500, CAP: 700, DIVE_CAP: 900, DIVE_ADD: 250, DIVE_BOOST_T: 0.3, DIVE_CD: 0.5, CHARGES: 2, HALF: 11, FRIC: 900, DRAG: 0.35, DRAG_AFTER: 0.3, BOUNCE_SIDE: 0.15, BUFFER: 0.08, CRUMBLE_T: 0.35, GATE_V: 120, RESPAWN_T: 0.3, WALL_RIDE_T: 0.25, COYOTE_T: 0.06 });
  const DIRS = (PL.DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]);
  const DT = C.DT, H = C.HALF;
  const CRUMBLE_TICKS = Math.round(C.CRUMBLE_T / DT);
  const DEAD_TICKS = Math.round(C.RESPAWN_T / DT);
  const BUFFER_TICKS = Math.round(C.BUFFER / DT); // 10: pending flip survives age<=10 ticks
  const DIVE_CD_TICKS = Math.round(C.DIVE_CD / DT); // 60
  const DIVE_BOOST_TICKS = Math.round(C.DIVE_BOOST_T / DT); // 36
  const RIDE_TICKS = Math.round(C.WALL_RIDE_T / DT); // 30
  const COYOTE_TICKS = Math.round(C.COYOTE_T / DT); // 7: flip/dive free for 7 ticks after walking off, denied on the 8th
  const EPS = 1e-6;

  PL.newState = function (room) {
    const s = {
      room, t: 0, x: room.start.x, y: room.start.y, vx: 0, vy: 0, g: room.start.g,
      charges: C.CHARGES, grounded: false, airT: 0, diveCd: 0, diveBoost: 0, pending: null,
      crumbleS: (room.crumbles || []).map(() => ({ st: 0, timer: 0 })),
      rideT: 0, rideKey: '', rideUsed: [], coyote: 0,
      dead: 0, won: false, flips: 0, lastLandSpeed: 0, events: [],
    };
    // spawn grounded if the start sits on a surface (no spurious 'land' on tick 1)
    const d = DIRS[s.g];
    s.x += d[0]; s.y += d[1];
    s.grounded = buildSolids(s, 0, 0).some((o) => overlapX(s, o.r) > EPS && overlapY(s, o.r) > EPS);
    s.x -= d[0]; s.y -= d[1];
    return s;
  };

  function crusherRect(c, t) {
    const s = Math.sin(2 * Math.PI * (t * DT) / 2.4 + c.phase) * c.amp;
    return [c.r[0] + c.ax * s, c.r[1] + c.ay * s, c.r[2], c.r[3]];
  }

  // internal solids: {r, cr (crumble index or -1)}
  function buildSolids(s, vx, vy) {
    const room = s.room, out = [];
    for (const r of room.walls) out.push({ r, cr: -1, key: 'w' + out.length });
    (room.crumbles || []).forEach((r, i) => { if (s.crumbleS[i].st !== 2) out.push({ r, cr: i, key: 'c' + i }); });
    (room.gates || []).forEach((g, gi) => {
      if (overlaps(s, g.r)) return; // latch: a gate never turns solid around a bob already inside it
      const dd = DIRS[g.dir];
      if (vx * dd[0] + vy * dd[1] < C.GATE_V) out.push({ r: g.r, cr: -1, gate: true, key: 'g' + gi });
    });
    (room.crushers || []).forEach((c, ci) => out.push({ r: crusherRect(c, s.t), cr: -1, key: 'k' + ci }));
    return out;
  }
  // gate state uses post-gravity velocity, matching PL.step
  PL.solids = function (s) {
    const d = DIRS[s.g];
    return buildSolids(s, s.vx + d[0] * C.G * DT, s.vy + d[1] * C.G * DT).map((o) => o.r);
  };

  function overlapX(s, r) { return Math.min(s.x + H, r[0] + r[2]) - Math.max(s.x - H, r[0]); }
  function overlapY(s, r) { return Math.min(s.y + H, r[1] + r[3]) - Math.max(s.y - H, r[1]); }
  function overlaps(s, r) { return overlapX(s, r) > 0 && overlapY(s, r) > 0; }

  // move one axis (0=x,1=y); returns hit info
  function moveAxis(s, ax, solids, hit) {
    if (ax === 0) s.x += s.vx * DT; else s.y += s.vy * DT;
    for (const o of solids) {
      const r = o.r;
      const ox = overlapX(s, r), oy = overlapY(s, r);
      if (!(ox > EPS && oy > EPS)) continue;
      // resolve on the axis of least penetration only (x pass yields to y when oy<ox, y pass yields when ox<oy)
      if (ax === 0 ? oy < ox : ox < oy) continue;
      const v = ax === 0 ? s.vx : s.vy;
      const c = ax === 0 ? s.x : s.y;
      const lo = ax === 0 ? r[0] : r[1], len = ax === 0 ? r[2] : r[3];
      // push out along the side of minimum penetration (not velocity sign) so moving solids cannot teleport the bob through
      const pPos = (c + H) - lo, pNeg = (lo + len) - (c - H);
      const sign = pPos < pNeg ? 1 : pPos > pNeg ? -1 : (v >= 0 ? 1 : -1);
      const np = sign > 0 ? lo - H : lo + len + H;
      if (ax === 0) s.x = np; else s.y = np;
      const gsign = DIRS[s.g][ax];
      if (gsign === sign) {
        // landing on gravity side
        hit.ground = true;
        hit.speed = Math.max(hit.speed, Math.abs(v));
        if (ax === 0) s.vx = 0; else s.vy = 0;
        if (o.cr >= 0) hit.crumbles.push(o.cr);
      } else if (v !== 0 && Math.sign(v) === sign) {
        if (ax === 0) s.vx = -C.BOUNCE_SIDE * s.vx; else s.vy = -C.BOUNCE_SIDE * s.vy;
      }
    }
  }

  function doFlip(s, dir) {
    s.g = dir; s.flips++; s.events.push('flip'); s.grounded = false; s.coyote = 0;
  }

  function applyInput(s, inp) {
    if (inp.k === 'flip') {
      if (!Number.isInteger(inp.dir) || inp.dir < 0 || inp.dir > 3 || inp.dir === s.g) return;
      if (s.grounded || s.coyote > 0) doFlip(s, inp.dir);
      else if (s.charges > 0) { s.charges--; doFlip(s, inp.dir); }
      else s.pending = { dir: inp.dir, age: 0 }; // age in ticks
    } else if (inp.k === 'dive') {
      if (s.diveCd > 0) return;
      if (!s.grounded && s.coyote <= 0) { if (s.charges <= 0) return; s.charges--; }
      s.coyote = 0;
      const d = DIRS[s.g];
      s.vx += d[0] * C.DIVE_ADD; s.vy += d[1] * C.DIVE_ADD;
      s.diveBoost = DIVE_BOOST_TICKS; s.diveCd = DIVE_CD_TICKS; s.events.push('dive');
    }
  }

  function die(s) { if (!s.dead) { s.dead = DEAD_TICKS; s.events.push('death'); } }

  PL.step = function (s, inputs) {
    s.events.length = 0;
    if (s.won) return;
    if (s.dead > 0) { s.dead--; s.t++; return; }
    if (inputs) for (const i of inputs) applyInput(s, i);

    // timers
    if (s.diveCd > 0) s.diveCd--;
    if (s.diveBoost > 0) s.diveBoost--;
    if (s.coyote > 0) s.coyote--;
    if (s.pending) { s.pending.age++; if (s.pending.age > BUFFER_TICKS) s.pending = null; }

    // forces
    const d = DIRS[s.g];
    s.vx += d[0] * C.G * DT; s.vy += d[1] * C.G * DT;
    if (s.grounded) {
      s.airT = 0;
      if (d[0] === 0) s.vx = fric(s.vx); else s.vy = fric(s.vy);
    } else {
      s.airT += DT;
      if (s.airT > C.DRAG_AFTER) {
        const k = 1 - C.DRAG * DT;
        if (d[0] === 0) s.vx *= k; else s.vy *= k;
      }
    }
    const cap = s.diveBoost > 0 ? C.DIVE_CAP : C.CAP;
    s.vx = Math.max(-cap, Math.min(cap, s.vx));
    s.vy = Math.max(-cap, Math.min(cap, s.vy));

    // move
    const solids = buildSolids(s, s.vx, s.vy);
    const hit = { ground: false, speed: 0, crumbles: [] };
    moveAxis(s, 0, solids, hit);
    moveAxis(s, 1, solids, hit);

    const was = s.grounded;
    s.grounded = hit.ground;
    if (was && !hit.ground) s.coyote = COYOTE_TICKS; // walked off a ledge (flip/dive already cleared grounded earlier)
    if (hit.ground) {
      s.coyote = 0; s.rideT = 0; s.rideKey = '';
      if (!was) {
        s.rideUsed.length = 0;
        s.lastLandSpeed = hit.speed; s.airT = 0; s.events.push('land');
        s.charges = C.CHARGES;
        if (s.pending) { const p = s.pending; s.pending = null; if (p.dir !== s.g) { doFlip(s, p.dir); s.grounded = false; } }
      } else s.charges = C.CHARGES;
    }
    if (!hit.ground) wallRide(s, solids);
    // decrement first, then trigger: a newly triggered crumble keeps the full CRUMBLE_TICKS
    s.crumbleS.forEach((c) => {
      if (c.st === 1 && --c.timer <= 0) { c.st = 2; c.timer = 0; s.events.push('crumble'); }
    });
    if (hit.ground) {
      for (const i of hit.crumbles) if (s.crumbleS[i].st === 0) { s.crumbleS[i].st = 1; s.crumbleS[i].timer = CRUMBLE_TICKS; }
    }

    // crush check against solids at this tick
    const now = buildSolids(s, s.vx, s.vy);
    for (const o of now) {
      if (o.gate) continue; // gates only block entry, never crush
      if (overlaps(s, o.r) && Math.min(overlapX(s, o.r), overlapY(s, o.r)) > 1) { die(s); break; }
    }
    // spikes
    if (!s.dead) {
      const h = H - 3;
      for (const sp of s.room.spikes || []) {
        const r = sp.r;
        if (s.x + h > r[0] && s.x - h < r[0] + r[2] && s.y + h > r[1] && s.y - h < r[1] + r[3]) { die(s); break; }
      }
    }
    if (!s.dead && (s.x < -40 || s.y < -40 || s.x > s.room.w + 40 || s.y > s.room.h + 40)) die(s);
    if (!s.dead) {
      const e = s.room.exit;
      if (Math.hypot(s.x - e.x, s.y - e.y) < 18) { s.won = true; s.events.push('win'); }
    }
    s.t++;
  };

  // continuous contact with a non-gravity-side solid (probe 0.05 px) for RIDE_TICKS refills +1 charge, once per solid per airborne period
  function wallRide(s, solids) {
    let key = '';
    const ox = s.x, oy = s.y;
    for (let k = 0; k < 4 && !key; k++) {
      if (k === s.g) continue;
      s.x = ox + DIRS[k][0] * 0.05; s.y = oy + DIRS[k][1] * 0.05;
      for (const o of solids) {
        if (o.gate) continue;
        const px = overlapX(s, o.r), py = overlapY(s, o.r);
        if (px > EPS && py > EPS && (DIRS[k][0] === 0 ? px : py) > 1) { key = o.key; break; }
      }
    }
    s.x = ox; s.y = oy;
    if (!key) { s.rideT = 0; s.rideKey = ''; return; }
    if (key !== s.rideKey) { s.rideKey = key; s.rideT = 0; }
    s.rideT++;
    if (s.rideT >= RIDE_TICKS && s.rideUsed.indexOf(key) < 0) {
      s.rideUsed.push(key);
      if (s.charges < C.CHARGES) s.charges++;
      s.events.push('ride');
    }
  }

  function fric(v) {
    const a = C.FRIC * DT;
    return Math.abs(v) <= a ? 0 : v - Math.sign(v) * a;
  }

  PL.hash = function (s) {
    const a = [s.x, s.y, s.vx, s.vy, s.g, s.charges, s.t, s.flips, s.dead, s.won ? 1 : 0];
    a.push(s.grounded ? 1 : 0, s.diveCd, s.diveBoost, s.airT, s.pending ? s.pending.dir + ':' + s.pending.age : '-');
    a.push(s.rideT, s.rideKey, s.rideUsed.join('|'), s.coyote);
    for (const c of s.crumbleS) a.push(c.st, c.timer);
    return a.join(',');
  };

  PL.replay = function (room, log) {
    const s = PL.newState(room);
    const end = (log.length ? log[log.length - 1].tick : 0) + 600;
    let i = 0;
    while (s.t < end && !s.won && !s.dead) {
      const inp = [];
      while (i < log.length && log[i].tick <= s.t) { inp.push({ k: log[i].k, dir: log[i].dir }); i++; }
      PL.step(s, inp);
    }
    return { state: s, hash: PL.hash(s) };
  };
})();

})();
(function(){
// rooms.js - Plumbline: seeded RNG + 3 hardcoded rooms (336x500, border walls 12 px included).
// Node-loadable, no DOM. Seed only picks per-room x-mirror and crusher phase.
//
// Geometry notes: G 1500, cap 700, bob box 22 (half 11), flip keeps velocity.
// A ledge with top at T puts a grounded bob at y = T - 11. Fly lines use that y.
// Solutions below are written for the UNMIRRORED layout; when a room is mirrored swap
// left<->right (gravity dir 1<->3) and x -> 336 - x. Times are seconds from first input.
//
// ROOM 1  "Arc Carry" (teach: flip mid-fall bends a carried speed into an arc)
//   Start on left pillar (40,109). Pit (x 102-215) with floor spikes; right-wall spikes y 80-120 sit
//   on the lazy line (flip right and hold, or flip right + tick-1 Dive: both die on the wall spikes).
//   Solution (2 flips, ~1.0 s): t=0.00 swipe RIGHT (free, grounded); t~0.31..0.45 swipe DOWN
//   (1 charge, before bob x~185) -> arc lands on the right block (top y 200, x 215-324) near
//   x 270-313. If past the exit, swipe LEFT (free) to slide back through it.
//
// ROOM 2  "Charge Banking" (teach: landing refills charges; crumble ledge; Dive-tap gate)
//   Start on top-left ledge (40,79). The left column (x 12-100) is solid to the floor and a wall
//   under the ledge's right end seals the chamber, so the gate floor is the only way in.
//   Solution (3 flips + 1 dive, ~3 s): t=0 swipe RIGHT (free); t~0.31..0.45 swipe DOWN (1 charge)
//   -> land on the crumble ledge (right, y 200, x 256-324; charges refill; it breaks 0.35 s after landing and
//   below it are floor spikes). Within 0.3 s swipe LEFT (free) -> bob flies the 26 px corridor and
//   stops at its end (x 111). Swipe DOWN (free, grounded): bob rests on the one-way gate floor (needs
//   120 px/s down; the corridor is too short to build it, max ~110). TAP = Dive (+250) -> falls into the
//   sealed chamber (x 100-226). Swipe RIGHT (free) -> slide into the exit (160,439).
//
// ROOM 3  "Rhythm Press" (teach: crusher rhythm + Late Flip)
//   Start on left ledge (40,119). A press plate (x 128-212, 60 tall, ay amp 50, period 2.4 s, phase from
//   seed) sits across the flight line y~119: it is clear only while its bottom is above y 108 or its top
//   below y 130 (about 40 % of the cycle, two windows), so the swipe-right moment differs per seed.
//   Solution (3 flips, ~3-5 s incl. waiting): time the first swipe RIGHT (free) so the bob arrives ~0.33 s
//   later while the plate is clear, hits the right wall (grounded); swipe DOWN (free) and fall along the
//   wall at 600-700 px/s; ~0.3 s later swipe LEFT (1 charge) to carry the speed sideways, then LATE swipe
//   DOWN (1 charge) in the last ~0.2 s so the arc drops onto the left shelf (top y 430, x 12-220).
//   Floor spikes x 220-324 punish the straight fall. Swipe LEFT (free) to slide into the exit.

const PL = (globalThis.PL = globalThis.PL || {});

PL.mulberry32 = function (seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

(function () {
  const W = 336, H = 500, B = 12;
  const border = () => [[0, 0, W, B], [0, H - B, W, B], [0, 0, B, H], [W - B, 0, B, H]];

  function base() {
    return [
      { // Room 1: Arc Carry
        name: 'Arc Carry',
        teach: 'Flip mid-fall: your speed turns into a sideways arc over the gap.',
        start: { x: 40, y: 109, g: 2 },
        walls: border().concat([[12, 120, 90, 368], [215, 200, 109, 288]]),
        spikes: [{ r: [102, 472, 113, 16] }, { r: [312, 80, 12, 40] }],
        crumbles: [], gates: [], crushers: [],
        exit: { x: 285, y: 189 },
      },
      { // Room 2: Charge Banking
        name: 'Charge Banking',
        teach: 'Landing refills charges. The ledge crumbles; tap to Dive through the gate.',
        start: { x: 40, y: 79, g: 2 },
        walls: border().concat([
          [12, 90, 88, 360],     // start ledge + sealed left column (x 12-100, down to floor)
          [100, 150, 126, 24],   // corridor ceiling
          [226, 200, 30, 12],    // solid strip between ledge and gate (no fall-in at speed from the broken ledge)
          [226, 212, 12, 238],   // chamber right wall: gate is the ONLY way into the chamber
          [12, 450, 312, 38],    // lower floor
        ]),
        spikes: [{ r: [312, 40, 12, 50] }, { r: [238, 436, 86, 14] }],
        crumbles: [[256, 200, 68, 12]],
        gates: [{ r: [100, 200, 126, 8], dir: 2 }],
        crushers: [],
        exit: { x: 160, y: 439 },
      },
      { // Room 3: Rhythm Press
        name: 'Rhythm Press',
        teach: 'Slip through when the press opens, then flip late to land tight.',
        start: { x: 40, y: 119, g: 2 },
        walls: border().concat([
          [12, 130, 100, 14],    // start ledge
          [12, 430, 208, 58],    // landing shelf
        ]),
        spikes: [{ r: [220, 472, 104, 16] }],
        crumbles: [], gates: [],
        crushers: [{ r: [128, 85, 84, 60], ax: 0, ay: 1, amp: 50, phase: 0 }],
        exit: { x: 50, y: 419 },
      },
    ];
  }

  const mr = (r) => [W - r[0] - r[2], r[1], r[2], r[3]];

  function mirror(room) {
    room.start.x = W - room.start.x;
    room.exit.x = W - room.exit.x;
    room.walls = room.walls.map(mr);
    room.spikes = room.spikes.map((s) => ({ r: mr(s.r) }));
    room.crumbles = room.crumbles.map(mr);
    room.gates = room.gates.map((g) => ({ r: mr(g.r), dir: g.dir === 1 ? 3 : g.dir === 3 ? 1 : g.dir }));
    room.crushers = room.crushers.map((c) => ({ r: mr(c.r), ax: c.ax, ay: c.ay, amp: c.amp, phase: c.phase }));
    room.mirrored = true;
  }

  PL.buildRooms = function (seed) {
    const rng = PL.mulberry32(seed);
    const rooms = base();
    for (const room of rooms) {
      const m = rng() < 0.5;
      const phase = rng() * Math.PI * 2;
      room.w = W; room.h = H;
      room.mirrored = false;
      for (const c of room.crushers) c.phase = phase;
      if (m) mirror(room);
    }
    return rooms;
  };

  // --- slice additions ---
  PL.mirrorRoom = function (room) {
    const r = JSON.parse(JSON.stringify(room));
    r.start.x = W - r.start.x;
    if (r.start.g === 1) r.start.g = 3; else if (r.start.g === 3) r.start.g = 1;
    r.exit.x = W - r.exit.x;
    r.walls = r.walls.map(mr);
    r.spikes = r.spikes.map((s) => ({ r: mr(s.r) }));
    r.crumbles = r.crumbles.map(mr);
    r.gates = r.gates.map((g) => ({ r: mr(g.r), dir: g.dir === 1 ? 3 : g.dir === 3 ? 1 : g.dir }));
    r.crushers = r.crushers.map((c) => ({ r: mr(c.r), ax: c.ax, ay: c.ay, amp: c.amp, phase: 0 - c.phase }));
    r.mirrored = true;
    return r;
  };

  PL.TEMPLATES = PL.TEMPLATES || [];
  [[1, 1], [2, 2], [3, 2]].forEach(([n, tier], i) => {
    const id = 't0' + n;
    PL.TEMPLATES.push({
      id, tier, teach: base()[i].teach,
      make(rng) {
        const room = base()[i];
        const phase = rng() * Math.PI * 2;
        room.w = W; room.h = H; room.mirrored = false;
        for (const c of room.crushers) c.phase = phase;
        return room;
      },
    });
  });

  PL.buildShaft = function (seed, n) {
    if (n === undefined) n = 7;
    const rng = PL.mulberry32(seed);
    const all = PL.TEMPLATES.slice();
    for (let i = all.length - 1; i > 0; i--) { // Fisher-Yates
      const j = Math.floor(rng() * (i + 1));
      const t = all[i]; all[i] = all[j]; all[j] = t;
    }
    const pick = all.slice(0, Math.min(n, all.length))
      .map((t, idx) => ({ t, idx }))
      .sort((a, b) => a.t.tier - b.t.tier || a.idx - b.idx)
      .map((o) => o.t);
    return pick.map((t) => {
      let room = t.make(rng);
      if (rng() < 0.5) room = PL.mirrorRoom(room);
      room.templateId = t.id;
      return room;
    });
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = PL;

})();
(function(){
// tpl1.js - Plumbline slice templates t04..t12 (9 rooms, tiers 1-3). Node-loadable, no DOM, rng only for crusher phases.
// Physics: G 1500, cap 700, bob box 22 (half 11), flip keeps velocity, 12 px border walls. Layouts are UNMIRRORED
// (mirrorRoom swaps left/right). A ledge with top T rests the bob at y = T - 11. "free" = flip/dive while grounded.
// Every solution below is machine-checked by src/test/tpl1-solve.js (<=5 inputs, <=25 s, both mirrors, 3 seeds).
//

    if (!runTuned && tunedNow()) runTuned = true;
    const ev = state.events || [];
    if (PL.audio && PL.audio.onEvents) { try { PL.audio.onEvents(ev, state); } catch (_) {} }
    for (const e of ev) {
      if (e === 'land') {
        cur.landSpeeds.push(Math.round(state.lastLandSpeed || 0));
        if (!reduced) fx.push({ x: state.x, y: state.y, age: 0 });
      } else if (e === 'ride') {
        cur.rides++;
      } else if (e === 'death' && !cur.result) {
        deaths++; finishAttempt('death'); deadHandled = true;
        trailPts = trailBuf.slice(); trailUntil = nowMs() + 1200;
      } else if (e === 'win' && !cur.result) {
        finishAttempt('win');
        cleared[roomIdx] = { log: cur.log.slice(), hash: PL.hash(state), ticks: state.t };
        winDelay = 60;
      }
    }
    if (deadHandled && state.dead <= 0) { startAttempt(); return; }
    if (winDelay > 0 && --winDelay === 0) {
      if (roomIdx + 1 >= rooms.length) { finishRun(); }
      else { roomIdx++; startAttempt(); }
    }
  }

  function finishRun() {
    const c = { timeS: totalTicks * C.DT, flips: flipsTotal, deaths, mode, seed, nRooms: rooms.length, tuned: runTuned,
      medal: 'none', flipStar: false, best: null, newBest: false };
    if (PL.meta) {
      try {
        const key = PL.meta.keyFor(mode, seed, rooms.length);
        const r = PL.meta.recordRun(key, { ticks: totalTicks, flips: flipsTotal, deaths, tuned: runTuned });
        if (r) {
          c.medal = r.medal || 'none'; c.flipStar = !!r.flipStar; c.newBest = !!r.isBest && !runTuned;
          if (r.best) c.best = { timeS: r.best.ticks * C.DT, flips: r.best.flips, medal: r.best.medal };
        }
      } catch (_) {}
    }
    complete = c; completeAt = nowMs(); clearGesture(); setMenuBtn(true);
  }

  // ---------- input ----------
  function qFlip(dir) { queue.push({ k: 'flip', dir }); }
  function qDive() { queue.push({ k: 'dive' }); }
  function rectHit(r, x, y) {
    if (!r) return false;
    const a = Array.isArray(r) ? r : [r.x, r.y, r.w, r.h];
    return x >= a[0] && x <= a[0] + a[2] && y >= a[1] && y <= a[1] + a[3];
  }
  let g = null; // active gesture
  let ring = 0;
  function clearGesture() { g = null; ring = 0; btn = null; cg = null; tg = null; menuDown = null; }
  function btnAt(x, y) {
    if (!PL.BTN) return null;
    if (rectHit(PL.BTN.copy(view), x, y)) return 'copy';
    if (!complete && rectHit(PL.BTN.path(view), x, y)) return 'path';
    if (PL.BTN.snd && rectHit(PL.BTN.snd(view), x, y)) return 'snd';
    return null;
  }
  canvas.style.touchAction = 'none';
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    if (PL.audio && PL.audio.init) { try { PL.audio.init(); } catch (_) {} }
    if (overlay) return;
    const x = e.clientX, y = e.clientY;
    if (scene === 'menu') { menuDown = { id: e.pointerId, item: menuItemAt(x, y) }; return; }
    if (x < 140 && y < 56 && !complete) { tg = { id: e.pointerId, t0: nowMs() }; return; }
    const b = btnAt(x, y);
    if (b) { btn = { id: e.pointerId, w: b }; return; }
    if (tuningOpen) { tuneTap(x, y); return; }
    if (complete) {
      if (nowMs() - completeAt <= 500) return;
      cg = { id: e.pointerId, t0: nowMs() };
      return;
    }
    if (g && nowMs() - g.t0 > 3000) g = null; // stale gesture
    if (y < 0.6 * view.H || g) return;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    g = { id: e.pointerId, x0: x, y0: y, t0: nowMs(), fired: false, moved: false, held: false };
  });
  function tryFlick(x, y) {
    const dx = x - g.x0, dy = y - g.y0;
    if (g.fired || Math.hypot(dx, dy) <= 24) return;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax >= 1.25 * ay) { qFlip(dx > 0 ? 1 : 3); g.fired = true; }
    else if (ay >= 1.25 * ax) { qFlip(dy > 0 ? 2 : 0); g.fired = true; }
  }
  canvas.addEventListener('pointermove', e => {
    if (!g || e.pointerId !== g.id) return;
    if (Math.hypot(e.clientX - g.x0, e.clientY - g.y0) >= 10) g.moved = true;
    tryFlick(e.clientX, e.clientY);
  });
  function endGesture(e, cancel) {
    if (!g || e.pointerId !== g.id) return;
    if (!cancel) tryFlick(e.clientX, e.clientY);
    const dt = nowMs() - g.t0, d = Math.hypot(e.clientX - g.x0, e.clientY - g.y0);
    if (!cancel && !g.fired && !g.held && !g.moved && d < 10 && dt < 180) qDive();
    g = null; ring = 0;
  }
  canvas.addEventListener('pointerup', e => {
    if (scene === 'menu') {
      const d = menuDown; menuDown = null;
      if (d && d.id === e.pointerId && d.item && menuItemAt(e.clientX, e.clientY) === d.item) menuAct(d.item);
      return;
    }
    if (tg && tg.id === e.pointerId) { tg = null; return; }
    if (cg && cg.id === e.pointerId) {
      const held = nowMs() - cg.t0; cg = null; ring = 0;
      if (complete && held < 600 && nowMs() - completeAt > 500) newRun();
      return;
    }
    if (btn && btn.id === e.pointerId) {
      const w = btn.w; btn = null;
      if (overlay || btnAt(e.clientX, e.clientY) !== w) return;
      if (w === 'copy') copyReport();
      else if (w === 'snd') {
        muted = !muted;
        if (PL.audio && PL.audio.setMuted) { try { PL.audio.setMuted(muted); } catch (_) {} }
        try { localStorage.setItem('plumbline.mute', muted ? '1' : '0'); } catch (_) {}
      } else pathOn = !pathOn;
      return;
    }
    endGesture(e, false);
  });
  canvas.addEventListener('pointercancel', e => {
    if (btn && btn.id === e.pointerId) btn = null;
    if (tg && tg.id === e.pointerId) tg = null;
    if (cg && cg.id === e.pointerId) { cg = null; ring = 0; }
    if (menuDown && menuDown.id === e.pointerId) menuDown = null;
    endGesture(e, true);
  });
  canvas.addEventListener('lostpointercapture', e => endGesture(e, true));
  window.addEventListener('blur', clearGesture);
  document.addEventListener('visibilitychange', () => { if (document.hidden) clearGesture(); });
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    audioInit();
    if (overlay) { if (k === 'Escape') closeOverlay(); return; }
    if (scene === 'menu') {
      if (k === '1') menuAct('tutorial'); else if (k === '2') menuAct('daily'); else if (k === '3') menuAct('seed');
      else return;
      e.preventDefault();
      return;
    }
    if (k === 'm' || k === 'M' || k === 'Escape') { toMenu(); return; }
    if (k === 't' || k === 'T') { tuningOpen = !tuningOpen; return; }
    if (complete) { if ((k === ' ' || k === 'Enter') && nowMs() - completeAt > 500) newRun(); return; }
    if (k === 'ArrowUp') qFlip(0); else if (k === 'ArrowRight') qFlip(1);
    else if (k === 'ArrowDown') qFlip(2); else if (k === 'ArrowLeft') qFlip(3);
    else if (k === ' ') qDive(); else if (k === 'r' || k === 'R') restartRoom('restart');
    else if (k === 'p' || k === 'P') pathOn = !pathOn;
    else return;
    e.preventDefault();
  });
  // ---------- menu ----------
  function menuModel() {
    const items = [
      { id: 'tutorial', label: 'Tutorial rooms', sub: '3 rooms, seed ' + urlSeed },
      { id: 'daily', label: 'Shaft: Daily', sub: '7 rooms, seed ' + dailySeed() },
      { id: 'seed', label: 'Shaft: Seed', sub: '7 rooms, type a number' },
      { id: 'best', label: 'Best times', sub: showBest ? 'tap to hide' : 'tap to show' }
    ];
    const bestLines = [];
    if (showBest) {
      const rows = [['Tutorial', 'tutorial', urlSeed, 3], ['Daily ' + dailySeed(), 'daily', dailySeed(), 7]];
      for (const r of rows) {
        let b = null;
        try { b = PL.meta && PL.meta.getBest(PL.meta.keyFor(r[1], r[2], r[3])); } catch (_) {}
        bestLines.push(r[0] + ': ' + (b ? (b.ticks * C.DT).toFixed(2) + 's, ' + b.flips + ' flips, ' + (b.medal || 'none') : 'no run yet'));
      }
    }
    return { title: 'Plumbline', sub: 'Flip gravity. Reach the exit.', items, seed: urlSeed, hint: 'Tap an option (keys 1-3)', bestLines };
  }
  function menuItemAt(x, y) {
    if (!PL.menuLayout) return null;
    const lay = PL.menuLayout(view, menuModel().items) || [];
    for (const it of lay) if (rectHit(it.rect, x, y)) return it.id;
    return null;
  }
  function menuAct(id) {
    if (id === 'tutorial') startMode('tutorial', urlSeed);
    else if (id === 'daily') startMode('daily', dailySeed());
    else if (id === 'seed') seedOverlay();
    else if (id === 'best') showBest = !showBest;
  }
  function seedOverlay() {
    closeOverlay();
    const o = document.createElement('div');
    o.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100dvh;z-index:99;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:max(16px,8vh) 16px 16px;box-sizing:border-box;color:#fff;font:18px sans-serif;overflow:hidden';
    const vv = window.visualViewport;
    const fit = () => { if (vv) { o.style.top = vv.offsetTop + 'px'; o.style.left = vv.offsetLeft + 'px'; o.style.height = vv.height + 'px'; o.style.width = vv.width + 'px'; } };
    if (vv) { fit(); vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); o._cleanup = () => { vv.removeEventListener('resize', fit); vv.removeEventListener('scroll', fit); }; }
    const lab = document.createElement('div'); lab.textContent = 'Shaft seed (digits only)';
    const err = document.createElement('div'); err.style.cssText = 'color:#ff7b7b;min-height:22px;font-size:16px';
    const inp = document.createElement('input');
    inp.type = 'text'; inp.inputMode = 'numeric'; inp.pattern = '[0-9]*'; inp.maxLength = 9; inp.autocomplete = 'off';
    inp.style.cssText = 'font:24px monospace;padding:12px;width:240px;text-align:center;box-sizing:border-box';
    inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 9); err.textContent = ''; inp.style.outline = ''; });
    lab.addEventListener('click', () => inp.focus());
    const go = () => {
      if (!inp.value) { err.textContent = 'Enter digits first'; inp.style.outline = '3px solid #ff7b7b'; inp.focus(); return; }
      const n = parseInt(inp.value, 10) | 0; closeOverlay(); startMode('seed', n);
    };
    inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') go(); });
    const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:12px';
    const mk = (t, f) => { const b = document.createElement('button'); b.textContent = t; b.style.cssText = 'font:18px sans-serif;min-width:112px;height:56px'; b.addEventListener('click', f); return b; };
    row.appendChild(mk('Start', go)); row.appendChild(mk('Cancel', closeOverlay));
    o.appendChild(lab); o.appendChild(inp); o.appendChild(err); o.appendChild(row); document.body.appendChild(o);
    overlay = o; inp.focus();
  }

  // ---------- tuning ----------
  function tuneRows() { return TUNE.map(t => ({ id: t.id, label: t.label, value: C[t.id] })); }
  function tuneTap(x, y) {
    if (!PL.tuningLayout) return;
    const lay = PL.tuningLayout(view, tuneRows()) || [];
    for (const r of lay) {
      const t = TUNE.find(q => q.id === r.id); if (!t) continue;
      let d = 0;
      if (rectHit(r.minus, x, y)) d = -t.step; else if (rectHit(r.plus, x, y)) d = t.step;
      if (d) { C[t.id] = Math.max(t.min, Math.min(t.max, C[t.id] + d)); if (tunedNow()) runTuned = true; return; }
    }
  }
  function updateHold() {
    if (tg) {
      if (nowMs() - tg.t0 >= 800) { tuningOpen = !tuningOpen; tg = null; }
      ring = 0; return;
    }
    if (cg) {
      const h = nowMs() - cg.t0;
      ring = Math.max(0, Math.min(1, (h - 250) / 350));
      if (h >= 600) { cg = null; ring = 0; toMenu(); }
      return;
    }
    if (g && !g.fired && !g.moved) {
      const h = nowMs() - g.t0;
      ring = Math.max(0, Math.min(1, (h - 250) / 350));
      if (h >= 600) { g.held = true; ring = 0; if (winDelay <= 0 && !(cur && cur.result === 'win')) restartRoom('restart'); }
    } else ring = 0;
  }

  // ---------- report ----------
  function replayCheck() {
    const lines = []; let ok = true, any = false;
    for (let i = 0; i < cleared.length; i++) {
      const c = cleared[i]; if (!c) continue; any = true;
      let r; try { r = PL.replay(rooms[i], c.log); } catch (e) { r = { hash: 'ERR ' + e.message }; }
      const same = r.hash === c.hash; if (!same) ok = false;
      lines.push('  room ' + (i + 1) + ': ' + (same ? 'match' : 'MISMATCH') + ' (' + c.log.length + ' inputs, ' + c.ticks + ' ticks)');
    }
    return { ok, any, lines };
  }
  function fmt(t) { return t.toFixed(2) + 's'; }
  function buildReport() {
    const L = [];
    const fps = avgFps();
    L.push('PLUMBLINE REPORT');
    L.push('mode: ' + mode + '  rooms: ' + (rooms ? rooms.length : 0));
    L.push('seed: ' + seed);
    L.push('templates: ' + (rooms || []).map(r => r.templateId || r.name).join(','));
    L.push('tuned: ' + (runTuned || tunedNow() ? 'YES (not saved as best) ' : 'no ') + tunedStr());
    if (complete) L.push('result: medal ' + complete.medal + (complete.flipStar ? ' +flipstar' : '') + '  newBest ' + complete.newBest +
      (complete.best ? '  best ' + complete.best.timeS.toFixed(2) + 's/' + complete.best.flips + ' flips/' + complete.best.medal : ''));
    L.push('build: ' + BUILD);
    L.push('UA: ' + navigator.userAgent);
    L.push('viewport: ' + view.W + 'x' + view.H + ' dpr ' + view.dpr + ' inset t' + view.inset.t + ' b' + view.inset.b);
    L.push('avg fps: ' + fps.toFixed(1));
    L.push('run time: ' + fmt(totalTicks * C.DT) + ' (' + totalTicks + ' ticks)  flips ' + curFlips() + '  deaths ' + deaths + (complete ? '  RUN COMPLETE' : '  in progress'));
    L.push('WebGPU output: NOT seen (canvas 2D)');
    L.push('');
    L.push('attempts [room, attempt, ticks, result, flips, landSpeeds]:');
    const all = attempts.concat(cur && !cur.result && !complete ? [Object.assign({}, cur, { ticks: state.t, flips: state.flips, result: 'in-progress' })] : []);
    for (const a of all) L.push('  ' + JSON.stringify({ room: a.room, attempt: a.attempt, ticks: a.ticks, result: a.result, flips: a.flips, landSpeeds: a.landSpeeds, rides: a.rides || 0 }));
    L.push('wall-ride count per room: ' + rooms.map((_, i) => all.filter(x => x.room === i + 1).reduce((s2, x) => s2 + (x.rides || 0), 0)).join(' '));
    L.push('');
    L.push('2nd attempt vs 1st per room:');
    for (let r = 1; r <= rooms.length; r++) {
      const a = all.filter(x => x.room === r);
      if (a.length < 2) L.push('  room ' + r + ': n/a (' + a.length + ' attempt' + (a.length === 1 ? '' : 's') + ')');
      else {
        const cmp = (a[0].result === 'win' && a[1].result === 'win') ? '' : '  (not like-for-like)';
        const t1 = a[0].ticks * C.DT, t2 = a[1].ticks * C.DT, d = t2 - t1;
        L.push('  room ' + r + ': 1st ' + fmt(t1) + ' (' + a[0].result + ')  2nd ' + fmt(t2) + ' (' + a[1].result + ')  delta ' + (d >= 0 ? '+' : '') + d.toFixed(2) + 's' + cmp);
      }
    }
    L.push('');
    const rc = replayCheck();
    L.push('determinism check (replay of cleared rooms):');
    for (const l of rc.lines) L.push(l);
    L.push(runTuned || tunedNow() ? 'determinism: skipped (tuned)' : !rc.any ? 'determinism: no cleared rooms yet' : rc.ok ? 'determinism OK' : 'determinism FAIL');
    L.push('');
    L.push('input log (room, attempt, tick, k, dir):');
    for (const i of inputLog) L.push('  ' + i.room + ' ' + i.attempt + ' ' + i.tick + ' ' + i.k + (i.k === 'flip' ? ' ' + DIRN[i.dir] : ''));
    if (cur && !cur.result) { /* current attempt inputs already in inputLog */ }
    return L.join('\n');
  }
  function closeOverlay() { if (overlay) { if (overlay._cleanup) overlay._cleanup(); overlay.remove(); overlay = null; } }
  function showManual(text) {
    try { console.log(text); } catch (_) {}
    closeOverlay();
    const o = document.createElement('div');
    o.style.cssText = 'position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.85);display:flex;flex-direction:column;gap:8px;padding:12px;box-sizing:border-box';
    const ta = document.createElement('textarea');
    ta.value = text; ta.readOnly = true;
    ta.style.cssText = 'flex:1;width:100%;font:16px monospace;box-sizing:border-box';
    ta.addEventListener('focus', () => { try { ta.select(); ta.setSelectionRange(0, text.length); } catch (_) {} });
    const bt = document.createElement('button');
    bt.textContent = 'Close'; bt.style.cssText = 'font:16px sans-serif;padding:12px';
    bt.addEventListener('click', closeOverlay);
    o.appendChild(ta); o.appendChild(bt); document.body.appendChild(o);
    overlay = o; ta.focus();
  }
  function copyReport() {
    const text = buildReport();
    const fallback = () => {
      let ok = false;
      try {
        const ta = document.createElement('textarea'); ta.value = text; ta.readOnly = true;
        ta.style.cssText = 'position:fixed;left:0;top:0;opacity:0;font-size:16px';
        document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
        ok = document.execCommand('copy'); ta.remove();
      } catch (_) { ok = false; }
      if (ok) showToast('Report copied'); else { showToast('Copy failed'); showManual(text); }
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('Report copied'), fallback);
      } else fallback();
    } catch (_) { fallback(); }
  }

  // ---------- loop ----------
  let last = 0, acc = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) last = ts;
    let dt = (ts - last) / 1000; last = ts;
    if (dt <= 0) return;
    if (dt > 0.25) dt = 0.25; // tab was hidden
    else { fpsFrames++; fpsSecs += dt; }
    acc += dt;
    let n = 0;
    if (scene !== 'play' || tuningOpen) acc = 0;
    else while (acc >= C.DT && n < 5) { simTick(); acc -= C.DT; n++; }
    setResetBtn(scene === 'play' && tuningOpen);
    if (acc > C.DT) acc = 0; // drop excess beyond 5 steps
    if (scene === 'menu') {
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      const mm = menuModel();
      if (PL.drawMenu && PL.menuLayout) PL.drawMenu(ctx, view, Object.assign({}, mm, { items: PL.menuLayout(view, mm.items) }));
      else { ctx.fillStyle = '#111'; ctx.fillRect(0, 0, view.W, view.H); ctx.fillStyle = '#fff'; ctx.font = '24px sans-serif'; ctx.fillText('Plumbline', 20, 60); }
      if (toast && nowMs() > toastUntil) toast = null;
      return;
    }
    updateHold();
    for (const f of fx) f.age += dt;
    fx = fx.filter(f => f.age < 0.6);
    if (toast && nowMs() > toastUntil) toast = null;
    const fr = PL.camUpdate(cam, state, view, dt);
    const hud = {
      roomIdx: roomIdx, roomN: roomIdx + 1, roomName: rooms[roomIdx].name, teach: rooms[roomIdx].teach,
      timeS: totalTicks * C.DT, flips: curFlips(), deaths, pathOn, seed, toast,
      ring, completeScreen: complete, fps: avgFps(), fx, reduced,
      roomTotal: rooms.length, nRooms: rooms.length, attempt: cur ? cur.attempt : 1, mode, roomAgeS: state.t * C.DT, muted,
      trail: trailPts && nowMs() < trailUntil ? trailPts : null,
      tuning: { open: tuningOpen, rows: tuneRows(), dirty: runTuned || tunedNow() }
    };
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    PL.draw(ctx, view, fr, state, hud);
  }

  newRun(); // scene stays 'menu' until a mode is picked
  requestAnimationFrame(frame);

  // ---------- test hook ----------
  window.PL_TEST = {
    getState: () => state,
    setSeed: n => { urlSeed = n | 0; seed = urlSeed; scene = 'play'; mode = 'tutorial'; nRooms = 3; newRun(); },
    startMode: (m, s) => { startMode(m, s === undefined ? (m === 'daily' ? dailySeed() : urlSeed) : s); },
    menu: () => { toMenu(); },
    tuning: () => { tuningOpen = !tuningOpen; return tuningOpen; },
    scene: () => scene,
    sceneName: () => scene === 'menu' ? 'menu' : complete ? 'complete' : 'play',
    kill: () => { if (scene === 'play' && !complete && state && !state.dead && !state.won) { state.dead = Math.round(C.RESPAWN_T / C.DT); state.events = (state.events || []).concat(['death']); deaths++; finishAttempt('death'); deadHandled = true; trailPts = trailBuf.slice(); trailUntil = nowMs() + 1200; return true; } return false; },
    inject: arr => { for (const i of (arr || [])) {
      if (!i) continue;
      if (i.k === 'dive') queue.push({ k: 'dive' });
      else if (i.k === 'flip' && Number.isInteger(i.dir) && i.dir >= 0 && i.dir <= 3) queue.push({ k: 'flip', dir: i.dir });
    } },
    room: n => { scene = 'play'; gotoRoom((n | 0) - 1); }, // 1-based
    tick: n => { for (let i = 0; i < (n || 1); i++) simTick(); },
    report: buildReport,
    attempts: () => attempts.slice(),
    inputLog: () => inputLog.slice(),
    getRunStats: () => ({ totalTicks, roomsCleared: cleared.filter(Boolean).length, tuned: runTuned || tunedNow() }),
    isComplete: () => !!complete
  };
  PL.ui = { buildReport };
})();

})();
</script>
<script>if('serviceWorker' in navigator&&isSecureContext)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e)));try{screen.orientation&&screen.orientation.lock&&matchMedia('(display-mode: fullscreen)').matches&&screen.orientation.lock('portrait').catch(()=>{});}catch(_){}</script>
