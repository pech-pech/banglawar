<script>
(function(){
const PL = (globalThis.PL = globalThis.PL || {});
(function () {
  'use strict';
  const C = (PL.C = { DT: 1 / 120, G: 1500, CAP: 700, DIVE_CAP: 900, DIVE_ADD: 250, DIVE_BOOST_T: 0.3, DIVE_CD: 0.5, CHARGES: 2, HALF: 11, FRIC: 900, DRAG: 0.35, DRAG_AFTER: 0.3, BOUNCE_SIDE: 0.15, BUFFER: 0.08, CRUMBLE_T: 0.35, GATE_V: 120, RESPAWN_T: 0.3, WALL_RIDE_T: 0.25, COYOTE_T: 0.06,
    // S1 (F2): former literals, now tunable
    CRUSHER_PERIOD: 2.4, SPIKE_SHRINK: 3, EXIT_R: 18, CRUSH_OVERLAP: 1 });
  const DIRS = (PL.DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]);
  const DT = C.DT; // 1/120 is the determinism base: never tunable
  // S1 (F1): nothing is frozen at load. Every tunable is read from PL.C once per
  // attempt (PL.newState) into state.K, so a mid-attempt change never alters a
  // running attempt and each attempt replays from its own snapshot (K.snap).
  const SIM_IDS = (PL.SIM_IDS = ['G', 'CAP', 'DIVE_CAP', 'DIVE_ADD', 'DIVE_BOOST_T', 'DIVE_CD', 'CHARGES', 'HALF', 'FRIC', 'DRAG', 'DRAG_AFTER', 'BOUNCE_SIDE', 'BUFFER', 'CRUMBLE_T', 'GATE_V', 'RESPAWN_T', 'WALL_RIDE_T', 'COYOTE_T', 'CRUSHER_PERIOD', 'SPIKE_SHRINK', 'EXIT_R', 'CRUSH_OVERLAP']);
  // copy of the sim-affecting values of PL.C (or of src); missing ids fall back to PL.C
  PL.simSnapshot = function (src) {
    const o = {};
    for (const id of SIM_IDS) o[id] = src && typeof src[id] === 'number' ? src[id] : C[id];
    return Object.freeze(o);
  };
  // per-attempt constants: snapshot values + tick counts (same rounding as the old load-time consts)
  PL.deriveK = function (snap) {
    const v = snap && Object.isFrozen(snap) && SIM_IDS.every((id) => typeof snap[id] === 'number') ? snap : PL.simSnapshot(snap);
    const K = Object.assign({}, v);
    K.snap = v;
    K.CRUMBLE_TICKS = Math.round(v.CRUMBLE_T / DT); // 42
    K.DEAD_TICKS = Math.round(v.RESPAWN_T / DT); // 36
    K.BUFFER_TICKS = Math.round(v.BUFFER / DT); // 10: pending flip survives age<=10 ticks
    K.DIVE_CD_TICKS = Math.round(v.DIVE_CD / DT); // 60
    K.DIVE_BOOST_TICKS = Math.round(v.DIVE_BOOST_T / DT); // 36
    K.RIDE_TICKS = Math.round(v.WALL_RIDE_T / DT); // 30
    K.COYOTE_TICKS = Math.round(v.COYOTE_T / DT); // 7: flip/dive free for 7 ticks after walking off, denied on the 8th
    return K;
  };
  // state without K (hand-built in a test): derive once from PL.C and keep it
  function KOf(s) { return s.K || (s.K = PL.deriveK()); }
  const EPS = 1e-6;

  // snap (optional): values from PL.simSnapshot / K.snap; default = PL.C now (attempt start)
  PL.newState = function (room, snap) {
    const K = PL.deriveK(snap);
    const s = {
      K, room, t: 0, x: room.start.x, y: room.start.y, vx: 0, vy: 0, g: room.start.g,
      charges: K.CHARGES, grounded: false, airT: 0, diveCd: 0, diveBoost: 0, pending: null,
      crumbleS: (room.crumbles || []).map(() => ({ st: 0, timer: 0 })),
      rideT: 0, rideKey: '', rideUsed: [], coyote: 0,
      dead: 0, cause: '', won: false, flips: 0, lastLandSpeed: 0, events: [],
    };
    // spawn grounded if the start sits on a surface (no spurious 'land' on tick 1)
    const d = DIRS[s.g];
    s.x += d[0]; s.y += d[1];
    s.grounded = buildSolids(s, 0, 0).some((o) => overlapX(s, o.r) > EPS && overlapY(s, o.r) > EPS);
    s.x -= d[0]; s.y -= d[1];
    return s;
  };

  // crusher rect at tick t; K = state.K (period CRUSHER_PERIOD); draw.js can call PL.crusherRect(c, state.t, state.K)
  function crusherRect(c, t, K) {
    const s = Math.sin(2 * Math.PI * (t * DT) / (K || C).CRUSHER_PERIOD + c.phase) * c.amp;
    return [c.r[0] + c.ax * s, c.r[1] + c.ay * s, c.r[2], c.r[3]];
  }
  PL.crusherRect = crusherRect;

  // internal solids: {r, cr (crumble index or -1)}
  function buildSolids(s, vx, vy) {
    const room = s.room, out = [], K = KOf(s);
    for (const r of room.walls) out.push({ r, cr: -1, key: 'w' + out.length });
    (room.crumbles || []).forEach((r, i) => { if (s.crumbleS[i].st !== 2) out.push({ r, cr: i, key: 'c' + i }); });
    (room.gates || []).forEach((g, gi) => {
      if (overlaps(s, g.r)) return; // latch: a gate never turns solid around a bob already inside it
      const dd = DIRS[g.dir];
      if (vx * dd[0] + vy * dd[1] < K.GATE_V) out.push({ r: g.r, cr: -1, gate: true, key: 'g' + gi });
    });
    (room.crushers || []).forEach((c, ci) => out.push({ r: crusherRect(c, s.t, K), cr: -1, key: 'k' + ci }));
    return out;
  }
  // gate state uses post-gravity velocity, matching PL.step
  PL.solids = function (s) {
    const d = DIRS[s.g];
    const K = KOf(s);
    return buildSolids(s, s.vx + d[0] * K.G * DT, s.vy + d[1] * K.G * DT).map((o) => o.r);
  };

  function overlapX(s, r) { const H = KOf(s).HALF; return Math.min(s.x + H, r[0] + r[2]) - Math.max(s.x - H, r[0]); }
  function overlapY(s, r) { const H = KOf(s).HALF; return Math.min(s.y + H, r[1] + r[3]) - Math.max(s.y - H, r[1]); }
  function overlaps(s, r) { return overlapX(s, r) > 0 && overlapY(s, r) > 0; }

  // move one axis (0=x,1=y); returns hit info
  function moveAxis(s, ax, solids, hit) {
    const K = s.K, H = K.HALF;
    if (ax === 0) s.x += s.vx * DT; else s.y += s.vy * DT;
    for (const o of solids) {
      const r = o.r;
      const ox = overlapX(s, r), oy = overlapY(s, r);
      if (!(ox > EPS && oy > EPS)) continue;
      // resolve on the axis of least penetration only (x pass yields to y when oy<ox, y pass yields when ox<oy)
      if (ax === 0 ? oy < ox : ox < oy) continue;
      const v = ax === 0 ? s.vx : s.vy;
      const c = ax === 0 ? s.x : s.y;
      const lo = ax === 0 ? r[0] : r[1], len = ax === 0 ? r[2] : r[3];
      // push out along the side of minimum penetration (not velocity sign) so moving solids cannot teleport the bob through
      const pPos = (c + H) - lo, pNeg = (lo + len) - (c - H);
      const sign = pPos < pNeg ? 1 : pPos > pNeg ? -1 : (v >= 0 ? 1 : -1);
      const np = sign > 0 ? lo - H : lo + len + H;
      if (ax === 0) s.x = np; else s.y = np;
      const gsign = DIRS[s.g][ax];
      if (gsign === sign) {
        // landing on gravity side
        hit.ground = true;
        hit.speed = Math.max(hit.speed, Math.abs(v));
        if (ax === 0) s.vx = 0; else s.vy = 0;
        if (o.cr >= 0) hit.crumbles.push(o.cr);
      } else if (v !== 0 && Math.sign(v) === sign) {
        if (ax === 0) s.vx = -K.BOUNCE_SIDE * s.vx; else s.vy = -K.BOUNCE_SIDE * s.vy;
      }
    }
  }

  function doFlip(s, dir) {
    s.g = dir; s.flips++; s.events.push('flip'); s.grounded = false; s.coyote = 0;
  }

  function applyInput(s, inp) {
    if (inp.k === 'flip') {
      if (!Number.isInteger(inp.dir) || inp.dir < 0 || inp.dir > 3 || inp.dir === s.g) return;
      if (s.grounded || s.coyote > 0) doFlip(s, inp.dir);
      else if (s.charges > 0) { s.charges--; doFlip(s, inp.dir); }
      else s.pending = { dir: inp.dir, age: 0 }; // age in ticks
    } else if (inp.k === 'dive') {
      if (s.diveCd > 0) return;
      if (!s.grounded && s.coyote <= 0) { if (s.charges <= 0) return; s.charges--; }
      s.coyote = 0;
      const d = DIRS[s.g];
      s.vx += d[0] * s.K.DIVE_ADD; s.vy += d[1] * s.K.DIVE_ADD;
      s.diveBoost = s.K.DIVE_BOOST_TICKS; s.diveCd = s.K.DIVE_CD_TICKS; s.events.push('dive');
    }
  }

  // cause: 'spike' | 'crush' | 'edge' (not hashed; for the death tag and Copy report)
  function die(s, cause) { if (!s.dead) { s.dead = s.K.DEAD_TICKS; s.cause = cause; s.events.push('death'); } }

  PL.step = function (s, inputs) {
    s.events.length = 0;
    const K = KOf(s);
    if (s.won) return;
    if (s.dead > 0) { s.dead--; s.t++; return; }
    if (inputs) for (const i of inputs) applyInput(s, i);

    // timers
    if (s.diveCd > 0) s.diveCd--;
    if (s.diveBoost > 0) s.diveBoost--;
    if (s.coyote > 0) s.coyote--;
    if (s.pending) { s.pending.age++; if (s.pending.age > K.BUFFER_TICKS) s.pending = null; }

    // forces
    const d = DIRS[s.g];
    s.vx += d[0] * K.G * DT; s.vy += d[1] * K.G * DT;
    if (s.grounded) {
      s.airT = 0;
      if (d[0] === 0) s.vx = fric(s.vx, K); else s.vy = fric(s.vy, K);
    } else {
      s.airT += DT;
      if (s.airT > K.DRAG_AFTER) {
        const k = 1 - K.DRAG * DT;
        if (d[0] === 0) s.vx *= k; else s.vy *= k;
      }
    }
    const cap = s.diveBoost > 0 ? K.DIVE_CAP : K.CAP;
    s.vx = Math.max(-cap, Math.min(cap, s.vx));
    s.vy = Math.max(-cap, Math.min(cap, s.vy));

    // move
    const solids = buildSolids(s, s.vx, s.vy);
    const hit = { ground: false, speed: 0, crumbles: [] };
    moveAxis(s, 0, solids, hit);
    moveAxis(s, 1, solids, hit);

    const was = s.grounded;
    s.grounded = hit.ground;
    if (was && !hit.ground) s.coyote = K.COYOTE_TICKS; // walked off a ledge (flip/dive already cleared grounded earlier)
    if (hit.ground) {
      s.coyote = 0; s.rideT = 0; s.rideKey = '';
      if (!was) {
        s.rideUsed.length = 0;
        s.lastLandSpeed = hit.speed; s.airT = 0; s.events.push('land');
        s.charges = K.CHARGES;
        if (s.pending) { const p = s.pending; s.pending = null; if (p.dir !== s.g) { doFlip(s, p.dir); s.grounded = false; } }
      } else s.charges = K.CHARGES;
    }
    if (!hit.ground) wallRide(s, solids);
    // decrement first, then trigger: a newly triggered crumble keeps the full CRUMBLE_TICKS
    s.crumbleS.forEach((c) => {
      if (c.st === 1 && --c.timer <= 0) { c.st = 2; c.timer = 0; s.events.push('crumble'); }
    });
    if (hit.ground) {
      for (const i of hit.crumbles) if (s.crumbleS[i].st === 0) { s.crumbleS[i].st = 1; s.crumbleS[i].timer = K.CRUMBLE_TICKS; }
    }

    // crush check against solids at this tick
    const now = buildSolids(s, s.vx, s.vy);
    for (const o of now) {
      if (o.gate) continue; // gates only block entry, never crush
      if (overlaps(s, o.r) && Math.min(overlapX(s, o.r), overlapY(s, o.r)) > K.CRUSH_OVERLAP) { die(s, 'crush'); break; }
    }
    // spikes
    if (!s.dead) {
      const h = K.HALF - K.SPIKE_SHRINK;
      for (const sp of s.room.spikes || []) {
        const r = sp.r;
        if (s.x + h > r[0] && s.x - h < r[0] + r[2] && s.y + h > r[1] && s.y - h < r[1] + r[3]) { die(s, 'spike'); break; }
      }
    }
    if (!s.dead && (s.x < -40 || s.y < -40 || s.x > s.room.w + 40 || s.y > s.room.h + 40)) die(s, 'edge');
    if (!s.dead) {
      const e = s.room.exit;
      if (Math.hypot(s.x - e.x, s.y - e.y) < K.EXIT_R) { s.won = true; s.events.push('win'); }
    }
    s.t++;
  };

  // continuous contact with a non-gravity-side solid (probe 0.05 px) for RIDE_TICKS refills +1 charge, once per solid per airborne period
  function wallRide(s, solids) {
    let key = '';
    const ox = s.x, oy = s.y;
    for (let k = 0; k < 4 && !key; k++) {
      if (k === s.g) continue;
      s.x = ox + DIRS[k][0] * 0.05; s.y = oy + DIRS[k][1] * 0.05;
      for (const o of solids) {
        if (o.gate) continue;
        const px = overlapX(s, o.r), py = overlapY(s, o.r);
        if (px > EPS && py > EPS && (DIRS[k][0] === 0 ? px : py) > 1) { key = o.key; break; }
      }
    }
    s.x = ox; s.y = oy;
    if (!key) { s.rideT = 0; s.rideKey = ''; return; }
    if (key !== s.rideKey) { s.rideKey = key; s.rideT = 0; }
    s.rideT++;
    if (s.rideT >= s.K.RIDE_TICKS && s.rideUsed.indexOf(key) < 0) {
      s.rideUsed.push(key);
      if (s.charges < s.K.CHARGES) s.charges++;
      s.events.push('ride');
    }
  }

  function fric(v, K) {
    const a = K.FRIC * DT;
    return Math.abs(v) <= a ? 0 : v - Math.sign(v) * a;
  }

  PL.hash = function (s) {
    const a = [s.x, s.y, s.vx, s.vy, s.g, s.charges, s.t, s.flips, s.dead, s.won ? 1 : 0];
    a.push(s.grounded ? 1 : 0, s.diveCd, s.diveBoost, s.airT, s.pending ? s.pending.dir + ':' + s.pending.age : '-');
    a.push(s.rideT, s.rideKey, s.rideUsed.join('|'), s.coyote);
    for (const c of s.crumbleS) a.push(c.st, c.timer);
    return a.join(',');
  };

  // snap (optional): the attempt's K.snap, so a tuned attempt replays with its own values
  PL.replay = function (room, log, snap) {
    const s = PL.newState(room, snap);
    const end = (log.length ? log[log.length - 1].tick : 0) + 600;
    let i = 0;
    while (s.t < end && !s.won && !s.dead) {
      const inp = [];
      while (i < log.length && log[i].tick <= s.t) { inp.push({ k: log[i].k, dir: log[i].dir }); i++; }
      PL.step(s, inp);
    }
    return { state: s, hash: PL.hash(s) };
  };
})();

})();
(function(){
// rooms.js - Plumbline: seeded RNG, the 3 tutorial rooms, templates t02/t03 and buildShaft (slot table).
// Node-loadable, no DOM. Rooms are 336x500 with 12 px border walls included.
//
// Geometry notes: G 1500, cap 700, bob box 22 (half 11), flip keeps velocity.
// A ledge with top at T puts a grounded bob at y = T - 11. Fly lines use that y.
// Solutions are written for the UNMIRRORED layout; mirrored rooms swap left<->right and x -> 336 - x.
//
// TUTORIALS (PL.buildRooms(seed) returns these 3, never mirrored, seed has no effect; never in shafts):
//   tut1 "Flip"      start (40,109) on a pillar, nothing else. RIGHT (free) flies to the wall, DOWN (free) drops to the
//                    exit. Two free flips, every window is huge, no spikes.
//   t01  "Arc Carry" (tutorial 2) flip mid-fall bends a carried speed into an arc over the pit: RIGHT (free), DOWN
//                    (1 charge) before bob x~185, land on the right block. Teaches "2 moves in the air".
//   tut3 "Dive Gate" rest on a full-width one-way gate; Dive (free on the ground) punches through and falls to the exit.
//
// SHAFT TEMPLATES in this file:
//   t02  "Charge Banking" (tier 2, family gate): RIGHT, DOWN (1 charge) onto the crumble ledge (refills); LEFT (free)
//        through the corridor; DOWN (free) on the gate; Dive; RIGHT into the exit.
//   t03  "Rhythm Press" (tier 2, family crusher, FIRST crusher a player meets, crusher alone): wait for the press to rise,
//        RIGHT (free) hits the right wall, DOWN (free) drops onto the safe stub, LEFT (free) flies over the shelf into the
//        exit. All free. Late Flip (LEFT mid-fall, DOWN late) stays as an optional faster line.

const PL = (globalThis.PL = globalThis.PL || {});

PL.mulberry32 = function (seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};


(function () {
  const W = 336, H = 500, B = 12;
  const border = () => [[0, 0, W, B], [0, H - B, W, B], [0, 0, B, H], [W - B, 0, B, H]];

  function base() {
    return [
      { // Tutorial 1: Flip (flip alone, no hazards)
        name: 'Flip',
        teach: 'Flip right to fly across, then flip down to drop to the exit. On the ground flips are free.',
        start: { x: 40, y: 109, g: 2 },
        walls: border().concat([[12, 120, 90, 368]]),
        spikes: [], crumbles: [], gates: [], crushers: [],
        exit: { x: 300, y: 477 },
      },
      { // Tutorial 2 (t01): Arc Carry
        name: 'Arc Carry',
        teach: 'Flip mid-fall: your speed turns into a sideways arc. You have 2 moves in the air.',
        start: { x: 40, y: 109, g: 2 },
        walls: border().concat([[12, 120, 90, 368], [215, 200, 109, 288]]),
        spikes: [{ r: [102, 472, 113, 16] }, { r: [312, 80, 12, 40] }],
        crumbles: [], gates: [], crushers: [],
        exit: { x: 285, y: 189 },
      },
      { // Tutorial 3: Dive through the gate
        name: 'Dive Gate',
        teach: 'You rest on a one-way gate. On the ground Dive is free. In the air it uses a move.',
        start: { x: 168, y: 89, g: 2 },
        walls: border(),
        spikes: [], crumbles: [],
        gates: [{ r: [12, 100, 312, 12], dir: 2 }],
        crushers: [],
        exit: { x: 168, y: 477 },
      },
    ];
  }
  PL.tutorialRooms = base;

  const T2 = () => ({ // Charge Banking (shaft tier 2)
    name: 'Charge Banking',
    teach: 'Landing refills your moves. The ledge breaks 0.35 s after you land: ride the corridor, then drop through the gate.',
    start: { x: 40, y: 79, g: 2 },
    walls: border().concat([
      [12, 90, 88, 360],     // start ledge + sealed left column (x 12-100, down to floor)
      [100, 130, 126, 24],   // corridor ceiling (raised 20 px: lane 46 px tall, was 26)
      [226, 212, 12, 238],   // chamber right wall: the gate is the ONLY way into the chamber
      [12, 450, 312, 38],    // lower floor
    ]),
    spikes: [{ r: [312, 40, 12, 30] }, { r: [238, 436, 86, 14] }],
    crumbles: [[226, 200, 98, 12]],
    gates: [{ r: [100, 200, 126, 12], dir: 2 }],
    crushers: [],
    exit: { x: 160, y: 439 },
  });
  const T3 = () => ({ // Rhythm Press: the crusher met alone
    name: 'Rhythm Press',
    teach: 'Wait for the press to rise, slip under it, drop down the wall onto the stub, then fly left to the exit.',
    start: { x: 40, y: 119, g: 2 },
    walls: border().concat([
      [12, 130, 100, 14],    // start ledge
      [12, 430, 208, 58],    // landing shelf
      [284, 430, 40, 58],    // safe stub (right)
    ]),
    spikes: [{ r: [220, 472, 64, 16] }],
    crumbles: [], gates: [],
    crushers: [{ r: [142, 85, 84, 60], ax: 0, ay: 1, amp: 50, phase: 0 }],
    exit: { x: 50, y: 419 },
  });

  const mr = (r) => [W - r[0] - r[2], r[1], r[2], r[3]];

  // PL.buildRooms(seed): the 3 tutorial rooms. Never mirrored; seed has no effect (kept in the signature for callers).
  PL.buildRooms = function (seed) {
    const rooms = base();
    for (const room of rooms) { room.w = W; room.h = H; room.mirrored = false; }
    return rooms;
  };

  PL.mirrorRoom = function (room) {
    const r = JSON.parse(JSON.stringify(room));
    r.start.x = W - r.start.x;
    if (r.start.g === 1) r.start.g = 3; else if (r.start.g === 3) r.start.g = 1;
    r.exit.x = W - r.exit.x;
    r.walls = r.walls.map(mr);
    r.spikes = r.spikes.map((s) => ({ r: mr(s.r) }));
    r.crumbles = r.crumbles.map(mr);
    r.gates = r.gates.map((g) => ({ r: mr(g.r), dir: g.dir === 1 ? 3 : g.dir === 3 ? 1 : g.dir }));
    r.crushers = r.crushers.map((c) => ({ r: mr(c.r), ax: c.ax, ay: c.ay, amp: c.amp, phase: 0 - c.phase }));
    r.mirrored = true;
    return r;
  };

  PL.TEMPLATES = PL.TEMPLATES || [];
  // meta: tier (0 = tutorial only), family (adjacent shaft rooms differ), inputs (needed inputs on the loosest route),
  // rest (may fill the rest slot), hard (may fill the hardest slot), tutorial (never in a shaft), retired (never in a shaft).
  function reg(id, tier, mk, meta) {
    const t = Object.assign({ id, tier, teach: mk().teach, make(rng) {
      const room = mk(); room.w = W; room.h = H; room.mirrored = false;
      const phase = rng() * Math.PI * 2;
      for (const c of room.crushers) c.phase = phase;
      return room;
    } }, meta);

  function domBtn(label, primary, f) {

    const cols = [U.C.brass, U.C.teal, U.C.coral, U.C.cream];
    for (let i = 0; i < 46; i++) { const x = view.W * (0.1 + 0.8 * ((i * 37) % 46) / 46), side = i % 2 ? 1 : -1;
      addPop({ k: 'conf', x, y: -10 - (i % 7) * 14, vx: side * (20 + (i * 13) % 50), vy: 120 + (i * 29) % 140, rot: i, vr: side * (3 + i % 4), age: 0, life: 1.8 + (i % 5) * 0.12, col: cols[i % 4], s: 5 + i % 4 }); }
    const L = layoutFor('shaftComplete').shaftComplete, m = L && L.rects && L.rects.medal;
    if (m) for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283; addPop({ k: 'star', x: m.x + m.w / 2, y: m.y + m.h / 2, vx: Math.cos(a) * 170, vy: Math.sin(a) * 170, age: 0, life: 0.8, s: 9 }); }
  }
  function stepPops(dt) {
    if (!(dt > 0)) return;
    for (const q of pops) { q.age += dt; if (q.vx != null) { q.x += q.vx * dt; q.y += q.vy * dt; if (q.k === 'conf') { q.vy += 90 * dt; q.rot += q.vr * dt; } else { q.vx *= 0.94; q.vy *= 0.94; } } }
    pops = pops.filter((q) => q.age < q.life);
  }
  function drawPops(c) {
    if (!pops.length) return;
    c.save();
    for (const q of pops) {
      const k = q.age / q.life;
      if (q.k === 'ripple') { c.globalAlpha = 0.7 * (1 - k); c.lineWidth = 3; c.strokeStyle = U.C.teal; c.beginPath(); c.arc(q.x, q.y, q.r0 + (q.r1 - q.r0) * k, 0, 6.283); c.stroke(); }
      else if (q.k === 'spark') { c.globalAlpha = 1 - k; c.fillStyle = U.C.brass; c.beginPath(); c.arc(q.x, q.y, q.s * (1 - 0.5 * k), 0, 6.283); c.fill(); }
      else if (q.k === 'star') { c.globalAlpha = 1 - k; c.fillStyle = U.C.brass; U.starPath(c, q.x, q.y, q.s * (1 + k), q.s * 0.45 * (1 + k)); c.fill(); }
      else if (q.k === 'conf') { c.globalAlpha = Math.min(1, (1 - k) * 2); c.fillStyle = q.col; c.save(); c.translate(q.x, q.y); c.rotate(q.rot); c.scale(1, Math.abs(Math.sin(q.rot * 1.7)) * 0.8 + 0.2); c.fillRect(-q.s / 2, -q.s, q.s, q.s * 2); c.restore(); }
    }
    c.restore();
  }

  // PL.drawPad: HUD + arrow pad + Retry/Pause + teach + chips, all PL.UI components fed by PL.Input.view()
  PL.drawPad = function (c, v, padModel, hud) {
    const vm = hud && hud.vm; if (!vm) return;
    SC.draw[hud.screenName || 'play'](c, v.W, v.H, vm, nowMs() / 1000);
  };
  function drawKiller(fr) {
    if (!death || !death.killer) return;
    const age = nowMs() - death.at; if (age > 900) return;
    if (!death.drawnAt) death.drawnAt = nowMs();
    const k = death.killer, a = toScreen(fr, k[0], k[1]), b = toScreen(fr, k[0] + k[2], k[1] + k[3]);
    const pulse = reducedNow() ? 1 : 0.65 + 0.35 * Math.sin(age / 60);
    ctx.save(); ctx.globalAlpha = age > 700 ? (900 - age) / 200 : 1;
    ctx.lineWidth = 3; ctx.strokeStyle = U.alpha(U.C.coral, pulse); U.rr(ctx, a.x - 3, a.y - 3, b.x - a.x + 6, b.y - a.y + 6, 4); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.strokeStyle = U.alpha(U.C.cream, 0.8 * pulse); U.rr(ctx, a.x - 6, a.y - 6, b.x - a.x + 12, b.y - a.y + 12, 6); ctx.stroke();
    ctx.restore();
  }
  // over = an overlay (pause, nudge, medal, settings from pause) sits on top: field only, 85% dusk scrim, no pad / HUD pills
  function renderPlay(dt, live, over) {
    const W = view.W, H = view.H;
    if (pipPop > 0) { pipPop += dt / 0.22; if (pipPop >= 1) pipPop = 0; }
    const fr = PL.camUpdate(cam, state, view, live ? dt : 0);
    lastFrame = fr;
    for (const f of fx) f.age += live ? dt : 0;
    fx = fx.filter((f) => f.age < 0.6);
    const hud = {
      chrome: 'ui', events: live ? frameEvents.slice() : [], reduced: reducedNow(), quality: vfxQuality(),
      roomIdx, roomN: roomIdx + 1, roomName: rooms[roomIdx].name, nRooms: rooms.length, roomTotal: rooms.length, mode, seed,
      timeS: totalTicks * C.DT, flips: curFlips(), deaths, attempt: cur ? cur.attempt : 1, roomAgeS: state.t * C.DT,
      pathOn: isTut() || !!aidRooms[roomIdx], aimArc: isTut() || !!aidRooms[roomIdx], fx, fps: avgFps(), hideHint: true, muted: settings.mute, ring: 0,
      trail: death && nowMs() - death.at < 1200 ? death.trail : null,
      deathCause: state.dead > 0 ? state.cause : '', killer: death && nowMs() - death.at < 900 ? death.killer : null,
      pad: PL.Input ? PL.Input.view() : null, completeScreen: null, tuning: null, toast: null, teach: null
    };
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    try { PL.draw(ctx, view, fr, state, hud); } catch (e) { ctx.fillStyle = U.C.dusk; ctx.fillRect(0, 0, W, H); if (!renderPlay.warned) { renderPlay.warned = 1; console.warn('draw', e); } }
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    if (over) { // over === 'bare': the caller (Settings from Pause) draws the shared scrim itself
      if (over !== 'bare') U.overlayScrim(ctx, W, H);
      if (vfxReady && PL.Vfx && PL.Vfx.drawOverlay) { try { PL.Vfx.drawOverlay(ctx, fr); } catch (_) {} }
      frameEvents.length = 0; return null;
    }
    drawKiller(fr);
    const t = nowMs() / 1000, vm = playVm(fr, t);
    let name = playName();
    const deathAge = death ? nowMs() - death.at : 1e9;
    if (clearInfo) name = 'roomClear';
    else if (deathAge < 1700) name = 'death';
    if (name === 'death') {
      const hp = toScreen(fr, death.x, death.y);
      vm.cause = { kind: death.kind, text: death.text, age: deathAge, iconOnly: death.iconOnly, x: hp.x, y: hp.y };
      vm.showSkip = isTut();
    }
    if (name === 'roomClear') {
      const ci = clearInfo;
      vm.time = fmtClock(ci.time); vm.best = ci.best != null ? fmtClock(ci.best) : null; vm.isNewBest = ci.isNew;
    }
    hud.vm = vm; hud.screenName = name;
    if (name === 'roomClear') { U.overlayScrim(ctx, W, H); vm.noHud = true; } // no pad / HUD pills through the card
    if (name === 'death' && isTut()) { // tutorial keeps teach + Skip under the tag
      SC.draw.tutorial(ctx, W, H, vm, t);
      const L = SC.layout(W, H, vm.leftHand, { roomRect: vm.roomRect }).death, c0 = vm.cause, rm = L.rects.room, tw2 = c0.iconOnly ? 44 : 220;
      const x = Math.max(rm.x + 6 + tw2 / 2, Math.min(rm.x + rm.w - 6 - tw2 / 2, c0.x)), y = Math.max(rm.y + 24, Math.min(rm.y + rm.h - 24, c0.y - 44));
      U.causeTag(ctx, { x: x - tw2 / 2, y: y - 18, w: tw2, h: 36 }, { kind: c0.kind, text: c0.text, age: c0.age, iconOnly: c0.iconOnly }, t);
    } else PL.drawPad(ctx, view, hud.pad, hud);
    stepPops(live ? dt : 0); drawPops(ctx);
    if (vfxReady && PL.Vfx && PL.Vfx.drawOverlay) { try { PL.Vfx.drawOverlay(ctx, fr); } catch (_) {} }
    frameEvents.length = 0;
    return vm;
  }

  // ---------- loop ----------
  let last = 0, acc = 0, lastScr = '';
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) last = ts;
    let dt = (ts - last) / 1000; last = ts;
    if (dt <= 0) return;
    if (dt > 0.25) dt = 0.25; else { fpsFrames++; fpsSecs += dt; }
    if (wiping && nowMs() > wipeGuard) wiping = false;
    const live = scr === 'play' && !domOverlay;
    acc += dt;
    let n = 0;
    if (!live) acc = 0;
    else while (acc >= C.DT && n < 5) { simTick(); acc -= C.DT; n++; }
    if (acc > C.DT) acc = 0;
    if (scr !== lastScr) { lastScr = scr; if (scr === 'tweak') rebuildTweakRows(); }
    if (nudgeAt && scr === 'play' && !clearInfo && !complete && !domOverlay && nowMs() >= nudgeAt) { nudgeAt = 0; goPause(); nudge = true; }
    render(dt, live);
  }
  // render / sim errors: count them; after 3 in a row show a visible chip instead of a silent flat screen (tap = back to the menu)
  let breakRender = false, errRun = 0, errTotal = 0, errWarned = false, problem = null;
  function fail(e) { errRun++; errTotal++; if (!errWarned) { errWarned = true; console.warn('Starfall error', e); } }
  function drawProblem() {
    try {
      const W = view.W, H = view.H, cw = Math.min(W - 24, 320), r = { x: Math.round((W - cw) / 2), y: Math.round(H / 2 - 40), w: cw, h: 80 };
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0); U.scrim(ctx, W, H, 0.9);
      U.button(ctx, r, { label: S.problem.text, kind: 'primary', vw: W }, 0); problem = r;
    } catch (_) { problem = { x: 0, y: 0, w: view.W, h: view.H }; }
  }
  function render(dt, live) {
    try { renderInner(dt, live); errRun = 0; problem = null; } catch (e) { fail(e); }
    if (errRun >= 3) drawProblem();
  }
  function renderInner(dt, live) {
    if (breakRender) throw new Error('test break');
    const W = view.W, H = view.H, t = nowMs() / 1000, base = chipVm(), sca = TEXT_SCALE[settings.textIdx];
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    const pr = (n) => (press && press.tgt === n ? n : null);
    const under = () => { if (state && rooms && (settingsFrom === 'pause' || scr === 'pause' || scr === 'shaftComplete')) { renderPlay(0, false, 'bare'); } else drawBackdrop('dim'); };
    if (scr === 'play' && state) { renderPlay(dt, live); }
    else if (scr === 'firstOpen') { drawBackdrop(); SC.draw.firstOpen(ctx, W, H, Object.assign({}, base, { drawArt: drawKeyArt, pressed: pr('start') }), t); }
    else if (scr === 'menu') { drawBackdrop(); SC.draw.menu(ctx, W, H, Object.assign({}, base, { drawArt: drawKeyArt, pressed: press && press.tgt }), t); }
    else if (scr === 'shaftPick') {
      drawBackdrop('dim');
      const best = ['short', 'long', 'daily'].map((m) => { let b = null; try { b = PL.meta && PL.meta.getBest(bestKey(m)); } catch (_) {} return b ? { time: fmtTotal(b.ticks * C.DT), tier: b.medal === 'plumb' ? 'gold' : b.medal } : null; });
      SC.draw.shaftPick(ctx, W, H, Object.assign({}, base, { selected: pickSel, best, dailyNote: true, pressed: press && press.tgt }), t);
    } else if (scr === 'pause' && nudge) { renderPlay(0, false, true); SC.draw.confirm(ctx, W, H, { text: S.nudge.msg, no: S.nudge.show, yes: S.nudge.no, danger: false, pressed: press && press.tgt, textScale: sca }, t); }
    else if (scr === 'pause') { renderPlay(0, false, true); SC.draw.pause(ctx, W, H, Object.assign({}, base, { confirm: pauseConfirm, pressed: press && press.tgt, leftHand: leftHand() }), t); }
    else if (scr === 'shaftComplete' && complete) {
      renderPlay(0, false, true);
      const c = complete, age = reducedNow() ? 99 : Math.max(0, (nowMs() - c.at) / 1000);
      SC.draw.shaftComplete(ctx, W, H, Object.assign({}, base, { tier: c.medal === 'plumb' ? 'gold' : c.medal, isNew: c.newBest, total: fmtClock(c.timeS), totalS: c.timeS, fmt: fmtClock, age,
        roomTimes: c.roomS.map((x) => fmtClock(x)), tuned: c.tuned, pressed: press && press.tgt, focus: 'again' }), t);
      stepPops(Math.min(dt, 0.05)); drawPops(ctx);
      if (vfxReady && PL.Vfx && PL.Vfx.drawOverlay) { try { PL.Vfx.drawOverlay(ctx, lastFrame); } catch (_) {} }
    } else if (scr === 'settings' || scr === 'tweak' || scr === 'confirm') {
      under();
      const values = { music: settings.music, sounds: settings.sounds, mute: settings.mute, vibration: PL.Input ? PL.Input.getVibrate() : true, left: leftHand(), motion: settings.motion, textIdx: settings.textIdx, qualityIdx: settings.qualityIdx };
      if (scr === 'tweak') SC.draw.tweak(ctx, W, H, Object.assign({}, base, { rows: tweakRowsCache, scroll: tweakScroll, pressed: press && press.tgt, drag: drag && drag.key }), t);
      else SC.draw.settings(ctx, W, H, Object.assign({}, base, { values, scroll: settingsScroll, pressed: press && press.tgt, drag: drag && drag.key }), t);
      if (scr === 'confirm') { U.scrim(ctx, W, H, 0.6); SC.draw.confirm(ctx, W, H, { text: S.settings.eraseQ, no: S.settings.keep, yes: S.settings.erase, danger: true, pressed: press && press.tgt, textScale: sca }, t); }
      if (toast && nowMs() < toast.until) { const tw2 = Math.min(W - 24, 320); U.toast(ctx, { x: (W - tw2) / 2, y: H - 120, w: tw2, h: 40 }, { text: toast.text, kind: toast.kind, vw: W }, t); }
      if (scr === 'settings' && base.devTuned) U.devBadge(ctx, { x: W - 64, y: 24, w: 56, h: 24 }, {}, t);
    } else { drawBackdrop(); }
  }

  requestAnimationFrame(frame);

  // ---------- test hook ----------
  function screenName() {
    if (scr === 'play') { if (clearInfo) return 'roomClear'; if (death && nowMs() - death.at < 1700) return 'death'; return playName(); }
    if (scr === 'pause' && pauseConfirm) return 'pauseConfirm';
    return scr;
  }
  window.PL_TEST = {
    breakRender: (on) => { breakRender = !!on; },
    errRun: () => errRun,
    getState: () => state,
    screen: screenName,
    scene: () => (scr === 'play' ? 'play' : scr === 'menu' ? 'menu' : scr),
    sceneName: () => (complete ? 'complete' : scr === 'play' ? 'play' : scr),
    // current PL.Screens layout for the screen that takes taps (rects in CSS px)
    rects: () => { const n = hitScreen(), L = layoutFor(n); return { name: n, rects: L[n] ? L[n].rects : null, targets: L[n] ? L[n].targets : [] }; },
    layout: (name) => layoutFor(name)[name],
    setSeed: (n) => { urlSeed = n | 0; startMode('tutorial', 1); },
    startMode: (m, s) => startMode(m === 'seed' ? 'short' : m, s),
    go: (n) => { if (n === 'settings') settingsFrom = scr === 'pause' ? 'pause' : 'menu'; if (n === 'pause') goPause(); else if (n === 'tweak') { scr = 'tweak'; rebuildTweakRows(); } else go(n); },
    menu: () => toMenu(),
    kill: (cause) => { if (scr === 'play' && !complete && state && !state.dead && !state.won) { state.dead = state.K.DEAD_TICKS || Math.round(C.RESPAWN_T / C.DT); state.cause = cause || 'spike'; frameEvents.push('death'); onDeath(); return true; } return false; },
    deathInfo: () => (death ? { kind: death.kind, text: death.text, killer: death.killer, at: death.at, drawnAt: death.drawnAt, iconOnly: death.iconOnly } : null),
    inject: (arr) => { for (const i of (arr || [])) { if (!i) continue; if (i.k === 'dive') queue.push({ k: 'dive' }); else if (i.k === 'flip' && Number.isInteger(i.dir) && i.dir >= 0 && i.dir <= 3) queue.push({ k: 'flip', dir: i.dir }); } },
    room: (n) => { scr = 'play'; complete = null; clearInfo = null; finishAttempt('abandoned'); roomIdx = clamp((n | 0) - 1, 0, rooms.length - 1); startAttempt(); },
    tick: (n) => { for (let i = 0; i < (n || 1); i++) simTick(); },
    winRoom: () => { if (scr !== 'play' || !state || clearInfo) return false; state.x = state.room.exit.x; state.y = state.room.exit.y; for (let i = 0; i < 3 && !clearInfo; i++) simTick(); return !!clearInfo; },
    advance: () => advance(true),
    advanceWipe: () => advance(),
    wiping: () => wiping,
    pops: () => pops.length,
    pipPop: () => pipPop,
    juice: () => pops.length + (PL.Vfx && PL.Vfx.stats ? (PL.Vfx.stats().particles || 0) : 0),
    report: buildReport,
    attempts: () => attempts.slice(),
    inputLog: () => inputLog.slice(),
    getRunStats: () => ({ totalTicks, roomsCleared: cleared.filter(Boolean).length, tuned: runTuned || !!(TW && TW.isDirty('sim')), mode, seed, rooms: rooms ? rooms.length : 0 }),
    pad: () => (PL.Input ? PL.Input.view() : null),
    isComplete: () => !!complete,
    aid: () => Object.assign({}, aidRooms),
    nudging: () => nudge,
    complete: () => (complete ? Object.assign({}, complete) : null),
    settings: () => Object.assign({}, settings, { hand: PL.Input && PL.Input.getHand(), vibrate: PL.Input && PL.Input.getVibrate() }),
    tweakRows: () => tweakRowsCache.map((r, i) => ({ i, kind: r.kind, id: r.id, group: r.group, label: r.label, btns: r.btns && r.btns.map((b) => b.id), weights: r.btns && r.btns.map((b) => b.weight || 1) })),
    setScroll: (v) => { if (scr === 'tweak') tweakScroll = clamp(v, 0, maxScroll('tweak')); else settingsScroll = clamp(v, 0, maxScroll('settings')); },
    music: () => moment,
    chips: () => chipVm(),
    roomRect: () => (lastFrame ? roomRectOf(lastFrame) : null)
  };
  PL.ui = Object.assign(PL.ui || {}, { buildReport, retryRoom, onPause: goPause, go, startMode, screen: screenName });
})();

})();
</script>
<script>if('serviceWorker' in navigator&&isSecureContext)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e)));try{screen.orientation&&screen.orientation.lock&&matchMedia('(display-mode: fullscreen)').matches&&screen.orientation.lock('portrait').catch(()=>{});}catch(_){}</script>
