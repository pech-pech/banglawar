<script>
// CORE-START  (pure rules, shared with the headless bot sweep)
const LOL = (() => {
  const SECTORS = ['leg', 'straight', 'off', 'loft'];
  const SCALE = { block: 1.4, rotate: 1.0, drive: 0.85, slog: 0.7 };
  // runs per grade x intent (LOL-R2-skill.md section 4)
  const RUNS = {
    perfect: { block: 1, rotate: 2, drive: 4, slog: 6 },
    good:    { block: 0, rotate: 1, drive: 2, slog: 4 },
    edge:    { block: 0, rotate: 0, drive: 1, slog: 2 },
    miss:    { block: 0, rotate: 0, drive: 0, slog: 0 },
  };
  // Cone Kid: 60 straight, 30 swing, 10 slower. shift = ms later than a straight ball.
  const DELIVERIES = {
    straight: { name: 'Straight', tell: 'Straight pace', shift: 0, onStumps: true },
    swing:    { name: 'Swing', tell: 'SWING → bends to the wall', shift: 50, onStumps: false },
    slower:   { name: 'Slower ball', tell: 'Hand flick: SLOWER BALL', shift: 120, onStumps: true },
  };
  const BOWLER = { name: 'Cone Kid', mix: [['straight', 60], ['swing', 30], ['slower', 10]] };
  // Field per over (admin default). Guarded sectors hold a fielder.
  const FIELDS = [
    { name: 'Spread', guard: { leg: true, off: true } },
    { name: 'Ring', guard: { leg: true, straight: true, off: true } },
    { name: 'Leg trap', guard: { leg: true, loft: true } },
    { name: 'Attack', guard: { straight: true, off: true } },
  ];
  const MATCH = { balls: 12, target: 20, wickets: 3, overLen: 4 };

  function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  function pickDelivery(r) { let x = r() * 100; for (const [k, w] of BOWLER.mix) { if ((x -= w) < 0) return k; } return 'straight'; }
  function windows(intent, perfectMs, assist) { const k = SCALE[intent]; return { perfect: (perfectMs + (assist ? 20 : 0)) * k, good: 100 * k, edge: 150 * k }; }
  function grade(offsetMs, intent, perfectMs, assist) {
    if (offsetMs == null) return 'leave';
    const w = windows(intent, perfectMs, assist), a = Math.abs(offsetMs);
    return a <= w.perfect ? 'perfect' : a <= w.good ? 'good' : a <= w.edge ? 'edge' : 'miss';
  }
  // offsetMs = tap time minus arrival (negative = early); null = no tap (leave).
  function resolve({ delivery, intent, sector, offsetMs, field, perfectMs = 60, assist = false }) {
    const d = DELIVERIES[delivery], g = grade(offsetMs, intent, perfectMs, assist);
    const guarded = !!(field && field.guard[sector]);
    const late = offsetMs == null ? '' : (offsetMs > 0 ? 'late by ' : 'early by ') + Math.round(Math.abs(offsetMs)) + ' ms';
    if (g === 'leave' || g === 'miss') {
      if (d.onStumps) return { grade: g, runs: 0, out: true, why: (g === 'leave' ? 'Left a ball on the stumps' : 'Missed, ' + late) + ' → BOWLED (' + d.name.toLowerCase() + ')' };
      return { grade: g, runs: 0, out: false, why: g === 'leave' ? 'Left it, swung past the stumps' : 'Missed, ' + late + ', swung past' };
    }
    let runs = RUNS[g][intent];
    if (sector === 'loft') {
      if (g === 'edge') return { grade: g, runs: 0, out: true, why: 'Skied it, ' + late + ' → CAUGHT' };
      if (g === 'perfect' && (intent === 'drive' || intent === 'slog')) runs = Math.min(6, runs + 2); // only attacking shots clear the infield
    }
    if (guarded) {
      if (g === 'edge') return { grade: g, runs: 0, out: true, why: 'Edged to the fielder, ' + late + ' → CAUGHT' };
      if (g === 'good' && (intent === 'slog' || intent === 'drive')) return { grade: g, runs: 0, out: true, why: (intent === 'slog' ? 'Slog' : 'Drive') + ' found the fielder, ' + late + ' → CAUGHT' };
      if (g === 'good') runs = Math.min(runs, 1);
      if (g === 'perfect' && sector !== 'loft') runs = Math.min(runs, 2); // deep fielder stops the boundary
    }
    return { grade: g, runs, out: false, why: (g === 'perfect' ? 'Perfect' : g === 'good' ? 'Good' : 'Edge') + (late ? ', ' + late : '') + (guarded && sector !== 'loft' && runs < RUNS[g][intent] ? ', fielder cuts it off' : '') };
  }
  function newMatch(seed) {
    const r = rng(seed), balls = [];
    for (let i = 0; i < MATCH.balls; i++) balls.push(pickDelivery(r));
    const fields = [0]; while (fields.length < Math.ceil(MATCH.balls / MATCH.overLen)) { const k = 1 + (r() * (FIELDS.length - 1) | 0); if (k !== fields[fields.length - 1]) fields.push(k); }
    return { seed, balls, fields, i: 0, runs: 0, wkts: 0, done: false, won: false, log: [] };
  }
  // Field changes every 4 balls (admin default); the first block is always Spread.
  function fieldFor(m, i = m.i) { return FIELDS[m.fields[Math.floor(i / MATCH.overLen)] || 0]; }
  function step(m, choice, opts) {
    const delivery = m.balls[m.i], field = fieldFor(m);
    const res = resolve({ delivery, field, ...choice, ...opts });
    m.runs += res.runs; if (res.out) m.wkts++;
    m.log.push({ ball: m.i + 1, delivery, ...choice, ...res, field: field.name });
    m.i++;
    if (m.runs >= MATCH.target) { m.done = true; m.won = true; }
    else if (m.wkts >= MATCH.wickets || m.i >= MATCH.balls) { m.done = true; m.won = false; }
    return res;
  }
  return { SECTORS, SCALE, RUNS, DELIVERIES, BOWLER, FIELDS, MATCH, rng, grade, windows, resolve, newMatch, fieldFor, step };
})();
if (typeof module !== 'undefined') module.exports = LOL;
// CORE-END

</script>

        q = G.path(p, W, H);
        var n = 1;
        f[16] = q[0]; f[17] = q[1]; f[18] = 16; f[19] = 0.45;   // items[0] glow
        if (!G.reduced) {
          for (i = 1; i <= 10; i++) {
            var pk = p - i * 0.012;
            var o = 16 + i * 4;
            if (pk < 0) { f[o + 3] = 0; continue; }
            q = G.path(pk, W, H);
            f[o] = q[0]; f[o + 1] = q[1];
            f[o + 2] = 3 - 1.5 * (i - 1) / 9;
            f[o + 3] = 0.25 * (11 - i) / 10;
          }
          n = 11;
        }
        S.dev.queue.writeBuffer(S.bb, 0, f.buffer, 0, 256);
        pass.setPipeline(S.ball);
        pass.setBindGroup(0, S.bbg);
        pass.draw(6, n);
        return;
      }

      // burst
      if (G.reduced) return;
      var res = cur.res;
      if (cur.tSettle == null) return;
      var el = now - cur.tSettle;
      var col, dur, cnt, spd, sz, pa, dust = 0, pf = 0;
      if (res.out) { col = DUST; dur = 500; cnt = 24; spd = 240; sz = 1; pa = 0.55; dust = 1; }
      else if (res.grade === 'perfect') { col = PGOLD; dur = 450; cnt = 80; spd = 420; sz = 1.4; pa = 1.0; pf = 1; }
      else if (res.grade === 'good') { col = WHITE; dur = 400; cnt = 40; spd = 300; sz = 1; pa = 0.85; }
      else if (res.grade === 'edge') { col = WHITE; dur = 300; cnt = 12; spd = 200; sz = 0.9; pa = 0.7; }
      else return;
      if (el < 0 || el > dur) return;
      q = G.path(1, W, H);
      var b = burstF;
      setHead(b, ctx, now);
      b[4] = cur.tSettle; b[5] = q[0]; b[6] = q[1]; b[7] = dust;
      b[8] = col[0]; b[9] = col[1]; b[10] = col[2]; b[11] = dur;
      b[12] = cnt; b[13] = spd; b[14] = sz; b[15] = pa;
      if (pf) {                                   // two-tone: dark rim pass, then gold fill, both normal-over
        var r = rimF;
        r.set(b);
        r[7] = 2; r[8] = RIM[0]; r[9] = RIM[1]; r[10] = RIM[2]; r[15] = 0.6;
        S.dev.queue.writeBuffer(S.rb, 0, r.buffer, 0, 256);
        S.dev.queue.writeBuffer(S.ub, 0, b.buffer, 0, 256);
        pass.setPipeline(S.fill);
        pass.setBindGroup(0, S.rbg);
        pass.draw(6, cnt);
        pass.setBindGroup(0, S.ubg);
        pass.draw(6, cnt);
        return;
      }
      S.dev.queue.writeBuffer(S.ub, 0, b.buffer, 0, 256);
      pass.setPipeline(dust ? S.dust : S.spark);
      pass.setBindGroup(0, S.ubg);
      pass.draw(6, cnt);
    } catch (e) { fail(e); }
  }

  var layer = { name: 'fx', setup: setup, encode: encode };
  if (L.gpu && L.gpu.layers) L.gpu.layers.push(layer);
  else { L._gpuLayers = (L._gpuLayers || []); L._gpuLayers.push(layer); }
})();

<script>
// ---------- shell: state, timing, loop (integrator) ----------
(() => {
  const $ = id => document.getElementById(id);
  const P = window.LOLParts;
  const Q = new URLSearchParams(location.search);
  let seed = +Q.get('seed') || (Date.now() % 1e9);
  const store = { get(k, d) { try { const v = localStorage.getItem('lol.' + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
                  set(k, v) { try { localStorage.setItem('lol.' + k, JSON.stringify(v)); } catch (_) {} } };
  const FLIGHT = 760, TELL = 800, HOLD = 1300, OUTHOLD = 1800, BREAK = 1500;
  const STOP = { perfect: 67, good: 50, edge: 33 };
  let rm = false; try { rm = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) {}
  // v2 changes the arrival cue, so the learned timing correction starts fresh (new log key).
  let log = store.get('log2', []);
  const G = window.G = {
    LOL, now: performance.now(), reduced: rm || Q.has('reduced'), m: null, field: LOL.FIELDS[0], intent: 'rotate',
    perfectMs: store.get('perfectMs', 60), assist: store.get('assist', false), cur: null, banner: null,
    stats: { p50: 0, p95: 0, max: 0, tapMean: null, tapSd: null, n: 0, corr: 0 },
  };
  G.geom = (W, H) => {
    const topY = H * 0.2, batY = H * 0.86;
    return { topY, batY, cx: W / 2, laneTopW: W * 0.16, laneBotW: W * 0.5,
      spots: { leg: [W * 0.14, H * 0.52], straight: [W * 0.64, H * 0.07], off: [W * 0.86, H * 0.52], loft: [W * 0.84, H * 0.27] } };
  };
  G.path = (p, W, H) => {
    const g = G.geom(W, H), y = g.topY + (g.batY - g.topY) * p;
    let x = g.cx;
    if (G.cur && G.cur.d === 'swing') { const q = Math.min(p, 1.3); x += Math.sin(Math.min(q, 1) * Math.PI * 0.9) * W * 0.05 + q * q * W * 0.17; }
    return [x, y];
  };

  // ---------- layout: portrait stage, ratio kept, sharp canvases ----------
  const stage = $('stage'), gv = $('gv'), cv = $('cv'), pc = $('pc'), cx = cv.getContext('2d'), px = pc.getContext('2d');
  let dpr = 1;
  function fit() {
    const vw = innerWidth, vh = innerHeight;
    let w = vw, h = vh;
    if (w / h > 0.8) w = Math.round(vh * 0.8);
    if (w / h < 0.42) h = Math.round(w / 0.42);
    stage.style.width = w + 'px'; stage.style.height = h + 'px';
    dpr = Math.min(3, devicePixelRatio || 1);
    for (const c of [gv, cv, pc]) { const r = c.getBoundingClientRect(), k = c === gv ? Math.min(2, dpr) : dpr; c.width = Math.round(r.width * k); c.height = Math.round(r.height * k); }
    if (P.gpu && P.gpu.ready) P.gpu.resize(gv.width, gv.height, Math.min(2, dpr));
  }
  addEventListener('resize', fit);

  // ---------- timing correction learned from real play (M's pick A) ----------
  function liveCorr() {
    const xs = log.filter(e => e.rawMs != null && Math.abs(e.rawMs) < 250).slice(-10).map(e => e.rawMs).sort((a, b) => a - b);
    return xs.length < 3 ? 0 : Math.round(xs[Math.floor(xs.length / 2)]);
  }
  function tapStats(list) {
    const xs = list.filter(e => e.offMs != null).map(e => e.offMs);
    if (!xs.length) return { mean: null, sd: null, n: 0 };
    const mean = xs.reduce((a, b) => a + b, 0) / xs.length;
    return { mean: Math.round(mean), sd: Math.round(Math.sqrt(xs.reduce((a, b) => a + (b - mean) ** 2, 0) / xs.length)), n: xs.length };
  }
  function refreshTapStats() { const s = tapStats(log.slice(-20)); Object.assign(G.stats, { tapMean: s.mean, tapSd: s.sd, n: s.n, corr: liveCorr() }); }
  refreshTapStats();

  // ---------- match flow ----------
  function startMatch() {
    G.m = LOL.newMatch(seed); seed = (seed * 16807) % 2147483647 || 7;
    G.field = LOL.fieldFor(G.m, 0); G.banner = null;
    $('ovStart').style.display = 'none'; $('ovEnd').style.display = 'none';
    nextBall(performance.now() + 700);
  }
  function nextBall(t0) {
    const m = G.m, f = LOL.fieldFor(m);
    if (m.i > 0 && f !== G.field) { G.banner = { text: 'New field: ' + f.name, until: t0 + BREAK }; t0 += BREAK; }
    G.field = f; // HUD, field and pad switch on this frame
    const d = m.balls[m.i];
    const cur = { d, tRun: t0, tRel: t0 + TELL + (d === 'slower' ? 100 : 0), tap: null, done: false, locked: false, res: null, tSettle: 0, stopUntil: 0, rejectAt: -1e9 };
    cur.tArr = cur.tRel + FLIGHT + LOL.DELIVERIES[d].shift;
    G.cur = cur;
  }
  function setIntent(i) {
    const c = G.cur;
    if (c && c.locked && !c.done) { c.rejectAt = performance.now(); return; }
    G.intent = i;
  }
  function onTap(sector, ts) {
    const c = G.cur;
    if (!G.m || G.m.done || !c || c.done || c.tap || !sector) return;
    if (ts < c.tRel - 50) return; // before release: ignored
    c.tap = { sector, t: ts };
    settle(performance.now());
  }
  function settle(now) {
    const c = G.cur, m = G.m;
    c.done = true;
    const raw = c.tap ? c.tap.t - c.tArr : null;
    const corr = liveCorr(), off = raw == null ? null : raw - corr;
    const res = LOL.step(m, { intent: G.intent, sector: c.tap ? c.tap.sector : null, offsetMs: off }, { perfectMs: G.perfectMs, assist: G.assist });
    res.kind = res.out ? (/BOWLED/.test(res.why) ? 'bowled' : 'caught') : res.grade === 'leave' ? 'leave' : res.grade === 'miss' ? 'miss' : 'hit';
    res.offMs = off == null ? null : Math.round(off);
    res.sector = c.tap ? c.tap.sector : null;
    const last = m.log[m.log.length - 1];
    Object.assign(last, { kind: res.kind, offMs: res.offMs, rawMs: raw == null ? null : Math.round(raw) });
    log.push({ t: Date.now(), d: c.d, intent: G.intent, sector: res.sector, rawMs: last.rawMs, offMs: res.offMs, grade: res.grade, kind: res.kind, perfectMs: G.perfectMs, corr });
    if (log.length > 500) log = log.slice(-500);
    store.set('log2', log); refreshTapStats();
    c.res = res; c.tSettle = now;
    c.stopUntil = now + (G.reduced ? 0 : (STOP[res.grade] || 0) + (res.out ? 100 : 0));
    P.ui.result(G);
  }
  let gpuStalls = 0;
  function rebowl(now) { if (G.m && !G.m.done && G.cur && !G.cur.done) nextBall(now + 900); }
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => { if (document.hidden) hiddenAt = 1; else if (hiddenAt) { hiddenAt = 0; rebowl(performance.now()); } });
  function finish() {
    const m = G.m, s = tapStats(m.log), w = LOL.windows;
    const inWin = s.n ? Math.round(100 * m.log.filter(e => e.offMs != null && Math.abs(e.offMs) <= w(e.intent, G.perfectMs, G.assist).perfect).length / s.n) : null;
    G.cur = null;
    $('ovEnd').style.display = '';
    P.ui.end(G, { won: m.won, runs: m.runs, wkts: m.wkts, balls: m.i, target: LOL.MATCH.target, strip: m.log, mean: s.mean, sd: s.sd, inWin, n: s.n });
  }

  // Pacing + tap readout, a thin strip at the very bottom of the pad (kept off the field).
  function drawReadout(ctx, W, H) {
    const st = G.stats, f1 = v => (v == null || isNaN(v)) ? '-' : (+v).toFixed(1);
    let t = renderer() + ' \u00b7 frame p50 ' + f1(st.p50) + ' p95 ' + f1(st.p95) + ' max ' + (st.max ? Math.round(st.max) : '-') +
      ' \u00b7 taps ' + (st.n ? Math.round(st.tapMean) + '\u00b1' + Math.round(st.tapSd) + ' (' + st.n + ')' : '-');
    ctx.font = '500 11px system-ui,sans-serif';
    if (ctx.measureText(t).width > W - 16) t = t.replace(renderer() + ' \u00b7 ', renderer() === 'WebGPU' ? 'GPU \u00b7 ' : '').replace('frame ', '');
    const w = Math.ceil(ctx.measureText(t).width + 12);
    ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect((W - w) / 2, H - 17, w, 15, 5) : ctx.rect((W - w) / 2, H - 17, w, 15); ctx.fill();
    ctx.fillStyle = '#c2cfc3'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(t, W / 2, H - 6);
  }

  // ---------- WebGPU painter (M's pick 2026-11-10): backdrop + glow under the 2D layer; Canvas 2D stays the fallback ----------
  G.gpuOn = false;
  function renderer() { return G.gpuOn && P.gpu && P.gpu.ready ? 'WebGPU' : (G.gpuNote ? 'Canvas 2D (' + G.gpuNote + ')' : 'Canvas 2D'); }
  // Safety net (whole session): drop to Canvas 2D if the median of the last 60 frame gaps passes 40 ms (under ~25 fps,
  // so a 30 fps power-saver cap is fine) or after 2 stall re-bowls while the GPU is on.
  // ?gpu=force keeps it on anyway (headless tests use a software GPU).
  let gpuWatch = null; const GPU_FORCE = Q.get('gpu') === 'force';
  function watchGpu(gap) {
    if (!gpuWatch || GPU_FORCE || document.hidden) return;
    const w = gpuWatch; w.n++; if (w.n <= 10) return;
    w.g.push(gap); if (w.g.length > 60) w.g.shift();
    if (w.g.length === 60 && w.n % 15 === 0) { const s2 = [...w.g].sort((a, b) => a - b); if (s2[30] > 40) slowGpu(); }
  }
  function slowGpu() { if (GPU_FORCE || !G.gpuOn) return; gpuWatch = null; G.gpuNote = 'GPU slow'; gpuOff('slow frames'); }
  function gpuOff(why) { G.gpuOn = false; gv.style.display = 'none'; if (why) console.warn('WebGPU off:', why); }
  function startGpu() {
    gv.style.display = 'none';
    if (!P.gpu || Q.get('gpu') === '0' || !navigator.gpu) return;
    if (P._gpuLayers) { P._gpuLayers.forEach(l => P.gpu.layers.push(l)); P._gpuLayers = null; }
    P.gpu.onLost(gpuOff);
    P.gpu.init(gv, G).then(ok => {
      if (!ok) return;
      gv.style.display = ''; P.gpu.resize(gv.width, gv.height, Math.min(2, dpr)); G.gpuOn = true; gpuWatch = { n: 0, g: [] };
    }).catch(e => gpuOff(e && e.message));
  }

  // ---------- frame loop ----------
  const gaps = []; let last = 0;
  function frame(now) {
    G.now = now;
    if (last) { const g = now - last; gaps.push(g); if (gaps.length > 300) gaps.shift(); if (G.gpuOn) watchGpu(g);
      if (g > (GPU_FORCE ? 3000 : 100) && G.cur && !G.cur.done && G.m && now > G.cur.tRun && !document.hidden) { if (G.gpuOn && ++gpuStalls >= 2) slowGpu(); rebowl(now); } }
    last = now;
    if (gaps.length && (gaps.length % 30 === 0 || !G.stats.p50)) { const s = [...gaps].sort((a, b) => a - b);
      G.stats.p50 = +s[Math.floor(s.length * 0.5)].toFixed(1); G.stats.p95 = +s[Math.floor(s.length * 0.95)].toFixed(1); G.stats.max = +s[s.length - 1].toFixed(1); }
    if (G.banner && now > G.banner.until) G.banner = null;
    const c = G.cur, m = G.m;
    if (c && m) {
      c.locked = now > c.tArr - 300;
      if (!c.done && now > c.tArr + 260) settle(now); // no tap = leave
      if (c.done && now > c.tSettle + (c.res.out ? OUTHOLD : HOLD)) { if (m.done) finish(); else nextBall(now + 200); }
    }
    if (G.gpuOn) P.gpu.draw(G);
    for (const [cnv, ctx, part] of [[cv, cx, P.field], [pc, px, P.pad]]) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, cnv.clientWidth, cnv.clientHeight);
      try { part.draw(ctx, G); } catch (e) { if (!part._err) { part._err = 1; console.error(e); } }
    }
    drawReadout(px, pc.clientWidth, pc.clientHeight);
    P.ui.update(G);
    requestAnimationFrame(frame);
  }

  // ---------- input + boot ----------
  pc.addEventListener('pointerdown', e => {
    e.preventDefault();
    const r = pc.getBoundingClientRect();
    onTap(P.pad.hit(e.clientX - r.left, e.clientY - r.top, r.width, r.height), e.timeStamp);
  });
  const h = {
    setIntent, play: startMatch,
    toggleWindow() { G.perfectMs = G.perfectMs === 60 ? 40 : 60; store.set('perfectMs', G.perfectMs); P.ui.start(G); },
    toggleAssist() { G.assist = !G.assist; store.set('assist', G.assist); P.ui.start(G); },
    copyLog() {
      const txt = JSON.stringify({ v: 3, renderer: renderer(), corr: liveCorr(), perfectMs: G.perfectMs, assist: G.assist, frame: { p50: G.stats.p50, p95: G.stats.p95, max: G.stats.max }, taps: log });
      return (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).catch(() => { prompt('Copy this log', txt); });
    },
  };
  P.ui.init(G, h);
  fit();
  P.ui.start(G);
  requestAnimationFrame(frame);
  startGpu();
  window.__lol = { G, get renderer() { return renderer(); }, gpuReadback: () => (G.gpuOn ? P.gpu.readback() : Promise.resolve(null)), get match() { return G.m; }, get cur() { return G.cur; }, get corr() { return liveCorr(); }, onTap, LOL };
})();
