<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ridgeline</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="pgs-build" content="__PGS_BUILD__">
<script src="../_shared/update.js" defer></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1220; overscroll-behavior: none; }
  body { position: fixed; inset: 0; width: 100%; height: 100dvh;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; font-family: system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100dvh; display: block; touch-action: none; outline: none; }
  #ui { position: fixed; inset: 0; width: 100%; height: 100dvh; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box; }
  #ui > * { pointer-events: auto; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
