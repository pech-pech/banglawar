<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Stock Terminal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0e14">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Stock Terminal UI v2: pro trading app look. Shared tokens. Makers: link this, do NOT edit. */
:root{
  --bg:#0b0e14; --surface:#131722; --surface2:#1c2230; --line:#2a3040; --grid:#1d2330;
  --text:#e6e9ef; --dim:#8a93a6; --faint:#5c667a;
  --x:#3d8bfd; --o:#f59f3a;            /* X / rising = blue, O / falling = orange. Never red vs green. */
  --accent:#5ad1b3; --warn:#f5c542; --bad:#ef6b6b;
  --r:10px; --pad:12px; --btn:52px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 var(--sans);-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.dim{color:var(--dim)} .faint{color:var(--faint)} .up{color:var(--x)} .down{color:var(--o)} .ok{color:var(--accent)} .warn{color:var(--warn)}
.cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad)}
.btn{height:var(--btn);border-radius:var(--r);border:1px solid var(--line);background:var(--surface2);color:var(--text);font:600 15px var(--sans);padding:0 14px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06241d}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.chip.fresh{border-color:var(--text);color:var(--text)} .chip.fresh.buy{border-color:var(--x);color:var(--x)} .chip.fresh.sell{border-color:var(--o);color:var(--o)} .chip.stale{color:var(--dim)}
/* fresh chips: ring by direction (buy blue, sell orange) plus the word 'this week'; mint is reserved for the primary button and OK checks */
.chip{font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg>button{flex:1;height:48px;background:var(--surface);color:var(--text);border:0;border-right:1px solid var(--line);font:600 14px var(--sans)}
.seg>button:last-child{border-right:0}
.seg>button.on{background:var(--surface2);box-shadow:inset 0 0 0 2px var(--text)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.bar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 12px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.dev{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:1px 6px}
.sheet{background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 12px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}

/* base.css: layout shared by all screens (owner U). Tokens come from pro.css. */
html,body{overflow-x:clip;max-width:100%}
body{background:var(--bg);margin:0}
button{font-family:inherit;color:inherit}
#app{padding:0 calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));max-width:900px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
#main{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
#top{flex:none}
.top{display:flex;align-items:center;gap:8px;height:44px;min-width:0}
.top h1{margin:0;font-size:18px;font-weight:700;white-space:nowrap}
.top .sub{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .top-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.top .dev{background:none;font-family:var(--sans)}
.top .dev{position:relative}
.top .dev::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:48px;transform:translateY(-50%)}
.bar{margin:0 calc(-12px - env(safe-area-inset-left)) 0 calc(-12px - env(safe-area-inset-right));padding:10px calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));gap:8px;background:var(--bg);border-top:1px solid var(--line)}
.bar>.btn,.bar>button{flex:1;min-width:0;height:52px;display:grid;place-items:center;text-decoration:none}
.bar>.btn.primary{flex:1.4}
.btn.outline{background:transparent;border-color:var(--line)}
.btn{cursor:pointer;font-family:var(--sans)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2>*,.grid3>*{min-width:0}
/* sheet */
#scrim{position:fixed;inset:0;background:rgba(5,7,12,.55);z-index:20;opacity:0;visibility:hidden;transition:opacity 180ms}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;z-index:30;padding:14px 12px 0;box-shadow:0 -12px 32px rgba(0,0,0,.5);transform:translateY(105%);visibility:hidden;transition:transform 180ms ease-out,visibility 0s linear 180ms}
.sheet .bar{position:sticky;bottom:0;margin:0 -12px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:0}
body.sheet-on #scrim{opacity:1;visibility:visible}
body.sheet-on .sheet{transform:none;visibility:visible;transition:transform 180ms ease-out,visibility 0s}
body.sheet-on{overflow:hidden}
@media (prefers-reduced-motion:reduce){#scrim,.sheet,body.sheet-on .sheet{transition:none}}
/* wide: order = right panel, week = centred */
body[data-layout=wide].sheet-order #scrim{display:none}
body[data-layout=wide].sheet-order .sheet{left:auto;right:0;top:0;bottom:0;width:360px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.5);padding-top:10px}
body[data-layout=wide].sheet-order .sheet .grab{display:none}
body[data-layout=wide].sheet-order #app{padding-right:372px}
body[data-layout=wide].sheet-order{overflow:auto}
body[data-layout=wide].sheet-week .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(560px,calc(100vw - 24px));max-height:92dvh;border-radius:16px;border:1px solid var(--line);transform:translate(-50%,-46%);opacity:0}
body[data-layout=wide].sheet-week.sheet-on .sheet{transform:translate(-50%,-50%);opacity:1}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,7,12,.7);z-index:50;display:none;overflow-y:auto;padding:16px calc(12px + env(safe-area-inset-right)) 16px calc(12px + env(safe-area-inset-left))}
.modal.on{display:block}
.modal .panel{max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad)}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100vw - 32px);z-index:60;background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:600;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 160ms}
#toast.on{opacity:1;visibility:visible}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
body.sheet-on #toast{z-index:70}
body.sheet-on:not([data-layout=wide]) #toast{bottom:auto;top:calc(12px + env(safe-area-inset-top))}

/* pf- : point and figure drawing + signal chips */
.chip.pf-trap{border-color:var(--warn);color:var(--warn)}
.chip.pf-trap::before{content:"\26A0";font-size:11px}
.chip.fresh.buy::before{content:"\25B2";font-size:9px}
.chip.fresh.sell::before{content:"\25BC";font-size:9px}
#pf,.pf-svg{display:block;max-width:100%;font-variant-numeric:tabular-nums}

/* panes.css [C2]: pn- classes */
.pn-card{padding:6px 12px 5px}
.pn-h{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;height:20px}
.pn-t{font-weight:600}
.pn-t i{font-style:normal;font-weight:400;color:var(--dim);margin-left:4px}
.pn-v{font-weight:700}
.pn-v .dim{font-weight:400}
.pn-svg{display:block;max-width:100%;overflow:visible}
.pn-svg text,.pn-mini text{font:11px var(--sans);fill:var(--dim);font-variant-numeric:tabular-nums}
.pn-svg .pn-halo{paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.pn-mini{display:inline-block;vertical-align:middle}
.pn-ax{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--dim);height:16px;margin-top:1px;white-space:nowrap}
.pn-lg{display:inline-flex;gap:10px;font-size:11px;min-width:0}
.pn-k{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pn-k::before{content:"";width:12px;height:0;border-top:2px solid var(--dim);display:inline-block}
.pn-kx::before{border-color:var(--x)}
.pn-ko::before{border-color:var(--o);border-top-style:dashed}
.pn-ka::before{border-color:var(--accent);border-top-width:2.5px}
.pn-kd::before{border-top-style:dashed}
.pn-ko2::before{border-color:var(--o);border-top-width:1.5px}
.pn-lgd{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--dim);margin-bottom:4px}
.pn-eq{max-width:100%}

/* Home (S1): d- classes */
.d-home{display:grid;gap:10px}
.d-side{display:grid;gap:10px;align-content:start}
.d-note{display:flex;align-items:center;gap:12px;font-size:14px}
.d-note span{flex:1}.d-note .btn{height:48px;flex:none}
.d-acct{padding:11px 12px;display:grid;gap:10px}
.d-eq{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.d-eq .cap{margin-bottom:6px}
.d-big{font-size:34px;font-weight:700;line-height:1;letter-spacing:-.01em}
.d-r{text-align:right;display:flex;flex-direction:column;gap:2px;font-size:12px}
.d-r b{font-size:18px}
.d-lab{white-space:nowrap;display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--dim);margin-bottom:6px}
.d-lab b{color:var(--text);font-weight:600}.d-lab b.d-bad{color:var(--bad)}
.d-track{position:relative;height:8px;border-radius:4px;background:var(--surface2)}
.d-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--x)}
.d-warnz{position:absolute;left:0;top:0;bottom:0;background:var(--warn);opacity:.28;border-radius:4px 0 0 4px}
.d-wt{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--warn)}
.d-mk{position:absolute;top:-4px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--text);border:3px solid var(--surface)}
.d-mk.bad{background:var(--bad)}
.d-ends{position:relative;height:16px;margin-top:6px;font-size:12px;color:var(--dim)}
.d-ends span{position:absolute;top:0;white-space:nowrap}
.d-wn{color:var(--warn);margin-left:6px}.d-hi{right:0}
.d-cash{display:grid;grid-template-columns:1fr 1fr;gap:16px;border-top:1px solid var(--line);padding-top:8px}
.d-cash div{display:flex;justify-content:space-between;align-items:baseline;color:var(--dim)}
.d-cash b{color:var(--text);font-size:15px;margin-left:6px}
.d-strip{padding:8px 12px 0}
.d-strip .cap{margin-bottom:2px}
.d-al{display:flex;align-items:center;gap:10px;min-height:48px;width:100%;padding:0;margin:0;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;text-align:left}
.d-al:last-child{border-bottom:0}
.d-more{color:var(--dim)}.d-more b{color:var(--text)}
.d-ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;background:var(--surface2);flex:none}
.d-ic.b{color:var(--x)}.d-ic.s{color:var(--o)}.d-ic.k{color:var(--accent)}.d-ic.w{color:var(--warn)}.d-ic.n{color:var(--dim)}
.d-tx{flex:1;min-width:0;line-height:1.25}.d-tx b{font-weight:700}
.d-tg{font-size:14px;color:var(--dim);white-space:nowrap}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.d-card{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"hd hd" "ch ind" "sg sg";gap:5px 8px;padding:9px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);color:var(--text);font:inherit;text-align:left;min-width:0;width:100%;align-items:start}
.d-card.hot.buy{border-color:color-mix(in srgb,var(--x) 60%,var(--line))}
.d-card.hot.sell{border-color:color-mix(in srgb,var(--o) 60%,var(--line))}
.d-hd{grid-area:hd;display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.d-l1{display:flex;align-items:center;gap:6px}.d-code{font-size:16px}
.d-held{font-size:11px;font-weight:600;border:1px solid var(--dim);border-radius:6px;padding:0 5px;line-height:17px;white-space:nowrap}
.d-l2{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.d-last{font-size:17px}.d-chg{font-size:12px;font-weight:600;white-space:nowrap}
.d-ch{grid-area:ch;line-height:0;align-self:center}.d-ch svg{display:block}
.d-ind{grid-area:ind;display:flex;flex-direction:column;justify-content:center;min-width:0}
.d-ir{line-height:16px;display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.d-il{font-size:11px;color:var(--dim)}
.d-sp{display:block;height:14px;margin-bottom:3px;line-height:0}
.d-sp svg{display:block;width:100%;height:14px}
.d-sg{grid-area:sg;display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;min-width:0}
.d-sg .chip{height:auto;min-height:22px;padding:2px 8px;white-space:normal;line-height:1.2}
.d-foot{font-size:12px;text-align:center;padding:12px 0 4px}
@media(max-width:380px){.d-sg .chip{padding:2px 6px}}
body[data-layout=wide] .d-home{grid-template-columns:236px 1fr;align-items:stretch}
body[data-layout=wide] .d-side{grid-template-rows:auto 1fr;gap:8px}
body[data-layout=wide] .d-acct{gap:8px;padding:8px 12px}
body[data-layout=wide] .d-eq{flex-direction:column;align-items:flex-start;gap:4px}
body[data-layout=wide] .d-eq .cap{margin-bottom:3px}
body[data-layout=wide] .d-big{font-size:28px}
body[data-layout=wide] .d-r{flex-direction:row;gap:10px;align-items:baseline}
body[data-layout=wide] .d-r b{font-size:15px}
body[data-layout=wide] .d-cash{grid-template-columns:1fr;gap:2px;padding-top:6px}
body[data-layout=wide] .d-strip{padding:6px 12px 0}
body[data-layout=wide] .d-grid{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:8px}
body[data-layout=wide] .d-card{padding:8px 10px;align-content:start}
body[data-layout=wide] .d-foot{padding:6px 0 0}
body[data-layout=wide] .d-note{padding:6px 12px;font-size:13px}
body[data-layout=wide] .d-note .btn{height:48px}

.ch-hd{display:flex;align-items:center;gap:6px;min-height:56px}
.ch-ib{flex:none;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--text);font:600 11px var(--sans)}
.ch-ib svg{width:18px;height:18px;stroke:var(--text);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ch-ttl{flex:1;min-width:0;padding-left:4px}
.ch-l1{display:flex;align-items:baseline;gap:10px;font-size:22px;font-weight:700;line-height:26px;white-space:nowrap}
.ch-l2{font-size:14px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-chips{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;align-items:center}
.ch-chips .chip{height:26px;padding:0 10px;white-space:nowrap}
.ch-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.ch-cols{display:flex;gap:10px;align-items:flex-start}
.ch-pf{padding:0;overflow:hidden}
.ch-pf svg{display:block}
.ch-ev{padding:9px 12px 10px;border-top:1px solid var(--line);font-size:14px;line-height:1.35;color:var(--dim)}
.ch-ev b{color:var(--text);font-weight:600}
.ch-ev .ok{color:var(--accent)} .ch-ev .warn{color:var(--warn)}
#main{min-width:0}
.ch-held{font-size:12px;font-weight:600;padding:0 4px;white-space:nowrap}

/* order sheet (od-). Placement lives in base.css. */
.od-wrap{display:flex;flex-direction:column;min-height:100%}
.od-body{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0}
.od-title{font-size:16px;line-height:24px}
.od-fr{display:flex;align-items:center;gap:8px}
.od-k{flex:none;width:34px;font-size:12px;color:var(--dim)}
.od-fr>.seg,.od-stp,.od-chips{flex:1;min-width:0}
.od-wrap .seg>button{height:48px;white-space:nowrap;padding:0 2px;font-size:14px}
.od-wrap .seg>button.on{background:rgba(61,139,253,.16);box-shadow:inset 0 0 0 1px var(--x)}
.od-line{font-size:12px;line-height:16px}
.od-line.ok{color:var(--accent)} .od-line.warn{color:var(--warn)}
.od-sm{font-size:11px}
.od-stp{display:flex;gap:8px}
.od-stp .btn{flex:none;width:56px;height:48px;padding:0;font-size:22px;line-height:1}
.od-qty{flex:1;text-align:center;font-size:20px;font-weight:700;height:48px;line-height:46px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.od-chips{display:flex;gap:8px}
.od-chips button{flex:1;height:48px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface2);color:var(--text);font:600 14px var(--sans)}
.od-est .row{padding:0;min-height:30px;align-items:center;font-size:14px}
.od-msg{flex:0 0 100%;font-size:13px;font-weight:600}
.od-msg:empty{display:none}
.od-bar{flex-wrap:wrap;position:sticky;bottom:0;margin:6px -12px -12px;padding:8px 12px 12px;background:var(--surface)}
.od-bar .btn{height:52px}
.od-bar .btn.outline,.od-bar .btn.primary{flex:1}
/* integrator: wide side panel at 568 tall must show every row above the sticky bar */
body[data-layout=wide] .od-body{gap:4px}
body[data-layout=wide] .od-title{font-size:15px;line-height:20px}
body[data-layout=wide] .od-est .row{min-height:22px;font-size:13px}
body[data-layout=wide] .od-line{font-size:11px;line-height:14px}
body[data-layout=wide] .od-bar{margin-top:4px;padding-top:6px;padding-bottom:8px}

/* week.css [S3] */
.sheet.wk-on,body.sheet-week .sheet{display:flex;flex-direction:column;padding:0}
.wk-body{display:flex;flex-direction:column;gap:10px;padding:10px 12px 4px}
.wk-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wk-head h1{font-size:20px;margin:0;font-weight:700}
.wk-h{margin:0 0 6px;font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.wk-eqrow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wk-big{font-size:26px;font-weight:700}
.wk-d{margin-left:auto;font-weight:600;text-align:right}
.wk-kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:6px}
.wk-kv:first-of-type{margin-top:8px}
.wk-track{position:relative;height:6px;border-radius:3px;background:var(--surface2);margin:8px 0 2px;overflow:hidden}
.wk-track i{position:absolute;left:0;top:0;bottom:0;background:var(--x);border-radius:3px}
.wk-flag{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;padding:8px 10px;border-radius:8px;font-size:13px;border:1px solid}
.wk-flag.warn{color:var(--warn);border-color:var(--warn)}
.wk-flag.bad{color:var(--bad);border-color:var(--bad)}
.wk-mv{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 0;border-bottom:1px solid var(--line)}
.wk-mv:last-child{border-bottom:0}
.wk-l1{display:flex;align-items:baseline;gap:8px;min-width:0}
.wk-code{font-weight:700;font-size:15px;min-width:42px}
.wk-r1{text-align:right}
.wk-l2{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--dim);align-items:center}

"use strict";
/* ---------- seeded RNG ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0,v=0;while(!u)u=r();v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

/* ---------- tweaks ---------- */
const DEFAULTS={startCash:10000,weeks:10,preWeeks:50,mandate:3,floorPct:10,warnPct:7,capPct:50,feePct:0.5,boxPct:2,reversal:3,volMin:2.5,volMax:6,driftSpread:0.6,mktWeight:0.5,baselineWindows:200,dataSrc:1};
const TWEAK_LABELS={startCash:"Start cash",weeks:"Weeks per period",preWeeks:"Pre-history weeks",mandate:"Mandate (pts over bench)",floorPct:"Floor (% down)",warnPct:"Warn (% down)",capPct:"Per-stock cap %",feePct:"Fee % per side",boxPct:"Box size %",reversal:"Reversal boxes",volMin:"Weekly vol min %",volMax:"Weekly vol max %",driftSpread:"Drift spread %/wk",mktWeight:"Market factor weight",baselineWindows:"Baseline windows",dataSrc:"Data (1 real, 0 stand-in)"};
let T=Object.assign({},DEFAULTS);
try{const s=localStorage.getItem("pfdesk.tweaks");if(s)Object.assign(T,JSON.parse(s))}catch(e){}
function tweaked(){return Object.keys(DEFAULTS).some(k=>+T[k]!==DEFAULTS[k])}
/* ---------- indicators ---------- */
function ema(a,n){const k=2/(n+1);let e=a[0],o=[];for(const x of a){e=x*k+e*(1-k);o.push(e)}return o}
function rsi(c,n=14){const o=[50];let ag=0,al=0;for(let i=1;i<c.length;i++){const d=c[i]-c[i-1],g=Math.max(d,0),l=Math.max(-d,0);
  if(i<=n){ag+=g/n;al+=l/n}else{ag=(ag*(n-1)+g)/n;al=(al*(n-1)+l)/n}o.push(al===0?100:100-100/(1+ag/al))}return o}
function macd(c){const f=ema(c,12),s=ema(c,26),m=f.map((x,i)=>x-s[i]),sg=ema(m,9);return{m,sg,h:m.map((x,i)=>x-sg[i])}}
function sma(c,n){return c.map((_,i)=>{const a=c.slice(Math.max(0,i-n+1),i+1);return a.reduce((s,x)=>s+x,0)/a.length})}

</script>
<script>
"use strict";
/* ---------- data layer (stand-in seeded market) ---------- */
// load(window) -> {codes, bars:[[{o,h,l,c,v}]], hidden:[[bars]]}. Swap source here for real data.
function genSeries(r,n,mkt,startPrice){
  const vol=(T.volMin+(T.volMax-T.volMin)*r())/100, drift=(r()*2-1)*T.driftSpread/100+0.001, w=T.mktWeight;
  let p=startPrice,bars=[],vb=1e5*(0.5+r()*2);
  for(let i=0;i<n;i++){const ret=drift+vol*(w*mkt[i]+Math.sqrt(1-w*w)*gauss(r));const o=p,c=Math.max(0.5,p*Math.exp(ret));
    const h=Math.max(o,c)*(1+Math.abs(gauss(r))*vol*0.45),l=Math.min(o,c)*(1-Math.abs(gauss(r))*vol*0.45);
    const v=vb*(1+Math.abs(ret)*12)*Math.exp(gauss(r)*0.25);bars.push({o,h,l,c,v});p=c}
  return bars}
function codeFor(r,used){const A="ABCDEFGHJKLMNPRSTUVWXYZ";let c;do{c=A[r()*23|0]+A[r()*23|0]+A[r()*23|0]}while(used.has(c));used.add(c);return c}
function standinWindow(seed){
  const r=mulberry32(seed),n=T.preWeeks+T.weeks,mkt=[];for(let i=0;i<n;i++)mkt.push(gauss(r));
  const used=new Set(),codes=[],bars=[],hidden=[];
  for(let i=0;i<6;i++){codes.push(codeFor(r,used));bars.push(genSeries(r,n,mkt,20+r()*180))}
  for(let i=0;i<30;i++)hidden.push(genSeries(r,n,mkt,20+r()*180));
  return{codes,bars,hidden,src:"standin"}}

/* ---------- real history (data/weekly.json v1) ---------- */
let DATA=null,_covN=-1,_covS=null;
async function loadData(){
  try{
    const res=await fetch("data/weekly.json");if(!res.ok)return;
    const j=await res.json();if(!j||j.v!==1||!Array.isArray(j.series))return;
    const series=[];
    for(const s of j.series){
      const len=s.c.length;let u=0;const bars=new Array(len);
      for(let i=0;i<len;i++){
        u+=s.c[i];const c=Math.exp(u/2000);
        let o=Math.exp((u+s.o[i])/2000),h=Math.exp((u+s.h[i])/2000),l=Math.exp((u+s.l[i])/2000);
        if(!(c>0&&o>0&&h>0&&l>0))throw 0;
        bars[i]={o,h:Math.max(h,o,c),l:Math.min(l,o,c),c,v:Math.exp(s.v[i]/100)-1};
      }
      series.push({id:s.id,k:s.k,f:s.f,bars});
    }
    DATA={nW:j.nW,series,ev:j.ev||null};_covN=-1;_covS=null;
  }catch(e){DATA=null}
}
function dataSource(){return(T.dataSrc===1&&DATA)?"real":"standin"}
// per window length n: stock series indices usable per start week + list of start weeks with >=36 covering (cached; admin default)
function _coverage(n){
  if(_covN===n&&_covS)return _covS;
  const cnt=new Int32Array(DATA.nW+2),st=[];
  DATA.series.forEach((s,i)=>{if(s.k!=="stock")return;st.push(i);const a=s.f,b=s.f+s.bars.length-n;if(b>=a){cnt[a]++;cnt[b+1]--}});
  const starts=[];let run=0;
  for(let w=0;w<DATA.nW;w++){run+=cnt[w];if(run>=36)starts.push(w)}
  _covN=n;_covS={starts,st};return _covS}
function _median(a){const b=a.slice().sort((x,y)=>x-y);return b[b.length>>1]}
function realWindow(seed){
  const n=T.preWeeks+T.weeks,cv=_coverage(n);
  if(!cv.starts.length)return null;
  const r=mulberry32(seed),s=cv.starts[r()*cv.starts.length|0];
  const pool=cv.st.filter(i=>{const d=DATA.series[i];return d.f<=s&&s+n<=d.f+d.bars.length});
  for(let i=pool.length-1;i>0;i--){const j=r()*(i+1)|0,t=pool[i];pool[i]=pool[j];pool[j]=t}
  const pick=pool.slice(0,36),out=[];
  for(const idx of pick){
    const d=DATA.series[idx],src=d.bars.slice(s-d.f,s-d.f+n);
    const pf=(20+r()*180)/src[T.preWeeks-1].c,vm=_median(src.map(b=>b.v)),vf=1e5*(0.5+r()*2)/(vm>0?vm:1);
    out.push(src.map(b=>({o:b.o*pf,h:b.h*pf,l:b.l*pf,c:b.c*pf,v:b.v*vf})));
  }
  const used=new Set(),codes=[];for(let i=0;i<6;i++)codes.push(codeFor(r,used));
  const bars=out.slice(0,6),hidden=out.slice(6);
  if(hidden.length<30){const mkt=[];for(let i=0;i<n;i++)mkt.push(gauss(r));
    while(bars.length<6)bars.push(genSeries(r,n,mkt,20+r()*180));
    while(hidden.length<30)hidden.push(genSeries(r,n,mkt,20+r()*180))}
  return{codes,bars,hidden,src:"real"}}
function loadWindow(seed){
  if(dataSource()==="real"){try{const w=realWindow(seed);if(w)return w}catch(e){}}
  return standinWindow(seed)}

</script>
<script>
"use strict";
/* ---------- point and figure (percent box, high/low, N-box reversal) ---------- */
const LB=()=>Math.log(1+T.boxPct/100);
const boxOf=p=>Math.floor(Math.log(p)/LB()+1e-9), boxUp=p=>Math.ceil(Math.log(p)/LB()-1e-9);
const priceOf=b=>Math.exp(b*LB());
function pnf(bars){ // columns [{d:1|-1,lo,hi,wk:{box:barIndex}}]
  const R=T.reversal,cols=[];let c=null;
  bars.forEach((b,i)=>{const hb=boxOf(b.h),lb=boxUp(b.l);
    if(!c){const d=b.c>=b.o?1:-1;c={d,lo:boxUp(b.l),hi:boxOf(b.h),wk:{}};if(c.lo>c.hi)c.lo=c.hi;for(let k=c.lo;k<=c.hi;k++)c.wk[k]=i;cols.push(c);return}
    if(c.d===1){ if(hb>c.hi){for(let k=c.hi+1;k<=hb;k++)c.wk[k]=i;c.hi=hb}
      else if(lb<=c.hi-R){c={d:-1,hi:c.hi-1,lo:lb,wk:{}};for(let k=c.lo;k<=c.hi;k++)c.wk[k]=i;cols.push(c)} }
    else { if(lb<c.lo){for(let k=lb;k<c.lo;k++)c.wk[k]=i;c.lo=lb}
      else if(hb>=c.lo+R){c={d:1,lo:c.lo+1,hi:hb,wk:{}};for(let k=c.lo;k<=c.hi;k++)c.wk[k]=i;cols.push(c)} }
  });return cols}
function pnfSignal(cols){ // last signal + pattern name
  let sig=null;
  for(let i=2;i<cols.length;i++){const c=cols[i],p=cols[i-2],pp=cols[i-4];
    if(c.d===1&&c.hi>p.hi)sig={buy:true,name:(pp&&pp.hi===p.hi)?"TRIPLE-TOP BUY":"DOUBLE-TOP BUY",col:i};
    if(c.d===-1&&c.lo<p.lo)sig={buy:false,name:(pp&&pp.lo===p.lo)?"TRIPLE-BOTTOM SELL":"DOUBLE-BOTTOM SELL",col:i}}
  return sig}
function vcount(cols){ // vertical count from latest X column (up) / O column (down)
  let bx=null,bo=null;for(let i=cols.length-1;i>=0;i--){if(!bx&&cols[i].d===1)bx=cols[i];if(!bo&&cols[i].d===-1)bo=cols[i]}
  return{up:bx?{n:bx.hi-bx.lo+1,base:bx.lo,tgt:bx.lo+(bx.hi-bx.lo+1)*T.reversal}:null,
         dn:bo?{n:bo.hi-bo.lo+1,base:bo.hi,tgt:bo.hi-(bo.hi-bo.lo+1)*T.reversal}:null}}
function pnfTrend(cols){ // Dorsey 45-degree line: {kind,col,box}|null  (box = start box at col)
  const n=cols.length;if(!n)return null;const st=Math.max(0,n-20);
  let oc=-1,xc=-1;
  for(let k=st;k<n;k++){const c=cols[k];
    if(c.d===-1&&(oc<0||c.lo<=cols[oc].lo))oc=k; // lowest O, latest on ties
    if(c.d===1&&(xc<0||c.hi>=cols[xc].hi))xc=k}  // highest X, latest on ties
  if(oc<0)return null;
  const b0=cols[oc].lo-1;let broken=false;
  for(let k=oc+1;k<n;k++)if(cols[k].lo<b0+(k-oc)){broken=true;break}
  if(!broken)return{kind:"support",col:oc,box:b0};
  if(xc<0)return null;
  return{kind:"resist",col:xc,box:cols[xc].hi+1}}
function pnfTraps(cols){ // [{col,kind:"bull"|"bear"}] 1-box breakout, next column reverses
  const out=[];
  for(let i=2;i<cols.length-1;i++){const c=cols[i],p=cols[i-2],nx=cols[i+1];
    if(c.d===1&&c.hi-p.hi===1&&nx.d===-1)out.push({col:i,kind:"bull"});
    else if(c.d===-1&&p.lo-c.lo===1&&nx.d===1)out.push({col:i,kind:"bear"})}
  return out}
function pfText(i,opt){
  opt=opt||{};const all=i.cols,lastBar=i.b.length-1;
  const inH=typeof window!=="undefined"?window.innerHeight:800;
  const maxC=Math.max(1,opt.cols||15),rows=Math.max(3,opt.rows||(inH<700?13:17));
  // most recent K<=maxC columns whose full box range fits in rows (admin default: min 1 column)
  let K=0,lo=Infinity,hi=-Infinity;
  for(let k=all.length-1;k>=0&&K<maxC;k--){const l=Math.min(lo,all[k].lo),h=Math.max(hi,all[k].hi);
    if(h-l+1>rows)break;lo=l;hi=h;K++}
  let f=1;
  if(K===0){const c=all[all.length-1];K=1;lo=c.lo;hi=c.hi;f=Math.ceil((hi-lo+1)/rows)} // compress: every f-th box
  const off=all.length-K,show=all.slice(off);
  const tr=pnfTrend(all),traps=pnfTraps(all).filter(t=>t.col>=off);
  let out="",r=0;const dp=priceOf(hi)<100?1:0; // one label precision per chart
  for(let b=hi;b>=lo;b-=f,r++){
    const p=priceOf(b),lab=((f>1?r%2===0:b%2===0)?p.toFixed(dp):"").padStart(5);let line=lab+"|";
    show.forEach((c,j)=>{const g=off+j;let ch=" ";
      if(b>=c.lo&&b<=c.hi){const s=c.d===1?"X":"O";
        ch=c.wk[b]===lastBar?`<span class="new">${s}</span>`:`<span class="${c.d===1?"x":"o"}">${s}</span>`}
      else if(tr&&g>=tr.col){const lb=tr.kind==="support"?tr.box+(g-tr.col):tr.box-(g-tr.col);
        if(lb===b||(f>1&&lb<b&&lb>b-f))ch='<span class="tl">+</span>'}
      line+=" "+ch});
    out+=line+"\n"}
  out+=(f>1?("1:"+f).padStart(5):"     ")+"+"+"-".repeat(show.length*2);
  if(traps.length){let row="      ";
    show.forEach((c,j)=>{const t=traps.find(x=>x.col===off+j);row+=t?(t.kind==="bull"?"BT":"bt"):"  "});
    out+="\n"+row;
    const W=6+show.length*2,fit=t=>t.slice(0,W).padEnd(W),k1="BT bull trap  bt bear trap",k2="BT=bull trap bt=bear trap";
    if(W>=k1.length)out+="\n"+fit(k1);else if(W>=k2.length)out+="\n"+fit(k2);
    else out+="\n"+fit("BT=bull trap")+"\n"+fit("bt=bear trap")}
  return out}
/* ---------- signal info (UI v2) ---------- */
function sigInfo(cols){ // {name|null,buy,dir,col,age,fresh,reversed,trap}
  const none={name:null,buy:false,dir:0,col:null,age:null,fresh:false,reversed:false,trap:null};
  if(!cols||!cols.length)return none;
  const s=pnfSignal(cols);if(!s)return none;
  const n=cols.length,age=n-1-s.col,ref=cols[s.col-2];let reversed=false;
  for(let j=s.col+1;j<n;j++){const c=cols[j];
    if(s.buy&&c.d===-1&&ref&&c.lo<=ref.hi)reversed=true;
    if(!s.buy&&c.d===1&&ref&&c.hi>=ref.lo)reversed=true}
  const t=pnfTraps(cols).find(x=>x.col===s.col),trap=t?t.kind:null;
  return{name:s.name,buy:s.buy,dir:s.buy?1:-1,col:s.col,age,fresh:age<=1&&!reversed,reversed,trap}}
function sigLabel(name){
  if(!name)return"No signal";
  const t=String(name).toLowerCase().replace(/-/g," ");return t.charAt(0).toUpperCase()+t.slice(1)}

</script>
<script>
"use strict";
/* ---------- evidence calculator (hit shares of P&F patterns / indicator states vs same-direction base) ---------- */
let EV=null;
const EV_PAT=[["DOUBLE-TOP BUY",1],["TRIPLE-TOP BUY",1],["DOUBLE-BOTTOM SELL",-1],["TRIPLE-BOTTOM SELL",-1],["BULL TRAP",-1],["BEAR TRAP",1]];

function computeEvidence(list,start,offs){

        }

function _ev(){try{return typeof evNow==="function"?evNow():null}catch(e){return null}}

}
function _closed(calls){return(calls||[]).filter(c=>c&&(c.res==="right"||c.res==="wrong")&&(c.view===1||c.view===-1))}
function callStats(calls,nLife){
  const cl=_closed(calls),n=cl.length;
  let right=0,exp=0,v=0;

}

/* ---------- baseline: no-read bots over locked seeded windows ---------- */
// score = mandate met (excess over benchmark >= T.mandate) and floor never hit. Windows: loadWindow(1e6+w*7919).
function baseline(){
  const n=T.baselineWindows,res={cash:0,rand:0,lock:0,signal:0},i0=T.preWeeks-1,iN=T.preWeeks+T.weeks-1;let src="standin";
  const pc=(a,b)=>(a/b-1)*100;
  for(let w=0;w<n;w++){const W=loadWindow(1e6+w*7919);src=W.src||src;const B=W.bars;
    const bRet=B.reduce((s,b)=>s+b[iN].c/b[i0].c,0)/6*100-100;
    // cash: idle, never hits floor, excess = -bench
    if(0-bRet>=T.mandate)res.cash++;
    // lock: equal-weight copy of benchmark, 0 excess, fails mandate by construction (admin default: 0>=mandate only if mandate<=0)
    if(0>=T.mandate)res.lock++;
    const run=(pick)=>{let cash=T.startCash;const pos=[0,0,0,0,0,0];
      for(let i=i0;i<iN;i++){const eq=cash+pos.reduce((s,q,k)=>s+q*B[k][i].c,0);
        if(eq<=T.startCash*(1-T.floorPct/100))return false;
        pick(i,eq,(k,amt)=>{const px=B[k][i].c;amt=Math.min(amt,cash/(1+T.feePct/100),eq*T.capPct/100-pos[k]*px);
          if(amt>50){pos[k]+=amt/px;cash-=amt*(1+T.feePct/100)}},
          k=>{const px=B[k][i].c;if(pos[k]>0){cash+=pos[k]*px*(1-T.feePct/100);pos[k]=0}})}
      const eqN=cash+pos.reduce((s,q,k)=>s+q*B[k][iN].c,0);
      return pc(eqN,T.startCash)-bRet>=T.mandate};
    const r=mulberry32(w+17);
    if(run((i,eq,buy)=>{if(r()<0.5){const k=r()*6|0;buy(k,eq/6)}}))res.rand++;
    const sigAt=(k,i)=>{const cols=pnf(B[k].slice(0,i+1));const s=pnfSignal(cols);return s&&s.col===cols.length-1?s.name+":"+s.col+":"+(s.buy?1:0):""};
    if(run((i,eq,buy,sell)=>{const sells=[],buys=[];
      for(let k=0;k<6;k++){const now=sigAt(k,i),prev=i>0?sigAt(k,i-1):"";if(now&&now!==prev){if(now.endsWith(":1"))buys.push(k);else sells.push(k)}}
      sells.forEach(sell);buys.forEach(k=>buy(k,eq/6))}))res.signal++}
  const p=x=>Math.round(100*x/n);
  return{n,src,cash:p(res.cash),rand:p(res.rand),lock:p(res.lock),signal:p(res.signal)}}

function baselineCached(){
  let key;try{key="st.base."+JSON.stringify(T)+"|"+(typeof dataSource==="function"?dataSource():"")}catch(e){return baseline()}
  if(_baseMem[key])return _baseMem[key];
  try{const s=localStorage.getItem(key);if(s){const o=JSON.parse(s);if(o&&o.n){_baseMem[key]=o;return o}}}catch(e){}

const sg2=x=>(x>=0?"+":"")+x.toFixed(2);
const $=id=>document.getElementById(id);
function pathOf(a,w,h,lo,hi){const d=hi-lo||1;return a.map((v,i)=>(i?"L":"M")+(i*w/(a.length-1||1)).toFixed(1)+" "+(h-(v-lo)/d*h+2).toFixed(1)).join(" ")}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

const SCREENS={}, SHEETS={};

function devBadge(){
  const t=(typeof tweaked==="function"&&tweaked())?"DEV* ":"DEV ";
  return `<button class="dev num" id="devBadge" onclick="openTweaks()">${t}${esc(typeof S!=="undefined"?S.seed:"")}</button>`}
function topBar(title,sub,right){
  return `<div class="top"><h1>${esc(title)}</h1>${sub?`<span class="sub">${esc(sub)}</span>`:""}<span class="top-r">${right||""}${/id="devBadge"/.test(right||"")?"":devBadge()}</span></div>`}
function layout(){
  const w=window.innerWidth,h=window.innerHeight;
  if(w<600)return"cover";
  if(w>=760&&w>h)return"wide";
  return"tall"}

let _lastToast=null,_toastT=0;
function showToast(){
  const t=$("toast");if(!t)return;
  const m=S.lastMsg;
  if(m===_lastToast)return;
  _lastToast=m;
  if(!m){t.classList.remove("on");return}
  t.textContent=m;t.classList.add("on");
  clearTimeout(_toastT);_toastT=setTimeout(()=>t.classList.remove("on"),2500)}

function fallback(kind,name){return`<div class="card dim">${kind} "${esc(name)}" is not available.</div>`}
function render(){
  if(typeof S==="undefined"||!S)return;
  const b=document.body;
  b.dataset.layout=layout();
  let sc=null,sh=null;
  try{const f=SCREENS[S.screen];sc=f?f():{top:topBar("Stock Terminal"),main:fallback("Screen",S.screen),bar:""}}
  catch(e){sc={top:topBar("Stock Terminal"),main:`<div class="card warn">Screen error: ${esc(e&&e.message)}</div>`,bar:""}}
  $("top").innerHTML=sc.top||"";$("main").innerHTML=sc.main||"";$("bar").innerHTML=sc.bar||"";
  const names=["order","week"];
  names.forEach(n=>b.classList.remove("sheet-"+n));
  if(S.sheet){
    try{const f=SHEETS[S.sheet];sh=f?f():{html:fallback("Sheet",S.sheet)}}
    catch(e){sh={html:`<div class="card warn">Sheet error: ${esc(e&&e.message)}</div>`}}
    const sheetEl=$("sheet"),prev=sheetEl.scrollTop;
    sheetEl.innerHTML=sh.html||"";sheetEl.scrollTop=prev;
    b.classList.add("sheet-on","sheet-"+S.sheet)}
  else{b.classList.remove("sheet-on");$("sheet").innerHTML=""}
  showToast()}

</script>
<script>
"use strict";
/* ---------- drawn point-and-figure (SVG) ---------- */
let _pfUid=0;
const _pfn=v=>+(+v).toFixed(1);
function _pfPrice(p,dp){ // fixed precision, thousands comma
  const s=p.toFixed(dp);if(p<1000)return s;
  const a=s.split(".");a[0]=a[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");return a.join(".")}
function _pfDp(p){return p<10?2:p<100?1:0}
// choose which columns/rows to show: last K columns whose box range fits, compress factor f
function _pfFit(all,maxC,rows){
  const L=all.length;if(!L)return null;
  let f=1;const last=all[L-1],n=last.hi-last.lo+1;
  while(Math.floor((n-1)/f)+1>rows)f++;
  const run=f=>{let K=0,lo=Infinity,hi=-Infinity;
    for(let k=L-1;k>=0&&K<maxC;k--){const l=Math.min(lo,all[k].lo),h=Math.max(hi,all[k].hi);
      if(Math.floor((h-l)/f)+1>rows)break;lo=l;hi=h;K++}
    return{K,lo,hi}};
  let r=run(f);
  // admin default: too few columns fit -> compress up to 1:3 so the chart keeps context
  const want=Math.min(maxC,L,5);
  while(r.K<want&&f<3){f++;r=run(f)}
  const K=r.K,lo=r.lo,hi=r.hi,used=Math.floor((hi-lo)/f)+1,free=Math.max(0,rows-used);
  return{f,K,off:L-K,lo,hi,used,above:Math.ceil(free/2),below:Math.floor(free/2)}}
function _pfXO(c,x,y,cs,isNew,mini){
  const ins=mini?1:3,sw=mini?1.2:1.8,col=c.d===1?"var(--x)":"var(--o)";let s="";
  if(isNew)s+=`<rect x="${_pfn(x+.5)}" y="${_pfn(y+.5)}" width="${cs-1}" height="${cs-1}" fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="1"/>`;
  if(c.d===1)s+=`<path d="M${_pfn(x+ins)} ${_pfn(y+ins)}L${_pfn(x+cs-ins)} ${_pfn(y+cs-ins)}M${_pfn(x+cs-ins)} ${_pfn(y+ins)}L${_pfn(x+ins)} ${_pfn(y+cs-ins)}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" fill="none"/>`;
  else s+=`<circle cx="${_pfn(x+cs/2)}" cy="${_pfn(y+cs/2)}" r="${_pfn((cs-2*ins)/2)}" stroke="${col}" stroke-width="${sw}" fill="none"/>`;
  return s}
// grid + columns; returns svg fragments. g={x0,y0,cs,rows,K,off,f,topBox,all,lastBar}
function _pfBody(g,mini){
  const{x0,y0,cs,rows,K,off,f,topBox,all,lastBar}=g,first=g.first||0,gw=K*cs,gh=rows*cs;let s="",gp="";
  for(let r=0;r<=rows;r++)gp+=`M${x0} ${_pfn(y0+r*cs)}H${x0+gw}`;
  for(let c=0;c<=K;c++)gp+=`M${_pfn(x0+c*cs)} ${y0}V${y0+gh}`;
  s+=`<path d="${gp}" stroke="var(--grid)" stroke-width="1" fill="none"/>`;
  for(let j=0;j<K;j++){const c=all[off+j];if(!c||off+j<first)continue;
    const r0=Math.floor((topBox-c.hi)/f),r1=Math.floor((topBox-c.lo)/f);
    for(let r=Math.max(0,r0);r<=Math.min(rows-1,r1);r++){
      let nw=false;const bt=topBox-r*f;
      for(let b=bt-f+1;b<=bt;b++)if(b>=c.lo&&b<=c.hi&&c.wk[b]===lastBar)nw=true;
      s+=_pfXO(c,x0+j*cs,y0+r*cs,cs,nw,mini)}}
  return s}

function pfSVG(i,opt){
  opt=opt||{};const w=Math.max(120,Math.round(opt.w||320)),h=Math.max(100,Math.round(opt.h||280));
  const cs=opt.cell||(w<600?15:14),axisW=46,axH=18,chipH=22;
  const all=(i&&i.cols)||[],si=(i&&i.si)||sigInfo(all);
  const uid="pf"+(++_pfUid);
  const px=i&&i.c&&i.c.length?i.c[i.c.length-1]:(i&&i.b&&i.b.length?i.b[i.b.length-1].c:null);
  const lastBar=i&&i.b?i.b.length-1:-1;
  const tgt=opt.tgt>0?+opt.tgt:null;
  const aria=`Point and figure chart, ${all.length} columns`;
  const head=`<svg id="pf" xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${aria}" font-family="var(--sans)" style="display:block;font-variant-numeric:tabular-nums">`;
  if(!all.length)return head+`<text x="${w/2}" y="${h/2}" text-anchor="middle" font-size="11" fill="var(--dim)">No data</text></svg>`;
  const maxC=Math.max(1,Math.floor((w-axisW)/cs));
  const layout=(top,bot)=>{const rows=Math.max(3,Math.floor((h-top-axH-bot)/cs));return{rows,top,bot,fit:_pfFit(all,maxC,Math.max(1,rows-2))}};
  const onScale=(L)=>{ // is target inside the visible rows?
    if(tgt==null)return null;const f=L.fit,topBox=f.hi+f.above*f.f,u=Math.log(tgt)/LB();
    const y=(topBox+1-u)/f.f;return y>=0&&y<=L.rows?true:(y<0?"up":"down")};
  let L=layout(2,0),os=onScale(L);
  if(os==="up")L=layout(chipH+2,0);else if(os==="down")L=layout(2,chipH);
  os=onScale(L);
  const F=L.fit,f=F.f,rows=L.rows,K=F.K,off0=F.off,off=all.length-maxC,topBox=F.hi+F.above*f; // integrator: right-align columns to the axis
  const x0=0,y0=L.top,gw=maxC*cs,gh=rows*cs,K0=K;
  const g={x0,y0,cs,rows,K:maxC,off,first:off0,f,topBox,all,lastBar};
  let s=head;
  s+=`<defs><clipPath id="${uid}c"><rect x="${x0}" y="${y0}" width="${gw}" height="${gh}"/></clipPath></defs>`;
  s+=_pfBody(g,false);
  const yOfU=u=>y0+(topBox+1-u)/f*cs;
  const rowOf=b=>Math.floor((topBox-b)/f);
  const halo=`stroke="var(--surface)" stroke-width="3" paint-order="stroke" stroke-linejoin="round"`;
  // trend line (only through empty cells)
  const tr=pnfTrend(all);
  if(tr&&tr.col+0<all.length){
    const sup=tr.kind==="support";let d="",cnt=0,lastPt=null;
    for(let gi=Math.max(tr.col,off0);gi<all.length;gi++){
      const c=all[gi],b=sup?tr.box+(gi-tr.col):tr.box-(gi-tr.col),j=gi-off;
      const r=rowOf(b);if(r<0||r>=rows)continue;
      if(b>=c.lo&&b<=c.hi)continue; // occupied
      if(f>1){const bt=topBox-r*f;if(!(c.hi<bt-f+1||c.lo>bt))continue}
      const xl=x0+j*cs,xr=xl+cs,yb=yOfU(b),yt=yOfU(b+1);
      d+=sup?`M${_pfn(xl)} ${_pfn(yb)}L${_pfn(xr)} ${_pfn(yt)}`:`M${_pfn(xl)} ${_pfn(yt)}L${_pfn(xr)} ${_pfn(yb)}`;
      cnt++;lastPt={x:(xl+xr)/2,y:(yb+yt)/2}}
    if(d){
      s+=`<g clip-path="url(#${uid}c)"><path d="${d}" fill="none" stroke="${sup?"var(--accent)":"var(--o)"}" stroke-width="1.5" stroke-linecap="round"${sup?"":' stroke-dasharray="4 3"'}/></g>`;
      if(cnt>=4&&lastPt&&f===1){
        const nx=0.707,ny=sup?0.707:-0.707;
        // label sits on the empty side of the line, a few cells before the end
        const bx=lastPt.x-cs*0.5+nx*9,by=lastPt.y+(sup?cs*0.5:-cs*0.5)+ny*9;
        s+=`<text transform="translate(${_pfn(bx)} ${_pfn(by)}) rotate(${sup?-45:45})" text-anchor="end" font-size="11" fill="${sup?"var(--accent)":"var(--o)"}" ${halo}>${sup?"support":"resistance"}</text>`}}}
  const lbx=[]; // placed label boxes {x1,x2,y1,y2} for collision avoidance
  const lhit=(a,b)=>a.x1<b.x2&&b.x1<a.x2&&a.y1<b.y2&&b.y1<a.y2;
  // target
  if(tgt!=null){
    const tp=_pfPrice(tgt,_pfDp(tgt)),txt="Target "+tp;
    if(os===true){const y=_pfn(yOfU(Math.log(tgt)/LB()));
      s+=`<path d="M${x0} ${y}H${x0+gw}" stroke="var(--dim)" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>`;
      const ty=Math.max(y0+11,Math.min(y0+gh-3,+y-3));
      lbx.push({x1:x0+gw-3-txt.length*6.2,x2:x0+gw-3,y1:ty-10,y2:ty+3});
      s+=`<text x="${x0+gw-3}" y="${ty}" text-anchor="end" font-size="11" fill="var(--dim)" ${halo}>${txt}</text>`}
    else{const up=os==="up",cw=txt.length*6.2+30,cx=x0+gw-cw+axisW-6,cy=up?1:y0+gh+axH+1;
      const cxx=Math.max(2,Math.min(w-cw-2,cx));
      s+=`<rect x="${_pfn(cxx)}" y="${cy}" width="${_pfn(cw)}" height="${chipH-4}" rx="${(chipH-4)/2}" fill="var(--surface2)" stroke="var(--dim)" stroke-dasharray="3 2"/>`;
      s+=`<text x="${_pfn(cxx+cw/2)}" y="${cy+(chipH-4)/2+4}" text-anchor="middle" font-size="11" fill="var(--dim)">${txt} ${up?"▲":"▼"}</text>`}}
  // signal triangle
  const sigLbl=(t,cx,ty,j,col)=>{const wd=t.length*6.6+2;let st=j<2,y=ty+4,b;
    const mk=()=>({x1:st?cx+8:cx-8-wd,x2:st?cx+8+wd:cx-8,y1:y-10,y2:y+3});
    b=mk();
    if(lbx.some(o=>lhit(b,o))){st=!st;b=mk()} // try opposite side of the triangle
    for(const dy of [0,-12,12,-24,24]){if(!lbx.some(o=>lhit(b,o)))break;y=ty+4+dy;b=mk()}
    lbx.push(b);
    return `<text x="${_pfn(st?cx+8:cx-8)}" y="${_pfn(y)}" text-anchor="${st?"start":"end"}" font-size="11" font-weight="600" fill="${col}" ${halo}>${t}</text>`};
  if(si&&si.name&&si.col!=null&&si.col>=off0){
    const c=all[si.col],j=si.col-off,cx=x0+(j+.5)*cs,col=si.buy?"var(--x)":"var(--o)";
    if(si.buy){const r=rowOf(c.hi)-1;if(r>=0){const ty=y0+r*cs+cs/2;
      s+=`<path d="M${_pfn(cx)} ${_pfn(ty-5)}L${_pfn(cx+5)} ${_pfn(ty+4)}L${_pfn(cx-5)} ${_pfn(ty+4)}Z" fill="${col}"/>`;
      s+=sigLbl("Buy",cx,ty,j,col)}}
    else{const r=rowOf(c.lo)+1;if(r<rows){const ty=y0+r*cs+cs/2;
      s+=`<path d="M${_pfn(cx)} ${_pfn(ty+5)}L${_pfn(cx+5)} ${_pfn(ty-4)}L${_pfn(cx-5)} ${_pfn(ty-4)}Z" fill="${col}"/>`;
      s+=sigLbl("Sell",cx,ty,j,col)}}}
  // trap labels
  pnfTraps(all).forEach(t=>{if(t.col<off0)return;const c=all[t.col],j=t.col-off;
    const r=rowOf(c.lo)+1,y=Math.min(y0+gh-2,y0+(r+1)*cs-3),cx=Math.max(x0+10,Math.min(x0+gw-10,x0+(j+.5)*cs));
    s+=`<text x="${_pfn(cx)}" y="${_pfn(y)}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--warn)" ${halo}>trap</text>`});
  // right price axis
  const dp=_pfDp(priceOf(topBox)),pdp=px!=null&&px<100?2:0,ax=x0+gw;
  let py=null;if(px!=null)py=Math.max(y0+7,Math.min(y0+gh-7,yOfU(Math.log(px)/LB())));
  const aa=[];
  for(let r=0;r<rows;r++){const b=topBox-r*f,on=f===1?(((b%2)+2)%2===0):(r%2===0);if(!on)continue;
    const cy=y0+(r+.5)*cs;if(py!=null&&Math.abs(cy-py)<11)continue;
    aa.push(`<text x="${ax+6}" y="${_pfn(cy+4)}" font-size="11" fill="var(--dim)">${_pfPrice(priceOf(b),dp)}</text>`)}
  s+=aa.join("");
  if(py!=null){const pw=w-ax-4,pt=_pfPrice(px,pdp);
    s+=`<path d="M${ax} ${_pfn(py)}h3" stroke="var(--text)" stroke-width="1"/><rect x="${ax+3}" y="${_pfn(py-8)}" width="${pw}" height="16" rx="4" fill="var(--text)"/><text x="${_pfn(ax+3+pw/2)}" y="${_pfn(py+4)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--bg)">${pt}</text>`}
  // column axis
  const yb=y0+gh;
  let tk=`M${x0} ${yb}H${ax}`,lb="";
  for(let j=0;j<maxC;j++){const n=off+j+1;if(n<1||n%5!==0||j<2)continue;const cx=_pfn(x0+(j+1)*cs-cs/2);
    tk+=`M${cx} ${yb}v4`;lb+=`<text x="${cx}" y="${yb+15}" text-anchor="middle" font-size="11" fill="var(--dim)">${n}</text>`}
  s+=`<path d="${tk}" stroke="var(--line)" stroke-width="1" fill="none"/>`;
  s+=`<text x="${x0+2}" y="${yb+15}" font-size="11" fill="var(--dim)">col</text>`+lb;
  if(f>1)s+=`<text x="${ax+6}" y="${yb+15}" font-size="11" fill="var(--warn)">1:${f}</text>`;
  return s+"</svg>"}

function pfMini(i,opt){
  opt=opt||{};const w=Math.max(30,Math.round(opt.w||60)),h=Math.max(20,Math.round(opt.h||40)),cs=opt.cell||6;
  const all=(i&&i.cols)||[],lastBar=i&&i.b?i.b.length-1:-1;
  const head=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Mini point and figure chart" style="display:block">`;
  if(!all.length)return head+"</svg>";
  const rows=Math.max(2,Math.floor(h/cs)),maxC=Math.max(1,Math.min(8,Math.floor(w/cs)));
  const F=_pfFit(all,maxC,rows),f=F.f,topBox=F.hi+F.above*f;
  const x0=Math.floor((w-F.K*cs)/2),y0=Math.floor((h-rows*cs)/2);
  return head+_pfBody({x0,y0,cs,rows,K:F.K,off:F.off,f,topBox,all,lastBar},true)+"</svg>"}

function sigChip(si){
  si=si||{name:null};
  const lab=si.name?sigLabel(si.name):"",age=si.age==null?0:si.age;
  let h;
  if(!si.name)h=`<span class="chip stale">No signal</span>`;
  else if(si.fresh)h=`<span class="chip fresh ${si.buy?"buy":"sell"}">${lab} · ${age<=0?"this week":"last col"}</span>`;
  else h=`<span class="chip stale">${lab} · ${age} col${age===1?"":"s"} ago</span>`;
  if(si.trap)h+=` <span class="chip pf-trap">${si.trap==="bull"?"Bull":"Bear"} trap?</span>`;
  return h}

<script>
"use strict";
/* panes.js [C2]: indicator panes + small charts. Pure functions returning HTML strings.
   opt.w = SVG width in px (card inner width); opt.h = SVG height in px; opt.id = card id.
   Card height at defaults (344 wide): RSI 100 px, MACD 100 px, volume 86 px. */
const PN_AX=36;               // right axis column width, px
const PN_N=26;                // weeks shown
function pnEsc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function pnF(x){return (Math.round(x*10)/10).toString()}
function pnS(x,d){const v=+x.toFixed(d);return(v>0?"+":"")+v.toFixed(d)}
function pnCom(x){return Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function pnNice(x){if(!(x>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(x))),f=x/e;
  return(f<=1?1:f<=1.5?1.5:f<=2?2:f<=3?3:f<=4?4:f<=5?5:f<=6?6:f<=8?8:10)*e}
function pnDec(step){return step>=10?0:step>=1?1:step>=0.1?2:3}
function pnLast(a,n){a=Array.isArray(a)?a.filter(v=>typeof v==="number"&&isFinite(v)):[];return a.slice(-n)}
function pnPts(a,x,y,off){return a.map((v,j)=>x(j+off).toFixed(1)+","+y(v).toFixed(1)).join(" ")}
function pnPill(pw,W,y,H,txt,fill,ink){
  const h=15,yy=Math.max(h/2,Math.min(H-h/2,y));
  return`<rect x="${pw+3}" y="${(yy-h/2).toFixed(1)}" width="${W-pw-3}" height="${h}" rx="7.5" fill="${fill}"/>`
   +`<text x="${(pw+3+(W-pw-3)/2).toFixed(1)}" y="${yy.toFixed(1)}" text-anchor="middle" dominant-baseline="central" style="fill:${ink};font-weight:700">${pnEsc(txt)}</text>`}
function pnLab(pw,y,t){return`<text x="${pw+6}" y="${y.toFixed(1)}" dominant-baseline="central">${pnEsc(t)}</text>`}
function pnCard(id,head,val,svg,mid,W){
  return`<div class="card pn-card" id="${pnEsc(id)}"><div class="pn-h"><span class="pn-t">${head}</span><span class="pn-v num">${val}</span></div>`
   +`<svg class="pn-svg" width="${W}" height="${svg.h}" viewBox="0 0 ${W} ${svg.h}" role="img" aria-label="${pnEsc(svg.aria)}">${svg.body}</svg>`
   +`<div class="pn-ax num" style="padding-right:${PN_AX}px"><span>${PN_N} wks</span>${mid||""}<span>now</span></div></div>`}

function rsiPane(i,opt){
  opt=opt||{};const W=Math.max(120,Math.round(opt.w||296)),H=Math.round(opt.h||54),pw=W-PN_AX;
  const a=pnLast(i&&i.r,PN_N),off=PN_N-a.length,lo=20,hi=80,pad=6;
  const y=v=>pad+(hi-v)/(hi-lo)*(H-2*pad),x=j=>6+j*(pw-12)/(PN_N-1);
  const lastV=a.length?a[a.length-1]:null,ly=lastV==null?-99:y(lastV);
  let s=`<rect x="0" y="${y(70).toFixed(1)}" width="${pw}" height="${(y(30)-y(70)).toFixed(1)}" fill="var(--surface2)" fill-opacity=".55"/>`;
  [70,50,30].forEach(v=>{s+=`<line x1="0" x2="${pw}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--faint)" stroke-dasharray="${v===50?"1 4":"3 3"}"/>`;
    if(Math.abs(y(v)-ly)>=10)s+=pnLab(pw,y(v),v)});
  if(a.length>1)s+=`<polyline points="${pnPts(a,x,y,off)}" fill="none" stroke="var(--text)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  if(lastV!=null){s+=`<circle cx="${x(PN_N-1).toFixed(1)}" cy="${ly.toFixed(1)}" r="3" fill="var(--text)"/>`+pnPill(pw,W,ly,H,Math.round(lastV),"var(--text)","var(--bg)")}
  return pnCard(opt.id||"rsiCard",`RSI <i>14</i>`,lastV==null?"-":Math.round(lastV),{h:H,body:s,aria:"RSI 14, last "+(lastV==null?"n/a":Math.round(lastV))},"",W)}

function macdPane(i,opt){

  let ety=ey,bty=by;if(Math.abs(ety-bty)<13){const mid=(ety+bty)/2,d=ety<=bty?-1:1;ety=mid+d*7;bty=mid-d*7}

  const lg=`<div class="pn-lgd"><span class="pn-k pn-ka">Equity</span><span class="pn-k pn-kd">Benchmark</span><span class="pn-k pn-ko2">Floor</span></div>`;
  return`<div class="pn-eq">${lg}<svg class="pn-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Equity ${eh.length?pc(eh[eh.length-1]):""} vs benchmark ${bh.length?pc(bh[bh.length-1]):""}, floor ${pnCom(floorEq)}">${s}</svg></div>`}

function intervalChart(edge,lo,hi,verdict,o){

  const mxv=Math.max(5,Math.abs(edge||0),hasB?Math.abs(lo):0,hasB?Math.abs(hi):0)*1.12,R=pnNice(mxv)<mxv?pnNice(mxv*1.01):pnNice(mxv);

  s+=`<line x1="${X(0)}" x2="${X(0)}" y1="${by-12}" y2="${ay}" stroke="var(--text)" stroke-width="1.4" stroke-dasharray="3 3"/>`
   +`<text x="${X(0)-4}" y="9" text-anchor="end" style="fill:var(--text);font-weight:700">base</text>`;
  if(hasB){s+=`<rect x="${X(lo).toFixed(1)}" y="${by-7}" width="${Math.max(2,X(hi)-X(lo)).toFixed(1)}" height="14" rx="7" fill="var(--x)" fill-opacity=".3" stroke="var(--x)" stroke-width="1.4"/>`

  s+=`<text x="${W/2}" y="${H-3}" text-anchor="middle" style="fill:var(--text);font-weight:700">edge ${sg(edge||0)} calls · ${pnEsc(verdict||"")}</text>`;
  return`<svg class="pn-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Edge ${sg(edge||0)} calls${hasB?", band "+sg(lo)+" to "+sg(hi):""}: ${pnEsc(verdict||"")}">${s}</svg>`}

  if(two){const l=Math.floor((total-10)*0.56);pw=l;paneW=total-10-l;
    pfH=Math.max(160,Math.min(320,H0-chrome-evH))}
  else{pw=paneW=total;pfH=Math.max(160,Math.min(lay==="tall"?380:246,H0-chrome-evH-(hr+40)-(hm+40)-8))}
  const cw=pw-2;paneW=paneW-(two?0:0);
  const cell=lay==="cover"?15:14;
  const held=S.pos[k]>0,ac=held?chAvgCost(k):null;
  const up=chg>=0,sq=(k+5)%6,nx=(k+1)%6;
  const chev=d=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
  const top=topBar("Chart",`Week ${S.week} of ${T.weeks} · Equity ${fmt(equity())}`,devBadge());
  const head=`<div class="ch-hd">
    <button class="ch-ib" id="btnBack" aria-label="Back to home" onclick="go('home')">${chev("M15 5l-7 7 7 7")}</button>
    <div class="ch-ttl"><div class="ch-l1"><span>${esc(code)}</span><span class="num" id="chPx">${px.toFixed(2)}</span></div>
    <div class="ch-l2 num ${up?"up":"down"}">${up?"&#9650;":"&#9660;"} ${up?"+":""}${chg.toFixed(1)}% <span class="dim">this week</span>${held?` <span class="dim ch-held">&middot; held ${S.pos[k]} sh${ac?` @ ${ac.toFixed(0)}`:""}</span>`:""}</div></div>
    <button class="ch-ib" id="btnPrev" aria-label="Previous instrument ${esc(S.W.codes[sq])}" onclick="openChart(${sq})">${chev("M6 15l6-6 6 6")}<span>${esc(S.W.codes[sq])}</span></button>
    <button class="ch-ib" id="btnNext" aria-label="Next instrument ${esc(S.W.codes[nx])}" onclick="openChart(${nx})">${chev("M6 9l6 6 6-6")}<span>${esc(S.W.codes[nx])}</span></button></div>`;
  const chips=`<div class="ch-chips">${sigChip(i.si)}${held?`<span class="ch-held dim">Held ${S.pos[k]} sh${ac?` @ ${ac.toFixed(0)}`:""}</span>`:""}</div>`;
  const pf=`<div class="card ch-pf" id="pfCard">${pfSVG(i,{w:cw,h:pfH,cell,tgt})}<div class="ch-ev" id="evLine">${chEvLine(i)}</div></div>`;
  const panes=rsiPane(i,{w:paneW,h:hr,id:"rsiCard"})+macdPane(i,{w:paneW,h:hm,id:"macdCard"})+volPane(i,{w:paneW,h:hv,id:"volCard"});
  const main=`${head}${chips}`+(two?`<div class="ch-cols"><div class="ch-col" style="width:${pw}px">${pf}</div><div class="ch-col" style="width:${paneW}px">${panes}</div></div>`
    :`<div class="ch-col">${pf}${panes}</div>`);
  const bar=`<button class="btn outline" id="btnHome" onclick="go('home')">Home</button><button class="btn primary" id="btnTrade" onclick="openSheet('order')">Trade</button>`;
  return{top,main,bar}};

</script>
<script>
"use strict";
/* Order sheet (S2b). SHEETS.order() -> {html}. Classes od-*. */
SHEETS.order=function(){
  const k=S.sel,px=closeNow(k),eq=equity(),buy=S.side===1,q=S.qty;
  const view=S.views[k],code=S.W.codes[k],held=S.pos[k];
  const cost=q*px,fee=cost*T.feePct/100;
  const after=held+(buy?q:-q),capUse=eq>0?after*px/eq*100:0;
  const capOk=!buy||capUse<=T.capPct+1e-6; // admin default: cap only judged on buys
  const floorEq=T.startCash*(1-T.floorPct/100),floorOk=eq>floorEq;
  let si=null;try{si=stockInfo(k).si||null}catch(e){}
  let patLine="";
  if(si&&si.name){
    let p=null;try{p=evNow().pat[si.name]}catch(e){}
    const nm=si.name.replace(/ (BUY|SELL)$/,"");const lbl=nm.charAt(0)+nm.slice(1).toLowerCase();
    if(p)patLine=`<div class="od-line ${liftCls(p)}" id="patLine">${esc(lbl)}: followed through ${pctTxt(p.ft)} of ${Number(p.seen).toLocaleString("en-US")} seen, lift ${liftTxt(p.lift)} vs base</div>`;
  }
  let tgtTxt="No count yet";
  try{const vc=stockInfo(k).vc,t=view===-1?vc.dn:vc.up;
    if(t)tgtTxt=`${priceOf(t.tgt).toFixed(0)} <span class="dim od-sm">(${t.n} boxes × ${T.reversal} ${view===-1?"below":"above"} ${priceOf(t.base).toFixed(0)})</span>`}catch(e){}
  const seg=(id,on,fn,label)=>`<button id="${id}" class="${on?"on":""}" aria-pressed="${on}" onclick="${fn}">${label}${on?" &#10003;":""}</button>`;
  const vb=(id,v,l)=>seg(id,view===v,`setView(${v})`,l);
  const msg=S.lastMsg&&S.lastMsg.indexOf("Rejected")===0?S.lastMsg:"";
  const row=(l,v)=>`<div class="row"><span class="dim">${l}</span><span>${v}</span></div>`;
  const chk=(id,ok,txt,bad)=>`<div class="row od-chk" id="${id}"><span><span class="${ok?"ok":bad}">${ok?"&#10003;":"&#10007;"}</span> ${txt}</span><span class="${ok?"ok":bad}">${ok?"OK":"OVER"}</span></div>`;
  const html=`<div class="od-wrap"><div class="grab"></div>
  <div class="od-body">
  <div class="od-title"><b>Order · ${esc(code)} · held ${held} sh</b></div>
  <div class="od-fr"><span class="od-k">Side</span><div class="seg">${seg("sideBuy",buy,"S.side=1;S.qty=0;render()","Buy")}${seg("sideSell",!buy,"S.side=-1;S.qty=0;render()","Sell")}</div></div>
  <div class="od-fr"><span class="od-k">View</span><div class="seg">${vb("viewBull",1,"Bullish")}${vb("viewBear",-1,"Bearish")}${vb("viewNeut",0,"Neutral")}</div></div>
  <div class="od-line dim" id="baseLine">Base rate: bullish calls right ${pctTxt(baseFor(1))}, bearish ${pctTxt(baseFor(-1))} (this market)</div>
  ${patLine}${view==null?`<div class="od-line dim" id="noViewLine">No view logged for this order</div>`:""}
  <div class="od-fr"><span class="od-k">Qty</span><div class="od-stp"><button class="btn" id="qtyMinus" aria-label="Decrease" onclick="S.qty=Math.max(0,S.qty-step());render()">&minus;</button><span class="od-qty num" id="qtyVal">${q}</span><button class="btn" id="qtyPlus" aria-label="Increase" onclick="S.qty=Math.min(maxQty(),S.qty+step());render()">+</button></div></div>
  <div class="od-fr"><span class="od-k"></span><div class="od-chips"><button id="qty25" onclick="od_pct(.25)">25%</button><button id="qty50" onclick="od_pct(.5)">50%</button><button id="qtyMax" onclick="od_pct(1)">Max</button></div></div>
  <div class="od-est num">
   ${row("Est. price (week close)",px.toFixed(2))}
   ${row(buy?"Est. cost":"Est. proceeds",fmt(cost))}
   ${row("Fee "+T.feePct+"%",fmt(fee))}
   ${row("Position after",after+" sh = "+fmt(after*px))}
   ${chk("capCheck",capOk,`Cap ${capUse.toFixed(1)}% of ${T.capPct}%`,"warn")}
   ${chk("floorCheck",floorOk,`Floor: equity ${fmt(eq)}, floor ${fmt(floorEq)}`,"bad")}
   ${row("Target",tgtTxt)}
  </div>
  </div>
  <div class="bar od-bar"><div class="od-msg warn" id="orderMsg">${esc(msg)}</div><button class="btn outline" id="btnCancel" onclick="closeSheet()">Cancel</button><button class="btn primary" id="btnPlace" onclick="place()">Place order</button></div></div>`;
  return{html}};
function od_pct(f){const m=maxQty();S.qty=m>0?Math.max(1,Math.floor(m*f)):0;render()}

</script>
<script>
"use strict";
/* week.js [S3]: week-close sheet */
SHEETS.week=function(){
  const R=S.report;if(!R)return{html:""};
  const code=k=>S.W.codes[k];
  const r=pct(R.eq,R.eq0),br=pct(R.bn,R.b0),cum=pct(R.eq,T.startCash),ex=cum-pct(R.bn,T.startCash);
  const prog=Math.max(0,Math.min(1,ex/T.mandate));
  const end=periodEnded();
  const floorRow=S.failed?`<div class="wk-flag bad" role="alert"><b>Floor breached, period ends</b><span class="num">${sg(cum)}% from start</span></div>`
    :cum<=-T.warnPct?`<div class="wk-flag warn"><b>Floor warning</b><span class="num">${sg(cum)}% from start, floor -${T.floorPct}%</span></div>`:"";
  const sigLbl=n=>typeof sigLabel==="function"?sigLabel(n):n;
  const moves=R.rows.map(x=>{
    const up=x.chg>0.005,dn=x.chg<-0.005,cls=up?"up":dn?"down":"dim",arrow=up?"▲":dn?"▼":"■";
    const bx=x.newBoxes?`<span class="wk-bx ${x.dir===1?"x":"o"} num">${x.dir===1?"+":"-"}${x.newBoxes} ${x.dir===1?"X":"O"}</span>`:`<span class="wk-bx dim num">0 boxes</span>`;
    const sig=x.fired?`<span class="wk-sig chip fresh ${/BUY/.test(x.fired)?"buy":"sell"}">${esc(sigLbl(x.fired))}</span>`:`<span class="wk-sig dim">no signal</span>`;
    return `<div class="wk-mv"><div class="wk-l1"><span class="wk-code">${code(x.k)}</span><span class="num">${fmt(closeNow(x.k))}</span></div>
<div class="wk-r1"><span class="num ${cls}">${arrow} ${sg(x.chg)}%</span></div>
<div class="wk-l2">${bx}<span class="num">RSI ${Math.round(x.r0)} › ${Math.round(x.r1)}</span><span class="num">MACD h ${sg2(x.h0)} › ${sg2(x.h1)}</span>${sig}</div></div>`}).join("");
  const sigTxt=c=>c.withSig===true?"with signal":c.withSig===false?"against signal":"no signal";
  const res=[];
  (R.resolved||[]).forEach(c=>{
    const ok=c.res==="right";
    res.push(`<div class="wk-res"><b>${code(c.k)}</b><span>${c.view===1||c.dir===1?"Bullish":"Bearish"} ${ok?"right":"wrong"} <span class="dim">· base ${typeof c.base==="number"?Math.round(c.base*100)+"%":"n/a"} · ${sigTxt(c)}</span></span><span class="wk-tag ${ok?"ok":"wrong"}">${ok?"✓ Right":"✕ Wrong"}</span></div>`)});
  (R.neutrals||[]).forEach(n=>res.push(`<div class="wk-res"><b>${n.s||code(n.k)}</b><span>Neutral</span><span class="wk-tag dim">Not scored</span></div>`));
  (R.open||[]).forEach(c=>{
    let t="";try{const vc=vcount(stockInfo(c.k).cols),g=(c.view||c.dir)===-1?vc.dn:vc.up;if(g)t=` · target ${priceOf(g.tgt).toFixed(0)}`}catch(e){}
    res.push(`<div class="wk-res"><b>${code(c.k)}</b><span>${(c.view||c.dir)===1?"Bullish":"Bearish"} open<span class="dim">${t}</span></span><span class="wk-tag up">Open</span></div>`)});
  let ps="";
  try{const p=periodStats();
    ps=`${p.closed} closed, ${p.right} right, expected ${p.exp.toFixed(1)}, edge ${sg(p.edge)}, <span class="dim">${p.verdict}</span>`}catch(e){ps='<span class="dim">no closed calls yet</span>'}
  const html=`<div class="grab"></div>
<div class="wk-body">
<div class="wk-head"><h1 id="wkTitle">Week ${R.wk} close</h1></div>
<div class="card wk-eq">
  <div class="wk-eqrow"><span class="wk-big num">${fmt(R.eq)}</span><span class="dim num">from ${fmt(R.eq0)}</span><span class="wk-d num ${r>=0?"up":"down"}">${r>=0?"▲":"▼"} ${r>=0?"+":"-"}${fmt(Math.abs(R.eq-R.eq0))} · ${sg(r)}%</span></div>
  <div class="wk-kv"><span class="dim">Benchmark</span><b class="num">${sg(br)}%</b></div>
  <div class="wk-kv"><span class="dim">Excess vs mandate</span><b class="num">${sg(ex)} of +${(+T.mandate).toFixed(1)} pts</b></div>
  <div class="wk-track" role="img" aria-label="Excess ${sg(ex)} of ${T.mandate}"><i style="width:${(prog*100).toFixed(0)}%"></i></div>
  ${floorRow}
</div>
<div class="card"><h2 class="wk-h">Moves this week</h2>${moves}</div>
<div class="card"><h2 class="wk-h">Calls resolved</h2>${res.length?res.join(""):'<div class="dim wk-none">No calls resolved or open</div>'}</div>
<div class="card wk-period"><h2 class="wk-h">Period so far</h2><span class="num">${ps}</span></div>
</div>
<div class="bar wk-bar"><button class="btn outline" id="btnCopy" onclick="copyReport()">Copy report</button><button class="btn primary" id="btnContinue" onclick="${end?"closeSheet();go('review')":"closeSheet()"}">${end?"Period review":"Continue"}</button></div>`;
  return{html}};

</script>
<script>
"use strict";
/* Period review screen (S4a). Journal tab body comes from journalTabHTML() (journal.js). */
function rvSg(x,d){d=d==null?1:d;const v=+x.toFixed(d);return(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(d)}
function rvTabs(){
  const p=S.tab!=="journal";
  return `<nav class="rv-tabs" role="tablist"><button id="tabPeriod" role="tab" aria-selected="${p}" class="${p?"on":""}" onclick="S.tab='period';render()">This period</button><button id="tabJournal" role="tab" aria-selected="${!p}" class="${p?"":"on"}" onclick="S.tab='journal';render()">Journal</button></nav>`}
function rvSplitRow(label,s){
  return `<tr><td>${label}</td><td class="num">${s.closed}</td><td class="num">${s.right}</td><td class="num">${s.exp.toFixed(1)}</td><td class="num">${rvSg(s.edge)}</td></tr>`}
function rvSignals(){
  const ev=evNow(),pat=(ev&&ev.pat)||{},g={},order=[];
  (S.fired||[]).forEach(f=>{if(!g[f.name]){g[f.name]=0;order.push(f.name)}g[f.name]++});
  const body=order.length?`<table><thead><tr><th>Pattern</th><th>Fired</th><th>Seen</th><th>Followed</th><th>Lift</th></tr></thead><tbody>${order.map(n=>{
    const p=pat[n],label=typeof sigLabel==="function"?sigLabel(n):n;
    if(!p)return `<tr><td>${esc(label)}</td><td class="num">${g[n]}</td><td class="num dim">-</td><td class="num dim">-</td><td class="num dim">-</td></tr>`;
    return `<tr><td>${esc(label)}</td><td class="num">${g[n]}</td><td class="num">${(+p.seen).toLocaleString("en-US")}</td><td class="num">${pctTxt(p.ft)}</td><td class="num ${liftCls(p)}">${liftTxt(p.lift)}</td></tr>`}).join("")}</tbody></table>
    <p class="rv-note">Followed = followed through. Lift is measured against the base rate (bullish ${pctTxt(ev.base.bull)}, bearish ${pctTxt(ev.base.bear)}).</p>`
    :`<p class="rv-note">No signals fired this period.</p>`;
  return `<section class="card rv-card"><h2>Signals this period</h2><div class="rv-sub">All instruments, whole history</div>${body}</section>`}
function rvBaseline(){
  const b=S.base,ev=evNow(),bull=ev&&ev.base?pctTxt(ev.base.bull):"-";
  let f1;
  if(!b)f1=`<p class="rv-note">Baseline: pending, computing…</p>`;
  else{const best=Math.max(b.cash,b.rand,b.lock);
    f1=`<p class="rv-note">No-read strategies meet the mandate in <b class="num">${best}%</b> of windows.</p><p class="rv-note rv-fine">Idle cash ${b.cash}%, random buys ${b.rand}%, copy benchmark ${b.lock}% (${b.n} ${b.src==="real"?"real":"stand-in"} windows).</p>`}
  return `<section class="card rv-card"><h2>Baseline</h2>${f1}<p class="rv-note">Bullish base rate <b class="num">${bull}</b>.</p></section>`}
function rvPeriodHTML(){
  const lay=layout(),eq=equity(),r=pct(eq,T.startCash),br=pct(bench(),T.startCash),ex=r-br;
  const met=!S.failed&&ex>=T.mandate,dd=Math.min(0,pct(S.minEq,T.startCash));
  const floorEq=T.startCash*(1-T.floorPct/100);
  const fees=S.fees||0,feePts=fees/T.startCash*100,exPre=ex+feePts;
  const st=periodStats(),sp=splitStats(S.calls,journalLoad().length),nn=noCallCount();
  const verdict=st.verdict||"too few to tell";
  const band=st.band?`, band ${rvSg(st.band[0])} to ${rvSg(st.band[1])} calls`:"";
  const res=S.failed?`<span class="v num rv-bad">✖ floor breached</span>`:met?`<span class="v num ok">✓ met</span>`:`<span class="v num warn">not met</span>`;
  const w=lay==="cover"?320:lay==="tall"?560:400,h=lay==="cover"?190:lay==="tall"?240:230;
  const perf=`<section class="card rv-card"><h2>Performance</h2>
    <div class="row"><span class="l dim">Return</span><span class="v num">${rvSg(r)}%</span></div>
    <div class="row"><span class="l dim">Benchmark</span><span class="v num">${rvSg(br)}%</span></div>
    <div class="row"><span class="l dim">Excess vs benchmark</span><span class="v num">${rvSg(ex)} pts</span></div>
    <div class="row"><span class="l dim">Mandate +${(+T.mandate).toFixed(1)} pts</span>${res}</div>
    <div class="row"><span class="l dim">Max drawdown</span><span class="v num${S.failed?" rv-bad":""}">${rvSg(dd)}%</span></div>
    <div class="row"><span class="l dim">Orders</span><span class="v num">${S.orders.length}</span></div>
    <div class="row"><span class="l dim">End equity</span><span class="v num">${fmt(eq)}</span></div></section>`;
  const chart=`<section class="card rv-card"><h2>Equity vs benchmark, % since start</h2><div class="rv-chart">${eqChart(S.eqHist,S.benchHist,floorEq,{w,h})}</div>
    <div class="rv-fee"><span class="cap">Fee drag</span><div class="num rv-feeL">Fees ${fmt(fees)} = ${feePts.toFixed(1)} pts of start equity</div><div class="num rv-feeL">Excess before fees ${rvSg(exPre)} pts</div></div></section>`;
  const rec=`<section class="card rv-card"><h2>Call record vs base</h2>
    <div class="rv-hl">${st.right} right of ${st.closed} closed</div>
    <div class="rv-sub">Expected from base rate alone: ${st.exp.toFixed(1)}. Edge ${rvSg(st.edge)} calls (n=${st.closed}, ${verdict}${band})</div>
    <table><thead><tr><th>Calls</th><th>Closed</th><th>Right</th><th>Exp</th><th>Edge</th></tr></thead><tbody>${rvSplitRow("With signal",sp.with)}${rvSplitRow("Against signal",sp.against)}${rvSplitRow("No signal",sp.none)}</tbody></table>
    <div class="row"><span class="l dim">Neutral views (not scored)</span><span class="v num">${S.neutrals.length}</span></div>
    <div class="row"><span class="l dim">Orders without a call</span><span class="v num">${nn}</span></div></section>`;
  return `<div class="rv-grid">${perf}${chart}${rec}${rvSignals()}${rvBaseline()}</div>`}
SCREENS.review=function(){
  const ended=periodEnded(),jn=S.tab==="journal";
  const top=topBar("Period review",(layout()==="cover"?"Wks 1-"+S.week+(ended?" · ended":" · so far"):"Weeks 1 to "+S.week+(ended?" · end of period":" · so far")),devBadge());
  const main=rvTabs()+(jn?`<div class="rv-pane">${journalTabHTML()}</div>`:`<div class="rv-pane">${rvPeriodHTML()}</div>`);
  const bar=ended
    ?`<button class="btn outline" id="btnRerun" onclick="newPeriod(S.seed)"><span class="rv-l">Rerun window</span><span class="rv-s">Rerun</span></button><button class="btn outline" id="btnCopy" onclick="copyReport()">Copy report</button><button class="btn primary" id="btnNextPeriod" onclick="newPeriod((Math.random()*90000|0)+10000)">Next period</button>`
    :`<button class="btn primary" id="btnHome" onclick="go('home')">Home</button><button class="btn outline" id="btnCopy" onclick="copyReport()">Copy report</button>`;
  return{top,main,bar}};

</script>
<script>
"use strict";
// Journal tab (lifetime call record). Owner S4b.
let _jnTimer=null,_jnArmed=false;

function jnRows(list){
  // list: [[label, statsObj, bold?]]
  const body=list.map(([lab,s,b])=>{
    s=s||{closed:0,right:0,exp:0,edge:0};
    const e=s.closed?sg2(s.edge,1):"-";
    const L=b?"<b>"+esc(lab)+"</b>":esc(lab);
    return `<tr><td>${L}</td><td class="num">${s.closed}</td><td class="num">${s.closed?s.right:"-"}</td><td class="num">${s.closed?s.exp.toFixed(1):"-"}</td><td class="num">${e}</td></tr>`;
  }).join("");
  return body;
}
function jnTable(first,list){
  return `<table class="jn-t"><thead><tr><th>${esc(first)}</th><th>Closed</th><th>Right</th><th>Exp</th><th>Edge</th></tr></thead><tbody>${jnRows(list)}</tbody></table>`;
}
function jnSg(x){ // signed one decimal with real minus
  const v=Math.round(x*10)/10;
  return (v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(1);
}

function journalTabHTML(){
  let J=null;
  try{J=journalStats();}catch(e){J=null;}
  if(!J||!J.n){
    return `<div class="card jn-card"><h2 class="jn-h">Lifetime call record</h2>
      <p class="jn-note">No closed calls yet. Set Bullish or Bearish on a stock, then advance weeks. Each call that resolves is saved here and compared with the base rate.</p></div>`+
      jnNote()+jnReset();
  }
  const A=J.all, wide=(typeof window!=="undefined"&&window.innerWidth>=600);
  const w=Math.max(240,Math.min((typeof window!=="undefined"?window.innerWidth:344)-48,520));
  const h=Math.min(150,Math.round(w*0.4));
  let chart="",vtxt;
  if(A.band){
    chart=intervalChart(A.edge,A.band[0],A.band[1],A.verdict,{w,h});
    vtxt=`<span class="jn-verdict">${esc(A.verdict)}</span><span class="dim jn-bandtxt">Band ${jnSg(A.band[0])} to ${jnSg(A.band[1])} calls${A.verdict==="at base"?" includes 0 (base)":""}.</span>`;
  }else{
    const need=Math.max(0,30-J.n);
    vtxt=`<span class="jn-verdict">too few to tell (n=${J.n})</span><span class="dim jn-bandtxt">${need} more closed call${need===1?"":"s"} needed to reach 30 before a band is shown.</span>`;
  }
  const head=`<div class="card jn-card"><h2 class="jn-h">Lifetime call record</h2>
    <div class="jn-hl">${A.right} right of ${A.closed} closed<small>expected from base ${A.exp.toFixed(1)} &middot; edge ${jnSg(A.edge)}</small></div>
    ${chart?`<div class="jn-chart">${chart}</div>`:""}
    <div class="jn-vrow">${vtxt}</div></div>`;
  const dir=`<div class="card jn-card"><h2 class="jn-h">By direction</h2>${jnTable("Call",[["▲ Bullish",J.bull],["▼ Bearish",J.bear],["All calls",A,1]])}</div>`;
  const names=Object.keys(J.byPat||{}).sort((a,b)=>J.byPat[b].closed-J.byPat[a].closed);
  const pat=`<div class="card jn-card"><h2 class="jn-h">By pattern called on</h2>${jnTable("Pattern",names.map(n=>[sigLabel(n==="No signal"?null:n),J.byPat[n]]).concat([["All",A,1]]))}</div>`;
  const fr=`<div class="card jn-card"><h2 class="jn-h">Fresh vs stale signal</h2>${jnTable("Signal",[["Fresh (age 0-1)",J.fresh.fresh],["Stale (2+ cols)",J.fresh.stale]])}
    <p class="jn-sub">Calls made with a chart signal showing.</p></div>`;
  const sp=`<div class="card jn-card"><h2 class="jn-h">With vs against signal</h2>${jnTable("Call",[["With signal",J.split.with],["Against signal",J.split.against],["No signal",J.split.none]])}</div>`;
  return `<div class="jn-grid">${head}${dir}${pat}${fr}${sp}${jnNote()}</div>`+jnReset();
}
function jnNote(){
  let y="most";try{y=pctTxt(baseFor(1));}catch(e){} // integrator: computed, never hard-coded
  return `<div class="card jn-card"><h2 class="jn-h">How to read this</h2><p class="jn-note">These stocks mostly rose. A bullish call is right about ${y} of the time with no chart at all. Your record is compared with that.</p></div>`;
}
function jnReset(){
  return `<div class="jn-reset"><button class="btn sm outline" id="btnResetJournal" onclick="jnResetTap()">Reset journal</button></div>`;
}
function jnResetTap(){
  const b=document.getElementById("btnResetJournal");
  if(!_jnArmed){
    _jnArmed=true;
    if(b)b.textContent="Tap again to reset";
    clearTimeout(_jnTimer);
    _jnTimer=setTimeout(()=>{_jnArmed=false;const c=document.getElementById("btnResetJournal");if(c)c.textContent="Reset journal";},3000);
    return;
  }
  clearTimeout(_jnTimer);_jnArmed=false;
  journalReset();
  render();
}

</script>
<script>
"use strict";
/* ---------- copy report ---------- */
function reportText(){
  const g=(f,d)=>{try{return typeof f==="function"?f():d}catch(e){return d}};
  const eq=g(equity,0),bn=g(bench,0),r=+pct(eq,T.startCash).toFixed(2),b=+pct(bn,T.startCash).toFixed(2);
  const per=S.calls||[];
  const calls=per.map(c=>({s:c.s||(S.W&&S.W.codes?S.W.codes[c.k]:null),wk:c.wk,view:c.view!=null?c.view:c.dir,d:c.dir,sig:c.sig||null,pat:c.pat||null,sigDir:c.sigDir!=null?c.sigDir:null,sigAge:c.sigAge!=null?c.sigAge:null,fresh:c.fresh!=null?c.fresh:null,withSig:c.withSig!=null?c.withSig:null,base:c.base!=null?c.base:null,res:c.res||"open"}));
  const lc=g(()=>journalLoad().length,0);
  const js=g(()=>journalStats(),null)||{};
  const jall=js.all||{};
  const ev=g(()=>evNow(),null)||{};
  const eb=ev.base||{};
  const o={build:BUILD,src:g(dataSource,"?"),seed:S.seed,week:S.week,tweaked:g(tweaked,false),tweaks:T,
    equity:Math.round(eq),ret:r,bench:b,excess:+(r-b).toFixed(2),failed:!!S.failed,fees:Math.round(S.fees||0),
    feePts:+(100*(S.fees||0)/(T.startCash||1)).toFixed(2),orders:S.orders||[],
    noCall:g(noCallCount,0),calls:calls,neutrals:(S.neutrals||[]).length,
    record:g(()=>callStats(per,lc),null),split:g(()=>splitStats(per,lc),null),
    journal:{n:js.n||0,edge:jall.edge!=null?jall.edge:null,verdict:jall.verdict||null},
    ev:{src:ev.src||"none",bull:eb.bull!=null?eb.bull:null,bear:eb.bear!=null?eb.bear:null,n:eb.n||0},
    baseline:S.base||"pending"};
  return JSON.stringify(o)}
function copyReport(){const t=reportText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{S.lastMsg="Report copied";render()},()=>{prompt("Copy report",t)})}

/* ---------- tweak menu + presets ---------- */
function presets(){try{return JSON.parse(localStorage.getItem("pfdesk.presets")||"{}")}catch(e){return{}}}
function openTweaks(){const P=presets(),keep=($("tw_pname")||{}).value||"";
  $("modalBody").innerHTML=`<div class="tw-wrap"><div class="tw-hd">Settings · Tweak (testing)</div>
  <div class="tw-sub dim">Build ${BUILD} · data ${dataSource()} · seed ${S.seed}. Apply starts a new period.</div>
  <div class="tw-grid">${Object.keys(DEFAULTS).map(k=>`<label class="tw-f${+T[k]!==DEFAULTS[k]?" chg":""}" for="tw_${k}"><span class="tw-l">${TWEAK_LABELS[k]} <span class="faint">(${DEFAULTS[k]})</span></span><input id="tw_${k}" class="num${+T[k]!==DEFAULTS[k]?" chg":""}" type="number" inputmode="decimal" step="any" value="${T[k]}"></label>`).join("")}
  <label class="tw-f" for="tw_seed"><span class="tw-l">Seed</span><input id="tw_seed" class="num" type="number" inputmode="numeric" value="${S.seed}"></label></div>
  <div class="tw-row"><button class="btn primary" id="twApply" onclick="applyTweaks()">Apply + new period</button><button class="btn" id="twDefaults" onclick="T=Object.assign({},DEFAULTS);openTweaks()">Defaults</button></div>
  <div class="tw-hd tw-h2">Presets</div>
  <div class="tw-row"><input id="tw_pname" class="tw-name" type="text" maxlength="40" placeholder="Preset name" value="${esc(keep)}"><button class="btn" id="twSave" onclick="savePreset()">Save preset</button></div>
  <div class="tw-row"><button class="btn" id="twCopyPreset" onclick="copyPreset()">Copy preset code</button><button class="btn" id="twCopyReport" onclick="copyReport()">Copy report</button></div>
  ${Object.keys(P).map((n,ix)=>`<div class="tw-prow"><span class="tw-pn">${esc(n)}</span><button class="btn" onclick="loadPreset(${ix})">Load</button><button class="btn" onclick="delPreset(${ix})">Delete</button></div>`).join("")}
  <div class="tw-row"><button class="btn outline" id="twClose" onclick="$('modal').classList.remove('on')">Close</button></div></div>`;
  $("modal").classList.add("on")}
function readTweaks(){const o={};Object.keys(DEFAULTS).forEach(k=>{const v=parseFloat($("tw_"+k).value);o[k]=isNaN(v)?DEFAULTS[k]:v});o.weeks=Math.max(1,Math.round(o.weeks));o.preWeeks=Math.max(30,Math.round(o.preWeeks));o.reversal=Math.max(1,Math.round(o.reversal));o.boxPct=Math.max(0.25,o.boxPct);return o}
function applyTweaks(){T=readTweaks();try{localStorage.setItem("pfdesk.tweaks",JSON.stringify(T))}catch(e){}const sd=parseInt($("tw_seed").value)||S.seed;$("modal").classList.remove("on");newPeriod(sd)}
function savePreset(){const n=(($("tw_pname")||{}).value||"").trim();if(!n){const e=$("tw_pname");if(e)e.focus();return}const P=presets();P[n]=readTweaks();try{localStorage.setItem("pfdesk.presets",JSON.stringify(P))}catch(e){}openTweaks()}
function loadPreset(ix){const P=presets(),n=Object.keys(P)[ix];T=Object.assign({},DEFAULTS,P[n]);openTweaks()}
function delPreset(ix){const P=presets(),n=Object.keys(P)[ix];delete P[n];try{localStorage.setItem("pfdesk.presets",JSON.stringify(P))}catch(e){}openTweaks()}
function copyPreset(){const t="PFDESK-PRESET:"+btoa(JSON.stringify(readTweaks()));(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{S.lastMsg="Preset code copied";render()},()=>prompt("Preset code",t))}

</script>
