<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crew Duel proto v1</title>
<style>
:root{--bg:#06202e;--sea:#0e3a52;--ink:#eaf6fb;--muted:#9cc3d3;--sand:#d6c4a0;--gold:#ffd27a;--coral:#ff9a7a;--mint:#8fe3c0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1100px;height:880px;transform-origin:center;background:linear-gradient(#0e3a52,#0a5870);border-radius:18px;overflow:hidden}
.top{position:absolute;left:24px;right:24px;top:16px;display:flex;justify-content:space-between;font-size:20px}
#enemy{position:absolute;left:560px;top:110px;width:500px;height:300px;text-align:center}
.mon{font-size:120px;line-height:150px}
.bar{height:16px;background:#033;border-radius:8px;overflow:hidden;margin:6px 60px}.bar i{display:block;height:100%;background:var(--coral);transition:width .3s}
.intent{display:inline-block;margin-top:10px;padding:8px 16px;border-radius:12px;background:#0008;font-size:20px;border:2px solid var(--gold)}
#crew{position:absolute;left:24px;top:110px;width:500px}
.cm{display:flex;align-items:center;gap:12px;background:#0006;border-radius:14px;padding:10px;margin-bottom:12px}
.cm.down{opacity:.35}.face{font-size:44px;width:60px;text-align:center}.cm .bar{margin:6px 0;width:200px}.cm .bar i{background:var(--mint)}
.moves{display:flex;gap:10px;margin-left:auto}
button{font:inherit;color:var(--ink);background:#164c66;border:2px solid #3d7f9c;border-radius:12px;min-width:110px;min-height:56px;padding:6px 10px;cursor:pointer}
button.sel{background:#2f7d5f;border-color:var(--mint)}button:disabled{opacity:.4}
#go{position:absolute;right:24px;bottom:24px;min-width:200px;min-height:72px;font-size:22px;background:#a8621f;border-color:var(--gold)}
#log{position:absolute;left:24px;bottom:24px;width:760px;height:150px;font-size:17px;color:var(--muted);overflow:hidden}
#link{position:absolute;left:24px;top:500px;width:760px;font-size:18px;color:var(--gold)}
#ov{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;font-size:24px;text-align:center}
#ov .card{background:#0c2f40;padding:28px 40px;border-radius:18px;border:2px solid var(--gold)}
.pop{position:absolute;font-size:34px;font-weight:700;color:var(--gold);pointer-events:none;animation:up .9s forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
#fold{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;font-size:24px}
@media (max-height:420px){#fold{display:flex}}
</style></head><body>
<div id="wrap"><div id="stage">
 <div class="top"><span id="fightlbl">Fight 1/3</span><span>Crew Duel · proto v1</span><span id="loot">Pearls 0 · XP 0</span></div>
 <div id="crew"></div>
 <div id="enemy"><div class="mon" id="mon"></div><div id="ename" style="font-size:24px"></div><div class="bar"><i id="ehp"></i></div><div id="ehpt"></div><div class="intent" id="intent"></div></div>
 <div id="link"></div>
 <div id="log"></div>
 <button id="go">Go!</button>
 <div id="ov"><div class="card" id="ovc"></div></div>
</div></div>
<div id="fold">Unfold to play</div>
<script>
// ---- seeded RNG (L-TD-6) ----
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000}}
const Q=new URLSearchParams(location.search);const SEED=+Q.get('seed')||Date.now()%100000;
// ---- data ----
const CREW=[
 {id:'tobb',name:'Tobb',face:'🛡️',hp:18,moves:[{k:'guard',n:'Guard',d:'Blocks the shown hit'},{k:'bash',n:'Bash',d:'2 dmg'}]},
 {id:'mara',name:'Mara',face:'⚓',hp:14,moves:[{k:'strike',n:'Strike',d:'4 dmg'},{k:'rally',n:'Rally',d:'+2 to all hits'}]},
 {id:'sela',name:'Sela',face:'✨',hp:12,moves:[{k:'heal',n:'Heal',d:'+5 to lowest'},{k:'spark',n:'Spark',d:'3 dmg'}]}];
const FIGHTS=[
 {name:'Bumper Crab',face:'🦀',hp:16,loop:[{t:'hit',v:7},{t:'all',v:3},{t:'shell'}],pearls:3},
 {name:'Urchin Pair',face:'🦔',hp:22,loop:[{t:'all',v:5},{t:'hit',v:9},{t:'hit',v:8}],pearls:3},
 {name:'Leviathan Pup',face:'🐙',hp:32,loop:[{t:'hit',v:12},{t:'all',v:6},{t:'shell'},{t:'hit',v:12}],pearls:6}];
function intentText(i){return i.t==='hit'?`Next: hits one crew for ${i.v}`:i.t==='all'?`Next: splashes everyone for ${i.v}`:'Next: hides in its shell (half damage)'}
// ---- pure sim ----
function newGame(seed){const r=rng(seed);return{r,f:0,crew:CREW.map(c=>({id:c.id,hp:c.hp,max:c.hp})),e:null,step:0,pearls:0,xp:0,over:null,log:[]}}
function startFight(G){const F=FIGHTS[G.f];G.e={hp:F.hp,max:F.hp};G.step=0;G.intentTarget=pickTarget(G)}
function alive(G){return G.crew.filter(c=>c.hp>0)}
function pickTarget(G){const a=alive(G);return a.length?a[Math.floor(G.r()*a.length)].id:null}
function intent(G){return FIGHTS[G.f].loop[G.step%FIGHTS[G.f].loop.length]}
// picks: {tobb:'guard', mara:'strike', sela:'heal'}
function resolve(G,picks){const I=intent(G),L=[];const up=k=>G.crew.find(c=>c.id===k);
 const has=(id,k)=>up(id).hp>0&&picks[id]===k;
 let rally=has('mara','rally')?2:0,dmg=0,links=[];
 const hitOf=b=>b+rally;
 if(has('tobb','bash'))dmg+=hitOf(2);
 if(has('mara','strike')){let d=hitOf(4);if(has('tobb','guard')){d*=2;links.push('Counter! Guard + Strike = double')}if(has('sela','spark')){d+=2;links.push('Charged! Spark + Strike = +2')}dmg+=d}
 if(has('sela','spark'))dmg+=hitOf(3);
 if(rally&&dmg)links.push('Rally! +2 on every hit');
 if(I.t==='shell')dmg=Math.ceil(dmg/2);
 G.e.hp=Math.max(0,G.e.hp-dmg);L.push(dmg?`Crew deals ${dmg}.`:'No damage this round.');
 if(has('sela','heal')){const low=alive(G).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];low.hp=Math.min(low.max,low.hp+5);L.push(`Sela heals ${CREW.find(c=>c.id===low.id).name} +5.`)}
 let taken=0;
 if(G.e.hp>0){const guard=has('tobb','guard');
  if(I.t==='hit'){const t=up(G.intentTarget)||alive(G)[0];if(t){if(guard){L.push('Tobb blocks the hit!')}else{t.hp=Math.max(0,t.hp-I.v);taken+=I.v;L.push(`${CREW.find(c=>c.id===t.id).name} takes ${I.v}.`)}}}
  else if(I.t==='all'){const v=guard?Math.ceil(I.v/2):I.v;alive(G).forEach(c=>{c.hp=Math.max(0,c.hp-v);taken+=v});L.push(`Splash! Everyone takes ${v}.`)}
 }
 G.step++;let ev=null;
 if(G.e.hp<=0){const F=FIGHTS[G.f];G.pearls+=F.pearls;G.xp+=10;ev='win';L.push(`${F.name} swims off happy! +${F.pearls} Pearls, +10 XP.`);
  if(G.f===FIGHTS.length-1){G.pearls+=8;G.over='win'}else{G.f++;G.crew.forEach(c=>{if(c.hp<=0)c.hp=Math.ceil(c.max*.3);else c.hp=Math.min(c.max,c.hp+Math.ceil(c.max*.2))});startFight(G)}}
 else if(!alive(G).length){G.over='lose';G.pearls=Math.floor(G.pearls/2)+3;L.push('The crew wakes up at the harbour.')}
 else G.intentTarget=pickTarget(G);
 return{log:L,links,dmg,taken,ev}}
// ---- bots (L-TD-7) ----
const BOTS={
 idle:G=>({}),
 naive:G=>{const p={};CREW.forEach(c=>p[c.id]=c.moves[Math.floor(G.r()*2)].k);return p},
 skilled:G=>{const I=intent(G),p={tobb:I.t==='shell'?'bash':'guard',mara:'strike',sela:'spark'};
  const low=alive(G).some(c=>c.hp/c.max<.45);if(low)p.sela='heal';if(I.t==='shell'){p.mara='rally'}return p}};
function sweep(n=60){const out={};for(const b in BOTS){let w=0,turns=0,pearls=0,hpEnd=[0,0,0];for(let s=1;s<=n;s++){const G=newGame(s*7919);startFight(G);let t=0;while(!G.over&&t<80){resolve(G,BOTS[b](G));t++}if(G.over==='win')w++;turns+=t;pearls+=G.pearls}out[b]={win:Math.round(100*w/n)+'%',turns:+(turns/n).toFixed(1),pearls:+(pearls/n).toFixed(1)}}return out}
// ---- UI ----
let G,picks={};
const $=id=>document.getElementById(id);
function fit(){const s=Math.min(innerWidth/1100,innerHeight/880);$('stage').style.transform=`scale(${s})`}
addEventListener('resize',fit);
function render(){const F=FIGHTS[G.f];$('fightlbl').textContent=`Fight ${G.f+1}/3`;$('loot').textContent=`Pearls ${G.pearls} · XP ${G.xp}`;
 $('mon').textContent=F.face;$('ename').textContent=F.name;$('ehp').style.width=(100*G.e.hp/G.e.max)+'%';$('ehpt').textContent=`${G.e.hp}/${G.e.max}`;
 const I=intent(G);const tn=G.intentTarget&&I.t==='hit'?' → '+CREW.find(c=>c.id===G.intentTarget).name:'';$('intent').textContent=intentText(I)+tn;
 $('crew').innerHTML='';CREW.forEach((c,i)=>{const s=G.crew[i];const d=document.createElement('div');d.className='cm'+(s.hp<=0?' down':'');
  d.innerHTML=`<div class="face">${c.face}</div><div><b>${c.name}</b><div class="bar"><i style="width:${100*s.hp/s.max}%"></i></div>${s.hp}/${s.max}</div><div class="moves"></div>`;
  c.moves.forEach(m=>{const b=document.createElement('button');b.innerHTML=`${m.n}<br><small>${m.d}</small>`;if(picks[c.id]===m.k)b.classList.add('sel');b.disabled=s.hp<=0;b.onclick=()=>{picks[c.id]=m.k;render()};d.querySelector('.moves').appendChild(b)});
  $('crew').appendChild(d)});
 const need=alive(G).every(c=>picks[c.id]);$('go').disabled=!need}
function pop(txt,x,y){const p=document.createElement('div');p.className='pop';p.textContent=txt;p.style.left=x+'px';p.style.top=y+'px';$('stage').appendChild(p);setTimeout(()=>p.remove(),900)}
$('go').onclick=()=>{const f=G.f;const r=resolve(G,picks);picks={};$('link').textContent=r.links.join('  ·  ');
 if(r.dmg)pop('-'+r.dmg,780,150);if(r.ev==='win')pop('Hooray!',740,90);
 const lg=$('log');lg.innerHTML=r.log.map(s=>`<div>${s}</div>`).join('')+lg.innerHTML;
 if(G.over)return end();render()};
function end(){const w=G.over==='win';$('ovc').innerHTML=`<h2>${w?'Victory! The sea is calm.':'Back at the harbour'}</h2><p>${w?'All 3 fights won':'The crew rests up'} · +${G.pearls} Pearls · +${G.xp} XP</p><p style="color:#9cc3d3">Pearls and XP go to the shared upgrade track.</p><button id="again">Play again</button>`;$('ov').style.display='flex';$('again').onclick=boot}
function boot(){G=newGame(SEED+Math.floor(Math.random()*1e4));startFight(G);picks={};$('ov').style.display='none';$('log').innerHTML='<div>Pick one move for each crew member, then Go! The monster shows what it will do next.</div>';$('link').textContent='Tip: Guard + Strike in the same round = Counter (double damage).';render();fit()}
window.__cd={newGame,startFight,resolve,sweep,BOTS,get state(){return G}};
boot();
</script></body></html>
