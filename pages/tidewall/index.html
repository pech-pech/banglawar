<script>
/* Tidewall audio - pure WebAudio code synthesis. No samples, no network, no dependencies.
   API: TWAudio.init() resume() setMuted(b) isMuted() play(name,opts) ambience(on)
   opts: {kind:'harpoon'|'lantern'|'cannon'} for towerFire, {stars:0-3} for victory,
         {pan:-1..1} any sound, {vol:0..2} any sound. Mute persists in localStorage 'tw_muted'. */
(function(){
'use strict';
var AC=window.AudioContext||window.webkitAudioContext;
var ctx=null,bus=null,NB=null,muted=false,armed=false,ambOn=false,ambG=null,last={},voices=[],inited=false;
var MASTER=0.9,MAXV=14;
var C,D,N,OUT; // current build target (live context or an OfflineAudioContext for level checks)
try{muted=localStorage.getItem('tw_muted')==='1';}catch(e){}

function chain(c,live){ // sfx+amb buses -> master gain -> limiter -> out
  var m=c.createGain();m.gain.value=(live&&muted)?0:MASTER;
  var L=c.createDynamicsCompressor();
  L.threshold.value=-6;L.knee.value=3;L.ratio.value=20;L.attack.value=.002;L.release.value=.15;
  m.connect(L);L.connect(c.destination);
  var s=c.createGain();s.connect(m);
  var a=c.createGain();a.gain.value=.78;a.connect(m);
  return {m:m,s:s,a:a};
}
function noiseBuf(c){
  var n=c.sampleRate*3|0,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0),s=22222;
  for(var i=0;i<n;i++){s=(s*16807)%2147483647;d[i]=s/1073741823.5-1;}
  return b;
}
function make(){
  if(ctx||!AC)return ctx;
  try{ctx=new AC();}catch(e){ctx=null;return null;}
  bus=chain(ctx,true);NB=noiseBuf(ctx);
  return ctx;
}

/* ---------- synth helpers ---------- */
function hz(m){return 440*Math.pow(2,(m-69)/12);}
function jit(a){return 1+(Math.random()*2-1)*(a||.04);}
function gn(v){var x=C.createGain();x.gain.value=v==null?1:v;return x;}
function env(p,t,a,pk,d){p.setValueAtTime(.0001,t);p.linearRampToValueAtTime(pk,t+a);p.exponentialRampToValueAtTime(.0001,t+a+d);}
function tone(t,f,dur,o){
  o=o||{};var a=o.a||.005,os=C.createOscillator(),e=gn(0),n=os;
  os.type=o.w||'sine';os.frequency.setValueAtTime(f,t);
  if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+(o.st||dur));
  if(o.det)os.detune.value=o.det;
  if(o.lp){n=C.createBiquadFilter();n.type='lowpass';n.frequency.value=o.lp;n.Q.value=o.q||.7;os.connect(n);}
  env(e.gain,t,a,o.v||.3,dur);n.connect(e);e.connect(o.out||OUT);
  os.start(t);os.stop(t+a+dur+.05);
  return os;
}
function nz(t,dur,o){
  o=o||{};var a=o.a||.005,s=C.createBufferSource(),f=C.createBiquadFilter(),e=gn(0),i;
  s.buffer=N;s.loop=true;
  f.type=o.ft||'bandpass';f.Q.value=o.q||1;f.frequency.setValueAtTime(o.f||1000,t);
  if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+(o.st||dur));
  if(o.fp)for(i=0;i<o.fp.length;i++)f.frequency.exponentialRampToValueAtTime(o.fp[i][1],t+o.fp[i][0]);
  env(e.gain,t,a,o.v||.3,dur);s.connect(f);f.connect(e);e.connect(o.out||OUT);
  s.start(t,Math.random()*2);s.stop(t+a+dur+.05);
  return f;
}
function bell(t,f,v,d){
  var P=[[1,1],[2.76,.4],[5.4,.2],[8.93,.08]];
  for(var i=0;i<P.length;i++)tone(t,f*P[i][0],d/(1+i*.7),{v:v*P[i][1],a:.002});
}
function panner(t,from,to,dur){
  if(!C.createStereoPanner)return OUT;
  var p=C.createStereoPanner();p.pan.setValueAtTime(from,t);p.pan.linearRampToValueAtTime(to,t+dur);p.connect(OUT);
  return p;
}

/* ---------- the sounds (each returns its length in seconds) ---------- */
var SFX={
  buttonTap:function(t){tone(t,900,.05,{to:700,v:.2,w:'triangle'});return .1;},
  cardPick:function(t){
    nz(t,.07,{f:1800,to:4200,q:1.2,v:.2});
    tone(t,560*jit(.02),.06,{to:780,v:.12,w:'triangle'});return .12;},
  cardPlace:function(t){
    var j=jit(.03);
    tone(t,190*j,.14,{to:85,v:.45});
    nz(t,.05,{ft:'lowpass',f:1500,v:.22});
    tone(t+.03,hz(79)*j,.2,{v:.07,w:'triangle'});return .26;},
  cardInvalid:function(t){
    tone(t,233,.09,{w:'triangle',v:.28,lp:900});
    tone(t+.11,185,.15,{w:'triangle',v:.28,lp:900});return .3;},
  energyLow:function(t){
    [64,60,57].forEach(function(m,i){tone(t+i*.09,hz(m),i<2?.07:.18,{v:.16,to:hz(m)*.97});});
    return .45;},
  endTurn:function(t){ // conch horn
    tone(t,hz(55),.5,{w:'sawtooth',lp:700,a:.12,v:.12});
    tone(t,hz(62),.5,{w:'sawtooth',lp:650,a:.15,v:.07,det:5});
    nz(t,.5,{f:500,to:900,q:.6,a:.15,v:.06});return .8;},
  towerFire:function(t,o){
    var k=o.kind||'lantern',j=jit(.03),q=gn(Math.pow(10,({harpoon:12,cannon:4}[k]||13)/20));q.connect(OUT);OUT=q;
    if(k==='harpoon'){
      nz(t,.13,{f:3200,to:700,q:.8,v:.2});
      tone(t,520*j,.12,{to:300,w:'triangle',v:.2});return .2;}
    if(k==='cannon'){
      tone(t,120*j,.35,{to:40,v:.6});
      nz(t,.28,{ft:'lowpass',f:900,to:180,v:.45});
      nz(t,.03,{ft:'highpass',f:2000,v:.12});return .45;}
    tone(t,1320*j,.12,{to:660,v:.12});
    tone(t,1980*j,.08,{to:990,v:.05,w:'triangle'});return .2;},
  hitEnemy:function(t){
    var j=jit(.06);
    nz(t,.06,{f:900*j,q:1.5,v:.28});
    tone(t,320*j,.07,{to:150,v:.2});return .12;},
  enemyDie:function(t){
    [0,1,2].forEach(function(i){var f=hz(76-i*4)*jit(.03);tone(t+i*.06,f,.07,{to:f*1.8,v:.15});});
    nz(t,.25,{f:2500,to:900,q:.6,a:.01,v:.12});return .4;},
  wallHit:function(t){
    nz(t,.08,{ft:'lowpass',f:700*jit(.05),v:.4});
    tone(t,150,.1,{to:110,v:.25,w:'triangle'});return .15;},
  wallBreak:function(t){
    for(var i=0;i<5;i++)nz(t+i*.05+Math.random()*.02,.12,{ft:'lowpass',f:1200-i*150,v:.28});
    tone(t,95,.4,{to:45,v:.4});
    nz(t+.05,.5,{f:600,to:250,q:.5,a:.05,v:.12});return .7;},
  trapSnap:function(t){
    nz(t,.025,{ft:'highpass',f:2500,v:.3});
    tone(t,1400,.05,{to:350,w:'triangle',v:.22});
    tone(t+.02,1568,.25,{v:.04});return .35;},
  spellWave:function(t){
    var p=panner(t,-.5,.5,.8);

  setT('piles',`Draw <b>${S.drawP.length}</b> &middot; Discard <b>${S.disc.length}</b><br>Deck <b>${S.deck.length}</b> cards`);
  $('bUndo').disabled=!(S.phase==='player'&&UNDO.length);
  setT('legend',`<div>Advances (N = slots; at the back: hits town)</div><div>Hits slot N for the number</div><div>Shields itself</div><div>Towers shoot first enemy in lane</div><div>Bell: +1 dmg, next lane, same column</div><div>Each tide the sea wears walls down (slot 1 most), never to nothing</div>`);
  {const er=S.phase==='erode',m=er?(S.erodeGone?`${S.erodeGone} washed away`:'Front slots take the most'):'';
   setT('erode',er?`The tide erodes the wall<small>${m}</small>`:'');$('erode').style.opacity=er?1:0;}
  $('endBtn').disabled=S.phase!=='player';$('endBtn').classList.toggle('ready',S.phase==='player'&&S.energy<=0);
  if(S.t-S.toastT>3.2||S.phase==='erode')$('toast').style.opacity=0;
}
/* ---------- main loop ---------- */
let last=0,booted=false,FREEZE=false;const NOPRESENT=new URLSearchParams(location.search).has('nopresent');
function fxState(){
  let rip=[0,0,0,0,60];
  if(RIP&&!RM){const u=(S.t-RIP.t0)/RIP.dur;if(u>=0&&u<1)rip=[RIP.x,RIP.y,u*RIP.max,16*(1-u),46];}
  return{bloom:RM?.55:.85,rip};
}
function frame(now){
  requestAnimationFrame(frame);
  if(!booted||!S||!R)return;
  let dt=Math.min(.05,(now-last)/1000||0);last=now;
  if(!PAUSED&&!foldShown&&!FREEZE){
    if(HS>0){HS-=dt;dt=0;}
    const busy=S.phase==='resolve'||S.phase==='erode';
    if(busy&&SPD===2){HS=0;let n=0;while(n++<700&&(S.phase==='resolve'||S.phase==='erode'))update(.05);stepParticles(.2);}
    else{update(dt*(busy&&SPD===1?2.5:1));stepParticles(dt);}
  }
  if(RIP&&S.t-RIP.t0>RIP.dur)RIP=null;
  if(SH>.05){SH*=Math.exp(-dt*9);const a=SH,tm=now/1000;$('cam').style.transform=`translate(${Math.sin(tm*61)*a}px,${Math.cos(tm*53)*a}px)`;}
  else if(SH!==0){SH=0;$('cam').style.transform='';}
  drawScene(S.t);hud();
  if(!NOPRESENT)R.flush(RM?0:S.t,[0.02,0.05,0.08],fxState());
}
window.__tw={
  get S(){return S;},CARDS,EN,
  playCard:(i,l,s)=>playCard(i,l,s),endTurn:()=>endTurn(),restart:s=>restart(s),
  err:(i,l,s)=>{const c=CARDS[S.hand[i]];return c?(c.c>S.energy?'energy':placeErr(c,l,s)):'none';},
  ff:sec=>{let n=Math.ceil(sec/.05);while(n-->0)update(.05);},
  intent:e=>intentOf(e),starsFor,takeReward,
  snap:()=>snap(),restore:o=>restore(o),lead,
  probe:()=>{drawScene(S.t);return R.probe?R.probe(RM?0:S.t,[0.02,0.05,0.08],fxState()):null;},
  get R(){return R;},freeze:v=>{FREEZE=v;},TUNE,pause:v=>setPaused(v),stepVisual:(dt)=>{stepParticles(dt);}
};
(async()=>{
  await initRenderer();
  const q=new URLSearchParams(location.search);
  muteIcon();
  restart(q.has('seed')?+q.get('seed'):undefined);
  booted=true;requestAnimationFrame(frame);
})();
})();
</script><script>if('serviceWorker' in navigator&&isSecureContext)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e)));try{screen.orientation&&screen.orientation.lock&&matchMedia('(display-mode: fullscreen)').matches&&screen.orientation.lock('landscape').catch(()=>{});}catch(_){}</script>
