<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Tidewall</title>
<style>
/* Shell only. Module CSS must be scoped under .mod-root[data-mod="<id>"] (see JOIN-PLAN.md section 6). */
:root{--bg:#05060d;--ink:#f3ead7;--dim:#a99f8c;--acc:#ffcf6b;--sea:#1d4f6e;--card:#13202e;--tap:56px;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:18px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}
/* shell buttons only: never a bare `button` rule (it leaked into module roots) */
:is(#scr-title,#scr-settings,#hud,#hubbar,#tw-fold) button{font:inherit;color:inherit;min-height:var(--tap);min-width:var(--tap);border:0;border-radius:14px;cursor:pointer}
.scr{position:fixed;inset:0;display:none}
.scr.on{display:block}
.mod-root{position:absolute;inset:0;overflow:hidden;contain:strict}
/* title */
#scr-title{background:radial-gradient(120% 90% at 50% 110%,#1d4f6e 0%,#0b1a2a 55%,#05060d 100%)}
.tw-tcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,92vw);padding:32px;border-radius:24px;background:rgba(19,32,46,.82);text-align:center;box-shadow:0 20px 60px #000a}
.tw-tcard h1{margin:0 0 6px;font-size:56px;letter-spacing:2px;color:var(--acc)}
.tw-tcard p{margin:0 0 24px;color:var(--dim)}
.tw-big{display:block;width:100%;min-height:88px;font-size:30px;font-weight:700;background:linear-gradient(#ffd77f,#f0a93c);color:#2a1a05;border-radius:var(--r);box-shadow:0 6px 0 #a8681c}
.tw-big:active{transform:translateY(3px);box-shadow:0 3px 0 #a8681c}
/* D1: the shell button reset (#id button{color:inherit}) out-ranked .tw-big; dark bold CTA text, about 9:1 on the gold */
:is(#scr-title,#scr-settings) .tw-big{color:#2a1a05;font-weight:800}
.tw-row{display:flex;gap:12px;justify-content:center;margin-top:18px}
.tw-ghost{background:rgba(255,255,255,.08);padding:0 20px}
/* hub chrome over the island module */
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:none;justify-content:space-between;align-items:center;pointer-events:none;z-index:20}
#hud.on{display:flex}
#hud .tw-pill{pointer-events:auto;background:rgba(5,6,13,.72);padding:10px 16px;border-radius:30px;min-height:var(--tap);display:flex;align-items:center;gap:14px;font-weight:600}
#hubbar{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:none;gap:14px;z-index:20}
#hubbar.on{display:flex}
.tw-mode{width:220px;min-height:112px;padding:14px 16px;text-align:left;background:var(--card);border:2px solid #2e4a63;box-shadow:0 8px 24px #0009}
.tw-mode b{display:block;font-size:24px;color:var(--acc)}
.tw-mode span{font-size:15px;color:var(--dim)}
.tw-mode.tw-resume{border-color:var(--acc)}
/* D3: while a module modal is open (island "Welcome home"), the shell HUD and mode cards step aside */
body.tw-modal #hud,body.tw-modal #hubbar{visibility:hidden}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:rgba(5,6,13,.9);padding:12px 20px;border-radius:14px;display:none;z-index:40;max-width:90vw;text-align:center}
#toast.on{display:block}
#scr-settings{background:rgba(5,6,13,.94);z-index:30}
#scr-settings .tw-tcard{text-align:left}
#scr-settings label{display:flex;justify-content:space-between;align-items:center;min-height:var(--tap);gap:12px}
#scr-settings select,#scr-settings input{min-height:44px;min-width:var(--tap);font:inherit}
/* D13: settings controls in the game's style: gold toggle switches and a dark select (no native blue/white) */
#scr-settings input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:68px;min-width:68px;height:38px;min-height:38px;margin:0;border-radius:19px;background:#2e4a63;box-shadow:inset 0 2px 4px #0008;cursor:pointer;transition:background .15s}
#scr-settings input[type=checkbox]::after{content:"";position:absolute;left:5px;top:5px;width:28px;height:28px;border-radius:50%;background:var(--ink);box-shadow:0 2px 4px #0007;transition:transform .15s}
#scr-settings input[type=checkbox]:checked{background:linear-gradient(#ffd77f,#f0a93c)}
#scr-settings input[type=checkbox]:checked::after{transform:translateX(30px);background:#2a1a05}
#scr-settings select{appearance:none;-webkit-appearance:none;min-height:var(--tap);max-width:62%;padding:0 44px 0 16px;border-radius:14px;border:2px solid #2e4a63;color:var(--ink);cursor:pointer;
  background:#0b1a2a linear-gradient(45deg,transparent 50%,var(--acc) 50%) no-repeat right 24px center/8px 8px;background-image:linear-gradient(45deg,transparent 50%,var(--acc) 50%),linear-gradient(135deg,var(--acc) 50%,transparent 50%);background-position:right 24px center,right 16px center;background-size:8px 8px,8px 8px;background-repeat:no-repeat}
#scr-settings select option{background:#13202e;color:var(--ink)}
#scr-settings input:focus-visible,#scr-settings select:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
#err{position:fixed;left:8px;bottom:8px;font-size:12px;color:#f88;z-index:50;pointer-events:none}
/* Fold cover screen (narrow portrait): stack everything, keep 56 px targets */
body.cover #scr-title .tw-tcard{width:94vw;padding:22px}
body.cover #scr-title .tw-tcard h1{font-size:42px}
body.cover #hubbar{left:10px;right:10px;flex-direction:column}
body.cover #hubbar .tw-mode{width:100%;min-height:84px}
/* D2: short cover (Fold cover screen held landscape, e.g. 882x344): cards side by side in one low strip */
body.cover.short #hubbar{flex-direction:row;bottom:max(8px,env(safe-area-inset-bottom));gap:10px}
body.cover.short #hubbar .tw-mode{flex:1;min-height:64px;padding:8px 14px}
body.cover.short #hubbar .tw-mode b{font-size:20px}body.cover.short #hubbar .tw-mode span{font-size:14px}
body.cover.short #hud{top:max(6px,env(safe-area-inset-top))}
/* D2: battles on the cover screen: "Unfold to play" card + Back (the battle stays mounted and saved underneath) */
#tw-fold{position:fixed;inset:0;z-index:25;display:none;background:radial-gradient(120% 90% at 50% 110%,#1d4f6e 0%,#0b1a2a 55%,#05060d 100%)}
#tw-fold.on{display:block}
#tw-fold .tw-tcard{width:min(460px,92vw);padding:24px}
#tw-fold h2{margin:6px 0 6px;font-size:30px;color:var(--acc)}
#tw-fold svg{width:56px;height:56px;display:block;margin:0 auto}
#tw-fold .tw-big{color:#2a1a05;font-weight:800;min-height:72px;font-size:24px}
body.short #tw-fold .tw-tcard{padding:14px 20px}body.short #tw-fold svg{display:none}body.short #tw-fold p{margin-bottom:12px}

<script data-part="tw-save">
/* tw-save.js - Tidewall joined game: ONE shared save (schema, versioning, migration, atomic write + .bak).
 * Works in the browser (window.TWSave) and node (module.exports). DOM-free. Storage is injected (localStorage-like).
 *
 * Envelope on disk:  "TW1|<fnv32 hex of json>|<json>"   (key 'tw_game_v1', backup 'tw_game_v1.bak')
 * Write order: serialize -> self-check parse -> copy current GOOD main to .bak -> write main. A failed write leaves
 * the previous main untouched. On quota errors battle snapshots are dropped first, then the ledger log is trimmed.
 * Load order: main (checksum ok) -> .bak -> legacy import (tw_save_v1, tw_island_v1, cd2_save_v1) -> fresh.
 * Modules never touch localStorage: each gets a Storage-like shim (getItem/setItem/removeItem) over doc.mods[id].
 */
(function (root) {
'use strict';
const KEY = 'tw_game_v1', BAK = KEY + '.bak', VERSION = 1, SNAP_MAX = 250000, LOG_MAX = 200;
// legacy standalone keys -> module id that owns them (copied verbatim into that module's storage shim)
const LEGACY = { tw_save_v1: 'td', tw_island_v1: 'island', cd2_save_v1: 'cd' };
const MODS = ['td', 'cd', 'island'];

function fnv(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(16).padStart(8, '0'); }
function pack(doc) { const j = JSON.stringify(doc); return 'TW1|' + fnv(j) + '|' + j; }
function unpack(str) {
  if (typeof str !== 'string' || str.slice(0, 4) !== 'TW1|') return null;
  const p = str.indexOf('|', 4); if (p < 0) return null;
  const sum = str.slice(4, p), j = str.slice(p + 1);
  if (fnv(j) !== sum) return null;
  try { const d = JSON.parse(j); return d && typeof d === 'object' && typeof d.v === 'number' ? d : null; } catch (e) { return null; }
}

function fresh(now) {
  return {
    v: VERSION, createdAt: now, savedAt: now, seq: 0,
    meta: { xp: 0, rank: 1, spBonus: 0, spSpent: 0 },            // Rank 1-20 from shared XP; SP = rank-1 + spBonus (wonders)
    wallet: { pearls: 0, lifetime: 0, lastPlay: 0, welcomeBack: false, wbRuns: 0, recentIds: [],
              day: { key: '', earned: 0, cdPaid: 0, cdFrac: 0, dailyTide: false, byMode: { td: { p: 0, ms: 0 }, cd: { p: 0, ms: 0 } } },
              log: [] },
    settings: { muted: false, sfx: 0.8, music: 0.6, reducedMotion: false, renderer: 'auto', bigText: false },
    mods: { td: {}, cd: {}, island: {} },                          // module-owned Storage shims: key -> string
    snaps: { td: null, cd: null },                                 // {at, bytes, data} per-mode battle snapshot
    resume: { screen: 'island', mode: null, startedAt: 0 },
    legacy: { imported: [] }
  };
}

/* migrations[n] upgrades a doc from version n to n+1. v0 = "pre-join": nothing but legacy keys. */
const migrations = {
  // example for the next release: 1: d => { d.settings.haptics = true; return d; }
};
function migrate(d, now) {
  if (!d || typeof d.v !== 'number') return fresh(now);
  if (d.v > VERSION) throw new Error('save is from a newer build (v' + d.v + '); refusing to downgrade');
  while (d.v < VERSION) { const m = migrations[d.v]; if (!m) throw new Error('no migration from v' + d.v); d = m(d); d.v++; }
  return repair(d, now);
}
/* fill any missing fields from a fresh doc (tolerates hand-edited or partial saves) */
function repair(d, now) {
  const f = fresh(now);
  const obj = x => x && typeof x === 'object' && !Array.isArray(x);
  (function fill(dst, src) {
    for (const k in src) {
      if (dst[k] === undefined || (dst[k] === null && src[k] !== null)) dst[k] = src[k];
      else if (obj(src[k]) && obj(dst[k])) fill(dst[k], src[k]);
    }
  })(d, f);
  for (const m of MODS) if (!d.mods[m] || typeof d.mods[m] !== 'object') d.mods[m] = {};
  return d;
}

function importLegacy(storage, d) {
  for (const k in LEGACY) {
    let s = null; try { s = storage.getItem(k); } catch (e) {}
    if (typeof s === 'string' && s.length) { d.mods[LEGACY[k]][k] = s; d.legacy.imported.push(k); }
  }
  // shared XP: lift TWRun's meta xp into the shared Rank so nobody loses levels (TWRun keeps its copy; shell is canonical)
  // TWRun meta.xp is XP INSIDE the current level: total = sum(25+10*l, l=1..level-1) + xp
  try { const t = JSON.parse(d.mods.td.tw_save_v1 || 'null');
    if (t && t.meta && typeof t.meta.xp === 'number') { const lv = Math.max(1, Math.min(20, t.meta.level | 0 || 1)); let tot = t.meta.xp | 0; for (let l = 1; l < lv; l++) tot += 25 + 10 * l; d.meta.xp = Math.max(d.meta.xp, tot);
      let r = 1, left = d.meta.xp; while (r < 20 && left >= 25 + 10 * r) { left -= 25 + 10 * r; r++; } d.meta.rank = r; } } catch (e) {}   // same curve as TWLedger.rankFor
  return d;
}

/* standalone tw-audio.js kept mute in 'tw_muted' ('1'/'0'). Imported ONCE into settings, also for saves made before this rule. */
function importLegacySettings(storage, d) {
  if (d.legacy.imported.indexOf('tw_muted') >= 0) return false;
  let m = null; try { m = storage.getItem('tw_muted'); } catch (e) {}
  if (m !== '1' && m !== '0') return false;
  d.settings.muted = m === '1'; d.legacy.imported.push('tw_muted'); return true;
}

function create(opts) {
  opts = opts || {};
  const storage = opts.storage, now = opts.now || (() => Date.now()), key = opts.key || KEY, bak = key + '.bak';
  if (!storage) throw new Error('TWSave.create needs a storage');
  let doc = null, lastGood = null, dirty = false, listeners = [];
  const read = k => { try { return storage.getItem(k); } catch (e) { return null; } };

  function load() {
    const warnings = []; let source = 'fresh', d = null;
    const main = read(key);
    if (main != null) { d = unpack(main); if (d) source = 'main'; else warnings.push('main save unreadable, trying backup'); }
    if (!d) { const b = read(bak); if (b != null) { d = unpack(b); if (d) source = 'bak'; else warnings.push('backup unreadable'); } }
    if (!d) {
      d = fresh(now());
      importLegacy(storage, d);
      if (d.legacy.imported.length) source = 'legacy';
      if (main != null || read(bak) != null) warnings.push('started a fresh save (old one kept under ' + key + '.corrupt)');
      if (main != null) { try { storage.setItem(key + '.corrupt', main); } catch (e) {} }
    }
    doc = migrate(d, now());
    const settingsImported = importLegacySettings(storage, doc);
    lastGood = source === 'main' ? main : null;
    if (source !== 'main' || settingsImported) commit();  // persist the import / restore immediately
    return { doc, source, warnings };
  }

  function write(str) { storage.setItem(key, str); }
  /* atomic-as-localStorage-allows: one setItem for the whole doc; previous good copy kept in .bak */
  function commit() {
    if (!doc) throw new Error('load() first');
    doc.seq++; doc.savedAt = now();
    for (let attempt = 0; attempt < 3; attempt++) {
      const str = pack(doc);
      if (!unpack(str)) throw new Error('self-check failed');
      try {
        if (lastGood) { try { storage.setItem(bak, lastGood); } catch (e) { /* backup is best-effort */ } }
        write(str); lastGood = str; dirty = false;
        return { ok: true, bytes: str.length, attempt };
      } catch (e) {
        if (attempt === 0) { doc.snaps.td = null; doc.snaps.cd = null; }          // 1st: drop snapshots
        else if (attempt === 1) { doc.wallet.log = doc.wallet.log.slice(-20); }  // 2nd: trim the log
      }
    }
    dirty = true;
    return { ok: false, error: 'storage full or blocked; progress kept in memory' };
  }

  function update(fn) { const r = fn(doc); const c = commit(); listeners.forEach(l => { try { l(doc); } catch (e) {} }); return r === undefined ? c : r; }

  function storageFor(mod) {
    if (MODS.indexOf(mod) < 0) throw new Error('unknown module ' + mod);
    return {
      getItem: k => { const v = doc.mods[mod][k]; return v === undefined ? null : v; },
      setItem: (k, v) => { doc.mods[mod][k] = String(v); commit(); },
      removeItem: k => { delete doc.mods[mod][k]; commit(); },
      key: i => Object.keys(doc.mods[mod])[i] || null,
      get length() { return Object.keys(doc.mods[mod]).length; }
    };
  }

  function saveSnap(mode, data) {
    if (!(mode in doc.snaps)) throw new Error('no snapshot slot ' + mode);
    if (data == null) { doc.snaps[mode] = null; return commit(); }
    const j = JSON.stringify(data);
    if (j.length > SNAP_MAX) return { ok: false, error: 'snapshot too big (' + j.length + ' > ' + SNAP_MAX + ')' };
    doc.snaps[mode] = { at: now(), bytes: j.length, data: JSON.parse(j) };
    doc.resume.mode = mode;
    return commit();
  }

  return {
    load, commit, update, storageFor, saveSnap,
    get doc() { return doc; }, get dirty() { return dirty; },
    onChange: f => { listeners.push(f); return () => { listeners = listeners.filter(x => x !== f); }; },
    exportString: () => pack(doc),
    importString(s) { const d = unpack(s); if (!d) return false; doc = migrate(d, now()); commit(); return true; }
  };
}

const api = { create, importLegacySettings, pack, unpack, fresh, migrate, repair, fnv, KEY, BAK, VERSION, LEGACY, MODS, SNAP_MAX, LOG_MAX, migrations };
if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.TWSave = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script data-part="tw-ledger">
/* tw-ledger.js - the ONE place Pearls, XP, Rank and SP change. Enforces the pay rules; modules only REPORT results.
 * Browser: window.TWLedger. Node: module.exports. Works on a TWSave store (store.doc / store.update).
 *
 * Pay rules (RPG-economy.md, SKILLS-DESIGN.md, LESSONS P-CD-B, L-CD-5):
 *  - TD pays from its table: fight 3, elite/guardian 6, boss 10; run win +8; run ended on loss/leave +3 (>=1 node);
 *    leftover Salvage 1 Pearl per 10, max 5; Daily tide +10 once per local day. Losing a tide pays 0 Pearls (it is retried) but XP.
 *  - Crew Duel pays 60% of TD PER MINUTE: TD reference 3.6 Pearls/min (36 per ~10 min) -> 2.16/min of measured play time.
 *    Minutes = min(module activeMs, shell-measured elapsed, 10 min). Fractions carry over within the day (exact rate),
 *    so a 2-3 min session pays ~4-7 (design), max 21 (10 min ceiling), and only the first 3 PAYING sessions per local day pay Pearls; after that XP + free hex only (quiet).
 *  - All modes: 250 Pearls per local day cap (quiet). Welcome-back (7+ days away): Pearls x2 until the first TD run ends.
 *  - XP: any finished battle, win or lose; Rank 1-20, need 25+10*lvl per level (TWRun curve); SP = rank-1 + spBonus.
 */
(function (root) {
'use strict';
const RULES = {
  dailyCap: 250,
  td: { fight: 3, elite: 6, guardian: 6, boss: 10, runWin: 8, runEnd: 3, salvagePer: 10, salvageMax: 5, dailyTide: 10 },
  tdRefPerMin: 3.6,
  cd: { share: 0.6, band: [0.5, 0.7], perSessionMax: 21, paidPerDay: 3, maxMinutes: 10, lossShare: 0.5 },  // 21 = 2.16/min x 10 min ceiling; a lower cap breaks the per-minute band
  xpPerFinishMax: 120, rankCap: 20, welcomeBackDays: 7, logMax: 200
};
const xpNeed = lvl => 25 + 10 * lvl;
function rankFor(xp, cap) { let lvl = 1, left = xp; while (lvl < cap && left >= xpNeed(lvl)) { left -= xpNeed(lvl); lvl++; } return lvl; }
function dayKey(t) { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const int = (x, lo, hi) => { x = Math.floor(Number(x) || 0); return Math.max(lo, Math.min(hi, x)); };

function create(store, opts) {
  opts = opts || {};
  const now = opts.now || (() => Date.now()), R = opts.rules || RULES;
  const D = () => store.doc;
  const B = () => { try { return (opts.bonuses && opts.bonuses()) || {}; } catch (e) { return {}; } };   // island td bonuses

  function rollDay(d, t) {
    const k = dayKey(t), w = d.wallet;
    if (w.day.key !== k) w.day = { key: k, earned: 0, cdPaid: 0, cdFrac: 0, dailyTide: false, byMode: { td: { p: 0, ms: 0 }, cd: { p: 0, ms: 0 } } };
    return w.day;
  }
  function log(d, e) { d.wallet.log.push(e); if (d.wallet.log.length > R.logMax) d.wallet.log.splice(0, d.wallet.log.length - R.logMax); }
  function addXp(d, xp) {
    const before = d.meta.rank;
    d.meta.xp += xp; d.meta.rank = rankFor(d.meta.xp, R.rankCap);
    return d.meta.rank - before;
  }
  function payCapped(d, day, want, notes) {
    let p = Math.max(0, Math.floor(want));

 *  - Persistent track: XP/level (perks + unlocks), milestone unlocks, codex counters. Loss still grants XP.

/* ---------------- map ---------------- */
function genMap(seed, asc, acts, steps) {

      let types;

      else if (c === 0 && (a === 0 || nc === 4)) types = ['fight'];
      else if (nc === 2) types = shuffle(r, ['fight', a === 1 ? (r() < 0.5 ? 'shop' : 'rest') : (r() < 0.5 ? 'rest' : 'event')]);
      else if (c === 1) types = shuffle(r, ['fight', r() < 0.6 ? 'event' : 'fight']);

function pickRar(r){const x=S.rng(),O=TUNE.offer;return x<(O.pRare[r]||0)?'r':x<(O.pRare[r]||0)+(O.pUncommon[r]||0)?'u':'c';}
function makeOffer(){
  const O=TUNE.offer,r=Math.min(S.picks,3),cnt={};for(const id of S.deck)cnt[id]=(cnt[id]||0)+1;
  const ok=id=>(cnt[id]||0)<O.copyCap;

             bottom: bar && bar.classList.contains('on') ? Math.ceil(innerHeight - bar.getBoundingClientRect().top) + 6 : 0 }; },
  get dpr() { return Math.min(devicePixelRatio || 1, 2); } };
function onResize() { document.body.classList.toggle('cover', view.cover); document.body.classList.toggle('short', view.cover && view.short); updateFold(); resizeSubs.forEach(f => { try { f(view); } catch (e) {} }); }
/* battles need the inner screen: on the cover show "Unfold to play" + Back; unfolding removes the card and the battle carries on */
const FOLD_NAME = { td: 'Tide Run', cd: 'Crew Duel' };
function updateFold(id) {
  if (!id) { try { id = router.current; } catch (e) { id = null; } }
  const on = view.cover && (id === 'td' || id === 'cd'), f = $('tw-fold'); if (!f) return;
  if (on) $('f-sub').textContent = FOLD_NAME[id] + ' plays on the inner screen. Your battle waits for you here.';
  f.classList.toggle('on', on);
}
addEventListener('resize', onResize);

/* ---------- island bonuses (island module is pure-callable even when not mounted) ---------- */
function bonuses() {
  const isl = TWModules.get('island');
  try { return (isl && isl.pure.bonuses(store.storageFor('island'))) || { td: {}, cd: {} }; } catch (e) { errBox(e); return { td: {}, cd: {} }; }
}

/* ---------- ctx handed to init(root, ctx) ---------- */
function ctxFor(id) {
  const ctx = {
    id, version: 1,
    storage: store.storageFor(id),
    finish: r => onFinish(id, r),
    exit: () => router.go('island'),
    saveSnapshot: snap => (id === 'td' || id === 'cd') ? store.saveSnap(id, snap) : { ok: false, error: 'no snapshot slot' },
    bonuses: () => bonuses()[id === 'island' ? 'td' : id] || {},
    allBonuses: bonuses,
    meta: { get rank() { return store.doc.meta.rank; }, get xp() { return store.doc.meta.xp; },
            get sp() { return ledger.status().sp; }, get spFree() { return ledger.status().spFree; }, get pearls() { return store.doc.wallet.pearls; } },
    pearls: { spend: (n, why) => ledger.spend(n, id + ':' + why), refund: (n, why) => ledger.refund(n, id + ':' + why), status: ledger.status },
    sp: { spend: n => ledger.spendSP(n), refund: n => ledger.refundSP(n),
          grant: id === 'island' ? (n, why) => ledger.grantSP(n, why) : undefined,
          revoke: id === 'island' ? (n, why) => ledger.revokeSP(n, why) : undefined },
    play: mode => (id === 'island' && (mode === 'td' || mode === 'cd')) ? router.go(mode, { restore: !!store.doc.snaps[mode] }) : Promise.resolve({ ok: false, error: 'play(td|cd) is for the island hub' }),
    audio,
    settings: { get: k => S()[k], set: (k, v) => setSetting(k, v), onChange: f => { settingsSubs.push(f); return () => { settingsSubs = settingsSubs.filter(x => x !== f); }; } },
    gpu: { getDevice: () => TWGPUDevice.getDevice(S().renderer), onLost: TWGPUDevice.onLost, get pref() { return S().renderer; } },
    view, onResize: f => { resizeSubs.push(f); return () => { resizeSubs = resizeSubs.filter(x => x !== f); }; },
    crew: () => { const cd = TWModules.get('cd'); try { return cd && cd.pure && cd.pure.crewSummary ? cd.pure.crewSummary(store.storageFor('cd')) : null; } catch (e) { return null; } },
    toast, log: (...a) => console.log('[' + id + ']', ...a), now: () => Date.now(),
    // D3: a module tells the shell a modal is open; the shell hides its HUD and mode cards until it closes
    modal: on => { document.body.classList.toggle('tw-modal', !!on && active && active.id === id); }
  };
  return ctx;
}

/* ---------- finishing a battle: ledger pays, island gets its free hex, snapshot cleared ---------- */
function onFinish(id, r) {
  if (!active || active.id !== id) return { ok: false, error: 'not the active module' };
  if (!r || !r.battleId) return { ok: false, error: 'result.battleId required' };
  if (active.seen.has(r.battleId)) return { ok: false, error: 'duplicate finish ' + r.battleId };
  active.seen.add(r.battleId);
  const elapsed = Date.now() - active.startedAt;
  const res = Object.assign({}, r, { mode: id });
  let paid;
  try { paid = ledger.creditBattle(res, elapsed); } catch (e) { errBox(e); return { ok: false, error: String(e.message) }; }
  let hex = 0;
  const isl = TWModules.get('island');
  if (r.battleFinished !== false && isl) { try { const h = isl.pure.onBattleFinished(store.storageFor('island'), res); hex = (h && h.hexes) | 0;
    // staffed workers -> crew XP lives in Crew Duel's save (one owner per number)
    const cd = TWModules.get('cd');
    if (h && h.crewXp && cd && cd.pure && cd.pure.addCrewXp) cd.pure.addCrewXp(store.storageFor('cd'), h.crewXp);
  } catch (e) { errBox(e); } }
  store.saveSnap(id, null);
  store.update(d => { d.resume.mode = null; });
  active.startedAt = Date.now(); active.finishedAt = Date.now();   // next battle in the same visit (TD run node) is timed afresh
  hexesGranted += hex; sinceIsland.pearls += paid.pearls; sinceIsland.xp += paid.xp; sinceIsland.hexes += hex; sinceIsland.ranksUp += paid.ranksUp;
  renderHud();
  return Object.assign({ ok: true, hexes: hex }, paid);
}

/* ---------- mounting ---------- */
async function mount(id, how) {
  const mod = TWModules.get(id); if (!mod) throw new Error('module ' + id + ' not loaded');
  const root = $('mod-' + id); root.innerHTML = '';
  active = { id, mod, root, startedAt: Date.now(), finishedAt: 0, seen: new Set() };
  await mod.init(root, ctxFor(id));
  if (id === 'island') { await mod.start({ kind: 'hub', since: sinceIsland }); return; }
  const snap = store.doc.snaps[id];
  const spec = { kind: 'new', bonuses: ctxFor(id).bonuses(), rank: store.doc.meta.rank, seed: (Date.now() % 2147483647) | 0, reducedMotion: S().reducedMotion };
  if (how === 'restore' && snap && snap.data) { let ok = false; try { ok = await mod.restore(snap.data); } catch (e) { errBox(e); } if (ok !== false) return; toast('Could not reopen that battle, starting a fresh one'); }
  await mod.start(spec);
}
async function unmount() {
  if (!active) return;
  const { id, mod, root } = active;
  if (id !== 'island' && mod.snapshot) { try { const s = mod.snapshot(); if (s != null) store.saveSnap(id, s); } catch (e) { errBox(e); } }
  try { await mod.dispose(); } catch (e) { errBox(e); }
  root.innerHTML = ''; active = null;
}
function show(id) { document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === 'scr-' + id)); $('hud').classList.toggle('on', id === 'island'); $('hubbar').classList.toggle('on', id === 'island'); document.body.classList.remove('tw-modal'); updateFold(id); }

const router = TWRouter.create({
  title: { enter() { show('title'); const s = store.doc.resume; $('t-sub').textContent = s.mode ? 'Your battle is waiting.' : (checkin.welcomeBack ? 'Welcome back. Today pays double.' : 'Keep the lamp lit.'); } },
  island: { async enter(p) { show('island'); renderHud(); await mount('island'); if (p && p.error) toast('Something went wrong, back on the island'); sinceIsland = { pearls: 0, xp: 0, hexes: 0, ranksUp: 0 }; },
            leave: unmount },
  td: { async enter(p) { show('td'); await mount('td', p.restore ? 'restore' : 'new'); }, leave: unmount },
  cd: { async enter(p) { show('cd'); await mount('cd', p.restore ? 'restore' : 'new'); }, leave: unmount },
  settings: { enter() {} }
}, { onError: (e, where) => errBox(where + ': ' + (e && e.message || e)) });

/* ---------- hub chrome ---------- */
function renderHud() {
  const st = ledger.status(), snaps = store.doc.snaps;
  $('h-pearls').textContent = st.pearls + ' Pearls'; $('h-rank').textContent = 'Rank ' + st.rank;
  $('b-td').classList.toggle('tw-resume', !!snaps.td); $('m-td').textContent = snaps.td ? 'Back to your tide' : 'Hold the wall, 3-5 min';
  $('b-cd').classList.toggle('tw-resume', !!snaps.cd);
  $('m-cd').textContent = snaps.cd ? 'Back to your duel' : (st.cdPaidLeft > 0 ? 'Your crew, 2-3 min' : 'Practice: XP and a free hex');
}
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

function openSettings() {
  $('s-sound').checked = !S().muted; $('s-motion').checked = S().reducedMotion; $('s-renderer').value = S().renderer === 'c2d' ? 'c2d' : 'auto';
  $('scr-settings').classList.add('on');
}
const SETTABLE = { muted: 'boolean', reducedMotion: 'boolean', sfx: 'number', music: 'number' };
function applySettings() { try { A.setMuted(S().muted); } catch (e) {} settingsSubs.forEach(f => { try { f(Object.assign({}, S())); } catch (e) {} }); }
/* modules may change a few player settings (TD's in-game mute); renderer and the rest stay shell-only */
function setSetting(k, v) {
  if (!SETTABLE[k]) return { ok: false, error: 'setting ' + k + ' is not settable from a module' };
  if (SETTABLE[k] === 'boolean') v = !!v; else { v = Number(v); if (!(v >= 0 && v <= 1)) return { ok: false, error: 'range 0..1' }; }
  store.update(d => { d.settings[k] = v; }); applySettings(); return { ok: true };
}
function closeSettings() {
  store.update(d => { d.settings.muted = !$('s-sound').checked; d.settings.reducedMotion = $('s-motion').checked; d.settings.renderer = $('s-renderer').value; });
  applySettings();
  $('scr-settings').classList.remove('on');
}

// HUD never goes stale: every store.update (ledger pay/spend/refund/SP, settings) re-renders it
store.onChange(() => { if (router.current === 'island') renderHud(); });

$('b-continue').onclick = () => { audioGesture(); const m = store.doc.resume.mode; router.go(m && store.doc.snaps[m] ? m : 'island', { restore: true }); };
$('b-td').onclick = () => router.go('td', { restore: !!store.doc.snaps.td });
$('b-cd').onclick = () => router.go('cd', { restore: !!store.doc.snaps.cd });
$('b-settings').onclick = $('b-settings-t').onclick = openSettings;
$('b-settings-done').onclick = closeSettings;
$('b-fold-back').onclick = () => router.back();

/* back button / Escape: battle -> island (snapshot kept), island -> title */
history.pushState({ tw: 1 }, '');
addEventListener('popstate', () => { history.pushState({ tw: 1 }, ''); if ($('scr-settings').classList.contains('on')) closeSettings(); else router.back(); });
addEventListener('keydown', e => { if (e.key === 'Escape') router.back(); });

/* lifecycle: snapshot + flush when the app is hidden (phones kill background tabs) */
function persistNow() {
  if (active && active.id !== 'island' && active.mod.snapshot) { try { const s = active.mod.snapshot(); if (s != null) store.saveSnap(active.id, s); } catch (e) {} }
  else store.commit();
}
addEventListener('pagehide', persistNow);
document.addEventListener('visibilitychange', () => {
  const hidden = document.visibilityState === 'hidden';
  if (hidden) persistNow();
  if (active) { try { hidden ? active.mod.pause && active.mod.pause() : active.mod.resume && active.mod.resume(); } catch (e) {} }
});

onResize();
if (boot.warnings.length) toast(boot.warnings[0]);
router.go('title');

/* test hooks (L-TD-2: live getters) */
window.__join = { store, ledger, router, get active() { return active && active.id; }, get renderer() { return TWGPUDevice.active ? 'webgpu' : 'none'; }, boot, modules: TWModules.list, bonuses, ctxFor, get hexesGranted() { return hexesGranted; } };
})();

</script>
