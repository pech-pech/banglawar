<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Candle Duel</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16130f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --stone:#16130f; --gold:#d9a441; --gold-d:#a67a25; --parch:#efe2c2; --parch-d:#d9c79b;
  --ink:#2a1d10; --seal:#8e1b1b; --seal-d:#5c0f0f; --good:#7d9a2e; --bad:#8a1c1c;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --font:Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--stone) radial-gradient(ellipse at 50% 18%,rgba(255,190,90,.22),rgba(22,19,15,0) 60%);
  background-attachment:fixed;
  color:var(--parch);font-family:var(--font);font-size:16px;line-height:1.3;
  overflow-x:hidden;-webkit-text-size-adjust:100%;
}
#app{position:relative;width:100%;height:100%;max-width:560px;margin:0 auto}
button,input{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:30px;color:var(--gold);text-align:center;letter-spacing:1px;text-shadow:0 0 14px rgba(217,164,65,.5)}
h2{font-size:22px;color:var(--gold)}

.screen{
  display:none;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  padding:calc(10px + var(--sat)) calc(14px + var(--sar)) calc(10px + var(--sab)) calc(14px + var(--sal));
  flex-direction:column;gap:10px;
}
.screen.active{display:flex}

.row{display:flex;flex-direction:row;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1 1 auto;min-width:0}
.small{font-size:14px}
.muted{opacity:.82}
.gold{color:var(--gold)}

.card{
  background:linear-gradient(180deg,#f4e9cb,var(--parch) 60%,var(--parch-d));
  color:var(--ink);border-radius:10px;padding:12px 14px;
  border:1px solid var(--gold-d);box-shadow:0 2px 10px rgba(0,0,0,.55),inset 0 0 18px rgba(120,80,20,.18);
}
.chip{
  display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;
  background:rgba(0,0,0,.45);border:1px solid var(--gold-d);color:var(--parch);font-size:13px;white-space:nowrap;
}
.card .chip{background:rgba(42,29,16,.12);color:var(--ink)}

.btn{
  min-height:56px;padding:10px 16px;border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#3a2c1a,#241a0e);border:1.5px solid var(--gold);color:var(--parch);
  font-weight:bold;text-align:center;touch-action:manipulation;
}
.btn:active{transform:translateY(1px);filter:brightness(1.15)}
.btn:disabled{opacity:.45;cursor:default}
.btn-seal{
  width:64px;height:64px;min-height:56px;padding:0;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#c13a3a,var(--seal) 45%,var(--seal-d));
  border:3px solid var(--gold);color:#f6e7c0;box-shadow:0 3px 8px rgba(0,0,0,.6),inset 0 0 8px rgba(0,0,0,.45);
  display:inline-flex;align-items:center;justify-content:center;font-size:20px;
}
#btn-play.btn-seal,#btn-rematch.btn-seal,#btn-wager-go.btn-seal{width:auto;min-width:160px;height:56px;border-radius:999px;padding:0 28px;font-size:22px}
#btn-rematch.btn-seal,#btn-wager-go.btn-seal{align-self:stretch;width:100%}
#btn-play.btn-seal{align-self:center;margin:2px 0}
#btn-settings.btn-seal{width:56px;height:56px;font-size:22px}
#scr-wager,#scr-result{justify-content:safe center}

.btn-ans{
  display:block;width:100%;min-height:56px;padding:8px 14px;border-radius:8px;cursor:pointer;
  background:linear-gradient(180deg,#f4e9cb,var(--parch-d));color:var(--ink);
  border:1.5px solid var(--gold-d);font-size:17px;text-align:left;font-weight:normal;
  box-shadow:0 2px 5px rgba(0,0,0,.5);touch-action:manipulation;
}
.btn-ans:active{filter:brightness(.95)}
.btn-ans.ans-right{background:linear-gradient(180deg,#e6f08a,#b4d03c);border:2.5px solid #fff3c0;color:#142002;font-weight:bold;box-shadow:0 0 14px rgba(240,200,98,.95)}
.btn-ans.ans-right::before{content:'\2713  ';font-weight:bold}
.btn-ans.ans-wrong{background:linear-gradient(180deg,#c43a3a,#8a1c1c);border-color:#2b0505;color:#fff;font-weight:bold}
.btn-ans.ans-wrong::before{content:'\2717  ';font-weight:bold}
.btn-ans.ans-dim{opacity:.55;filter:saturate(.6)}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.topbar .chip{font-size:15px}
#p-score,#r-score{font-size:22px;font-weight:bold;color:var(--gold)}
#q-num{font-size:15px;color:var(--parch);opacity:.85}
#timer-bar{
  flex:none;height:8px;border-radius:4px;background:rgba(255,255,255,.12);
  border:1px solid var(--gold-d);overflow:hidden;position:relative;
}
#timer-fill{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),#f0c862)}

/* duel screen: no scroll at 475x638 */
#scr-duel{overflow:hidden;gap:8px}
#scr-duel .card#q-text,#q-text{
  flex:0 1 auto;font-size:19px;line-height:1.28;min-height:0;display:flex;align-items:center;
  max-height:30%;overflow:hidden;
}
#chips-row{min-height:30px;flex:none}
#top-r .rname{font-size:14px;color:var(--parch)}
#scr-duel #ans-wrap{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
#q-fact{
  font-size:14px;line-height:1.25;padding:8px 12px;max-height:84px;overflow:hidden;flex:0 1 auto;
}
#q-fact:empty,#q-fact[hidden]{display:none}
#btn-next,#btn-next.btn-seal{flex:none;min-height:56px;height:56px;width:auto;border-radius:999px;padding:0 24px;font-size:18px;align-self:center}
.chip.pop{position:static;font-size:15px;animation:none}
#btn-next[hidden]{display:none}

.pop{
  position:absolute;pointer-events:none;font-weight:bold;font-size:22px;color:var(--gold);
  text-shadow:0 1px 3px #000;animation:floatup 1.1s ease-out forwards;
}
.pop.neg{color:#e86a6a}
@keyframes floatup{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-44px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,164,65,.55)}50%{box-shadow:0 0 0 8px rgba(217,164,65,0)}}
#btn-play,.btn-next-pulse,.chip.pulse{animation:pulse 2s infinite}

.banner-win,.banner-loss,.banner-draw{
  text-align:center;font-size:26px;font-weight:bold;padding:14px 10px;border-radius:10px;
  border:2px solid var(--gold);letter-spacing:1px;
}
.banner-win{background:linear-gradient(180deg,#e9c766,var(--gold-d));color:#2a1d10;box-shadow:0 0 18px rgba(217,164,65,.6)}
.banner-loss{background:linear-gradient(180deg,#5a1616,#3a0c0c);color:#f1d6c0}
.banner-draw{background:linear-gradient(180deg,#5b5340,#3d372a);color:var(--parch)}

.swatch{
  width:56px;height:56px;border-radius:50%;border:3px solid rgba(239,226,194,.35);cursor:pointer;padding:0;
  box-shadow:inset 0 0 6px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.5);flex:none;
}
.swatch.sel,.topic-tile.sel,.btn.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 0 12px rgba(217,164,65,.7)}
.btn.sel{background:linear-gradient(180deg,#f8eac0,#e8c97a);color:var(--ink)}

.topic-tile,.btn-topic{
  flex:1 1 0;min-width:0;min-height:72px;padding:8px 6px;border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#f4e9cb,var(--parch-d));color:var(--ink);
  border:2px solid var(--gold-d);text-align:center;font-weight:bold;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;box-shadow:0 2px 6px rgba(0,0,0,.5);
}
.topic-tile.sel,.btn-topic.sel{border-color:var(--gold);background:linear-gradient(180deg,#f8eac0,#e8c97a)}

input[type=text],input[type=number],input:not([type]){
  min-height:44px;padding:6px 10px;border-radius:8px;background:#fbf3dc;color:var(--ink);
  border:1.5px solid var(--gold-d);min-width:0;
}

.tweak-panel{
  background:rgba(0,0,0,.35);border:1px solid var(--gold-d);border-radius:10px;padding:8px;
  display:flex;flex-direction:column;gap:6px;
}
.tweak-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;min-height:40px}
.tweak-row input{width:84px;min-height:36px;flex:none}
.tweak-panel .btn{min-height:48px;font-size:14px;padding:6px 10px}

#dev-badge{
  position:fixed;bottom:calc(4px + var(--sab));left:calc(4px + var(--sal));z-index:99;
  width:22px;height:22px;border-radius:50%;display:none;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,#d24545,var(--seal-d));border:1.5px solid var(--gold);
  color:#f6e7c0;font-size:10px;font-weight:bold;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.7);
}
#dev-badge.on{display:flex}

canvas{display:block;border-radius:50%;flex:none}

#scr-home{gap:8px}
#scr-home .card{padding:8px 12px}
#scr-home .topic-tile{min-height:60px}
#scr-home h1{font-size:28px}
#btn-readto-minus,#btn-readto-plus{min-width:56px;padding:0}
#in-readto{width:56px}
#home-rival-name{font-size:17px;font-weight:bold;color:var(--ink);border-bottom:2px solid var(--gold);align-self:flex-start}
#home-warn:empty{display:none}
#scr-settings .foot{position:sticky;bottom:0;background:var(--stone);padding:6px 0;margin-top:auto;z-index:5}
@media (max-width:360px){
  h1{font-size:24px}
  .btn-ans{font-size:16px;padding:6px 10px}
  #q-text{font-size:18px}
  .btn-seal{width:56px;height:56px}
}
@media (max-height:660px){
  .screen{gap:7px}
  #scr-duel .btn-ans{padding-top:6px;padding-bottom:6px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .pop{opacity:1}
}

  var cfg = {};

  }

  function refreshBadge() {

    } catch (e) {}

  function set(key, value) {

    var step = state.rivalStep, rname = '?';
    for (var i = 0; i < rivals.length; i++) if (rivals[i].step === step) rname = rivals[i].name;
    var df = diffs(), dk = Object.keys(df);
    var lines = [];
    lines.push('Build: ' + (TD.BUILD || '?'));
    lines.push('Seed: ' + state.seed + '  Mode: ' + state.mode + '  ReadUpTo: ' + state.readUpTo);

      for (k in df) if (k in d && typeof df[k] === 'number' && isFinite(df[k])) cfg[k] = df[k];

    }

    function render() {
      container.innerHTML = '';
      var panel = el('div', 'tweak-panel');

      Object.keys(d).forEach(function (k) {
        var row = el('div', 'tweak-row');
        var lab = el('label', 'grow small', k);

      panel.appendChild(btn('Reset all', function () {
        applyDiffs({}); changed(); render();

      var r1 = el('div', 'tweak-row'); r1.appendChild(nameIn); panel.appendChild(r1);

      var r2 = el('div', 'tweak-row');

        if (!n) return;

      var cb = btn('Copy report', function () {

      r2.appendChild(cb);
      panel.appendChild(r2);

      Object.keys(presets).forEach(function (n) {

      });

    c.beginPath(); c.moveTo(40, fy - 4); c.lineTo(46, fy - 4.5); c.moveTo(54, fy - 4.5); c.lineTo(60, fy - 4); c.stroke();
    c.strokeStyle = '#8a3a2a'; c.lineWidth = 1.4;
    c.beginPath(); c.arc(50, fy + 10, 5, 0.2, Math.PI - 0.2); c.stroke();
    if (look.freckles) {
      c.fillStyle = 'rgba(140,80,40,0.7)';
      [[41, 8], [44, 10], [39, 11], [56, 10], [59, 8], [61, 11], [47, 7], [53, 7]].forEach(function (p) {
        c.beginPath(); c.arc(p[0], fy + p[1] - 2, 0.9, 0, 7); c.fill();
      });
    }
    if (look.glasses) {
      c.strokeStyle = '#d9a441'; c.lineWidth = 1.4;
      c.strokeRect(36.5, fy - 4, 11, 9); c.strokeRect(52.5, fy - 4, 11, 9);
      c.beginPath(); c.moveTo(47.5, fy); c.lineTo(52.5, fy); c.stroke();
    }
    c.restore();
    c.lineWidth = 3.2; c.strokeStyle = '#d9a441';
    c.beginPath(); c.arc(50, 50, 47, 0, 7); c.stroke();
  }

  // ---------- duel ----------
  function stopTimers() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    if (autoT) { clearTimeout(autoT); autoT = 0; }
  }

  function startDuel() {
    stopTimers();
    var c = cfg(), E = TD.engine;
    var seedStr = ($('in-seed') && $('in-seed').value || '').trim();
    var seed = seedStr !== '' && isFinite(+seedStr) ? (Math.floor(+seedStr) >>> 0) : (Date.now() % 1e9);
    var step = Math.max(1, Math.min(5, Math.round(+c.rivalStep || save.rivalStep || 1)));
    var pool = poolFor();
    var rnd = E.rng(seed);
    var plan = E.planDuel(pool, save.picked, save.memory, rnd, c);
    D = {
      seed: seed, mode: save.mode, readUpTo: save.readUpTo, pickedTopic: save.picked, wagerTopic: save.picked,
      pMult: 1, rMult: 1, rivalStep: step, log: [], pScore: 0, rScore: 0, result: null,
      pool: pool, rnd: rnd, plan: plan, n: 0, q: null, ex: null
    };
    D.exclude = new Set(plan.map(function (q) { return q.id; }));
    // topbar
    var tp = $('top-p'), tr = $('top-r');
    tp.innerHTML = ''; tr.innerHTML = '';
    tp.appendChild(sealDot()); tp.appendChild(h('span', { id: 'p-score', class: 'gold', text: '0' }));
    var mc = h('canvas', {});
    drawPortrait(mc, rivalOf(step).look, 44);
    tr.appendChild(mc); tr.appendChild(h('span', { class: 'rname', text: rivalOf(step).name.split(' ').pop() })); tr.appendChild(h('span', { id: 'r-score', class: 'gold', text: '0' }));
    nextQuestion();
    show('scr-duel');
  }

  function nextQuestion() {
    var E = TD.engine, c = cfg();
    D.n++;
    var isQ7 = D.n === 7;
    var q;
    if (isQ7) {
      q = E.drawQ7(D.pool, D.wagerTopic, save.memory, D.rnd, c, D.exclude);
      D.rMult = E.rivalWager(D.pScore, D.rScore, c);
    } else q = D.plan[D.n - 1];
    D.q = q;
    D.sh = E.shuffleAnswers(q, D.rnd);
    D.rv = E.rivalAnswer(q, c, D.rnd);
    D.locked = false;
    D.rvShown = false;
    $('q-num').textContent = 'Q ' + D.n + '/7';
    $('q-text').textContent = q.q;
    var btns = document.querySelectorAll('#scr-duel .btn-ans');
    for (var i = 0; i < 4; i++) {
      btns[i].textContent = q.a[D.sh.order[i]];
      btns[i].className = 'btn btn-ans';
      btns[i].disabled = false;
    }
    $('q-fact').textContent = '';
    $('chips-row').innerHTML = '';
    $('btn-next').style.display = 'none';
    $('timer-fill').style.width = '100%';
    $('p-score').textContent = D.pScore;
    $('r-score').textContent = D.rScore;
    D.t0 = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(tick);
  }

  function tick() {
    if (!D || D.locked) return;
    var c = cfg();
    var el = (performance.now() - D.t0) / 1000;
    var left = Math.max(0, 1 - el / c.timerSec);
    $('timer-fill').style.width = (left * 100).toFixed(1) + '%';
    if (!D.rvShown && el >= D.rv.tSec) {
      D.rvShown = true;
      var chip = h('span', { class: 'chip', id: 'chip-rival-ans', text: rivalOf(D.rivalStep).name.split(' ').pop() + ' answered' });
      $('chips-row').appendChild(chip);
    }
    if (el >= c.timerSec) { resolve(-1, c.timerSec); return; }
    rafId = requestAnimationFrame(tick);
  }

  function onAnswer(pos) {
    if (!D || D.locked || D.q == null) return;
    var el = (performance.now() - D.t0) / 1000;
    resolve(pos, Math.min(el, cfg().timerSec));
  }

  function resolve(pos, tSec) {
    var E = TD.engine, c = cfg(), q = D.q;
    D.locked = true;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    var isQ7 = D.n === 7;
    var pRight = pos >= 0 && pos === D.sh.correctPos;
    var pT = pos < 0 ? c.timerSec : tSec;
    var pm = isQ7 ? D.pMult : 1, rm = isQ7 ? D.rMult : 1;
    var pPts = E.scoreAnswer(pRight, pT, q, c, pm, isQ7);
    var rPts = E.scoreAnswer(D.rv.correct, D.rv.tSec, q, c, rm, isQ7);
    D.pScore = E.applyScore(D.pScore, pPts);
    D.rScore = E.applyScore(D.rScore, rPts);
    E.markAnswered(save.memory, q, pRight);
    persist();
    D.log.push({ n: D.n, id: q.id, tier: q.tier, topic: q.topic, pRight: pRight, pT: +pT.toFixed(2),
      pPts: pPts, rRight: D.rv.correct, rT: +D.rv.tSec.toFixed(2), rPts: rPts });
    var btns = document.querySelectorAll('#scr-duel .btn-ans');
    for (var i = 0; i < 4; i++) {
      btns[i].disabled = true;
      if (i === D.sh.correctPos) btns[i].classList.add('ans-right');
      else if (i === pos) btns[i].classList.add('ans-wrong');
      else btns[i].classList.add('ans-dim');
    }
    var row = $('chips-row'); row.innerHTML = '';
    var rn = rivalOf(D.rivalStep).name.split(' ').pop();
    row.appendChild(h('span', { class: 'chip', text: 'You ' + (pos < 0 ? 'timed out' : pT.toFixed(1) + 's') }));
    row.appendChild(h('span', { class: 'chip', text: rn + ' ' + (D.rv.correct ? 'right' : 'wrong') + ' ' + D.rv.tSec.toFixed(1) + 's' }));
    row.appendChild(h('span', { class: 'chip pop', text: (pPts >= 0 ? '+' : '') + pPts }));
    if (rPts) row.appendChild(h('span', { class: 'chip pop', text: rn + ' +' + rPts }));
    $('p-score').textContent = D.pScore;
    $('r-score').textContent = D.rScore;
    if (!pRight) $('q-fact').textContent = q.fact;
    var nx = $('btn-next');
    nx.style.display = '';
    nx.textContent = D.n === 7 ? 'Result' : (D.n === 6 ? 'To the wager' : 'Next');
    if (pRight) {
      var myN = D.n;
      autoT = setTimeout(function () { autoT = 0; if (D && D.n === myN && D.locked) goNext(); }, 2500);
    }
  }

  function goNext() {
    if (!D || !D.locked) return;
    if (autoT) { clearTimeout(autoT); autoT = 0; }
    D.locked = false; // prevent double advance
    D.q = null;
    if (D.n < 6) { nextQuestion(); }
    else if (D.n === 6) { buildWagerAndShow(); }
    else finish();
  }

  function buildWagerAndShow() {
    D.pMult = 1;
    refreshWager();
    show('scr-wager');
  }
  function startQ7() {
    if (!D) return;
    nextQuestion();
    show('scr-duel');
  }

  function finish() {
    var E = TD.engine, c = cfg();
    D.result = E.result(D.pScore, D.rScore);
    var xp = E.xpFor(D.result, c);
    var before = save.topicXp[D.pickedTopic] || 0;
    save.topicXp[D.pickedTopic] = before + xp;
    var step = D.rivalStep;
    if (D.result === 'win') step = Math.min(5, step + 1);
    save.rivalStep = step;
    try { TD.tweak.set('rivalStep', step); } catch (e) {}
    persist();
    var state = { seed: D.seed, mode: D.mode, readUpTo: D.readUpTo, pickedTopic: D.pickedTopic, wagerTopic: D.wagerTopic,
      pMult: D.pMult, rMult: D.rMult, rivalStep: D.rivalStep, log: D.log, pScore: D.pScore, rScore: D.rScore, result: D.result };
    try { TD.tweak.lastState = state; } catch (e) {}
    var k = D.log.filter(function (l) { return l.pRight; }).length;
    $('res-k').textContent = 'You got ' + k + ' of 7';
    var b = $('res-banner');
    b.className = 'card ' + (D.result === 'win' ? 'banner-win' : D.result === 'loss' ? 'banner-loss' : 'banner-draw');
    b.textContent = D.result === 'win' ? 'Victory!' : D.result === 'loss' ? 'Defeated' : 'A draw';
    $('res-scores').textContent = 'You ' + D.pScore + '  ·  ' + rivalOf(D.rivalStep).name + ' ' + D.rScore;
    $('res-xp').textContent = '+' + xp + ' XP in ' + topicLabel(D.pickedTopic) + (D.result === 'win' && step > D.rivalStep ? ' · Next rival unlocked' : '');
    var tot = save.topicXp[D.pickedTopic];
    $('res-lv').textContent = topicLabel(D.pickedTopic) + ' level ' + E.levelOf(tot, c) + ' (' + (tot % c.xpPerLevel) + '/' + c.xpPerLevel + ' XP)';
    $('res-seed').textContent = 'Seed ' + D.seed;
    $('btn-report').textContent = 'Copy report';
    refreshBadge();
    show('scr-result');
  }

  // ---------- start ----------
  function start() {
    var app = $('app');
    if (!app) return;
    app.innerHTML = '';
    ['home', 'duel', 'wager', 'result', 'settings'].forEach(function (n) {
      app.appendChild(h('section', { class: 'screen', id: 'scr-' + n }));
    });
    var badge = h('div', { id: 'dev-badge', text: 'DEV' });
    badge.style.display = 'none';
    document.body.appendChild(badge);
    save = loadSave();
    try {
      if (TD.tweak && TD.tweak.set && save.rivalStep !== TD.tweak.cfg.rivalStep) TD.tweak.set('rivalStep', save.rivalStep);
    } catch (e) {}
    buildHome(); buildDuel(); buildWager(); buildResult(); buildSettings();
    refreshHome();
    show('scr-home');
    refreshBadge();
  }
  ui.start = start;

  TD.ui = ui;
  if (typeof document !== 'undefined' && typeof window !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  }
  if (typeof module !== 'undefined') module.exports = ui;
})();
