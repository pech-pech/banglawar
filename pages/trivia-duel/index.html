<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Candle Duel</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b1d6b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Candle Duel - look A "Arena" (td-proto-2). Flat, loud, indigo stage.
   Admin defaults (guesses, no answer needed): sizes copied from look-A.md; markup-dependent ids/classes
   (#top-p/#top-r/.hdr/.mid/.side/.sc/.nm/.rnd/.tp/.big/.badge/.c/.cells) are styled defensively so ui-* makers can use either. */
:root{
  --bg:#2b1d6b; --bg2:#3a2a8a; --deep:#1b1245; --blue:#2f7bff; --blue-d:#1c5fe0; --orange:#ff7a1a; --orange-d:#e8620a;
  --card:#fff; --ink:#1c1540; --ok:#22c55e; --ok-d:#0f7a35; --bad:#ef4444; --bad-d:#8f1d1d; --gold:#ffd23f;
  --violet:#a855f7; --teal:#14b8a6; --lav:#cfc8ff; --accent:#6d5bd0;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow:0 4px 0 rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#2b1d6b;color:#fff;font-family:var(--font);font-size:16px;line-height:1.25;overflow-x:hidden;-webkit-text-size-adjust:100%}
#app{position:relative;width:100%;height:100%;max-width:560px;margin:0 auto}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
h1{font-size:30px;font-weight:900;text-align:center;letter-spacing:.02em;text-shadow:0 3px 0 rgba(0,0,0,.25)}
h2{font-size:22px;font-weight:800;color:var(--gold)}
img{display:block}

.screen{
  display:none;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;flex-direction:column;gap:10px;
  padding:calc(14px + var(--sat)) calc(14px + var(--sar)) calc(16px + var(--sab)) calc(14px + var(--sal));
}
.screen.active{display:flex}

.row{display:flex;flex-direction:row;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1 1 auto;min-width:0}
.small{font-size:14px}
.muted{opacity:.75}
.gold{color:var(--gold)}

/* cards, chips */
.card{background:var(--card);color:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 12px;border-radius:999px;background:rgba(0,0,0,.28);color:#fff;font-size:13px;font-weight:800;white-space:nowrap}
.card .chip{background:rgba(109,91,208,.14);color:var(--accent)}

/* buttons */
.btn{
  min-height:56px;padding:10px 16px;border-radius:14px;cursor:pointer;border:0;
  background:#fff;color:var(--ink);font-weight:900;font-size:18px;text-align:center;touch-action:manipulation;box-shadow:var(--shadow);
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.45;cursor:default}
.btn-seal{ /* name kept from old API: now the primary orange button */
  min-height:56px;border-radius:14px;background:var(--orange);color:#fff;border:0;font-weight:900;font-size:20px;
  display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer;
}
#btn-play,#btn-rematch,#btn-wager-go{min-height:60px;width:100%;font-size:22px;letter-spacing:.06em;text-transform:uppercase;background:var(--orange);color:#fff}
#btn-play{align-self:stretch}
#btn-home{min-height:60px;width:100%;background:#fff;color:var(--ink);font-size:20px}
#btn-report{min-height:44px;font-size:14px;background:rgba(0,0,0,.28);color:var(--lav);box-shadow:none;align-self:center;padding:6px 18px}
#btn-settings{width:52px;min-width:52px;height:52px;min-height:52px;padding:0;border-radius:50%;font-size:22px;flex:none;background:rgba(0,0,0,.28);color:#fff;box-shadow:none}
#btn-back{background:rgba(0,0,0,.28);color:#fff;box-shadow:none}
.btn.sel{outline:4px solid var(--gold);outline-offset:-4px}
#btn-mode-movie,#btn-mode-book{flex:1 1 0;min-height:48px;font-size:16px}
#btn-mode-movie.sel,#btn-mode-book.sel{background:var(--gold);color:var(--bg);outline:0}
#btn-rt-minus,#btn-rt-plus,#btn-readto-minus,#btn-readto-plus{min-width:52px;width:52px;padding:0;font-size:24px;min-height:48px}
#btn-reset-progress{background:var(--bad);color:#fff}

input[type=text],input[type=number],input:not([type]),textarea{
  min-height:48px;padding:6px 12px;border-radius:12px;background:#fff;color:var(--ink);font-weight:800;border:3px solid transparent;min-width:0;
}
input:focus,textarea:focus{outline:0;border-color:var(--gold)}
#in-name{width:100%;font-size:20px}
#in-readto{width:64px;text-align:center}
textarea{width:100%;font-size:14px;font-weight:600}

/* avatars (avatar.js) */
.av{border-radius:50%;border:3px solid #fff;overflow:hidden;display:grid;place-items:center;flex:none;font-weight:800;color:#fff;background:var(--bg2);position:relative}
.av img,.av canvas{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av-player{background:var(--blue);border-color:#fff;box-shadow:0 0 0 3px var(--blue)}
.av-rival{background:var(--orange);border-color:#fff;box-shadow:0 0 0 3px var(--orange)}
canvas{display:block;border-radius:50%;flex:none}

/* ---------- home ---------- */
#scr-home{gap:8px}
#scr-home .card{padding:8px 12px}
#scr-home h1{font-size:28px}
#home-build{font-size:11px;opacity:.55;text-align:center}
#home-warn{color:var(--gold);font-size:13px;font-weight:700;text-align:center}
#home-warn:empty{display:none}
#home-rival-name{font-size:17px;font-weight:900;color:var(--ink)}
#home-rival-step{font-size:13px;font-weight:800;color:var(--accent)}
#topic-row{display:flex;gap:8px}
.swatch{width:52px;height:52px;border-radius:50%;border:4px solid #fff;cursor:pointer;padding:0;flex:none;box-shadow:var(--shadow)}
.swatch.sel{box-shadow:0 0 0 4px var(--gold),var(--shadow)}
.topic-tile,.btn-topic{
  flex:1 1 0;min-width:0;min-height:72px;padding:8px 6px;border-radius:14px;cursor:pointer;border:0;
  background:#fff;color:var(--ink);text-align:center;font-weight:800;font-size:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;box-shadow:var(--shadow);border-bottom:6px solid var(--accent);
}
.btn-topic[data-topic=spells]{border-bottom-color:var(--violet)}
.btn-topic[data-topic=creatures]{border-bottom-color:var(--ok)}
.btn-topic[data-topic=places]{border-bottom-color:var(--teal)}
.topic-tile.sel,.btn-topic.sel{outline:4px solid var(--gold);outline-offset:-4px;background:#fff8dc}
.btn-topic img{width:36px;height:36px;border-radius:10px}

/* settings + tweak panel */
#scr-settings .foot{position:sticky;bottom:0;background:var(--bg);padding:6px 0;margin-top:auto;z-index:5}
.tweak-panel{background:rgba(0,0,0,.28);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px}
.tweak-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:700;min-height:40px}
.tweak-row input{width:84px;min-height:36px;flex:none;font-size:14px;padding:2px 8px}
.tweak-row input[type=text]{width:100%}
.tweak-panel .btn{min-height:44px;font-size:14px;padding:6px 10px;border-radius:12px}

/* ---------- versus intro ---------- */
#scr-vs{padding:0;gap:0;background:var(--deep);overflow:hidden}
#scr-vs .half,.vs-half{position:absolute;inset:0}
#scr-vs .bl,.vs-blue{background:var(--blue);clip-path:polygon(0 0,100% 0,0 100%)}
#scr-vs .or,.vs-orange{background:var(--orange);clip-path:polygon(100% 0,100% 100%,0 100%)}
#scr-vs .stripe,.vs-stripe{position:absolute;inset:0;background:#fff;opacity:.9;clip-path:polygon(calc(100% - 8px) 0,100% 0,8px 100%,0 100%)}
#scr-vs .vs-bg,#scr-vs>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
#scr-vs .p{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:46%}
#scr-vs .p.l{left:max(20px,var(--sal));top:calc(54px + var(--sat));animation:slide-l .25s ease-out both}
#scr-vs .p.r{right:max(20px,var(--sar));bottom:calc(96px + var(--sab));animation:slide-r .25s ease-out both}
#scr-vs .av,#scr-vs .big{width:140px;height:140px;border-width:6px;font-size:52px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
#scr-vs .n{font-size:26px;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.25);text-align:center;overflow-wrap:anywhere;line-height:1.1}
#scr-vs .lv{font-size:15px;font-weight:800;background:rgba(0,0,0,.3);padding:3px 12px;border-radius:999px;white-space:nowrap}
.badge{
  position:absolute;left:53%;top:45%;transform:translate(-50%,-50%) rotate(-8deg);width:112px;height:112px;border-radius:50%;
  background:var(--gold);color:var(--bg);display:grid;place-items:center;font-size:56px;font-weight:900;border:6px solid var(--bg);
  box-shadow:0 0 0 5px var(--gold),0 8px 0 5px rgba(0,0,0,.3);animation:slam .25s ease-out both;
}
#scr-vs .tp{position:absolute;left:0;right:0;bottom:calc(22px + var(--sab));text-align:center;font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:6px}
#scr-vs .tp b{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border-radius:999px;padding:8px 20px;font-size:17px;letter-spacing:.02em}
@media (max-width:360px){
  #scr-vs .av,#scr-vs .big{width:104px;height:104px;font-size:40px}
  #scr-vs .p{max-width:50%}
  #scr-vs .n{font-size:20px}
  .badge{width:92px;height:92px;font-size:46px}
}
@keyframes slide-l{from{transform:translateX(-60px);opacity:0}to{transform:none;opacity:1}}
@keyframes slide-r{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes slam{from{transform:translate(-50%,-50%) rotate(-8deg) scale(1.5)}to{transform:translate(-50%,-50%) rotate(-8deg)}}

/* ---------- duel: fits 475x638 and 344x882, no scroll ---------- */
#scr-duel{overflow:hidden;gap:10px}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;flex:none;min-height:88px}
#top-p,#top-r,.side{display:flex;flex-direction:column;align-items:center;width:112px;min-width:0;position:relative;flex:none}
#top-p .av,#top-r .av,.hdr .av{width:48px;height:48px;font-size:18px}
.nm,#top-p .pname,#top-r .rname{font-size:13px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#p-score,#r-score,.sc{font-size:32px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.mid{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;flex:1 1 auto}
#q-num,.rnd{background:rgba(0,0,0,.28);border-radius:999px;padding:4px 14px;font-weight:800;font-size:18px;white-space:nowrap}
#q-topic,.topic{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
#r-answered,#chip-rival-ans{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--orange);color:#fff;white-space:nowrap;z-index:2}
#r-answered:empty,#r-answered[hidden],#chip-rival-ans[hidden]{display:none}

.pop{position:absolute;top:-2px;pointer-events:none;font-size:20px;font-weight:900;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.3);animation:pop .25s ease-out both}
#top-p .pop,.side.l .pop{right:-6px}
#top-r .pop,.side.r .pop{left:-6px}
.pop.zero,.pop.neg{color:var(--lav)}
.chip.pop{position:static;font-size:15px;animation:none}
@keyframes pop{from{transform:translateY(8px) scale(.6)}to{transform:none}}

.tm{display:flex;align-items:center;gap:10px;flex:none}
#timer-bar{flex:1;height:22px;border-radius:11px;background:rgba(0,0,0,.35);overflow:hidden;position:relative}
#timer-fill{display:block;height:100%;width:100%;border-radius:11px;background:var(--ok);transition:width .25s linear,background-color .25s}
#timer-fill.mid{background:#facc15}
#timer-fill.low{background:var(--bad)}
#timer-num{font-size:32px;font-weight:900;min-width:52px;text-align:right;font-variant-numeric:tabular-nums;flex:none}

#q-text{
  background:var(--card);color:var(--ink);border-radius:20px;padding:12px 16px;font-size:22px;font-weight:800;line-height:1.22;text-align:center;
  flex:0 1 auto;min-height:88px;max-height:34%;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:4px;box-shadow:0 5px 0 rgba(0,0,0,.25);
}
#q-text .t,#q-text .q-label{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
#ans-wrap{display:flex;flex-direction:column;gap:10px;flex:1 1 auto;min-height:0}
.btn-ans{
  flex:1 1 0;min-height:60px;width:100%;background:#fff;color:var(--ink);border:0;border-left:12px solid var(--c,var(--blue));border-radius:14px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 14px 6px 16px;font-size:20px;font-weight:800;text-align:left;
  box-shadow:var(--shadow);position:relative;cursor:pointer;touch-action:manipulation;overflow:hidden;line-height:1.15;
}
.btn-ans:nth-child(1){--c:var(--blue)}.btn-ans:nth-child(2){--c:var(--orange)}.btn-ans:nth-child(3){--c:var(--violet)}.btn-ans:nth-child(4){--c:var(--teal)}
.btn-ans:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn-ans.ans-right{background:var(--ok);color:#fff;border-left-color:var(--ok-d);animation:flash .2s ease-out both}
.btn-ans.ans-wrong{background:var(--bad);color:#fff;border-left-color:var(--bad-d)}
.btn-ans.ans-dim{opacity:.55}
.mk{display:flex;gap:6px;flex:none}
.mark-p,.mark-r{width:30px;height:30px;border-radius:50%;border:2px solid #fff;overflow:hidden;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:none}
.mark-p{background:var(--blue)}.mark-r{background:var(--orange)}
.mark-p img,.mark-r img,.mark-p canvas,.mark-r canvas{width:100%;height:100%;object-fit:cover}
@keyframes flash{from{filter:brightness(1.6)}to{filter:none}}

#q-fact{background:#fff;color:var(--ink);border-radius:14px;border-left:8px solid var(--gold);font-size:14px;font-weight:700;line-height:1.25;padding:8px 12px;max-height:84px;overflow:hidden;flex:0 1 auto;box-shadow:var(--shadow)}
#q-fact:empty,#q-fact[hidden]{display:none}
#btn-next{flex:none;min-height:56px;width:100%;background:var(--orange);color:#fff;font-size:20px;text-transform:uppercase;letter-spacing:.06em}
#btn-next[hidden]{display:none}

@media (max-width:360px){
  #top-p,#top-r,.side{width:84px}
  #p-score,#r-score,.sc{font-size:26px}
  #q-text{font-size:19px;padding:10px 12px}
  .btn-ans{font-size:18px;padding-left:12px}
  #timer-num{font-size:26px;min-width:40px}
}
@media (max-height:660px){
  #scr-duel{gap:8px;padding-top:calc(10px + var(--sat));padding-bottom:calc(12px + var(--sab))}
  #ans-wrap{gap:8px}
  .hdr{min-height:84px}
}

/* ---------- wager ---------- */
#scr-wager,#scr-result{justify-content:safe center}
#wager-scores{display:flex;justify-content:space-around;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
#wager-note{background:rgba(0,0,0,.28);border-radius:14px;padding:8px 12px;text-align:center;font-weight:700;font-size:15px}
.btn-wtopic{
  flex:1 1 0;min-width:0;min-height:64px;border:0;border-radius:14px;background:#fff;color:var(--ink);font-weight:800;font-size:15px;
  box-shadow:var(--shadow);border-bottom:6px solid var(--accent);cursor:pointer;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px
}
.btn-wtopic.sel{outline:4px solid var(--gold);outline-offset:-4px}
#btn-x1,#btn-x2{flex:1 1 0;min-height:60px;font-size:24px;font-weight:900}
#btn-x2{background:var(--gold);color:var(--bg)}
#btn-x1.sel,#btn-x2.sel{outline:4px solid #fff;outline-offset:-4px}

/* ---------- result ---------- */
.banner-win,.banner-loss,.banner-draw{
  align-self:center;position:relative;text-align:center;font-size:44px;font-weight:900;letter-spacing:.08em;padding:6px 44px;margin-top:6px;
  background:var(--gold);color:var(--bg);clip-path:polygon(0 0,100% 0,calc(100% - 22px) 50%,100% 100%,0 100%,22px 50%);animation:slamr .25s ease-out both;
}
.banner-loss{background:var(--bad);color:#fff}
.banner-draw{background:var(--lav);color:var(--bg)}
@keyframes slamr{from{transform:scale(1.4)}to{transform:none}}
#res-scores,.res{display:flex;justify-content:space-around;align-items:flex-start}
#res-scores .av{width:64px;height:64px;font-size:22px}
#res-scores .win .av{box-shadow:0 0 0 4px var(--gold)}
#res-scores .sc{font-size:32px}
.bd,#res-k-wrap{background:rgba(0,0,0,.28);border-radius:16px;padding:10px 10px 12px}
#res-k,.bd h4{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--lav);margin-bottom:8px;text-align:center}
.cells,#res-cells{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.c{position:relative;border-radius:8px;text-align:center;padding:6px 0 5px;font-weight:800;font-size:14px;line-height:1.2;min-width:0}
.c small{display:block;font-size:11px;opacity:.9}
.c.g{background:var(--ok)}.c.r{background:var(--bad)}
.c .x2,.c .tag{position:absolute;top:-6px;right:-3px;background:var(--gold);color:var(--bg);font-size:10px;font-weight:900;border-radius:6px;padding:0 4px;line-height:14px}
.xp{display:flex;justify-content:space-between;align-items:center;background:#fff;color:var(--ink);border-radius:14px;padding:10px 16px;font-weight:800;font-size:18px;box-shadow:var(--shadow)}
#res-lv,.xp span:last-child{color:var(--accent)}
#res-seed{font-size:11px;opacity:.55;text-align:center}
#scr-result .btns{display:flex;flex-direction:column;gap:10px;margin-top:auto}

/* ---------- coordinator additions: avatar.js / ui-duel.js / ui-end.js class names ---------- */
.topic-img{border-radius:12px;object-fit:cover;flex:none;background:var(--bg2)}
.topic-fb{border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:900;flex:none;background:var(--violet)}
.emblem-img{object-fit:cover;flex:none;border-radius:50%;box-shadow:0 0 0 3px var(--gold)}
.emblem-fb{border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--bg);font-weight:900;flex:none;border:4px solid var(--bg);box-shadow:0 0 0 3px var(--gold)}
.av>img,.av>canvas{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}

/* VS (ui-duel) */
.vs-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.vs-p{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:46%}
.vs-p.vs-l{left:max(20px,var(--sal));top:calc(54px + var(--sat))}
.vs-p.vs-r{right:max(20px,var(--sar));bottom:calc(96px + var(--sab))}
#scr-vs.vs-in .vs-p.vs-l{animation:slide-l .25s ease-out both}
#scr-vs.vs-in .vs-p.vs-r{animation:slide-r .25s ease-out both}
.vs-p .av{width:140px;height:140px;border-width:6px;font-size:52px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.vs-name{font-size:26px;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.25);text-align:center;overflow-wrap:anywhere;line-height:1.1}
.vs-lv{font-size:15px;font-weight:800;background:rgba(0,0,0,.3);padding:3px 12px;border-radius:999px;white-space:nowrap}
.vs-badge{position:absolute;left:53%;top:45%;transform:translate(-50%,-50%) rotate(-8deg);width:112px;height:112px;border-radius:50%;background:var(--gold);color:var(--bg);display:grid;place-items:center;font-size:56px;font-weight:900;border:6px solid var(--bg);box-shadow:0 0 0 5px var(--gold),0 8px 0 5px rgba(0,0,0,.3)}
#scr-vs.vs-in .vs-badge{animation:slam .25s ease-out both}
.vs-topic,#vs-topic{position:absolute;left:0;right:0;bottom:calc(22px + var(--sab));text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.vs-topic-lbl{font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.vs-topic-chip{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border-radius:999px;padding:8px 20px;font-size:17px;font-weight:800}
@media (max-width:360px){.vs-p .av{width:104px;height:104px;font-size:40px}.vs-p{max-width:50%}.vs-name{font-size:20px}.vs-badge{width:92px;height:92px;font-size:46px}}

/* duel header scoping: .hdr .side vs .res .side */
.side{display:flex;flex-direction:column;align-items:center;position:relative;min-width:0}
.hdr .side{width:112px;flex:none}
.res .side{width:auto;flex:1 1 0}
.hdr .av,.av-slot .av{width:48px;height:48px;font-size:18px}
.av-slot{display:flex;justify-content:center}
.res .av{width:64px;height:64px;font-size:22px}
.res .side.win .av{box-shadow:0 0 0 4px var(--gold)}
.chip-answered{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--orange);color:#fff;white-space:nowrap;z-index:2;display:none}
.chip-answered.on{display:block}
.bar{flex:1;height:22px;border-radius:11px;background:rgba(0,0,0,.35);overflow:hidden;position:relative}
.bar.done{opacity:.45}
.sec{font-size:32px;font-weight:900;min-width:52px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.sec small{font-size:14px;font-weight:700;opacity:.8}
.qc{background:var(--card);color:var(--ink);border-radius:20px;padding:12px 16px;font-size:22px;font-weight:800;line-height:1.22;text-align:center;flex:0 1 auto;min-height:88px;max-height:34%;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:4px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.qc .t{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.ans{display:flex;flex-direction:column;gap:10px;flex:1 1 auto;min-height:0}
.btn-ans.ans-c0{--c:var(--blue)}.btn-ans.ans-c1{--c:var(--orange)}.btn-ans.ans-c2{--c:var(--violet)}.btn-ans.ans-c3{--c:var(--teal)}
.ans-text{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.btn-ans.ans-right,.btn-ans.ans-wrong{--c:inherit}
.q-fact{background:#fff;color:var(--ink);border-radius:14px;border-left:8px solid var(--gold);font-size:14px;font-weight:700;line-height:1.25;padding:8px 12px;max-height:84px;overflow:hidden;flex:0 1 auto;box-shadow:var(--shadow)}
.q-fact:empty,.q-fact[hidden]{display:none}
.btn-next{flex:none;min-height:56px;width:100%;background:var(--orange);color:#fff;font-size:20px;text-transform:uppercase;letter-spacing:.06em}
.btn-next[hidden]{display:none}
@media (max-width:360px){.hdr .side{width:84px}.sec{font-size:26px;min-width:40px}.qc{font-size:19px;padding:10px 12px}}

/* ui-end */
.rb{align-self:center;position:relative;background:var(--gold);color:var(--bg);font-size:44px;font-weight:900;letter-spacing:.08em;padding:6px 44px;margin-top:6px;clip-path:polygon(0 0,100% 0,calc(100% - 22px) 50%,100% 100%,0 100%,22px 50%);animation:slamr .25s ease-out both}
.rb.banner-loss{background:var(--bad);color:#fff}.rb.banner-draw{background:var(--lav);color:var(--bg)}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.btn.p{background:var(--orange);color:#fff}.btn.s{background:#fff;color:var(--ink)}
.btn-report{min-height:44px;font-size:14px;background:rgba(0,0,0,.28);color:var(--lav);box-shadow:none;align-self:center;padding:6px 18px}
.res-seed{font-size:11px;opacity:.55;text-align:center}
.c-x2{position:absolute;top:-6px;right:-3px;background:var(--gold);color:var(--bg);font-size:10px;font-weight:900;border-radius:6px;padding:0 4px;line-height:14px}
.wager-title{font-size:26px;font-weight:900;text-align:center;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.wager-lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--lav);text-align:center}
.wager-topics,.wager-mult{display:flex;gap:8px}
.btn-mult{flex:1 1 0;min-height:60px;font-size:24px;font-weight:900}
.btn-mult.sel{outline:4px solid var(--gold);outline-offset:-4px}
.wager-note{background:rgba(0,0,0,.28);border-radius:14px;padding:8px 12px;text-align:center;font-weight:700;font-size:15px}
#res-banner.rb,#res-banner{align-self:center}

/* ---------- integrator fixes (td-proto-2) ---------- */
/* home: cards are purple here, so text must be light */
#scr-home{padding-top:calc(8px + var(--sat));padding-bottom:calc(8px + var(--sab))}
#scr-home .card{color:#fff}
#home-rival-name{color:#fff}
#home-rival-step{color:var(--orange)}
/* settings: sticky footer covers the bottom padding too */
#scr-settings{padding-bottom:0}
#scr-settings .foot{padding-bottom:calc(12px + var(--sab))}
/* wager */
.rb.wager-title{color:var(--bg);text-shadow:none;font-size:26px;padding:8px 40px}
.btn-mult{border:0;border-radius:14px;background:#fff;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;touch-action:manipulation}
#btn-x2.btn-mult{background:var(--gold);color:var(--bg)}
#btn-x1.sel,#btn-x2.sel,.btn-mult.sel{outline:4px solid #fff;outline-offset:3px}
/* result */
#res-xp{background:none;box-shadow:none;padding:0}
.btn-report,#btn-report{border:0;border-radius:999px;font-weight:700;cursor:pointer}
/* duel: Next button + reveal compaction so the fact never overlaps the answers */
.btn-next,#btn-next{border:0;border-radius:14px;font-weight:900;box-shadow:var(--shadow);cursor:pointer;touch-action:manipulation}
.mark-p .av,.mark-r .av{width:100%;height:100%;border:0;box-shadow:none;font-size:12px}
#scr-duel.has-fact .btn-ans{min-height:56px}
@media (max-height:720px){
  #scr-duel.has-fact .tm{display:none}
  #scr-duel.has-fact #q-text{min-height:0;font-size:19px;padding:8px 14px}
}
/* narrow phones: score pops sit in the gap beside the score, not on the avatar */
@media (max-width:360px){
  .hdr .side.l .pop{right:-40px;top:64px;font-size:18px}
  .hdr .side.r .pop{left:-40px;top:64px;font-size:18px}
}
/* VS: keep rival block clear of the topic chip */
.vs-p.vs-r{bottom:calc(112px + var(--sab))}

/* art (td-proto-2b): images fill their circle; vs-bg is a low-opacity texture over the blue/orange split */
.av>img.av-img{object-fit:cover;border-radius:50%}
#scr-vs .vs-bg{z-index:1;opacity:.22;mix-blend-mode:soft-light;pointer-events:none}
#scr-vs .vs-bg img{display:block;width:100%;height:100%;object-fit:cover}
#scr-vs .vs-stripe{z-index:1}
#scr-vs .vs-p,#scr-vs .vs-badge,#scr-vs .badge,#scr-vs .vs-topic{z-index:2}

/* ---------- dev badge ---------- */
#dev-badge{
  position:fixed;bottom:calc(4px + var(--sab));left:calc(4px + var(--sal));z-index:99;width:22px;height:22px;border-radius:50%;display:none;
  align-items:center;justify-content:center;background:var(--orange);border:2px solid #fff;color:#fff;font-size:10px;font-weight:900;pointer-events:none;
}
#dev-badge.on{display:flex}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .pop{opacity:1;transform:none}
}

/* buttons.css - raised 3D game buttons. Loaded AFTER style.css (overrides only).
   Admin defaults: radius 16, lip 6px, press = translateY(4px) + lip 2px in 80ms. */
:root{--lip-h:6px;--lip-p:2px;--press-y:4px;--lip-neutral:#a9a3dc;--ok-lip:#15803d;--bad-lip:#991b1b;--dim-lip:#8a82bd}

/* shared raised behaviour */
.btn,.btn-seal,.btn-ans,.btn-topic,.btn-wtopic,.btn-mult,#btn-next,.btn-next,
#btn-play,#btn-rematch,#btn-home,#btn-wager-go,#btn-x1,#btn-x2,#btn-mode-movie,#btn-mode-book{
  border:0;border-radius:16px;position:relative;
  --lip:var(--lip-neutral);
  box-shadow:0 var(--lip-h) 0 var(--lip),0 calc(var(--lip-h) + 3px) 8px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.7);
  transition:transform 80ms ease-out,box-shadow 80ms ease-out,filter 80ms;
  margin-bottom:var(--lip-h);
}
.btn:active,.btn.pressed,.btn-seal:active,.btn-ans:active,.btn-ans.pressed,.btn-topic:active,.btn-wtopic:active,.btn-mult:active,
#btn-next:active,.btn-next:active,#btn-play:active,#btn-rematch:active,#btn-home:active,#btn-wager-go:active,
#btn-x1:active,#btn-x2:active,#btn-mode-movie:active,#btn-mode-book:active{
  transform:translateY(var(--press-y));
  box-shadow:0 var(--lip-p) 0 var(--lip),inset 0 2px 0 rgba(255,255,255,.5);
}
.btn:disabled{box-shadow:0 var(--lip-h) 0 var(--lip);transform:none}

/* white-face buttons: gradient top highlight */
.btn,.btn-topic,.btn-wtopic,.btn-mult,#btn-home,.btn.s,#btn-mode-movie,#btn-mode-book{
  background:linear-gradient(#fff,#eef0ff);color:var(--ink);
}
/* orange primaries */
#btn-next,.btn-next,#btn-play,#btn-rematch,#btn-wager-go,.btn.p,.btn-seal{
  background:linear-gradient(#ff9a45,var(--orange));color:#fff;--lip:#c24e00;
  text-shadow:0 2px 0 rgba(0,0,0,.2);
}
#btn-x2,#btn-x2.btn-mult{background:linear-gradient(#ffe273,var(--gold));color:var(--bg);--lip:#c99a00}
#btn-x1{--lip:var(--lip-neutral)}
#btn-mode-movie.sel,#btn-mode-book.sel{background:linear-gradient(#ffe273,var(--gold));--lip:#c99a00}
#btn-reset-progress{background:linear-gradient(#f56565,var(--bad));--lip:var(--bad-lip);color:#fff}
.btn-topic[data-topic=spells]{--lip:#7e2fd0}.btn-topic[data-topic=creatures]{--lip:var(--ok-lip)}.btn-topic[data-topic=places]{--lip:#0e8f81}
.btn-topic,.btn-wtopic{border-bottom:0}
.btn-wtopic{--lip:#7e2fd0}
.btn.sel,.btn-topic.sel,.btn-wtopic.sel,.btn-mult.sel{outline:3px solid var(--gold);outline-offset:2px}
/* flat utility buttons stay flat */
#btn-report,#btn-settings,#btn-back,.btn-report{box-shadow:none;margin-bottom:0;background:rgba(0,0,0,.28)}
#btn-report:active,#btn-settings:active,#btn-back:active{box-shadow:none;transform:translateY(2px)}
#btn-settings{border-radius:50%}

/* answer bars */
#ans-wrap,.ans{gap:12px}
.btn-ans{
  --lip:var(--lip-neutral);--c:var(--blue);
  min-height:60px;border-left:0;border-radius:16px;overflow:hidden;
  padding:8px 14px 8px 34px;font-size:21px;font-weight:800;color:var(--ink);
  background:linear-gradient(#fff,#eef0ff);
}
.btn-ans::before{ /* coloured inset pill tab */
  content:"";position:absolute;left:9px;top:10px;bottom:10px;width:9px;border-radius:6px;
  background:var(--c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);
}
.btn-ans .ans-text{order:0}
.btn-ans .mk{order:2}
.btn-ans::after{order:1;font-size:26px;font-weight:900;line-height:1;flex:none}
.btn-ans.ans-c0,.btn-ans:nth-child(1){--c:var(--blue)}
.btn-ans.ans-c1,.btn-ans:nth-child(2){--c:var(--orange)}
.btn-ans.ans-c2,.btn-ans:nth-child(3){--c:var(--violet)}
.btn-ans.ans-c3,.btn-ans:nth-child(4){--c:var(--teal)}
.btn-ans.ans-right,.btn-ans.ans-wrong{--c:inherit}
.btn-ans.ans-right{background:linear-gradient(#4ade80,var(--ok));color:#fff;--lip:var(--ok-lip);animation:flash .2s ease-out both}
.btn-ans.ans-right::before{background:var(--ok-lip)}
.btn-ans.ans-right::after{content:"\2713";color:#fff}
.btn-ans.ans-wrong{background:linear-gradient(#f05252,#dc2626);color:#fff;--lip:var(--bad-lip)}
.btn-ans.ans-wrong::before{background:var(--bad-lip)}
.btn-ans.ans-wrong::after{content:"\2715";color:#fff}
.btn-ans.ans-dim{opacity:1;background:#a9a1d6;color:rgba(28,21,64,.62);--lip:var(--dim-lip);box-shadow:0 var(--lip-h) 0 var(--lip),inset 0 2px 0 rgba(255,255,255,.35)}
.btn-ans.ans-dim::before{background:#8a82bd;box-shadow:none}
.btn-ans.ans-right:active,.btn-ans.ans-wrong:active,.btn-ans.ans-dim:active{transform:none}
.btn-ans .mk{display:flex}
#scr-duel.has-fact .btn-ans{min-height:56px}

/* fit small screens */
@media (max-height:660px){#ans-wrap,.ans{gap:10px}.btn-ans{min-height:60px}}
@media (max-width:360px){.btn-ans{font-size:19px;padding-left:32px}}
@media (prefers-reduced-motion:reduce){
  .btn,.btn-seal,.btn-ans,.btn-topic,.btn-wtopic,.btn-mult,#btn-next,.btn-next,#btn-play,#btn-rematch,#btn-home,#btn-wager-go,#btn-x1,#btn-x2{transition:none;animation:none}
}
/* home: selected mode is blue (set inline by ui-home.js) -> blue lip; picked topic tile = gold ring + warm face */
#btn-mode-movie.sel,#btn-mode-book.sel{--lip:#1d4fd8}
.btn-topic.sel{background:linear-gradient(#fffbea,#fff1c2)}
/* home: the 10px flex gap already clears a 6px lip, so no extra margin (keeps home scroll-free at 475x638) */
#scr-home .btn,#scr-home .btn-seal,#scr-home #btn-play{margin-bottom:0}

/* qcard.css: question hero panel + timer (Maker Q). Loaded after style.css. */
#scr-duel{isolation:isolate} /* stays position:absolute from .screen (full height) */
#scr-duel::before{content:"";position:absolute;left:50%;top:44%;width:130%;aspect-ratio:1;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(61,42,156,.95),rgba(61,42,156,0) 70%);z-index:-1;pointer-events:none}
.tm{gap:0;position:relative;margin-bottom:-2px}
#timer-bar{height:26px;border-radius:13px;background:rgba(8,4,40,.7);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.08);overflow:hidden}
#timer-fill{border-radius:13px;box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
#timer-num{width:44px;min-width:44px;height:44px;margin-left:-30px;border-radius:50%;background:#fff;color:#1c1540;font-size:22px;font-weight:900;
  display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 3px 0 #c9c3ef;z-index:1}
#timer-num small{font-size:11px;margin-left:1px;font-weight:800}
#timer-bar.low{background:rgba(120,10,10,.6)}
#timer-bar.low #timer-fill{background:#ef4444!important}
#timer-num.low{color:#dc2626;animation:qpulse .5s ease-in-out infinite alternate}
@keyframes qpulse{from{transform:scale(1)}to{transform:scale(1.14)}}
#q-text{background:#fff;border-radius:20px;box-shadow:0 6px 0 #c9c3ef,0 14px 24px rgba(20,8,80,.45);padding:10px 16px 14px;
  font-size:25px;font-weight:900;line-height:1.2;min-height:22vh;max-height:none;justify-content:flex-start;gap:0;text-align:center;overflow:hidden;margin-bottom:4px}
#q-text.long{font-size:21px}

#q-text .t{font-size:12px;font-weight:900;color:#6d4fe0;letter-spacing:.1em;text-transform:uppercase}
#q-text .qh-topic{display:inline-flex;align-items:center;gap:5px;min-width:0}
#q-text .qh-topic>*:first-child{width:22px;height:22px;flex:none}
#q-text .qh-lbl{font-size:11px;font-weight:800;color:#6d4fe0;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#q-text .qb{flex:1;display:flex;align-items:center;justify-content:center;padding-top:6px;color:#1c1540}
#scr-duel.has-fact #q-text{min-height:0;font-size:19px;padding:6px 14px 8px;margin-bottom:0}
@media (max-width:360px){#q-text{font-size:21px}#q-text.long{font-size:18px}#timer-num{font-size:20px}}
@media (max-height:720px){#q-text{min-height:20vh}}
@media (prefers-reduced-motion:reduce){#timer-num.low{animation:none}#timer-fill{transition:none}}
/* tall phones: answers stay chunky but capped; the hero panel takes the spare height */
.btn-ans{max-height:88px}

  function defaults() { return TD.DEFAULTS || {}; }
  function ls() { try { return (typeof localStorage !== 'undefined') ? localStorage : null; } catch (e) { return null; } }
  function load(key, fallback) {
    try { var s = ls(); var raw = s && s.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
  }

  var cfg = {};

    var d = defaults(), k;

    }
  })();

  function diffs() {
    var d = defaults(), out = {}, k;

  }

  function refreshBadge() {
    try {
      if (typeof document === 'undefined') return;
      var b = document.getElementById('dev-badge');

    } catch (e) {}

  function set(key, value) {
    var v = Number(value);
    if (!isFinite(v)) return;
    cfg[key] = v;
    save(CFG_KEY, diffs());
    refreshBadge();
  }

  function report(state) {
    state = state || {};

    var step = state.rivalStep, rname = '?';
    for (var i = 0; i < rivals.length; i++) if (rivals[i].step === step) rname = rivals[i].name;
    var df = diffs(), dk = Object.keys(df);
    var lines = [];
    lines.push('Build: ' + (TD.BUILD || '?'));
    lines.push('Seed: ' + state.seed + '  Mode: ' + state.mode + '  ReadUpTo: ' + state.readUpTo);
    lines.push('Picked topic: ' + state.pickedTopic + '  Wager topic: ' + state.wagerTopic);

        panel.appendChild(row);

      panel.appendChild(btn('Reset all', function () {
        applyDiffs({}); changed(); render();
      }));

      var nameIn = document.createElement('input');

      var r1 = el('div', 'tweak-row'); r1.appendChild(nameIn); panel.appendChild(r1);

      var r2 = el('div', 'tweak-row');
      r2.appendChild(btn('Save preset', function () {

        if (!n) return;
        presets[n] = diffs(); save(PRE_KEY, presets); render();
      }));
      var cb = btn('Copy report', function () {
        copy(report(tweak.lastState)).then(function () { flash(cb, 'Copied'); }, function () { flash(cb, 'Failed'); });
      });
      r2.appendChild(cb);
      panel.appendChild(r2);

      Object.keys(presets).forEach(function (n) {

        r.appendChild(btn('Load', function () { applyDiffs(presets[n]); changed(); render(); }));
        r.appendChild(btn('Delete', function () { delete presets[n]; save(PRE_KEY, presets); render(); }));
        panel.appendChild(r);
      });

      var cc = btn('Copy preset code', function () {
        copy(encode(diffs())).then(function () { flash(cc, 'Copied'); }, function () { flash(cc, 'Failed'); });
      });
      panel.appendChild(cc);

      var ta = document.createElement('textarea');
      ta.rows = 2; ta.placeholder = 'Paste preset code';
      panel.appendChild(ta);
      var ap = btn('Apply code', function () {
        try { applyDiffs(decode(ta.value)); changed(); render(); } catch (e) { flash(ap, 'Bad code'); }
      });
      panel.appendChild(ap);

      container.appendChild(panel);
    }
    render();
  }

    s.appendChild(h('div', { class: 'wager-mult' }, [
      h('button', { id: 'btn-x1', class: 'btn-mult', type: 'button', text: 'x1 safe' }),
      h('button', { id: 'btn-x2', class: 'btn-mult', type: 'button', text: 'x2 wager' })
    ]));
    s.appendChild(h('div', { id: 'wager-note', class: 'wager-note' }));
    s.appendChild(h('div', { class: 'btns' }, [h('button', { id: 'btn-wager-go', class: 'btn p', type: 'button', text: 'GO' })]));
  };

  ui.renderWager = function (st) {
    var c = cfg();
    var sc = $('wager-scores');
    sc.innerHTML = '';
    sc.appendChild(side('p', st, st.pScore));
    sc.appendChild(side('r', st, st.rScore));
    var t = document.querySelectorAll('#scr-wager .btn-wtopic');
    for (var i = 0; i < t.length; i++) t[i].classList.toggle('sel', t[i].getAttribute('data-topic') === st.wagerTopic);
    $('btn-x1').classList.toggle('sel', st.pMult === 1);
    $('btn-x2').classList.toggle('sel', st.pMult !== 1);
    $('wager-note').textContent = 'Right on x' + c.wagerMult + ' scores double. Miss on x' + c.wagerMult + ' loses ' + c.wagerMissCost + '.';
  };

  // ---------- result ----------
  ui.buildResult = function () {
    var s = $('scr-result');
    s.innerHTML = '';
    s.appendChild(h('div', { id: 'res-banner', class: 'rb' }));
    s.appendChild(h('div', { id: 'res-scores', class: 'res' }));
    s.appendChild(h('div', { class: 'bd' }, [h('h4', { id: 'res-k' }), h('div', { id: 'res-cells', class: 'cells' })]));
    s.appendChild(h('div', { class: 'xp' }, [h('span', { id: 'res-xp' }), h('span', { id: 'res-lv' })]));
    s.appendChild(h('div', { class: 'btns' }, [
      h('button', { id: 'btn-rematch', class: 'btn p', type: 'button', text: 'Rematch' }),
      h('button', { id: 'btn-home', class: 'btn s', type: 'button', text: 'Home' }),
      h('button', { id: 'btn-report', class: 'btn-report', type: 'button', text: 'Copy report' })
    ]));
    s.appendChild(h('div', { id: 'res-seed', class: 'res-seed' }));
  };

  ui.renderResult = function (st, xpGain, topicLevel) {
    var r = st.result;
    var b = $('res-banner');
    b.className = 'rb ' + (r === 'win' ? 'banner-win' : r === 'loss' ? 'banner-loss' : 'banner-draw');
    b.textContent = r === 'win' ? 'WIN' : r === 'loss' ? 'LOSS' : 'DRAW';
    var sc = $('res-scores');
    sc.innerHTML = '';
    sc.appendChild(side('p', st, st.pScore, r === 'win' ? 'win' : ''));
    sc.appendChild(side('r', st, st.rScore, r === 'loss' ? 'win' : ''));
    var log = st.log || [], k = 0, cells = $('res-cells');
    cells.innerHTML = '';
    log.forEach(function (l, i) {
      if (l.pRight) k++;
      var cell = h('div', { class: 'c ' + (l.pRight ? 'g' : 'r') }, [
        document.createTextNode(String(i + 1)),
        h('small', { text: (l.pPts < 0 ? '' : '+') + l.pPts })
      ]);
      if (i === 6 && st.pMult > 1) cell.appendChild(h('small', { class: 'c-x2', text: 'x' + st.pMult }));
      cells.appendChild(cell);
    });
    $('res-k').textContent = k + ' OF 7 RIGHT';
    $('res-xp').textContent = '+' + xpGain + ' XP';
    var lbl = ui.topicLabel ? ui.topicLabel(st.pickedTopic) : st.pickedTopic;
    $('res-lv').textContent = lbl + ' Lv ' + topicLevel;
    $('res-seed').textContent = 'Seed ' + st.seed;
    $('btn-report').textContent = 'Copy report';
  };
})();

</script>
<script>if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script>
