<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Project Volley</title>
<style>
:root{
  --sand:#e9dcbf; --sand2:#cdbb94; --ink:#14130f; --gun:#26292b; --gun2:#33373a; --panel:rgba(22,23,24,.92);
  --cyan:#43d3e3; --cyanD:#0e5a63; --red:#e2463c; --hp:#5fd06a; --amber:#f0b54a; --mut:#b9b2a2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1b1a17;color:var(--sand);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#stage{position:absolute;left:0;top:0;overflow:hidden;touch-action:none;background:#c9b48a;flex:none}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
/* HUD */
#hud{position:absolute;left:0;top:0;right:0;pointer-events:none;z-index:10}
#hudTop{display:flex;align-items:center;gap:6px;height:44px;padding:4px 4px 0 6px;background:linear-gradient(#1d1e1fee,#1d1e1fcc)}
#stageLbl{font-weight:700;font-size:13px;white-space:nowrap;color:var(--sand);background:var(--gun);border:1px solid #4a4d4f;border-radius:6px;padding:3px 6px}
#stageLbl b{color:#fff}
#lvl{font-weight:800;font-size:13px;color:#0d1b1d;background:var(--cyan);border-radius:6px;padding:3px 6px;white-space:nowrap}
#xpWrap{flex:1;height:8px;border-radius:4px;background:#0c0d0e;border:1px solid #45494c;overflow:hidden;min-width:30px}
#xpFill{height:100%;width:0;background:var(--cyan)}
#gear{pointer-events:auto;width:56px;height:56px;margin:-6px -4px -6px 0;border:0;background:transparent;color:var(--sand);font-size:24px;line-height:56px;padding:0;cursor:pointer}
#gear span{display:inline-block;width:36px;height:36px;line-height:34px;border-radius:8px;background:var(--gun);border:1px solid #55595c}
#hpRow{position:relative;height:18px;margin:0 6px;border-radius:0 0 6px 6px;background:#0c0d0e;border:1px solid #45494c;border-top:0;overflow:hidden}
#hpFill{height:100%;width:100%;background:var(--hp);transition:width .12s}
#hpTxt{position:absolute;inset:0;text-align:center;font-size:12px;font-weight:800;line-height:18px;color:#0b1416}
#rlbl{position:absolute;left:6px;bottom:6px;font:11px/1.2 ui-monospace,Menlo,Consolas,monospace;color:#1b1a17;background:rgba(233,220,191,.85);padding:2px 5px;border-radius:4px;pointer-events:none;z-index:10}
#toast{position:absolute;left:50%;transform:translateX(-50%);max-width:40%;text-align:center;font-weight:700;font-size:13px;color:var(--sand);background:var(--panel);
  border:1px solid var(--cyanD);border-radius:8px;padding:6px 8px;pointer-events:none;z-index:11;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
#flash{position:absolute;inset:0;pointer-events:none;z-index:9;box-shadow:inset 0 0 40px 14px rgba(226,40,30,.85);opacity:0;transition:opacity .25s ease-out}
#flash.on{opacity:1;transition:none}
body.ovon #hud, body.ovon #toast, body.ovon #rlbl{visibility:hidden}
/* overlays */
.ov{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;
  background:rgba(20,19,16,.94);text-align:center}
.ov.on{display:flex}
.ov h2{margin:0;font-size:22px;color:#fff;letter-spacing:.5px}
.ov p{margin:0;color:var(--sand);max-width:300px}
.btn{min-height:56px;min-width:120px;padding:8px 18px;border-radius:10px;border:0;font:700 17px system-ui,sans-serif;background:var(--cyan);color:#0b1416;cursor:pointer}
.btn.ghost{background:var(--gun2);color:var(--sand);border:1px solid #5a5e61}
.card{width:100%;max-width:300px;min-height:84px;border-radius:12px;border:2px solid var(--cyan);background:var(--gun);color:var(--sand);padding:10px 12px;text-align:left;cursor:pointer;font:inherit}
.card b{display:block;font-size:17px;color:#fff;margin-bottom:3px}
.card span{font-size:14px;color:var(--sand)}
#deadStats{font-size:14px;color:var(--sand);line-height:1.5}
#coverNote{position:absolute;display:none;font-size:13px;color:var(--sand);background:var(--gun);border:1px solid #4a4d4f;border-radius:8px;padding:8px 10px;z-index:40;max-width:260px}
/* drawer */
#drawer{position:absolute;top:0;right:0;bottom:0;width:100%;z-index:50;background:rgba(18,18,17,.97);display:none;flex-direction:column}
#drawer.on{display:flex}
#drHead{display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid #3c3f42;flex-wrap:wrap}
#drHead h3{margin:0 auto 0 4px;font-size:16px;color:#fff}
#drBody{flex:1;overflow-y:auto;padding:4px 10px 20px;touch-action:pan-y}
#drBody h4{margin:12px 0 2px;font-size:13px;color:var(--cyan);text-transform:uppercase;letter-spacing:1px}
.kn{padding:4px 0;border-bottom:1px solid #2b2d2f}
.kn label{display:flex;justify-content:space-between;font-size:12px;color:var(--sand)}
.kn label i{font-style:normal;color:#fff;font-family:ui-monospace,Menlo,monospace}
.kn input[type=range]{width:100%;height:36px;margin:0;accent-color:var(--cyan)}
.kn .tg{min-height:56px;width:100%;margin-top:2px}
#drMsg{font-size:12px;color:var(--amber);min-height:16px;padding:0 10px}
#copyArea{position:absolute;left:-9999px;top:0;width:10px;height:10px}
</style>

(function(){ var G = (typeof window !== 'undefined' ? window : globalThis); var V = G.V = G.V || {};
// Tuning knobs. V.TUNE is the live copy the drawer mutates; the sim reads S.tune every step.
V.TUNE_DEFAULTS = {
  // enemies / scaling (DESIGN 11)
  ENEMY_HP_GLOBAL: 0.72, HP_SLOPE: 0.036, DMG_SLOPE: 0.012,
  ENEMY_DMG_MULT: 1, ENEMY_SHOT_SPEED_MULT: 1, TELL_MULT: 1,
  // hero (D1 2)
  HERO_HP: 600, HERO_ATK: 150, CRIT_CHANCE: 0.05, CRIT_MULT: 2,
  MOVE_SPEED: 4.5, BRACE_DELAY: 0.15, FIRE_INTERVAL: 0.8, FIRE_FLOOR: 0.2,
  ROUND_SPEED: 14, ROUND_R: 0.12, INVULN: 0.6, PICKUP_R: 0.9,
  // run
  CARDS_OFFERED: 2, TIME_SCALE: 1, PICK_DELAY: 1.0, SPAWN_T: 0.6,
  // feel / input (shell side)
  HITSTOP_MS: 50, DEADZONE_ENTER: 14, DEADZONE_EXIT: 8, HAPTICS: true, SOUND: true
};
V.TUNE = {};
for (var k in V.TUNE_DEFAULTS) V.TUNE[k] = V.TUNE_DEFAULTS[k];
})();

</script>
<script>
(function(){ var G = (typeof window !== 'undefined' ? window : globalThis); var V = G.V = G.V || {};
// mulberry32; state in .s so it can be hashed/inspected.
function Rng(seed){
  if (!(this instanceof Rng)) return new Rng(seed);
  this.s = (seed >>> 0) ^ 0x9E3779B9;
  if (this.s === 0) this.s = 1;
}
Rng.prototype.next = function(){
  var t = (this.s = (this.s + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
Rng.prototype.int = function(n){ return Math.floor(this.next() * n); };
Rng.prototype.range = function(a, b){ return a + (b - a) * this.next(); };
V.Rng = Rng;
})();

</script>

};
V.ROOM_ORDER = ['R01', 'R02', 'R03'];

// P0 card pool (D2 IDs and values). max = copies allowed per run.
V.CARDS = [
  { id:'SK-01', key:'front', max:1, name:'Twin Barrel',     desc:'+1 forward round. All rounds deal x0.75.' },

<script>
(function(){ var G = (typeof window !== 'undefined' ? window : globalThis); var V = G.V = G.V || {};
// Pure deterministic sim. Fixed step 1/60 s x TIME_SCALE. No DOM, no unseeded randomness, no wall clock.

var STEP = 1 / 60;
var HERO_WALL_R = 0.35, HERO_HURT_R = 0.28;
var LEVEL_COST = [0, 0, 25, 35, 50, 65, 90, 125, 175, 245, 335, 465]; // index = level reached
var LEVEL_CAP = 11;
var SHOT_R = 0.15;
var RETARGET_DT = 0.1, LOCK_HYST = 1.0, LOST_LINE_T = 0.25;
var CONTACT_CD = 1.0, MAGNET_SPEED = 14;
var REPAIR_PCT = 0.2, REPAIR_BASE = 0.03, REPAIR_PITY = 0.005, REPAIR_CAP = 0.08, REPAIR_LIFE = 15;
var MULTI_GAP = 0.12;
var DIAG_ANG = [35, 55, 75];
var RICO_MAX = 3, RICO_MULT = 0.7, RICO_RANGE = 4;

// D1 4 base stats (ch1 stage 1)
var EN = {
  'E-01': { hp:300, contact:60, atk:60, speed:2.4, r:0.35, size:'small',  xp:4 },
  'E-02': { hp:450, contact:40, atk:60, speed:1.0, r:0.40, size:'medium', xp:8 },
  'E-03': { hp:600, contact:40, atk:45, speed:0,   r:0.50, size:'medium', xp:8 }
};
var E01 = { range:2.5, tell:0.5, lungeSpeed:6.0, lungeDist:3.0, cool:2.0 };
var E02 = { tell:0.6, lockLast:0.2, cool:2.2, shotSpeed:6.0, range:10, prefer:4.5 };
var E03 = { tell:0.7, cool:2.8, shotSpeed:5.0, spread:25 * Math.PI / 180, range:14 };

function cardCount(S, key){ return S.hero.mods[key] || 0; }
function hpScale(S){ var t = S.tune; return t.ENEMY_HP_GLOBAL * (1 + t.HP_SLOPE * (S.stage - 1)); }
function enemyDmg(S, base){
  var t = S.tune;
  return Math.max(1, Math.floor(base * t.ENEMY_DMG_MULT * (1 + t.DMG_SLOPE * (S.stage - 1))));
}
function ev(S, o){ S.events.push(o); return o; }

// ---------- geometry ----------
function circleRectPush(cx, cy, r, b){
  // returns [px,py] push to move the circle out, or null
  var nx = cx < b.x ? b.x : (cx > b.x + b.w ? b.x + b.w : cx);
  var ny = cy < b.y ? b.y : (cy > b.y + b.h ? b.y + b.h : cy);
  var dx = cx - nx, dy = cy - ny, d2 = dx * dx + dy * dy;
  if (d2 >= r * r) return null;
  if (d2 > 1e-12) { var d = Math.sqrt(d2), k = (r - d) / d; return [dx * k, dy * k]; }
  // centre inside: push along the smallest axis
  var l = cx - b.x + r, rr = b.x + b.w - cx + r, u = cy - b.y + r, dn = b.y + b.h - cy + r;
  var m = Math.min(l, rr, u, dn);
  if (m === l) return [-l, 0]; if (m === rr) return [rr, 0]; if (m === u) return [0, -u]; return [0, dn];
}
function circleRect(cx, cy, r, b){
  var nx = cx < b.x ? b.x : (cx > b.x + b.w ? b.x + b.w : cx);
  var ny = cy < b.y ? b.y : (cy > b.y + b.h ? b.y + b.h : cy);
  var dx = cx - nx, dy = cy - ny; return dx * dx + dy * dy < r * r;
}
// segment vs AABB expanded by pad (slab test)
function segRect(x1, y1, x2, y2, b, pad){
  var minx = b.x - pad, maxx = b.x + b.w + pad, miny = b.y - pad, maxy = b.y + b.h + pad;
  var dx = x2 - x1, dy = y2 - y1, t0 = 0, t1 = 1, p, q, i, r;
  var P = [-dx, dx, -dy, dy], Q = [x1 - minx, maxx - x1, y1 - miny, maxy - y1];
  for (i = 0; i < 4; i++) {
    p = P[i]; q = Q[i];
    if (Math.abs(p) < 1e-12) { if (q < 0) return false; }
    else { r = q / p; if (p < 0) { if (r > t1) return false; if (r > t0) t0 = r; } else { if (r < t0) return false; if (r < t1) t1 = r; } }
  }
  return true;
}
function blockers(S){
  var a = S.room.solids;
  if (!S.room.door.open) return a.concat([S.room.door]);
  return a;
}
function clearLine(S, x1, y1, x2, y2, pad){
  var a = blockers(S);
  for (var i = 0; i < a.length; i++) if (segRect(x1, y1, x2, y2, a[i], pad)) return false;
  return true;
}
function hitsSolid(S, x, y, r){
  var a = blockers(S);
  for (var i = 0; i < a.length; i++) if (circleRect(x, y, r, a[i])) return true;
  return false;
}
function outOfRoom(S, x, y, r){ return x < -r || x > S.room.w + r || y < -r || y > S.room.h + r; }
function collideBody(S, o, r){
  var a = blockers(S), i, p;
  for (var it = 0; it < 2; it++) {
    for (i = 0; i < a.length; i++) { p = circleRectPush(o.x, o.y, r, a[i]); if (p) { o.x += p[0]; o.y += p[1]; } }
  }
  if (o.x < r) o.x = r; if (o.x > S.room.w - r) o.x = S.room.w - r;
  if (o.y < r) o.y = r; if (o.y > S.room.h - r) o.y = S.room.h - r;
}

// ---------- room build ----------
function buildSolids(grid, coverKind){
  var rows = grid.length, cols = grid[0].length, runs = [], y, x, s;
  for (y = 0; y < rows; y++) {
    x = 0;
    while (x < cols) {
      if (grid[y][x] === '#') { s = x; while (x < cols && grid[y][x] === '#') x++; runs.push({ x:s, y:y, w:x - s, h:1, kind: y === 0 ? 'wall' : coverKind }); }
      else x++;
    }
  }
  // merge identical runs vertically
  var out = [];
  for (var i = 0; i < runs.length; i++) {
    var r = runs[i], merged = false;
    for (var j = 0; j < out.length; j++) {
      var o = out[j];
      if (o.x === r.x && o.w === r.w && o.kind === r.kind && o.y + o.h === r.y) { o.h++; merged = true; break; }
    }
    if (!merged) out.push({ x:r.x, y:r.y, w:r.w, h:r.h, kind:r.kind });
  }
  return out;
}
function findChar(grid, ch){
  for (var y = 0; y < grid.length; y++) { var x = grid[y].indexOf(ch); if (x >= 0) return { x:x, y:y }; }
  return null;
}

function spawnEnemy(S, type, x, y){
  var b = EN[type], hp = Math.max(1, Math.round(b.hp * hpScale(S)));
  var e = { id: ++S._nextId, type:type, x:x, y:y, r:b.r, hp:hp, maxHp:hp, ang:Math.PI / 2, st:'spawn',
    tell01:0, aimAng:Math.PI / 2, flashT:0, size:b.size,
    stT:S.tune.SPAWN_T, cd:0, contactCd:0, vx:0, vy:0, strafe: S.rng.next() < 0.5 ? -1 : 1, strafeT:S.rng.range(1.2, 2.4), lungeLeft:0 };
  // first attack delay
  if (type === 'E-02') e.cd = S.rng.range(0.6, 1.4);
  if (type === 'E-03') e.cd = S.rng.range(0.8, 1.6);
  S.enemies.push(e);
  return e;
}

function loadRoom(S, roomId){
  var R = V.ROOMS[roomId], grid = R.grid;
  var d = findChar(grid, 'D'), sp = findChar(grid, 'S');
  S.roomId = roomId;
  S.room = { w:grid[0].length, h:grid.length, solids:buildSolids(grid, R.cover || 'pillar'),
    door:{ x:d.x, y:d.y, w:1, h:1, open:false }, name:R.name };
  S.enemies = []; S.rounds = []; S.shots = []; S.pickups = [];
  var h = S.hero;
  h.x = sp.x + 0.5; h.y = sp.y + 0.5; h.ang = -Math.PI / 2;
  h.lockId = null; h.lockClear = false; h.lostT = 0; h.retargetT = 0; h.burstQ = [];
  S.phase = 'play'; S.roomT = 0; S.clearT = 0;
  for (var i = 0; i < R.spawns.length; i++) spawnEnemy(S, R.spawns[i].type, R.spawns[i].x, R.spawns[i].y);
  S.lap = Math.floor((S.stage - 1) / V.ROOM_ORDER.length) + 1;
  ev(S, { k:'room', x:h.x, y:h.y, roomId:roomId, stage:S.stage });
}

// ---------- create ----------
function create(seed, tune){
  tune = tune || V.TUNE;
  seed = (seed >>> 0);
  var S = { seed:seed, frame:0, t:0, tune:tune, phase:'play', stage:1, roomId:null, lap:1,
    room:null,
    hero:{ x:4.5, y:14.5, r:HERO_HURT_R, hp:tune.HERO_HP, maxHp:tune.HERO_HP, atk:tune.HERO_ATK, ang:-Math.PI / 2,
      moving:false, braced:false, brace01:0, fireCd:0, invulnT:0, lockId:null, lockClear:false,
      level:1, xp:0, xpNext:LEVEL_COST[2], mods:{}, braceT:0, lostT:0, retargetT:0, burstQ:[] },
    enemies:[], rounds:[], shots:[], pickups:[], cards:null, events:[],

  ENEMY_HP_GLOBAL: [0.1, 3, 0.01], HP_SLOPE: [0, 0.3, 0.002], DMG_SLOPE: [0, 0.3, 0.002], ENEMY_DMG_MULT: [0, 4, 0.05],
  ENEMY_SHOT_SPEED_MULT: [0.2, 3, 0.05], TELL_MULT: [0.2, 3, 0.05], TIME_SCALE: [0.1, 2, 0.05], HITSTOP_MS: [0, 200, 5],
  CARDS_OFFERED: [1, 3, 1], BRACE_DELAY: [0, 1, 0.01], DEADZONE_ENTER: [2, 60, 1], DEADZONE_EXIT: [0, 40, 1],
  HAPTIC_HURT_MS: [0, 200, 5], HAPTIC_KILL_MS: [0, 100, 2]
};
function rangeFor(k, d){
  if (RANGE[k]) return RANGE[k];
  if (d <= 1) return [0, 2, 0.01];
  if (d <= 20) return [0, Math.ceil(d * 3), 0.1];
  return [0, Math.ceil(d * 3), 1];
}
function fmt(v){ return typeof v === 'number' ? (Math.abs(v) >= 100 || v === Math.round(v) ? String(Math.round(v * 1000) / 1000) : v.toFixed(3).replace(/0+$/, '').replace(/\.$/, '')) : String(v); }

var toastT = 0, lastHud = '', hooks = {};
var UI = V.UI = {};

UI.init = function(h){
  hooks = h || {};
  $('gear').addEventListener('click', function(){ UI.openDrawer(true); });
  $('drClose').addEventListener('click', function(){ UI.openDrawer(false); });
  $('drReset').addEventListener('click', function(){
    for (var k in V.TUNE_DEFAULTS) V.TUNE[k] = V.TUNE_DEFAULTS[k];
    buildDrawer(); msg('Defaults restored');
  });
  $('drCopyS').addEventListener('click', function(){ copy(JSON.stringify(V.TUNE, null, 1), 'Settings copied'); });
  $('drCopyR').addEventListener('click', function(){ copy(UI.report(), 'Report copied'); });
  buildDrawer();
};

function msg(t){ $('drMsg').textContent = t; }
function copy(text, ok){
  var done = function(){ msg(ok); };
  var fallback = function(){
    var ta = $('copyArea'); ta.value = text; ta.style.left = '0'; ta.focus(); ta.select();
    var r = false; try { r = document.execCommand('copy'); } catch (_) {}
    ta.style.left = '-9999px'; UI.lastCopy = text;
    msg(r ? ok : 'Copy blocked: text is in window.__pv.lastCopy');
  };
  UI.lastCopy = text;
  try { if (navigator.clipboard && G.isSecureContext) { navigator.clipboard.writeText(text).then(done, fallback); return; } } catch (_) {}
  fallback();
}

function buildDrawer(){
  var body = $('drBody'); body.innerHTML = '';
  var seen = {}, groups = GROUPS.map(function(g){ return [g[0], g[1].filter(function(k){ return k in V.TUNE_DEFAULTS; })]; });
  groups.forEach(function(g){ g[1].forEach(function(k){ seen[k] = 1; }); });
  var other = Object.keys(V.TUNE_DEFAULTS || {}).filter(function(k){ return !seen[k]; });
  if (other.length) groups.push(['Other', other]);
  groups.push(['Renderer', ['__stress']]);
  groups.forEach(function(g){
    if (!g[1].length) return;
    var h = document.createElement('h4'); h.textContent = g[0]; body.appendChild(h);
    g[1].forEach(function(k){ body.appendChild(knob(k)); });
  });
}
function knob(k){
  var row = document.createElement('div'); row.className = 'kn';
  var isStress = k === '__stress';
  var d = isStress ? 0 : V.TUNE_DEFAULTS[k], v = isStress ? ((V.Scene && V.Scene.stress) | 0) : V.TUNE[k];
  var lab = document.createElement('label'), val = document.createElement('i');
  lab.textContent = isStress ? 'STRESS_SHAPES' : k; lab.appendChild(val); row.appendChild(lab);
  if (typeof d === 'boolean') {
    var b = document.createElement('button'); b.className = 'btn ghost tg';
    var paint = function(){ b.textContent = V.TUNE[k] ? 'On' : 'Off'; val.textContent = V.TUNE[k] ? 'on' : 'off'; };
    b.addEventListener('click', function(){ V.TUNE[k] = !V.TUNE[k]; paint(); });
    paint(); row.appendChild(b); return row;
  }
  var rg = isStress ? [0, 2000, 50] : rangeFor(k, d);
  var inp = document.createElement('input'); inp.type = 'range';
  inp.min = rg[0]; inp.max = Math.max(rg[1], v); inp.step = rg[2]; inp.value = v;
  val.textContent = fmt(v);
  inp.addEventListener('input', function(){
    var x = parseFloat(inp.value);
    if (isStress) { if (V.Scene) V.Scene.stress = x | 0; }
    else V.TUNE[k] = x;
    val.textContent = fmt(x);
  });
  row.appendChild(inp); return row;
}

UI.openDrawer = function(on){
  $('drawer').classList.toggle('on', !!on);
  if (on) { buildDrawer(); msg(''); }
  UI.syncOverlay();
  if (hooks.onDrawer) hooks.onDrawer(!!on);
};
UI.drawerOpen = function(){ return $('drawer').classList.contains('on'); };

UI.syncOverlay = function(){
  var any = ['ovCards', 'ovDead', 'ovPause', 'ovBoot'].some(function(id){ return $(id).classList.contains('on'); }) || UI.drawerOpen();
  document.body.classList.toggle('ovon', any);
};
function show(id, on){ $(id).classList.toggle('on', !!on); UI.syncOverlay(); }
UI.show = show;

UI.toast = function(text, ms){
  var t = $('toast'); t.textContent = text; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, ms || 1600);
};
UI.placeToast = function(view){
  // Below the room, in the ground area: never over the HUD bars or the room edge (L-TD-5).
  var t = $('toast'); t.style.top = Math.round(view.oy + 15 * view.s + 12) + 'px';
};

var flashT = 0;
UI.hurtFlash = function(){
  if (V.TUNE.EDGE_FLASH === false) return;
  var f = $('flash'); f.classList.add('on'); clearTimeout(flashT);
  flashT = setTimeout(function(){ f.classList.remove('on'); }, 60);
};

UI.hud = function(S, R, view){
  if (!S) return;
  var h = S.hero, room = V.ROOMS && V.ROOMS[S.roomId];
  var hp = Math.max(0, Math.ceil(h.hp)), mx = Math.max(1, Math.round(h.maxHp));
  var xpPct = h.xpNext ? Math.max(0, Math.min(1, h.xp / h.xpNext)) : 1;
  var key = [S.stage, S.roomId, hp, mx, h.level, Math.round(xpPct * 200)].join('|');
  if (key !== lastHud) {
    lastHud = key;
    $('stNum').textContent = S.stage;
    $('roomName').textContent = room ? room.name : (S.roomId || '');
    $('lvl').textContent = 'Lv ' + h.level;
    $('xpFill').style.width = (xpPct * 100).toFixed(1) + '%';
    $('hpFill').style.width = (hp / mx * 100).toFixed(1) + '%';
    $('hpFill').style.background = hp / mx < 0.3 ? '#f07a6e' : '#5fd06a';
    $('hpTxt').textContent = hp + ' / ' + mx;
  }
  UI.rendererLabel(R, view);
};
UI.rendererLabel = function(R, view){
  var t = (R ? R.name : 'none') + ' | ' + Math.round(view.w) + 'x' + Math.round(view.h) + ' | dpr ' + (Math.round((G.devicePixelRatio || 1) * 100) / 100);
  var el = $('rlbl'); if (el.textContent !== t) el.textContent = t;
};

UI.cards = function(S, onPick){
  var list = $('cardList'); list.innerHTML = '';
  $('cardTitle').textContent = 'Field upgrade - level ' + S.hero.level;
  (S.cards || []).forEach(function(ci, i){
    var c = (V.CARDS && V.CARDS[ci]) || { name: 'Card ' + ci, desc: '' };
    var b = document.createElement('button'); b.className = 'card'; b.dataset.i = i;
    var n = document.createElement('b'); n.textContent = c.name; var d = document.createElement('span'); d.textContent = c.desc || '';
    b.appendChild(n); b.appendChild(d);
    b.addEventListener('click', function(){ onPick(i); });
    list.appendChild(b);
  });
  show('ovCards', true);
};

UI.dead = function(S){
  var st = S.stats || {}, rt = st.roomTimes || [];
  var room = V.ROOMS && V.ROOMS[S.roomId];
  var lines = [
    'Reached stage ' + S.stage + (room ? ' (' + room.name + ')' : ''),
    'Level ' + S.hero.level + ' | ' + (st.kills | 0) + ' machines down',
    'Rooms cleared ' + rt.length + ' | Damage taken ' + Math.round(st.dmgTaken || 0)
  ];
  $('deadStats').innerHTML = lines.map(function(l){ return '<div>' + l.replace(/</g, '&lt;') + '</div>'; }).join('');
  show('ovDead', true);
};

// Copy report: everything needed to compare a play session.
UI.report = function(){
  var m = hooks.metrics ? hooks.metrics() : {}, S = m.S || {}, st = S.stats || {};
  var braced = st.playSteps ? Math.round(100 * (st.bracedSteps || 0) / st.playSteps) : 0;
  var r = {
    build: BUILD, date: new Date().toISOString(), seed: S.seed, renderer: m.renderer, viewport: m.viewport, dpr: G.devicePixelRatio || 1,
    ua: navigator.userAgent,
    frameMs: m.frame, gapsOver50ms: m.gaps,
    bracedUptimePct: braced, hitsBy: st.hitsBy, roomTimes: st.roomTimes, kills: st.kills, deaths: m.deaths,
    stage: S.stage, level: S.hero && S.hero.level, picks: st.picks, shots: st.shots, dmgTaken: st.dmgTaken,
    input: V.Input ? { counts: V.Input.counts, log: V.Input.logText() } : null,
    audio: V.Audio ? { state: V.Audio.state, played: V.Audio.played, dropped: V.Audio.dropped } : null,
    settings: V.TUNE
  };
  return 'Project Volley report\n' + JSON.stringify(r, null, 1);
};
UI.BUILD = BUILD;
})();

</script>
<script>
(function(){ var G = (typeof window !== 'undefined' ? window : globalThis); var V = G.V = G.V || {};
// Boot, layout, fixed 60 Hz loop, hit-stop, pause, overlays and the window.__pv test hook.
var $ = function(id){ return document.getElementById(id); };
var Q = new URLSearchParams(location.search);
var STEP_MS = 1000 / 60, MAX_STEPS = 5;
var S = null, R = null, list = [], view = { w: 344, h: 882, dpr: 1, ox: 0, oy: 66, s: 38 };
var acc = 0, last = 0, hitstopUntil = 0, paused = false, frozen = Q.get('freeze') === '1';
var shown = { pick: false, dead: false }, deadAt = 0, deaths = 0;
var ft = [], FT_MAX = 1200, gaps = 0, frames = 0;

function fail(t){ $('bootMsg').textContent = t; UI.show('ovBoot', true); console.warn('volley:', t); }
var UI = V.UI;

// ---------- layout ----------
function layout(){
  var W = G.innerWidth, H = G.innerHeight, st = $('stage'), note = $('coverNote');
  var w = W, h = H, left = 0;
  if (W / H > 0.75) {                                  // wide or landscape: portrait column at the cover screen aspect
    w = Math.round(H * 344 / 882); left = Math.round((W - w) / 2);
    var gut = left - 16;
    note.style.display = 'block';
    if (gut >= 120) { note.style.left = '8px'; note.style.top = '8px'; note.style.maxWidth = Math.min(260, gut) + 'px'; }
    else { note.style.left = '8px'; note.style.top = 'auto'; note.style.bottom = '8px'; note.style.maxWidth = Math.max(100, Math.min(260, W * 0.4)) + 'px'; }
  } else note.style.display = 'none';
  st.style.left = left + 'px'; st.style.top = '0px'; st.style.width = w + 'px'; st.style.height = h + 'px';
  var hud = $('hud').offsetHeight || 62;
  var oy = hud + 2, s = Math.min(w / 9, (h - oy) / 15);
  view.w = w; view.h = h; view.dpr = G.devicePixelRatio || 1; view.s = s; view.ox = (w - 9 * s) / 2; view.oy = oy;
  if (R) R.resize(w, h, view.dpr);
  UI.placeToast(view);
}

// ---------- events from the sim ----------
function vib(ms){
  var ua = navigator.userActivation;   // vibrate before any tap logs a console error in Chrome
  if (V.TUNE.HAPTICS && ms > 0 && navigator.vibrate && (!ua || ua.hasBeenActive)) { try { navigator.vibrate(ms); } catch (_) {} }
}
function handleEvents(ev, live){
  if (!ev) return;
  var stop = false;
  for (var i = 0; i < ev.length; i++) {
    var e = ev[i];
    switch (e.k) {
      case 'fire': V.Audio.play('fire'); break;
      case 'hit': case 'crit': V.Audio.play('hit'); stop = true; break;
      case 'kill': V.Audio.play('kill'); vib(V.TUNE.HAPTIC_KILL_MS); stop = true; break;
      case 'hurt': V.Audio.play('hurt'); UI.hurtFlash(); vib(V.TUNE.HAPTIC_HURT_MS); break;
      case 'door': V.Audio.play('door'); UI.toast('Area clear. Head north through the door.', 2200); break;
      case 'room': { var rm = V.ROOMS && V.ROOMS[S.roomId]; UI.toast('Stage ' + S.stage + (rm ? ': ' + rm.name : ''), 1500); break; }
      case 'levelup': V.Audio.play('levelup'); UI.toast('Level up', 1200); break;
      case 'death': deaths++; break;
    }
  }
  if (stop && live && V.TUNE.HITSTOP_MS > 0) hitstopUntil = performance.now() + V.TUNE.HITSTOP_MS;
}
function simStep(inp, live){ V.Sim.step(S, inp); if (V.Scene && V.Scene.ingest) V.Scene.ingest(S.events, S); handleEvents(S.events, live); }

// ---------- overlays ----------
function syncPhase(){
  if (S.phase === 'pick' && S.cards) {
    if (!shown.pick) { shown.pick = true; V.Input.release(); UI.cards(S, pick); }
  } else if (shown.pick) { shown.pick = false; UI.show('ovCards', false); }
  if (S.phase === 'dead') {
    if (!shown.dead) { shown.dead = true; deadAt = performance.now(); V.Input.release(); UI.dead(S); }
  } else if (shown.dead) { shown.dead = false; UI.show('ovDead', false); }
}
function pick(i){
  if (!S || S.phase !== 'pick') return;
  V.Sim.pick(S, i);
  handleEvents(S.events, false);
  shown.pick = false; UI.show('ovCards', false);
  syncPhase();                                           // another pending level shows the next card screen
}
function restart(){
  S = V.Sim.restart(S); V.Audio.seed(S.seed);
  acc = 0; hitstopUntil = 0; shown.dead = false; UI.show('ovDead', false); shown.pick = false; UI.show('ovCards', false);
  syncPhase(); return S;
}
function tryRestart(){ if (S && S.phase === 'dead' && performance.now() - deadAt > 450) restart(); }

function pause(){
  if (paused || !S) return;
  paused = true; V.Input.release(); V.Audio.setPaused(true); UI.show('ovPause', true);
}
function resume(){
  if (!paused) return;
  paused = false; acc = 0; last = 0; hitstopUntil = 0; V.Audio.setPaused(false); UI.show('ovPause', false);
}

// ---------- loop ----------
function frame(ts){
  requestAnimationFrame(frame);
  var dt = last ? ts - last : STEP_MS; last = ts;
  if (!S || !R) return;
  var running = !paused && !frozen && !UI.drawerOpen() && (S.phase === 'play' || S.phase === 'clear');
  if (!paused && !document.hidden) {
    frames++; ft.push(dt); if (ft.length > FT_MAX) ft.shift(); if (dt > 50 && frames > 3) gaps++;
  }
  if (running) {
    if (ts < hitstopUntil) acc = 0;
    else {
      acc += Math.min(dt, 250);
      var n = 0;
      while (acc >= STEP_MS && n < MAX_STEPS) {
        simStep(V.Input.read(), true); acc -= STEP_MS; n++;
        if (hitstopUntil > ts || S.phase === 'pick' || S.phase === 'dead') { acc = 0; break; }
      }
      if (n >= MAX_STEPS) acc = 0;                       // never chase a long stall (L-LOL-2)
    }
  } else if (!paused && !frozen && !UI.drawerOpen()) {
    // pick/dead: the sim may still animate; nothing to step here
  }
  syncPhase();
  draw();
}
function draw(){
  V.Scene.build(S, view, list);
  R.draw(list, view);
  UI.hud(S, R, view);
}

function pct(a, p){ if (!a.length) return 0; var b = a.slice().sort(function(x, y){ return x - y; }); return Math.round(b[Math.min(b.length - 1, Math.floor(p * b.length))] * 10) / 10; }
function metrics(){
  return { S: S, renderer: R ? R.name + (R.why ? ' (' + R.why + ')' : '') : 'none', viewport: Math.round(view.w) + 'x' + Math.round(view.h),
    frame: { p50: pct(ft, 0.5), p95: pct(ft, 0.95), max: Math.round(Math.max.apply(null, ft.concat([0])) * 10) / 10, n: ft.length },
    gaps: gaps, deaths: deaths };
}

// ---------- boot ----------
function boot(){
  if (!V.Sim || !V.Scene || !V.Render || !V.TUNE) { fail('Missing parts: ' + ['Sim', 'Scene', 'Render', 'TUNE'].filter(function(k){ return !V[k]; }).join(', ')); return; }
  UI.init({ metrics: metrics, onDrawer: function(on){ if (on) V.Input.release(); acc = 0; last = 0; } });
  var stage = $('stage');
  V.Input.attach(stage, V.TUNE);
  layout();
  G.addEventListener('resize', layout);
  if (G.visualViewport) G.visualViewport.addEventListener('resize', layout);

  var seed = Q.has('seed') ? (parseInt(Q.get('seed'), 10) | 0) : (Date.now() % 1000000);
  var stress = parseInt(Q.get('stress') || '0', 10) | 0; if (stress > 0) V.Scene.stress = stress;
  S = V.Sim.create(seed, V.TUNE); V.Audio.seed(seed);

  document.addEventListener('visibilitychange', function(){ if (document.hidden) pause(); });
  G.addEventListener('blur', pause);
  G.addEventListener('pagehide', pause);
  $('ovPause').addEventListener('pointerdown', function(e){ e.preventDefault(); resume(); });
  $('btnResume').addEventListener('click', resume);
  $('ovDead').addEventListener('pointerdown', function(e){ if (e.target.id !== 'btnRestart') tryRestart(); });
  $('btnRestart').addEventListener('click', tryRestart);
  G.addEventListener('keydown', function(e){
    if (paused && (e.key === ' ' || e.key === 'Enter' || e.key === 'Escape')) { resume(); return; }
    if (S && S.phase === 'dead' && (e.key === ' ' || e.key === 'Enter' || e.key === 'r')) tryRestart();
    if (S && S.phase === 'pick' && /^[1-3]$/.test(e.key) && S.cards && +e.key <= S.cards.length) pick(+e.key - 1);
  });

  V.Render.create({ c2d: $('c2d'), cgpu: $('cgpu'), forceCanvas: Q.get('gpu') === '0' }).then(function(r){
    R = r; layout();
    if (R.onChange) R.onChange(function(){ layout(); UI.rendererLabel(R, view); });
    UI.show('ovBoot', false);
    syncPhase();
    requestAnimationFrame(frame);
  }).catch(function(e){ console.error(e); fail('Renderer failed: ' + (e && e.message)); });

  G.__pv = {
    get renderer(){ return R ? R.name : 'none'; },
    get rendererWhy(){ return R ? R.why : ''; },
    get R(){ return R; },
    get S(){ return S; },
    get paused(){ return paused; },
    get view(){ return view; },
    get frozen(){ return frozen; },
    get lastCopy(){ return UI.lastCopy; },
    step: function(n, inp){
      n = n || 1; inp = inp || { mx: 0, my: 0 };
      for (var i = 0; i < n; i++) simStep(inp, false);
      syncPhase(); if (R) draw(); return S;
    },
    pick: function(i){ pick(i); return S; },
    restart: function(){ return restart(); },
    readback: function(){ return R && R.readback ? R.readback() : Promise.resolve(null); },
    freeze: function(on){ frozen = on !== false; acc = 0; return frozen; },  // stop real-time stepping (deterministic tests)
    pause: pause, resume: resume,
    drawer: function(on){ UI.openDrawer(on); },
    report: function(){ return UI.report(); },
    metrics: metrics,
    hash: function(){ return V.Sim.hash ? V.Sim.hash(S) : null; },
    tune: V.TUNE,
    input: V.Input,
    audio: V.Audio,
    build: UI.BUILD
  };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
