<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Project Volley</title>
<style>
:root{
  --sand:#e9dcbf; --sand2:#cdbb94; --ink:#14130f; --gun:#26292b; --gun2:#33373a; --panel:rgba(22,23,24,.92);
  --cyan:#43d3e3; --cyanD:#0e5a63; --red:#e2463c; --hp:#5fd06a; --amber:#f0b54a; --mut:#b9b2a2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--pv-ui-bg,#0b0e11);color:var(--sand);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
/* Full-screen layout (pick 43, R42): no scaled frame. #stage is the whole viewport in real CSS px (main.js layout() sets its size).
   Width classes on body: w-narrow (<600) / w-wide (>=600), plus h-short (<720). Safe-area insets (L-PV-13) pad the HUD, overlays and Home. */
body{touch-action:none}
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;touch-action:none;background:#c9b48a}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
/* HUD band = 64 px under the top inset: bar 48 (stage chip, level, XP bar, pause, tuning) + HP strip 16, both full width (FULLSCREEN-LAYOUT s4, L-PV-7). */
#hud{position:absolute;left:0;top:0;right:0;pointer-events:none;z-index:10;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);background:#1d1e1f}
#hudTop{display:flex;align-items:center;gap:8px;height:48px;padding:0 0 0 8px;background:linear-gradient(#24262a,#1d1e1f)}
#stageLbl{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:13px;white-space:nowrap;color:var(--sand);background:var(--gun);border:1px solid #4a4d4f;border-radius:6px;padding:4px 7px}
#stageLbl b{color:#fff}
#lvl{flex:none;font-weight:800;font-size:13px;color:#0d1b1d;background:var(--cyan);border-radius:6px;padding:4px 7px;white-space:nowrap}
#xpWrap{flex:1 1 40px;min-width:64px;max-width:360px;height:8px;border-radius:4px;background:#0c0d0e;border:1px solid #45494c;overflow:hidden}   /* XP bar stretches; at most 360 wide (guess, spec s4) */
.w-wide #xpWrap{margin-right:auto}
#xpFill{height:100%;width:0;background:var(--cyan)}
/* 44 px plate centred in the 48 bar; 56 x 56 hit area from the top edge, overhanging the HP strip by 8 px (never above the viewport) */
.hb{pointer-events:auto;flex:none;position:relative;align-self:flex-start;width:56px;height:56px;margin:0 0 -8px;border:0;background:transparent;color:var(--sand);font-size:22px;padding:2px 0 0;cursor:pointer;display:flex;align-items:flex-start;justify-content:center}
#pauseBtn{font-size:13px;letter-spacing:-2px}
.hb span{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;background:var(--gun);border:1px solid #55595c}
#hpRow{position:relative;display:flex;align-items:center;gap:8px;height:16px;padding:0 8px;background:#151617}
#hpBar{position:relative;flex:1;height:10px;border-radius:3px;background:#0c0d0e;border:1px solid #45494c;overflow:hidden}
#hpFill{height:100%;width:100%;background:var(--hp);transition:width .12s}
/* HP number beside the bar (L-PV-7), not over the fill */
.hpT{flex:none;font-size:12px;font-weight:800;line-height:16px;color:#f2ead8;font-variant-numeric:tabular-nums;white-space:nowrap}
#hpTxtE{display:none}
#rlbl{position:absolute;left:6px;bottom:6px;font:12px/1.2 ui-monospace,Menlo,Consolas,monospace;color:#1b1a17;background:rgba(233,220,191,.85);padding:2px 5px;border-radius:4px;pointer-events:none;z-index:10;display:none}
body.dbg #rlbl{display:block}
.rinfo{font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;color:var(--mut)}
#toast{position:absolute;left:50%;transform:translateX(-50%);max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-weight:700;font-size:13px;color:var(--sand);background:var(--panel);
  border:1px solid var(--cyanD);border-radius:8px;padding:6px 8px;pointer-events:none;z-index:11;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
#flash{position:absolute;inset:0;pointer-events:none;z-index:9;box-shadow:inset 0 0 40px 14px rgba(226,40,30,.45);opacity:0;transition:opacity .25s ease-out}
#flash.on{opacity:1;transition:none}
body.ovon #hud, body.ovon #toast, body.ovon #rlbl{visibility:hidden}
/* overlays */
.ov{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  background:rgba(20,19,16,.94);text-align:center}
.ov.on{display:flex}
.ov h2{margin:0;font-size:22px;color:#fff;letter-spacing:.5px}
.ov p{margin:0;color:var(--sand);max-width:400px}
.btn{min-height:56px;min-width:120px;padding:8px 18px;border-radius:10px;border:0;font:700 17px system-ui,sans-serif;background:var(--cyan);color:#0b1416;cursor:pointer}
.btn.ghost{background:var(--gun2);color:var(--sand);border:1px solid #5a5e61}
.card{width:100%;min-height:96px;border-radius:10px;border:2px solid var(--cyan);background:var(--gun);color:var(--sand);padding:8px 10px;text-align:left;cursor:pointer;font:inherit;
  display:flex;align-items:center;gap:10px}
.card .gl{flex:none;width:44px;height:44px;border-radius:8px;background:#11262a;border:1px solid var(--cyanD);color:var(--cyan);font:700 22px/44px system-ui,sans-serif;text-align:center}
.card .tx{flex:1;min-width:0}
.card b{display:block;font-size:18px;color:#fff;margin-bottom:2px}
.card span{display:block;font-size:15px;line-height:1.25;color:var(--sand)}
/* Level-up and supply rows: full width less 16 px (the .ov side padding) on narrow screens, at most 560 wide, 96 high, stacked (FULLSCREEN-LAYOUT s4) */
#cardList,#supList{max-width:560px}
.h-short #cardList,.h-short #supList{gap:8px!important}
/* Pause: centred panel at most 400 wide; the mods list scrolls inside; build label at the foot */
#ovPause .pz{display:flex;flex-direction:column;align-items:stretch;gap:10px;width:100%;max-width:400px;max-height:100%;min-height:0}
#ovPause .pz .btn{width:100%;min-width:0}
#pauseMods{flex:0 1 auto;min-height:0;overflow-y:auto;max-height:30vh;font-size:12px;line-height:1.4;color:var(--mut);text-align:center}
.h-short #ovPause .pz{gap:8px}
.h-short #ovPause .pz .btn.ghost{min-height:48px}   /* secondary targets may be 48 on short screens (G1) */
.card.sup .gl{background:#2d2414;border-color:#7a5a20;color:var(--amber)}
#deadStats{font-size:14px;color:var(--sand);line-height:1.5}
/* Boss bar (D1): label row above a plain full-width bar, so no text sits over the fill. */
#bossBar{position:absolute;display:none;z-index:10;pointer-events:none;padding:2px 4px 4px;border-radius:6px;background:rgba(12,13,14,.88);border:1px solid #6a2a26}
#bossTxt{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;line-height:15px;color:#fff;white-space:nowrap;padding:0 2px}
#bossTxt span{overflow:hidden;text-overflow:ellipsis}
#bossHp{flex:none;font-variant-numeric:tabular-nums}
#bossTrack{height:9px;margin-top:1px;border-radius:3px;background:#2a1513;border:1px solid #6a2a26;overflow:hidden}
#bossFill{height:100%;width:100%;background:#e0483d}
#howto{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:86%;text-align:center;font-size:14px;font-weight:700;color:#1b1a17;background:rgba(233,220,191,.92);
  border:1px solid #8a7a5a;border-radius:8px;padding:6px 10px;pointer-events:none;z-index:10;display:none}
body.ovon #bossBar, body.ovon #howto, body.ovon #dmgLayer{visibility:hidden}
#dmgLayer{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.dn{position:absolute;left:0;top:0;font:800 16px/1 system-ui,sans-serif;color:#ff9a2e;white-space:nowrap;opacity:0;
  text-shadow:-1px -1px 0 #2a1200,1px -1px 0 #2a1200,-1px 1px 0 #2a1200,1px 1px 0 #2a1200,0 0 3px #000;will-change:transform,opacity}
.card.sup{border-color:var(--amber)}
.card small{display:block;font-size:12px;color:var(--amber);text-transform:uppercase;letter-spacing:1px;margin-bottom:1px}
#resStats{flex:0 1 auto;min-height:0;overflow-y:auto;font:400 14px/1.2 var(--pv-ui-font);color:var(--pv-ui-text);text-align:left;background:linear-gradient(var(--pv-ui-metal-700),var(--pv-ui-metal-800));border:1.5px solid var(--pv-ui-ink);border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -2px 0 rgba(0,0,0,.35),0 2px 0 rgba(0,0,0,.55);padding:4px 12px;max-width:480px;width:100%}
#resStats .row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:32px;border-bottom:1px dashed var(--pv-ui-metal-600)}
#resStats .row:last-child{border-bottom:0}
#resStats .row span{font:700 12px/1.1 var(--pv-ui-font-stencil);text-transform:uppercase;letter-spacing:.12em;color:var(--pv-ui-text-2)}
#resStats .row b{font:800 16px/1.1 var(--pv-ui-font-stencil);font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--pv-ui-text);text-align:right;min-width:0}
#ovDead h2{font:800 22px/1.1 var(--pv-ui-font-stencil);text-transform:uppercase;letter-spacing:.08em;color:var(--pv-ui-sand)}
#ovDead{justify-content:flex-start}
#ovDead::before{content:"";flex:1 1 0;max-height:12vh}
#ovDead .btn{flex:none;width:100%;max-width:480px;min-height:64px;display:flex;align-items:center;justify-content:center;font:800 14px/1 var(--pv-ui-font-stencil);text-transform:uppercase;letter-spacing:.14em;border-radius:6px;
  color:var(--pv-ui-text);background:linear-gradient(var(--pv-ui-metal-600),var(--pv-ui-metal-800));border:2.5px solid var(--pv-ui-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -2px 0 rgba(0,0,0,.35),0 3px 0 var(--pv-ui-ink)}
#ovDead .btn#btnRestart{min-height:64px;font-size:22px;letter-spacing:.2em;color:var(--pv-ui-cyan-ink);border:0;border-radius:0;background:linear-gradient(var(--pv-ui-cyan-hi),var(--pv-ui-cyan) 45%,#18bfd6);
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));box-shadow:inset 0 0 0 2px var(--pv-ui-ink),inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,60,70,.35)}
#ovDead .btn.ghost{background:linear-gradient(var(--pv-ui-metal-700),var(--pv-ui-metal-900));border:2.5px solid var(--pv-ui-cyan-lo);color:var(--pv-ui-cyan)}
#ovDead .btn:active{transform:translateY(3px);filter:brightness(.88)}
#ovDead #resTitle.win{color:var(--pv-ui-cyan)}
#ovDead:not(.armed) #btnRestart{opacity:.45}
@media (prefers-reduced-motion: reduce){ #flash{display:none} #toast,#hpFill{transition:none} }
/* Results portrait (P-02): framed panel, sand backdrop kept */
#resHead{flex:none;display:flex;align-items:center;gap:12px;width:100%;max-width:480px}
#resHead h2{flex:1;text-align:left}
#resPortrait{display:block;flex:none;width:72px;height:96px;border-radius:4px;border-radius:6px;border:2px solid #0f1215;box-shadow:0 0 0 1.5px #4a535d;object-fit:cover;object-position:top;background:#1b2026}
/* QA-VISUAL D2 (option A): short screens tighten the results card so every stats row, MODS included, shows without scrolling (475x590/638) */
.h-short #ovDead{gap:8px}
.h-short #ovDead::before{max-height:4vh}
.h-short #resPortrait{width:54px;height:72px}
.h-short #resStats{padding:2px 12px}
.h-short #resStats .row{min-height:25px;padding:1px 0}
.h-short #resStats .row b{font-size:15px;line-height:1.05}
#ovBoot{z-index:60}
/* drawer */
#drawer{position:absolute;top:0;right:0;bottom:0;width:100%;z-index:50;background:rgba(18,18,17,.97);display:none;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
#drawer.on{display:flex}
#drHead{display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid #3c3f42;flex-wrap:wrap}
#drHead h3{margin:0 auto 0 4px;font-size:16px;color:#fff}
#drBody{flex:1;overflow-y:auto;padding:4px max(10px,calc((100% - 560px) / 2)) max(20px,env(safe-area-inset-bottom,0px));touch-action:pan-y}   /* knobs in a centred column at most 560 (Settings rule, s4) */
#drBody h4{margin:12px 0 2px;font-size:13px;color:var(--cyan);text-transform:uppercase;letter-spacing:1px}
.kn{padding:4px 0;border-bottom:1px solid #2b2d2f}
.kn label{display:flex;justify-content:space-between;font-size:12px;color:var(--sand)}
.kn label i{font-style:normal;color:#fff;font-family:ui-monospace,Menlo,monospace}
.kn input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--cyan)}
.kn input[type=range]:disabled{opacity:.45}
.kn .tg{min-height:56px;width:100%;margin-top:2px}
#drHead{justify-content:center}
#drMsg{font-size:12px;color:var(--amber);min-height:16px;padding:0 10px}
#copyArea{position:absolute;left:-9999px;top:0;width:10px;height:10px}
/* ==========================================================================
   Project Volley UI kit  (ui-kit.css)   full viewport in real CSS px (R42: no scaled frame; body classes w-narrow / w-wide / h-short), no dependencies
   Look: military field hardware. Gunmetal + olive panels, sand/off-white text,
   cyan = hero accent + primary action, red = enemies/danger only,
   amber hazard stripes = warnings only. Thin ink outlines, stencil labels.
   Tokens come from the G2 look (look-G2-desert-refined.html).

   CLASS INDEX (prefix pv-)
   Frame      .pv-screen  .pv-screen__body  .pv-scroll  .pv-safe-bottom  .pv-stack  .pv-row  .pv-grow
   Type       .pv-h1 .pv-h2 .pv-body .pv-small .pv-num .pv-stencil .pv-muted .pv-cyan .pv-danger
   Status bar .pv-status  .pv-status__title  .pv-chip  .pv-chip--credits  .pv-chip--schem  .pv-chip__icon
   Header     .pv-section  .pv-section__label  .pv-section__aside
   Panel      .pv-panel  .pv-panel--olive  .pv-panel--inset  .pv-panel--cut  .pv-rivets
   Buttons    .pv-btn  .pv-btn--primary (Deploy)  .pv-btn--secondary  .pv-btn--ghost  .pv-btn--danger
              .pv-btn--sm  .pv-btn--block  .pv-btn--icon  states: .is-pressed .is-disabled [disabled]
   Tab bar    .pv-tabbar  .pv-tab  .pv-tab--center (raised)  .pv-tab__icon  .pv-tab__label  .is-selected
   Gear       .pv-slot (gear slot, 64px)  .pv-cell (inventory cell, 56px)  .pv-slot__label
              rarity: .r1 .r2 .r3 .r4 .r5 (+ .r6 spare)   .pv-lvl (level badge)  .is-selected .is-locked .is-empty
   Stats      .pv-stat  .pv-stat__name  .pv-stat__val  .pv-stat__delta  (.is-up .is-down)
   Progress   .pv-bar  .pv-bar__fill  .pv-bar--cyan .pv-bar--olive .pv-bar--danger .pv-bar--sm .pv-bar__text
   Chapter    .pv-chapter  .pv-chapter__art  .pv-chapter__title  .pv-chapter__meta  .pv-chapter__stars  .is-selected .is-locked
   List row   .pv-list  .pv-item  .pv-item__icon  .pv-item__main  .pv-item__title  .pv-item__sub  .pv-item__end
   Upgrade    .pv-upgrade  .pv-upgrade__icon  .pv-upgrade__name  .pv-upgrade__fx  .pv-upgrade__tag  (also in-run field-mod row)
   Modal      .pv-scrim  .pv-sheet  .pv-sheet__grab  .pv-sheet__title  .pv-sheet__actions
   Toast      .pv-toast  .pv-toast--ok  .pv-toast--warn
   Lock       .is-locked  .pv-lock (overlay)  .pv-lock__icon  .pv-lock__text
   Badge/pip  .pv-badge  .pv-badge--cyan .pv-badge--olive .pv-badge--warn .pv-badge--danger  .pv-pip  .pv-pip--num
   Hazard     .pv-hazard (amber stripe strip, warnings only)
   Icons      .pv-ico (1em inline svg, uses currentColor)  .pv-ico--lg
   ========================================================================== */

:root{
  /* ink + gunmetal */
  --pv-ui-ink:#0f1215;          /* outline colour */
  --pv-ui-bg:#0b0e11;           /* screen base */
  --pv-ui-metal-900:#14181c;
  --pv-ui-metal-800:#1b2026;
  --pv-ui-metal-700:#242a31;
  --pv-ui-metal-600:#2f363e;
  --pv-ui-metal-500:#4a535d;
  --pv-ui-metal-400:#5b6671;
  /* olive */
  --pv-ui-olive-900:#23271a;
  --pv-ui-olive-800:#2f3320;
  --pv-ui-olive-700:#3d4a28;
  --pv-ui-olive-500:#5a673a;
  --pv-ui-olive-300:#8a925c;
  /* sand + text */
  --pv-ui-sand:#d6bf8e;
  --pv-ui-sand-dim:#a38a60;
  --pv-ui-text:#e4dfd2;         /* primary text */
  --pv-ui-text-2:#b6b0a2;       /* secondary text */
  --pv-ui-text-3:#8f897b;       /* tertiary, large/decorative only */
  /* accents */
  --pv-ui-cyan:#38e8ff;
  --pv-ui-cyan-hi:#7ff3ff;
  --pv-ui-cyan-lo:#0e7f90;
  --pv-ui-cyan-ink:#04181c;     /* text on cyan */
  --pv-ui-red:#ff3b30;
  --pv-ui-red-lo:#7a1812;
  --pv-ui-amber:#f4c21a;
  --pv-ui-amber-ink:#2a2d31;
  --pv-ui-ok:#8fc25a;
  /* rarity (see spec 07) */
  --pv-ui-r1:#8f897b; --pv-ui-r2:#7fae4f; --pv-ui-r3:#4aa3e0; --pv-ui-r4:#9a86ff; --pv-ui-r5:#e0a93a; --pv-ui-r6:#d8fbff;
  /* type */
  --pv-ui-font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --pv-ui-font-stencil:"Arial Narrow","Roboto Condensed","DIN Condensed","Bahnschrift Condensed",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --pv-ui-fs-xs:12px; --pv-ui-fs-sm:12px; --pv-ui-fs-md:14px; --pv-ui-fs-lg:17px; --pv-ui-fs-xl:22px; --pv-ui-fs-xxl:30px;
  /* space (4 px grid) */
  --pv-ui-s1:4px; --pv-ui-s2:8px; --pv-ui-s3:12px; --pv-ui-s4:16px; --pv-ui-s5:24px; --pv-ui-s6:32px;
  /* radii, strokes */
  --pv-ui-r-sm:3px; --pv-ui-r-md:6px; --pv-ui-r-lg:10px; --pv-ui-cut:8px;
  --pv-ui-stroke:1.5px; --pv-ui-stroke-heavy:2.5px;
  /* shadows */
  --pv-ui-sh-1:0 2px 0 rgba(0,0,0,.55);
  --pv-ui-sh-2:0 4px 10px rgba(0,0,0,.6);
  --pv-ui-glow:0 0 10px rgba(56,232,255,.45);
  --pv-ui-bevel:inset 0 1px 0 rgba(255,255,255,.10), inset 0 -2px 0 rgba(0,0,0,.35);
  /* sizes */
  --pv-ui-touch:56px; --pv-ui-w:var(--pv-frame-w,100vw); --pv-ui-col:520px; --pv-ui-h:100vh;   /* touch: 56 default (G1), 48 on short screens, never under 44 */
  --pv-sat:env(safe-area-inset-top,0px); --pv-sab:env(safe-area-inset-bottom,0px); --pv-sal:env(safe-area-inset-left,0px); --pv-sar:env(safe-area-inset-right,0px); --pv-ui-tabbar-h:64px; --pv-ui-status-h:48px;
  --pv-ui-hazard:repeating-linear-gradient(-45deg,var(--pv-ui-amber) 0 8px,var(--pv-ui-amber-ink) 8px 16px);
  --pv-ui-rivet:radial-gradient(circle at 35% 35%,#7b848d 0 1px,#3a4149 2px,#14181c 3px,transparent 3.5px);
}

*,*::before,*::after{box-sizing:border-box}
.pv-screen{position:relative;width:100%;height:100%;overflow:hidden;background:
  radial-gradient(120% 60% at 50% 0,#1b2026 0,transparent 70%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 2px,transparent 2px 4px),var(--pv-ui-bg);
  color:var(--pv-ui-text);font:400 var(--pv-ui-fs-md)/1.35 var(--pv-ui-font);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent}
.pv-screen__body{flex:1;min-height:0;padding:var(--pv-ui-s3);display:flex;flex-direction:column;gap:var(--pv-ui-s3)}
.pv-scroll{overflow-y:auto;scrollbar-width:none}.pv-scroll::-webkit-scrollbar{display:none}
.pv-safe-bottom{padding-bottom:calc(var(--pv-ui-tabbar-h) + var(--pv-ui-s3))}
.pv-stack{display:flex;flex-direction:column;gap:var(--pv-ui-s2)}
.pv-row{display:flex;align-items:center;gap:var(--pv-ui-s2)}
.pv-grow{flex:1;min-width:0}

/* type */
.pv-h1{font:800 var(--pv-ui-fs-xl)/1.1 var(--pv-ui-font-stencil);text-transform:uppercase;letter-spacing:.06em;margin:0}
.pv-h2{font:700 var(--pv-ui-fs-lg)/1.2 var(--pv-ui-font);margin:0}

  box-shadow:var(--pv-ui-bevel),0 3px 0 var(--pv-ui-ink);transform:translateY(0);transition:transform .06s,box-shadow .06s}

  background:linear-gradient(var(--pv-ui-metal-700),var(--pv-ui-metal-900));border-top:var(--pv-ui-stroke-heavy) solid var(--pv-ui-ink);border-radius:var(--pv-ui-r-lg) var(--pv-ui-r-lg) 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1)}

.pv-tab--center:not(.is-selected) .pv-tab__icon{background:linear-gradient(var(--pv-ui-metal-700),var(--pv-ui-metal-900));color:var(--pv-ui-cyan);border-color:var(--pv-ui-cyan-lo);box-shadow:var(--pv-ui-sh-2)}
.pv-tab--center.is-selected::before{display:block;left:6%;right:6%}

/* Deploy tab (FULLSCREEN-LAYOUT s4). #pane-deploy is a size container and a flex column.

   so the cover crop keeps at least the middle 70% of the 328:216 art (QA-056); any height left over sits between the card and the
   bottom block, so DEPLOY (88 high) stays fixed above the tab bar. Short: the art shrinks first. Images keep their aspect (object-fit:cover). */
#pane-deploy{container-type:size}

.hm-card .pv-chapter__art img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
/* QA-VISUAL D5 (option A): the key art has a baked blue band on its top edge (16 of 432 px) and a cream sliver on its left (12 of 656 px).
   A uniform 4% scale anchored bottom-right crops about 3.8% off the top and left of the shown box and nothing else; no stretch. */
.hm-card .pv-chapter__art{overflow:hidden}
.hm-card .pv-chapter__art img{transform:scale(1.04);transform-origin:100% 100%}
.hm-card{background:var(--pv-ui-metal-900)}
.hm-card::after{inset:auto 0 auto 0;top:calc(var(--art-h) - min(96px,var(--art-h)));height:min(96px,var(--art-h));background:linear-gradient(transparent,var(--pv-ui-metal-900))}
.hm-info{position:absolute!important;left:12px;right:12px;top:calc(var(--art-h) + 12px);display:flex;flex-direction:column;gap:4px;align-items:flex-start}

//   "Tap to deploy" y 640-688 with a pulse, save-reset line y 720-760, version at the foot. Other sizes keep the same height ratios.

//   resume().then (L-HB-1). Taps in the first 350 ms after the title appears are ignored (L-PV-9 spirit, guess).
// After the tap: first launch goes straight to stage 1 (pick 14); later launches go to Deploy. V.Title.onStart(first) overrides this.
// API: V.Title.show(opts) -> true if shown; hide(); visible; NAME; fit(name, maxW, measure) (pure, for tests). ?title=0 skips it.
var GAME_NAME = 'Project Volley';   // placeholder until M gives the name (pick 18)

// Auto-fit: one line from 44 px down to 28; else two lines broken at the space nearest the middle, from 44 down to 28.
// measure(text, px) -> width in px without letter-spacing. Returns { size, lines }.
function fit(name, maxW, measure){
  var s, w;
  function width(t, px){ return measure(t, px) + Math.max(0, t.length - 1) * FIT.spacing * px; }
  for (s = FIT.max; s >= FIT.min; s--) if (width(name, s) <= maxW) return { size: s, lines: [name] };
  var sp = [], i; for (i = 0; i < name.length; i++) if (name[i] === ' ') sp.push(i);
  if (!sp.length) return { size: FIT.min, lines: [name] };
  var mid = name.length / 2, best = sp[0];
  sp.forEach(function(p){ if (Math.abs(p - mid) < Math.abs(best - mid)) best = p; });

function Rng(seed){
  if (!(this instanceof Rng)) return new Rng(seed);
  this.s = (seed >>> 0) ^ 0x9E3779B9;
  if (this.s === 0) this.s = 1;
}
Rng.prototype.next = function(){
  var t = (this.s = (this.s + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
Rng.prototype.int = function(n){ return Math.floor(this.next() * n); };
Rng.prototype.range = function(a, b){ return a + (b - a) * this.next(); };

  var best = null, bd = D.RICO_RANGE;
  for (var k = 0; k < S.enemies.length; k++) {
    var o = S.enemies[k];
    if (!targetable(o) || (r.hit && r.hit.indexOf(o.id) >= 0)) continue;
    var d = Math.hypot(o.x - r.x, o.y - r.y);
    if (d < bd) { bd = d; best = o; }                       // line of sight not required (D2 3c-1)
  }
  return best;
}

// ---- helpers the sim may use ----
function count(S, m){ return (S.hero && S.hero.mods && S.hero.mods[m.key]) || 0; }
function capped(S, m){ return !!m.max && count(S, m) >= m.max; }
function inPool(m, pool){ return m.pool.indexOf(pool) >= 0; }
// Offer k distinct mods from pool ('F' weighted, 'SD' uniform), never a capped one.
// F offers follow D2 2a pity A: at least one core mod when any core is available.
// opts.exclude: mod indices that may not appear (a reroll never repeats a card, 03 "Reroll").
// 'F' offers with fewer than k legal cards are padded with Emergency repair (03 "Dry pool"); opts.noRepair turns that off.
var REPAIR = -1; for (var ri = 0; ri < M.length; ri++) if (M[ri].id === 'SK-RP') REPAIR = ri;
function legalCount(S, pool, exclude){
  var n = 0; for (var i = 0; i < M.length; i++) if (inPool(M[i], pool) && !capped(S, M[i]) && !(exclude && exclude.indexOf(i) >= 0)) n++;
  return n;
}
function offer(S, pool, k, rng, opts){
  rng = rng || S.rng; pool = pool || 'F'; k = k || 3;
  var cand = [], i, out = [], ex = opts && opts.exclude;
  for (i = 0; i < M.length; i++) if (inPool(M[i], pool) && !capped(S, M[i]) && !(ex && ex.indexOf(i) >= 0)) cand.push(i);
  function w(ix){ return pool === 'F' ? (M[ix].weight || 0) : 1; }
  function draw(list){
    var tot = 0, j; for (j = 0; j < list.length; j++) tot += w(list[j]);
    if (tot <= 0) return list.length ? 0 : -1;
    var x = rng.next() * tot;
    for (j = 0; j < list.length; j++) { x -= w(list[j]); if (x < 0) return j; }
    return list.length - 1;
  }
  while (out.length < k && cand.length) { var j = draw(cand); out.push(cand[j]); cand.splice(j, 1); }
  if (pool === 'F' && out.length && !(opts && opts.noPity)) {
    var hasCore = false; for (i = 0; i < out.length; i++) if (M[out[i]].core) hasCore = true;
    var cores = []; for (i = 0; i < cand.length; i++) if (M[cand[i]].core) cores.push(cand[i]);
    if (!hasCore && cores.length) {
      var lo = 0; for (i = 1; i < out.length; i++) if (w(out[i]) < w(out[lo])) lo = i;
      out[lo] = cores[draw(cores)];
    }
  }
  if (pool === 'F' && REPAIR >= 0 && !(opts && opts.noRepair)) while (out.length < k) out.push(REPAIR);
  return out;
}

// Level the held mod reaches if card index ci is picked (1 = new).
function levelAfter(S, ci){ var m = M[ci]; return m ? count(S, m) + 1 : 1; }
function isRepair(ci){ return ci === REPAIR; }
// ---- offer reroll (pick 21): one banked per boss kill, held on S.rerolls (a plain number; sim snapshots copy it) ----
function rerolls(S){ return Math.max(0, (S && S.rerolls) | 0); }
function bankReroll(S){ S.rerolls = rerolls(S) + 1; if (S.fx) S.fx.push({ k:'reroll', v:S.rerolls }); return S.rerolls; }
// A reroll can change the offer only while a legal, not-currently-shown card exists.
function canReroll(S){
  if (!S || S.phase !== 'pick' || !S.cards || !rerolls(S)) return false;
  return legalCount(S, 'F', S.cards) > 0;
}
// Spend one banked reroll: a fresh set of the same size, no repeats of the shown cards. Returns true when the offer changed.
function reroll(S){
  if (!canReroll(S)) return false;
  var k = S.cards.length;
  S.cards = offer(S, 'F', k, S.rng, { exclude:S.cards.slice() });
  S.rerolls = rerolls(S) - 1;
  if (S.stats) S.stats.rerollsUsed = (S.stats.rerollsUsed | 0) + 1;
  if (S.events) S.events.push({ k:'reroll', left:S.rerolls });
  return true;
}

function newStats(){ return { atkAdd:0, atkMul:1, primaryMul:1, rateAdd:0, rateMul:1, critAdd:0, critDmgAdd:0, hpMaxAdd:0, dmgTakenMul:1, moveMul:1, dodge:0, volleys:1 }; }
// Derived stats from all held mods (reference for the sim; same init the hooks expect).
function stats(S){
  var st = newStats();
  for (var i = 0; i < M.length; i++) { var n = count(S, M[i]); if (n > 0 && M[i].hooks.stats) M[i].hooks.stats(S, n, st); }
  return st;
}
function pattern(S){
  var list = [{ ang:0, off:0, mul:1 }];
  for (var i = 0; i < M.length; i++) { var n = count(S, M[i]); if (n > 0 && M[i].hooks.pattern) M[i].hooks.pattern(S, n, list); }
  return list;
}
// Generic dispatcher: V.Mods.call(S, 'onHit', e, r, api) calls every held mod's hook with n prepended.
function call(S, name, a, b, c){
  for (var i = 0; i < M.length; i++) {
    var h = M[i].hooks[name]; if (!h) continue;
    var n = count(S, M[i]); if (n > 0) h(S, n, a, b, c);
  }
}

var KIND_NAME = { combat:'Combat', earning:'Earning', head:'Head start' };
var REROLL_COST = [20, 25, 30];   // 02 T16 by chapter; Hard x1.5; T-08 halves
function boostById(id){ for (var i = 0; i < BOOSTS.length; i++) if (BOOSTS[i].id === id) return BOOSTS[i]; return null; }
function openBoosts(){ return BOOSTS.filter(function(b){ return b.open; }); }
function rollAt(seed, idx){
  var r = new V.Rng(((seed >>> 0) ^ Math.imul((idx | 0) + 1, 0x85EBCA6B)) >>> 0);
  r.next();                                                 // first output of mulberry32 on a near seed is weakly mixed: burn one
  var open = openBoosts(), b = open[Math.floor(r.next() * open.length)], x = r.next(), t = 0, acc = 0;
  for (var i = 0; i < TIER.length; i++) { acc += TIER[i].w; if (x < acc) { t = i; break; } t = i; }
  return { id:b.id, tier:t };
}
function make(seed){ seed = seed >>> 0; return { seed:seed, idx:0, used:false, started:false, boost:rollAt(seed, 0) }; }
function rerollCost(ch, opts){
  var c = REROLL_COST[Math.max(0, Math.min(2, ((ch || 1) | 0) - 1))];
  if (opts && opts.hard) c *= 1.5;
  if (opts && opts.discount) c *= 0.5;
  return Math.round(c);
}
// Replace the result once. Returns the new boost or null when the reroll was already used.
function rerollRoll(st){
  if (!st || st.used) return null;
  st.used = true; st.idx = 1; st.boost = rollAt(st.seed, 1); return st.boost;
}
function boostText(bo){ var b = boostById(bo.id), v = b.vals[bo.tier]; return b.text(v); }
function boostInfo(bo){ var b = boostById(bo.id), t = TIER[bo.tier]; return { id:b.id, kind:b.kind, kindName:KIND_NAME[b.kind], name:b.name, tier:t.id, tierName:t.name, pips:t.pips, text:boostText(bo) }; }
// Numbers the run reads. All zero for a missing boost.
function effects(bo){
  var e = { atk:0, rate:0, hp:0, dmgCut:0, crit:0, picks:0, pickLv2:0, shield:0, credits:0 };
  if (!bo) return e;
  var b = boostById(bo.id); if (!b) return e;
  var v = b.vals[bo.tier];
  switch (b.id) {
    case 'D2': e.atk = v / 100; break;
    case 'D3': e.rate = v / 100; break;
    case 'D4': e.hp = v / 100; break;
    case 'D5': e.dmgCut = v / 100; break;
    case 'D6': e.crit = v / 100; break;
    case 'D7': e.picks = v === 3 ? 2 : 1; e.pickLv2 = bo.tier >= 1 ? e.picks : 0; break;
    case 'D8': e.shield = v / 100; break;
    case 'D9': e.credits = v / 100; break;
  }
  return e;
}
// Sim hooks (one line each in sim.js, see G-REPORT): S.deploy = {id, tier} is set by the shell at run start.
function applyStats(S, st){
  if (!S || !S.deploy) return st;
  var e = effects(S.deploy), T = S.tune || V.TUNE || {};
  st.atkMul *= 1 + e.atk; st.rateMul *= 1 + e.rate;
  st.hpMaxAdd += Math.round(e.hp * (T.HERO_HP || 600));
  if (e.dmgCut) st.dmgTakenMul = Math.max(0.5, st.dmgTakenMul * (1 - e.dmgCut));     // shares the 50 percent cap (T16 D5)
  st.critAdd += e.crit;
  return st;
}
// Shell hand-off, before the first step of a run: S.deploy = the boost; S.st = null makes the sim's first step rebuild hero stats with it.
function attach(S, bo){ S.deploy = bo ? { id:bo.id, tier:bo.tier } : null; S.deployDone = false; S.deployShield = 0; S.st = null; return S; }
// Once at run start (after the first refreshStats). Idempotent per run.
function runStart(S){
  if (!S || !S.deploy || S.deployDone) return null;
  S.deployDone = true;
  var e = effects(S.deploy), mx = (S.hero && S.hero.maxHp) || (S.tune && S.tune.HERO_HP) || 600;
  S.deployShield = Math.round(e.shield * mx);
  S.freePicks = (S.freePicks | 0) + e.picks; S.deployL2 = e.pickLv2;
  if (S.hero) S.hero.hp = S.hero.maxHp;                      // D4 (and meta) max HP: the run starts full
  return e;
}
// After a free pick is applied: an opening pick of a rare or elite roll enters at level 2 (returns true when an extra level was due).
function pickBonus(S){ if (S && S.deployL2 > 0) { S.deployL2--; return true; } return false; }
// Shield soaks damage before HP. Returns the damage that still lands.

// ---------- create ----------

// ---------- hero weapon ----------
function roundDamage(S, mul){
  var st = S.st || heroStats(S);
  return Math.max(1, Math.floor(S.tune.HERO_ATK * (1 + st.atkAdd) * st.atkMul * st.primaryMul * (mul == null ? 1 : mul)));
}
function fireInterval(S){

}
function spawnRound(S, x, y, ang, dmg){
  var t = S.tune, st = S.st, crit = S.rng.next() < Math.min(1, t.CRIT_CHANCE + st.critAdd);
  var r = { x:x, y:y, vx:Math.cos(ang) * t.ROUND_SPEED, vy:Math.sin(ang) * t.ROUND_SPEED, r:t.ROUND_R,
    dmg: crit ? Math.floor(dmg * (t.CRIT_MULT + st.critDmgAdd)) : dmg, crit:crit, bounces:0, wallBounces:0, hit:[] };

    var p = list[i], off = p.off || 0;
    if (p.delay > 0) { h.delayQ.push({ t:p.delay, ang:p.ang || 0, off:off, mul:p.mul == null ? 1 : p.mul }); continue; }
    spawnRound(S, mx + px * off, my + py * off, a + (p.ang || 0), roundDamage(S, p.mul == null ? 1 : p.mul));
  }
  ev(S, { k:'fire', x:mx, y:my, ang:a, n:list.length, vol:vol, weapon:'rifle' });

function findEnemy(S, id){ for (var i = 0; i < S.enemies.length; i++) if (S.enemies[i].id === id) return S.enemies[i]; return null; }
function targetable(e){ return e.st !== 'spawn' && e.hp > 0 && !e.hidden; }

function updateLock(S, dt){
  var h = S.hero, t = S.tune;
  var cur = h.lockId != null ? findEnemy(S, h.lockId) : null;
  if (cur && !targetable(cur)) cur = null;
  h.retargetT -= dt;
  if (cur && h.retargetT > 0) return;
  h.retargetT = RETARGET_DT;
  var best = null, bestD = 1e9, near = null, nearD = 1e9, curD = 1e9, curClear = false;
  for (var i = 0; i < S.enemies.length; i++) {
    var e = S.enemies[i]; if (!targetable(e)) continue;
    var d = Math.hypot(e.x - h.x, e.y - h.y);
    var c = clearLine(S, h.x, h.y, e.x, e.y, t.ROUND_R);
    if (d < nearD) { nearD = d; near = e; }
    if (c && d < bestD) { bestD = d; best = e; }
    if (cur && e === cur) { curD = d; curClear = c; }
  }
  var next = cur;
  if (!cur) next = best || near;
  else if (curClear) { h.lostT = 0; if (best && best !== cur && bestD < curD - LOCK_HYST) next = best; }
  else { h.lostT += RETARGET_DT; if (best && h.lostT > LOST_LINE_T) next = best; }
  if (next !== cur) h.lostT = 0;
  var newId = next ? next.id : null;
  if (newId !== h.lockId) {
    if (newId != null) ev(S, { k:'lock', x:next.x, y:next.y, id:newId });
    else if (h.lockId != null) ev(S, { k:'unlock', x:h.x, y:h.y, id:h.lockId });
  }
  h.lockId = newId;
  h.lockClear = next ? (next === cur ? curClear : next === best) : false;
}

// ---------- hero ----------
function stepHero(S, inp, dt){
  var h = S.hero, t = S.tune;
  var mx = inp && +inp.mx || 0, my = inp && +inp.my || 0, len = Math.hypot(mx, my);
  if (h.invulnT > 0) h.invulnT = Math.max(0, h.invulnT - dt);
  if (h.fireCd > 0) h.fireCd = Math.max(0, h.fireCd - dt);
  if (len > 1e-6) {
    mx /= len; my /= len;
    var sp = t.MOVE_SPEED * S.st.moveMul * (S.phase === 'clear' && inp.walk > 1 ? inp.walk : 1);   // pick 45: auto-walk to the door runs faster (inp.walk, set by main.js only)
    h.x += mx * sp * dt; h.y += my * sp * dt;
    collideBody(S, h, HERO_WALL_R);
    h.ang = Math.atan2(my, mx);
    if (!h.moving && h.lockId != null) ev(S, { k:'unlock', x:h.x, y:h.y, id:h.lockId });
    h.moving = true; h.braced = false; h.braceT = 0; h.brace01 = 0;
    h.lockId = null; h.lockClear = false; h.lostT = 0; h.retargetT = 0; h.burstQ.length = 0; h.delayQ.length = 0;
    return;
  }
  h.moving = false;
  h.braceT += dt;
  h.brace01 = t.BRACE_DELAY > 0 ? Math.min(1, h.braceT / t.BRACE_DELAY) : 1;
  h.braced = h.braceT >= t.BRACE_DELAY - 1e-9;
  if (S.phase !== 'play') { if (h.lockId != null) { h.lockId = null; h.lockClear = false; } return; }
  updateLock(S, dt);
  var tg = h.lockId != null ? findEnemy(S, h.lockId) : null;
  if (tg) h.ang = Math.atan2(tg.y - h.y, tg.x - h.x);
  for (var di = 0; di < h.delayQ.length; di++) {
    var q = h.delayQ[di]; q.t -= dt;
    if (q.t <= 0) {
      var a0 = h.ang, qx = h.x + Math.cos(a0) * 0.3, qy = h.y + Math.sin(a0) * 0.3;
      spawnRound(S, qx - Math.sin(a0) * q.off, qy + Math.cos(a0) * q.off, a0 + q.ang, roundDamage(S, q.mul));
      h.delayQ.splice(di, 1); di--;
    }
  }
  for (var i = h.burstQ.length - 1; i >= 0; i--) {
    h.burstQ[i] -= dt;
    if (h.burstQ[i] <= 0) { h.burstQ.splice(i, 1); if (tg) fireBatch(S); }
  }
  if (h.braced && tg && h.lockClear && h.fireCd <= 0) {
    fireBatch(S);
    h.fireCd = fireInterval(S);
    for (var m = 1; m < S.st.volleys; m++) h.burstQ.push(MULTI_GAP * m);
  }
}

// META credits (mirrors V.Meta.TUNING; sim must not depend on V.Meta). D4 3.1 weights x 24.

// ---------- enemy helpers (api) ----------
function steerTo(S, e, tx, ty, speed, dt){

}

    r:r, dmg:dmg, src:e.type, bounces:(opts && opts.bounces) || 0, life:(opts && opts.life) || 12 };

}
function lob(S, e, tx, ty, T, r, dmg){
  var s = { x:e.x, y:e.y, sx:e.x, sy:e.y, tx:tx, ty:ty, t:0, T:Math.max(0.05, T), r:r || 1.0, dmg:dmg, src:e.type };

}
function tellT(S, b){ return b * S.tune.TELL_MULT; }
var api = {
  ev:ev, rng:function(S){ return S.rng; }, enemyDmg:enemyDmg, steerTo:steerTo, enemyShoot:enemyShoot, lob:lob,
  hurtHero:hurtHero, healHero:healHero, clearLine:clearLine, hitsSolid:hitsSolid, hitsSolidBody:hitsSolidBody, collideBody:collideBody,
  hero:function(S){ return S.hero; },
  dist:function(a, b){ return Math.hypot(b.x - a.x, b.y - a.y); },
  angleTo:function(a, b){ return Math.atan2(b.y - a.y, b.x - a.x); },
  tellT:tellT, spawnEnemy:spawnEnemy,
  damageEnemy:function(S, e, dmg, crit, opts){ return damageEnemy(S, e, dmg, !!crit, null, opts); },
  enemies:function(S){ return S.enemies; }, targetable:targetable, roundDamage:roundDamage, outOfRoom:outOfRoom,
  fx:function(S, o){ S.fx.push(o); return o; }
};

function stepEnemy(S, e, dt){
  var h = S.hero, b = base(e), A = V.AI[e.type];
  if (e.flashT > 0) e.flashT = Math.max(0, e.flashT - dt);

  if (e.st === 'spawn') { e.spawnT -= dt; if (e.spawnT <= 0) e.st = e.afterSpawn || 'move'; return; }

    if (e.boss || (e.immune && e.immune.freeze)) e.frozenT = 0; else e.frozenT = Math.max(0, e.frozenT - dt);
  }
  if (!(e.frozenT > 0) && A && A.step) A.step(S, e, dt, api);

  if (!immovable(e) && !charging(e)) collideBody(S, e, e.r);

  if (!e.noContact && !e.hidden && b.contact > 0 && e.contactCd <= 0 &&
      Math.hypot(h.x - e.x, h.y - e.y) < e.r + HERO_HURT_R + (charging(e) ? 0 : HERO_GAP + 0.02)) {

function immovable(e){ var b = base(e); return !!(b.static || e.static || e.boss || (e.immune && e.immune.knockback) || e.knockback === 0); }

      var dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy), m = p.r + q.r + 0.04;
      if (d >= m) continue;

      var pm = immovable(p) ? 0 : 1, qm = immovable(q) ? 0 : 1, sm = pm + qm;

    }

      else {

}

// ---------- damage to enemies ----------
// R45 (b): from 11 columns up, a repair drop that would land in a bottom 3 x 3 corner moves to the centre of the nearest
// floor cell outside both corners (first found wins a tie; no rng). At 9 columns the drop is untouched.
var CORNER = 3;

function killEnemy(S, e){

  var others = 0; for (var oi = 0; oi < S.enemies.length; oi++) if (S.enemies[oi] !== e && S.enemies[oi].hp > 0) others++;

    else S.pity += b.size === 'small' ? REPAIR_PITY * 0.5 : REPAIR_PITY;

function damageEnemy(S, e, dmg, crit, r, opts){

<script>
(function(){ var G = (typeof window !== 'undefined' ? window : globalThis); var V = G.V = G.V || {};
// F1 STAGE PROMPTS (pick 14; spec 05 s3.12; 06 row N1). Learn by playing: three short lines that leave the moment the action is done.
//   P-1 "Drag to move"            shows after 1.5 s with no touch; done when the Operator has moved one tile.
//   P-2 "Stand still to fire"     shows once P-1 is done and the Operator has moved for 4 s without a volley; done when a volley
//                                 fires after a stop that followed a move (standing at the spawn does not count).
//   P-3 "Cover blocks enemy shots" shows when an enemy round is in flight in a room with cover; done when an enemy round hits
//                                 cover within 1.5 tiles of the Operator.
// Rules [spec]: one prompt at a time, in that order; never pauses, never a tap target, hidden on boss stages; done = flagged in the
// settings key at once; a prompt not done returns in the next stage for at most 3 stages, then retires. An action done before its
// prompt shows also counts (the player already knows it). The sim is never touched: everything is read from S and its events.
// Times use sim seconds (S.t), so pause and hit-stop freeze them. Numbers marked (guess) are 05's guesses, not measured.
// API: V.Prompts.show(id), done(id), frame(S, view, o), event(e, S), state(), reset(), isDone(id), TEXT, ORDER, core(io) for tests.

var ORDER = ['P-1', 'P-2', 'P-3'];
var TEXT = { 'P-1': 'Drag to move', 'P-2': 'Stand still to fire', 'P-3': 'Cover blocks enemy shots' };

var MOVE_TILE = 1.0;      // tiles moved for P-1 (guess, 05)
var MOVE_NOFIRE = 4.0;    // s moving without a volley before P-2 shows (guess, 05)
var COVER_R = 1.5;        // tiles: a block this close to the Operator completes P-3 (guess, 05)
var MAX_STAGES = 3;       // stages a prompt may show in before it retires (guess, 05)
var SKEY = 'volley.settings.v1';

function blank(){ return { v: 1, done: {}, stages: {}, retired: {} }; }
function cleanState(o){

// P snippet 4 (pick 48): at most 2 buys per home visit. V.Meta.visitLeft() / whyNot() -> '' | 'max' | 'visit' | 'credits'.
function upBtn(v, cls){

        statRow(v) + costRow(v) + upBtn(v, 'ta-main') +

      '<p class="ta-note" style="margin:0">Credits are earned by clearing rooms.</p>' +
    '</div>' + (sheetOpen ? sheet(v) : '') + '</div>';

function onClick(e){
  var t = e.target; while (t && t !== el && !(t.getAttribute && t.getAttribute('data-act'))) t = t.parentNode;

  else if (act === 'buy') { var M = meta(); if (M.buy('rifle', 'rifle')) buySound(); render(); }

function buySound(){ var A = V.Audio; if (A && typeof A.play === 'function') { try { A.play('buy'); } catch (_) {} } }   // S-504 buy cue (audio.js F1)

<script>
(function(){ var G = (typeof window !== 'undefined' ? window : globalThis); var V = G.V = G.V || {};

].join('\n');

function tune(k, d){ var t = V.TUNE; return (t && typeof t[k] === 'number') ? t[k] : d; }
function r1(n){ return (Math.round(n * 10) / 10).toString(); }
function r2(n){ return (Math.round(n * 100) / 100).toFixed(2); }
function pct(n){ return r1(n * 100) + '%'; }
function dur(s){ s = Math.max(0, Math.round(+s || 0)); return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); }
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function when(t){
  if (!isFinite(t) || !t) return '';
  var d = new Date(t); if (isNaN(d.getTime())) return '';
  return MON[d.getMonth()] + ' ' + d.getDate() + ' ' + (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
}
function ico(path){ return '<svg class="pv-ico" viewBox="0 0 24 24" aria-hidden="true">' + path + '</svg>'; }
var I_HP = '<path d="M6 4l6 2 6-2 3 4-3 3v9H6v-9L3 8z"/>', I_ATK = '<path d="M2 14h14l2-3h4v3h-3v2H9l-1 4H5l1-4H2z"/>', I_RATE = '<path d="M3 12h8M13 6l8 6-8 6z"/>';

function figure(){
  var u = asset(KEYS.portrait);

  return '<svg viewBox="0 0 120 200" style="position:absolute;left:16px;top:26px;width:120px;height:200px" aria-hidden="true"><path d="M60 12a16 18 0 110 36 16 18 0 010-36zM40 60Q60 53 80 60L84 76L80 128L40 128L36 76ZM42 124h36l5 62H37z" fill="#2f3320" stroke="#0f1215" stroke-width="2"/><path d="M47 25H73L71 35H49Z" fill="#4cf0ff"/></svg>';
}

// Totals: hp = base + hpAdd, atk = base * atkMul, interval = base / rateMul (rateMul > 1 = faster). Bonus column shows the Meta difference.
function totals(){
  var M = meta(), hp0 = tune('HERO_HP', 600), atk0 = tune('HERO_ATK', 150), iv0 = tune('FIRE_INTERVAL', 0.8), x;
  var base = { hp0: hp0, atk0: atk0, iv0: iv0, crit: tune('CRIT_CHANCE', 0.05), critM: tune('CRIT_MULT', 2), spd: tune('MOVE_SPEED', 4.5) };
  if (typeof M.totals === 'function') { x = M.totals(); base.hp = Math.round(x.maxHp); base.atk = Math.round(x.atk); base.iv = x.interval; base.rate = 1 / x.interval; return base; }
  var s = (M.stats && M.stats()) || {}, rm = isFinite(s.rateMul) && s.rateMul > 0 ? +s.rateMul : 1;
  base.hp = Math.round(hp0 + (+s.hpAdd || 0)); base.atk = Math.round(atk0 * (isFinite(s.atkMul) && s.atkMul > 0 ? +s.atkMul : 1)); base.iv = iv0 / rm; base.rate = rm / iv0; return base;
}

var el = null, shown = false;
function render(){

          '<div class="to-r">Wins<b>' + fmt(wins) + '</b></div></div></div>' +
      '<div class="pv-panel pv-rivets to-tbl"><div class="h ta-hint"><span>Stat</span><span>Base <span style="color:var(--pv-ui-cyan)">+Bonus</span></span><span>Total</span></div>' + rows + '</div>' +
      '<div class="pv-section">' + (headU ? '<img src="' + headU + '" width="40" height="40" alt="" style="object-fit:contain;order:-1">' : '') + '<span class="pv-section__label">Run log</span><span class="pv-section__aside">last ' + Math.max(runs.length, 0) + ' of 10</span></div>' +
      '<div class="to-log">' + log + '</div>' +
    '</div></div>';
}

V.Tabs = V.Tabs || {};
V.Tabs.operator = {

};

<script>

}

/* local stub, used only when V.Meta is missing */
var stub = null;
function M(){
  if (V.Meta) return V.Meta;
  if (!stub) stub = { state:{ credits:0, cond:{hp:0,atk:0,rate:0}, settings:{sound:true,haptics:true}, codex:{seen:{}}, runs:[], best:0 },
    cost:function(){ return {credits:100}; }, canBuy:function(){ return false; }, buyRandom:function(){ return false; },
    stats:function(){ return {hpAdd:0, atkMul:1, rateMul:1}; }, onChange:function(){}, power:1 };
  return stub;
}

function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
function pct(m){ return '+' + Math.round((m - 1) * 100) + '%'; }
function effectOf(id, st){
  st = st || {};
  if (id === 'hp') return '+' + fmt(st.hpAdd || 0) + ' HP';
  if (id === 'atk') return pct(st.atkMul || 1) + ' ATK';
  return pct(st.rateMul || 1) + ' SPEED';
}
function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function level(id){ var c = M().state && M().state.cond; return (c && c[id]) | 0; }
function capOf(s){ var m = M(); return (m.maxLevel && m.maxLevel('cond', s.id)) || s.cap; }
function buysLeft(){ var m = M(); return m.visitLeft ? m.visitLeft() : 2; }
function whyNot(){ var m = M(); return m.whyNot ? m.whyNot('cond', 'rand') : (m.canBuy && m.canBuy('cond', 'rand') ? '' : 'credits'); }
function pipsHtml(n, max){ var h = ''; for (var i = 0; i < max; i++) h += '<span class="pip' + (i < n ? ' on' : '') + '"></span>'; return h; }
function iconBox(s, withAsset){
  return ico(s.icon);
}

var T = V.Tabs = V.Tabs || {};
var root = null, body = null, mounted = false, unsub = false, sheet = null;

function capBuys(){ var m = M(); return m.maxTotal ? m.maxTotal('cond') : 30; }
function boughtBuys(){ var m = M(); return m.boughtCount ? m.boughtCount('cond') : 0; }
function nextCost(){
  var m = M(), c = null;

  if (m.cost) c = m.cost('cond', 'rand');
  return c;
}
function render(){
  if (!root) return;
  var m = M(), st = m.state || {};
  var stats = m.stats ? m.stats() : {};
  body.innerHTML = '';
  var rule = el('p', 'rule');
  rule.innerHTML = 'Trains one random stat. Attack and speed give 2 levels.<span class="n">' + boughtBuys() + ' / ' + capBuys() + ' bought</span>';

  var vis = el('div', 'tb-visit' + (left <= 0 ? ' none' : '')); vis.id = 'tb-visit'; vis.setAttribute('role', 'status');
  vis.innerHTML = '<span class="vl">Buys left this visit:<b id="tb-left">' + left + '</b></span><span class="pips" aria-hidden="true">' + pipsHtml(left, vmax) + '</span>';
  body.appendChild(vis);
  var g = el('div', 'tb-grid3');
  STATS.forEach(function(s){
    var lv = level(s.id), cp = capOf(s), max = lv >= cp;
    var t = el('div', 'tl' + (max ? ' mx' : ''));
    t.id = 'tb-' + s.id;
    t.innerHTML = '<div class="tb-ti">' + iconBox(s, true) + '</div><div class="tn">' + s.name + '</div>' +
      '<div class="tv">' + (max ? 'MAX' : 'Lv ' + lv + ' / ' + cp) + '</div><div class="fx">' + effectOf(s.id, stats) + '</div><div class="per">+' + s.per + ' level' + (s.per > 1 ? 's' : '') + ' per buy</div>' +
      '<div class="pv-bar"><div class="pv-bar__fill" style="--v:' + Math.min(100, Math.round(lv / cp * 100)) + '%"></div></div>';
    g.appendChild(t);
  });
  body.appendChild(g);
  var c = nextCost(), all = !c;
  var pn = el('div', 'pv-panel tb-pn');

    '<div class="sm">' + (all ? 'Every stat is at its cap.' : 'Upgrades one random stat that is not maxed.') + '</div></div>';
  body.appendChild(pn);
  body.appendChild(el('div', 'tb-spacer'));
  var why = all ? 'max' : whyNot(), can = !all && c && why === '';
  var btn = el('button', 'pv-btn tb-buy ' + (can ? 'pv-btn--primary' : ''));
  btn.type = 'button'; btn.setAttribute('data-buy', 'cond');
  if (all) btn.innerHTML = '<span class="lbl">Maxed</span>';
  else if (why === 'visit') btn.innerHTML = '<span class="lbl">No buys left</span><span class="cost">' + COIN + fmt(c ? c.credits : 0) + '</span>';
  else btn.innerHTML = '<span class="lbl">Upgrade</span><span class="cost">' + COIN + fmt(c ? c.credits : 0) + '</span>';
  if (!can) { btn.className += ' is-disabled'; btn.disabled = true; }
  btn.addEventListener('click', buy);
  body.appendChild(btn);
  // QA-HOME 12: same hint as the Armory (tab-armory.js upBtn / .ta-note): grey, never red.
  var short = (!all && c && why === 'credits') ? Math.max(0, (c.credits | 0) - (st.credits | 0)) : 0;
  body.appendChild(el('div', 'tb-note' + (short > 0 || why === 'visit' ? ' is-warn' : ''), why === 'visit' ? 'Your buys for this visit are used. They come back after your next run.' : (short > 0 ? 'Need ' + fmt(short) + ' more credits' : '&nbsp;')));
}

function buy(){
  var m = M();
  if (!(m.canBuy && m.canBuy('cond', 'rand'))) return;
  var before = m.stats ? m.stats() : {}, lv = {};
  STATS.forEach(function(s){ lv[s.id] = level(s.id); });
  var r = m.buy ? m.buy('cond', 'rand') : (m.buyRandom ? m.buyRandom('cond') : false);
  var id = r && r.stat ? r.stat : (r === true ? m.lastBuy : (typeof r === 'string' ? r : null));
  if (!id) return;
  var s = STATS.filter(function(x){ return x.id === id; })[0];
  if (!s) return;
  showSheet(s, before, m.stats ? m.stats() : {}, lv[id], level(id), Math.max(1, level(id) - lv[id]));
}

function showSheet(s, before, after, lb, la, granted){
  closeSheet();
  var r = el('div', 'tb-res'); r.setAttribute('role', 'dialog'); r.setAttribute('aria-label', 'Training complete');
  r.innerHTML = '<div class="card"><div class="pv-stencil pv-muted">Training complete</div>' +
    '<div class="big">' + iconBox(s, false) + '<b>' + s.name + '</b></div>' +
    '<div class="plus">+' + granted + ' LEVEL' + (granted > 1 ? 'S' : '') + '</div>' +
    '<div class="ba"><div class="bx"><small>Before &middot; Lv ' + lb + '</small><span>' + effectOf(s.id, before) + '</span></div>' + ico('arrow') +
    '<div class="bx af"><small>After &middot; Lv ' + la + '</small><span>' + effectOf(s.id, after) + '</span></div></div>' +
    '<div class="pv-stencil pv-muted" id="tb-sheet-left">Buys left this visit: ' + buysLeft() + '</div>' +
    '<button type="button" class="pv-btn pv-btn--primary" data-continue>Continue</button></div>';
  r.querySelector('[data-continue]').addEventListener('click', closeSheet);
  root.appendChild(r); sheet = r;
}
function closeSheet(){ if (sheet && sheet.parentNode) sheet.parentNode.removeChild(sheet); sheet = null; }

T.upgrades = {
  id: 'upgrades', title: 'Upgrades', icon: 'upgrades',
  mount: function(host){
    injectCss();
    root = el('div', 'tb-up');
    body = el('div', 'body');
    root.appendChild(body);
    host.innerHTML = ''; host.appendChild(root);
    mounted = true;
    if (!unsub && M().onChange) { M().onChange(function(){ if (mounted) render(); }); unsub = true; }
    render();
  },
  show: function(){ if (root) render(); },
  hide: function(){ closeSheet(); }
};
})();

</script>

  function circ(x, y, r, fill){ shape(function(){ c.arc(x, y, r, 0, 7); }, fill); }

  function poly(pts, fill){ shape(function(){ pts.forEach(function(p, i){ i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }); c.closePath(); }, fill); }

  c.globalAlpha = 1;

    c.beginPath(); c.arc(0, 0, 24, 0, 7); c.lineWidth = 3; c.strokeStyle = '#1a1f24'; c.stroke();
    circ(0, 0, 15, METAL); eye(0, 0, 6);

    poly([[-14,12],[14,12],[10,-12],[-10,-12]], METAL); poly([[-3,-26],[3,-26],[3,-8],[-3,-8]], DARK); eye(0, 3, 4);

    var o = []; for (var j = 0; j < 8; j++) { var b = j * Math.PI / 4 + Math.PI / 8; o.push([Math.cos(b) * 24, Math.sin(b) * 24]); }

    // pick/dead: the sim may still animate; nothing to step here
  }
  syncPhase();
  draw();
}
// Catch room (K): V.CatchScene paints with a real 2D context, so it gets its own overlay canvas (works under WebGPU and Canvas 2D alike).
var catchCtx = null, catchOn = false;
function drawCatch(){
  var cv = $('cCatch'); if (!cv) return;
  var on = !!(S.mini && S.stageKind === 'collect' && V.CatchScene);   // S.mini is not cleared when the next stage loads (K bug), so also test the stage kind
  if (!on) { if (catchOn) { cv.style.display = 'none'; catchOn = false; } return; }
  var d = view.dpr || 1, pw = Math.max(1, Math.round(view.w * d)), ph = Math.max(1, Math.round(view.h * d));
  if (cv.width !== pw) cv.width = pw; if (cv.height !== ph) cv.height = ph;
  if (!catchOn) { cv.style.display = 'block'; catchOn = true; }
  if (!catchCtx) catchCtx = cv.getContext('2d');
  catchCtx.setTransform(d, 0, 0, d, 0, 0);
  V.CatchScene.draw(catchCtx, S, view);
}
function draw(){
  if (roomCols() && roomCols() !== view.C) refit();   // a new room was entered with another column count: refit the tile (C changes only here)
  V.Scene.build(S, view, list);
  R.draw(list, view);
  drawCatch();
  UI.hud(S, R, view);
  if (!moved && (V.Input.active || S.stage > 1)) moved = true;
  if (V.Prompts) { UI.howto(false, view); V.Prompts.frame(S, view, { touching: !!V.Input.active, home: home, paused: paused }); } else UI.howto(!moved && S.phase === 'play', view);
}

function pct(a, p){ if (!a.length) return 0; var b = a.slice().sort(function(x, y){ return x - y; }); return Math.round(b[Math.min(b.length - 1, Math.floor(p * b.length))] * 10) / 10; }
function metrics(){
  return { S: S, renderer: R ? R.name + (R.why ? ' (' + R.why + ')' : '') : 'none', viewport: Math.round(view.w) + 'x' + Math.round(view.h),
    frame: { p50: pct(ft, 0.5), p95: pct(ft, 0.95), max: Math.round(Math.max.apply(null, ft.concat([0])) * 10) / 10, n: ft.length },
    gaps: gaps, deaths: deaths };
}

// ---------- boot ----------
function boot(){
  if (!V.Sim || !V.Scene || !V.Render || !V.TUNE) { fail('Missing parts: ' + ['Sim', 'Scene', 'Render', 'TUNE'].filter(function(k){ return !V[k]; }).join(', ')); return; }
  UI.init({ metrics: metrics, onDrawer: function(on){ if (on) V.Input.release(); acc = 0; last = 0; } });
  var stage = $('stage');
  V.Input.attach(document.body, V.TUNE);   // body, not #stage: in a run a touch that starts in a bar steers too (spec 05 s1)
  layout();
  G.addEventListener('resize', layout);
  if (G.visualViewport) G.visualViewport.addEventListener('resize', layout);

  var seed = Q.has('seed') ? (parseInt(Q.get('seed'), 10) | 0) : (Date.now() % 1000000);
  var stress = parseInt(Q.get('stress') || '0', 10) | 0; if (stress > 0) V.Scene.stress = stress;
  S = V.Sim.create(seed, V.TUNE, simOpts); V.Audio.seed(seed);

  document.addEventListener('visibilitychange', function(){ if (document.hidden) pause(); });
  G.addEventListener('blur', pause);
  G.addEventListener('pagehide', pause);
  $('ovPause').addEventListener('pointerdown', function(e){ if (e.target.closest && e.target.closest('button')) return; e.preventDefault(); resume(); swallowPauseClick = true; setTimeout(function(){ swallowPauseClick = false; }, 400); });
  $('btnHome').addEventListener('click', function(e){ if (guardOk(e.detail === 0 ? performance.now() : (resPressAt > deadAt ? resPressAt : 0)) && V.Home) V.Home.show(); });
  $('btnResume').addEventListener('click', resume);
  $('pauseBtn').addEventListener('click', function(){ if (swallowPauseClick) { swallowPauseClick = false; return; } pause(); });
  $('btnRestartRun').addEventListener('click', function(e){ e.stopPropagation(); restart(); resume(); });
  $('btnTune').addEventListener('click', function(e){ e.stopPropagation(); UI.openDrawer(true); });
  // Pick 45 (M): a touch during the clear phase PAUSES auto-walk (it no longer cancels it). While the finger is down the player steers;
  // after the lift, auto-walk resumes once AUTO_WALK_DELAY has passed with no input (autoWalkInput resets aw.idle on any input).
  stage.addEventListener('pointerdown', function(e){
    if (S && S.phase === 'clear' && aw.on && !(e.target.closest && e.target.closest('button, .ov, #drawer'))) { aw.on = false; V.Input.note('awp', 0, 0); }
  }, true);
  $('ovDead').addEventListener('pointerdown', function(e){ resPressAt = performance.now(); });
  // A click counts only when its press began on this screen after the guard (keyboard clicks have detail 0).
  $('btnRestart').addEventListener('click', function(e){ tryRestart(e.detail === 0 ? performance.now() : (resPressAt > deadAt ? resPressAt : 0)); });
  G.addEventListener('keydown', function(e){
    if (paused && (e.key === ' ' || e.key === 'Enter' || e.key === 'Escape')) { resume(); return; }
    if (S && isEnd() && !e.repeat && (e.key === ' ' || e.key === 'Enter' || e.key === 'r')) tryRestart();
    if (S && S.phase === 'supply' && !(S.mini && S.stageKind === 'collect') && /^[1-2]$/.test(e.key) && S.supply && +e.key <= S.supply.length) pickSupply(+e.key - 1);
    if (S && S.phase === 'pick' && /^[1-3]$/.test(e.key) && S.cards && +e.key <= S.cards.length) pick(+e.key - 1);
  });

  V.Render.create({ c2d: $('c2d'), cgpu: $('cgpu'), forceCanvas: Q.get('gpu') === '0' }).then(function(r){
    R = r; layout();
    if (R.onChange) R.onChange(function(){ layout(); UI.rendererLabel(R, view); });
    UI.show('ovBoot', false);
    syncPhase();
    requestAnimationFrame(frame);
    if (V.Title) V.Title.show();
  }).catch(function(e){ console.error(e); fail('Renderer failed: ' + (e && e.message)); });

  G.__pv = {
    get renderer(){ return R ? R.name : 'none'; },
    get rendererWhy(){ return R ? R.why : ''; },
    get R(){ return R; },
    get S(){ return S; },
    get paused(){ return paused; },
    get view(){ return view; },
    get frame(){ return { scale: 1, left: 0, top: 0, w: vp.W, h: vp.H, vw: vp.W, vh: vp.H }; },   // compat: the stage is the viewport
    get layout(){ return Object.assign({ colsNext: V.Layout.cols() }, fitNow); },
    relayout: layout,
    toFrame: toFrame,
    get frozen(){ return frozen; },
    get autoWalk(){ return { idle: aw.idle, cancelled: aw.cancelled, on: aw.on }; },
    get lastCopy(){ return UI.lastCopy; },
    step: function(n, inp){
      n = n || 1; inp = inp || { mx: 0, my: 0 };
      for (var i = 0; i < n; i++) simStep(typeof inp === 'function' ? inp(S) : inp, false);
      syncPhase(); if (R) draw(); return S;
    },
    pick: function(i){ pick(i); return S; },
    doorDir: function(){ return S ? doorDir() : { mx: 0, my: 0 }; },  // same path the auto-walk uses
    pickSupply: function(i){ pickSupply(i); return S; },
    restart: function(){ return restart(); },
    get home(){ return home; },
    readback: function(){ return R && R.readback ? R.readback() : Promise.resolve(null); },
    freeze: function(on){ frozen = on !== false; acc = 0; return frozen; },  // stop real-time stepping (deterministic tests)
    pause: pause, resume: resume,
    drawer: function(on){ UI.openDrawer(on); },
    report: function(){ return UI.report(); },
    metrics: metrics,
    hash: function(){ return V.Sim.hash ? V.Sim.hash(S) : null; },
    tune: V.TUNE,
    input: V.Input,
    audio: V.Audio,
    build: UI.BUILD
  };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
