<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Project Volley</title>
<style>
:root{
  --sand:#e9dcbf; --sand2:#cdbb94; --ink:#14130f; --gun:#26292b; --gun2:#33373a; --panel:rgba(22,23,24,.92);
  --cyan:#43d3e3; --cyanD:#0e5a63; --red:#e2463c; --hp:#5fd06a; --amber:#f0b54a; --mut:#b9b2a2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--pv-ui-bg,#0b0e11);color:var(--sand);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
/* Scaled frame (pick 1): #stage is always 344 x 882 frame units; main.js layout() sets translate+scale. The bars are the body background
   (flat --pv-ui-bg) with a 1 px --pv-ui-metal-500 line on the frame edge (1 screen px at any scale). Bars carry no art or text. */
body{touch-action:none}
#stage{position:absolute;left:0;top:0;width:344px;height:882px;transform-origin:0 0;overflow:hidden;touch-action:none;background:#c9b48a;flex:none;
  box-shadow:0 0 0 calc(1px / var(--pv-scale,1)) var(--pv-ui-metal-500,#4a535d)}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
/* HUD */
#hud{position:absolute;left:0;top:0;right:0;pointer-events:none;z-index:10;
  padding:0px 0px 0 0px;
  background:linear-gradient(#1d1e1f,#1d1e1f) no-repeat top/100% 0px}
#hudTop{display:flex;align-items:center;gap:6px;height:44px;padding:4px 4px 0 6px;background:linear-gradient(#1d1e1fee,#1d1e1fcc)}
#stageLbl{font-weight:700;font-size:13px;white-space:nowrap;color:var(--sand);background:var(--gun);border:1px solid #4a4d4f;border-radius:6px;padding:3px 6px}
#stageLbl b{color:#fff}
#lvl{font-weight:800;font-size:13px;color:#0d1b1d;background:var(--cyan);border-radius:6px;padding:3px 6px;white-space:nowrap}
#xpWrap{height:6px;margin:2px 6px 0;border-radius:3px;background:#0c0d0e;border:1px solid #45494c;overflow:hidden}
#xpFill{height:100%;width:0;background:var(--cyan)}
.hb{pointer-events:auto;flex:none;width:56px;height:56px;margin:-6px -4px -6px 0;border:0;background:transparent;color:var(--sand);font-size:24px;line-height:56px;padding:0;cursor:pointer}
#pauseBtn{font-size:13px;letter-spacing:-2px}
.hb span{display:inline-block;width:36px;height:36px;line-height:34px;border-radius:8px;background:var(--gun);border:1px solid #55595c}
#hpRow{position:relative;height:18px;margin:0 6px;border-radius:0 0 6px 6px;background:#0c0d0e;border:1px solid #45494c;border-top:0;overflow:hidden}
#hpFill{height:100%;width:100%;background:var(--hp);transition:width .12s}
/* Two copies of the HP text: dark where the bar is filled, light where it is empty (4.5:1 on both). */
.hpT{position:absolute;inset:0;text-align:center;font-size:12px;font-weight:800;line-height:18px;transition:clip-path .12s}
#hpTxt{color:#0b1416;clip-path:inset(0 0 0 0)}
#hpTxtE{color:#f2ead8;clip-path:inset(0 0 0 100%)}
#rlbl{position:absolute;left:6px;bottom:6px;font:11px/1.2 ui-monospace,Menlo,Consolas,monospace;color:#1b1a17;background:rgba(233,220,191,.85);padding:2px 5px;border-radius:4px;pointer-events:none;z-index:10;display:none}
body.dbg #rlbl{display:block}
.rinfo{font:11px/1.3 ui-monospace,Menlo,Consolas,monospace;color:var(--mut)}
#toast{position:absolute;left:50%;transform:translateX(-50%);max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-weight:700;font-size:13px;color:var(--sand);background:var(--panel);
  border:1px solid var(--cyanD);border-radius:8px;padding:6px 8px;pointer-events:none;z-index:11;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
#flash{position:absolute;inset:0;pointer-events:none;z-index:9;box-shadow:inset 0 0 40px 14px rgba(226,40,30,.85);opacity:0;transition:opacity .25s ease-out}
#flash.on{opacity:1;transition:none}
body.ovon #hud, body.ovon #toast, body.ovon #rlbl{visibility:hidden}
/* overlays */
.ov{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:max(16px,0px) max(16px,0px) max(16px,0px) max(16px,0px);
  background:rgba(20,19,16,.94);text-align:center}
.ov.on{display:flex}
.ov h2{margin:0;font-size:22px;color:#fff;letter-spacing:.5px}
.ov p{margin:0;color:var(--sand);max-width:300px}
.btn{min-height:56px;min-width:120px;padding:8px 18px;border-radius:10px;border:0;font:700 17px system-ui,sans-serif;background:var(--cyan);color:#0b1416;cursor:pointer}
.btn.ghost{background:var(--gun2);color:var(--sand);border:1px solid #5a5e61}
.card{width:100%;min-height:64px;border-radius:10px;border:2px solid var(--cyan);background:var(--gun);color:var(--sand);padding:8px 10px;text-align:left;cursor:pointer;font:inherit;
  display:flex;align-items:center;gap:10px}
.card .gl{flex:none;width:44px;height:44px;border-radius:8px;background:#11262a;border:1px solid var(--cyanD);color:var(--cyan);font:700 22px/44px system-ui,sans-serif;text-align:center}
.card .tx{flex:1;min-width:0}
.card b{display:block;font-size:18px;color:#fff;margin-bottom:2px}
.card span{display:block;font-size:15px;line-height:1.25;color:var(--sand)}
.card.sup .gl{background:#2d2414;border-color:#7a5a20;color:var(--amber)}
#deadStats{font-size:14px;color:var(--sand);line-height:1.5}
/* Boss bar (D1): label row above a plain full-width bar, so no text sits over the fill. */
#bossBar{position:absolute;display:none;z-index:10;pointer-events:none;padding:2px 4px 4px;border-radius:6px;background:rgba(12,13,14,.88);border:1px solid #6a2a26}
#bossTxt{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;line-height:15px;color:#fff;white-space:nowrap;padding:0 2px}
#bossTxt span{overflow:hidden;text-overflow:ellipsis}
#bossHp{flex:none;font-variant-numeric:tabular-nums}
#bossTrack{height:9px;margin-top:1px;border-radius:3px;background:#2a1513;border:1px solid #6a2a26;overflow:hidden}
#bossFill{height:100%;width:100%;background:#e0483d}
#howto{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:86%;text-align:center;font-size:14px;font-weight:700;color:#1b1a17;background:rgba(233,220,191,.92);
  border:1px solid #8a7a5a;border-radius:8px;padding:6px 10px;pointer-events:none;z-index:10;display:none}
body.ovon #bossBar, body.ovon #howto, body.ovon #dmgLayer{visibility:hidden}
#dmgLayer{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.dn{position:absolute;left:0;top:0;font:800 16px/1 system-ui,sans-serif;color:#ff9a2e;white-space:nowrap;opacity:0;
  text-shadow:-1px -1px 0 #2a1200,1px -1px 0 #2a1200,-1px 1px 0 #2a1200,1px 1px 0 #2a1200,0 0 3px #000;will-change:transform,opacity}
.card.sup{border-color:var(--amber)}
.card small{display:block;font-size:12px;color:var(--amber);text-transform:uppercase;letter-spacing:1px;margin-bottom:1px}
#resStats{font:400 14px/1.2 var(--pv-ui-font);color:var(--pv-ui-text);text-align:left;background:linear-gradient(var(--pv-ui-metal-700),var(--pv-ui-metal-800));border:1.5px solid var(--pv-ui-ink);border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -2px 0 rgba(0,0,0,.35),0 2px 0 rgba(0,0,0,.55);padding:4px 12px;max-width:312px;width:100%}
#resStats .row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:32px;border-bottom:1px dashed var(--pv-ui-metal-600)}
#resStats .row:last-child{border-bottom:0}
#resStats .row span{font:700 12px/1.1 var(--pv-ui-font-stencil);text-transform:uppercase;letter-spacing:.12em;color:var(--pv-ui-text-2)}
#resStats .row b{font:800 16px/1.1 var(--pv-ui-font-stencil);font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--pv-ui-text);text-align:right;min-width:0}
#ovDead h2{font:800 22px/1.1 var(--pv-ui-font-stencil);text-transform:uppercase;letter-spacing:.08em;color:var(--pv-ui-sand)}
#ovDead .btn{width:100%;max-width:312px;min-height:56px;display:flex;align-items:center;justify-content:center;font:800 14px/1 var(--pv-ui-font-stencil);text-transform:uppercase;letter-spacing:.14em;border-radius:6px;
  color:var(--pv-ui-text);background:linear-gradient(var(--pv-ui-metal-600),var(--pv-ui-metal-800));border:2.5px solid var(--pv-ui-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -2px 0 rgba(0,0,0,.35),0 3px 0 var(--pv-ui-ink)}
#ovDead .btn#btnRestart{min-height:64px;font-size:22px;letter-spacing:.2em;color:var(--pv-ui-cyan-ink);border:0;border-radius:0;background:linear-gradient(var(--pv-ui-cyan-hi),var(--pv-ui-cyan) 45%,#18bfd6);
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));box-shadow:inset 0 0 0 2px var(--pv-ui-ink),inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,60,70,.35)}
#ovDead .btn.ghost{background:linear-gradient(var(--pv-ui-metal-700),var(--pv-ui-metal-900));border:2.5px solid var(--pv-ui-cyan-lo);color:var(--pv-ui-cyan)}
#ovDead .btn:active{transform:translateY(3px);filter:brightness(.88)}
#ovDead #resTitle.win{color:var(--pv-ui-cyan)}
#ovDead:not(.armed) #btnRestart{opacity:.45}
@media (prefers-reduced-motion: reduce){ #flash{display:none} #toast,#hpFill{transition:none} }
/* Results portrait (P-02): framed panel, sand backdrop kept */
#resHead{display:flex;align-items:center;gap:12px;width:100%;max-width:312px}
#resHead h2{flex:1;text-align:left}
#resPortrait{display:block;flex:none;width:72px;height:96px;border-radius:4px;border-radius:6px;border:2px solid #0f1215;box-shadow:0 0 0 1.5px #4a535d;object-fit:cover;object-position:top;background:#1b2026}
#ovBoot{z-index:60}
/* drawer */
#drawer{position:absolute;top:0;right:0;bottom:0;width:100%;z-index:50;background:rgba(18,18,17,.97);display:none;flex-direction:column;
  padding:0px 0px 0px 0px}
#drawer.on{display:flex}
#drHead{display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid #3c3f42;flex-wrap:wrap}
#drHead h3{margin:0 auto 0 4px;font-size:16px;color:#fff}
#drBody{flex:1;overflow-y:auto;padding:4px 10px 20px;touch-action:pan-y}
#drBody h4{margin:12px 0 2px;font-size:13px;color:var(--cyan);text-transform:uppercase;letter-spacing:1px}
.kn{padding:4px 0;border-bottom:1px solid #2b2d2f}
.kn label{display:flex;justify-content:space-between;font-size:12px;color:var(--sand)}
.kn label i{font-style:normal;color:#fff;font-family:ui-monospace,Menlo,monospace}
.kn input[type=range]{width:100%;height:36px;margin:0;accent-color:var(--cyan)}
.kn .tg{min-height:56px;width:100%;margin-top:2px}
#drMsg{font-size:12px;color:var(--amber);min-height:16px;padding:0 10px}
#copyArea{position:absolute;left:-9999px;top:0;width:10px;height:10px}
/* ==========================================================================
   Project Volley UI kit  (ui-kit.css)   344 x 882 portrait, no dependencies
   Look: military field hardware. Gunmetal + olive panels, sand/off-white text,
   cyan = hero accent + primary action, red = enemies/danger only,
   amber hazard stripes = warnings only. Thin ink outlines, stencil labels.
   Tokens come from the G2 look (look-G2-desert-refined.html).

   CLASS INDEX (prefix pv-)
   Frame      .pv-screen  .pv-screen__body  .pv-scroll  .pv-safe-bottom  .pv-stack  .pv-row  .pv-grow
   Type       .pv-h1 .pv-h2 .pv-body .pv-small .pv-num .pv-stencil .pv-muted .pv-cyan .pv-danger
   Status bar .pv-status  .pv-status__title  .pv-chip  .pv-chip--credits  .pv-chip--schem  .pv-chip__icon
   Header     .pv-section  .pv-section__label  .pv-section__aside
   Panel      .pv-panel  .pv-panel--olive  .pv-panel--inset  .pv-panel--cut  .pv-rivets
   Buttons    .pv-btn  .pv-btn--primary (Deploy)  .pv-btn--secondary  .pv-btn--ghost  .pv-btn--danger
              .pv-btn--sm  .pv-btn--block  .pv-btn--icon  states: .is-pressed .is-disabled [disabled]
   Tab bar    .pv-tabbar  .pv-tab  .pv-tab--center (raised)  .pv-tab__icon  .pv-tab__label  .is-selected
   Gear       .pv-slot (gear slot, 64px)  .pv-cell (inventory cell, 56px)  .pv-slot__label
              rarity: .r1 .r2 .r3 .r4 .r5 (+ .r6 spare)   .pv-lvl (level badge)  .is-selected .is-locked .is-empty
   Stats      .pv-stat  .pv-stat__name  .pv-stat__val  .pv-stat__delta  (.is-up .is-down)
   Progress   .pv-bar  .pv-bar__fill  .pv-bar--cyan .pv-bar--olive .pv-bar--danger .pv-bar--sm .pv-bar__text
   Chapter    .pv-chapter  .pv-chapter__art  .pv-chapter__title  .pv-chapter__meta  .pv-chapter__stars  .is-selected .is-locked
   List row   .pv-list  .pv-item  .pv-item__icon  .pv-item__main  .pv-item__title  .pv-item__sub  .pv-item__end
   Upgrade    .pv-upgrade  .pv-upgrade__icon  .pv-upgrade__name  .pv-upgrade__fx  .pv-upgrade__tag  (also in-run field-mod row)
   Modal      .pv-scrim  .pv-sheet  .pv-sheet__grab  .pv-sheet__title  .pv-sheet__actions
   Toast      .pv-toast  .pv-toast--ok  .pv-toast--warn
   Lock       .is-locked  .pv-lock (overlay)  .pv-lock__icon  .pv-lock__text
   Badge/pip  .pv-badge  .pv-badge--cyan .pv-badge--olive .pv-badge--warn .pv-badge--danger  .pv-pip  .pv-pip--num
   Hazard     .pv-hazard (amber stripe strip, warnings only)
   Icons      .pv-ico (1em inline svg, uses currentColor)  .pv-ico--lg
   ========================================================================== */

:root{
  /* ink + gunmetal */
  --pv-ui-ink:#0f1215;          /* outline colour */
  --pv-ui-bg:#0b0e11;           /* screen base */
  --pv-ui-metal-900:#14181c;
  --pv-ui-metal-800:#1b2026;
  --pv-ui-metal-700:#242a31;
  --pv-ui-metal-600:#2f363e;
  --pv-ui-metal-500:#4a535d;
  --pv-ui-metal-400:#5b6671;
  /* olive */
  --pv-ui-olive-900:#23271a;
  --pv-ui-olive-800:#2f3320;
  --pv-ui-olive-700:#3d4a28;
  --pv-ui-olive-500:#5a673a;
  --pv-ui-olive-300:#8a925c;
  /* sand + text */
  --pv-ui-sand:#d6bf8e;
  --pv-ui-sand-dim:#a38a60;
  --pv-ui-text:#e4dfd2;         /* primary text */
  --pv-ui-text-2:#b6b0a2;       /* secondary text */
  --pv-ui-text-3:#8f897b;       /* tertiary, large/decorative only */
  /* accents */
  --pv-ui-cyan:#38e8ff;
  --pv-ui-cyan-hi:#7ff3ff;
  --pv-ui-cyan-lo:#0e7f90;
  --pv-ui-cyan-ink:#04181c;     /* text on cyan */
  --pv-ui-red:#ff3b30;
  --pv-ui-red-lo:#7a1812;
  --pv-ui-amber:#f4c21a;
  --pv-ui-amber-ink:#2a2d31;
  --pv-ui-ok:#8fc25a;
  /* rarity (see spec 07) */
  --pv-ui-r1:#8f897b; --pv-ui-r2:#7fae4f; --pv-ui-r3:#4aa3e0; --pv-ui-r4:#9a86ff; --pv-ui-r5:#e0a93a; --pv-ui-r6:#d8fbff;
  /* type */
  --pv-ui-font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --pv-ui-font-stencil:"Arial Narrow","Roboto Condensed","DIN Condensed","Bahnschrift Condensed",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --pv-ui-fs-xs:11px; --pv-ui-fs-sm:12px; --pv-ui-fs-md:14px; --pv-ui-fs-lg:17px; --pv-ui-fs-xl:22px; --pv-ui-fs-xxl:30px;
  /* space (4 px grid) */
  --pv-ui-s1:4px; --pv-ui-s2:8px; --pv-ui-s3:12px; --pv-ui-s4:16px; --pv-ui-s5:24px; --pv-ui-s6:32px;
  /* radii, strokes */
  --pv-ui-r-sm:3px; --pv-ui-r-md:6px; --pv-ui-r-lg:10px; --pv-ui-cut:8px;
  --pv-ui-stroke:1.5px; --pv-ui-stroke-heavy:2.5px;
  /* shadows */
  --pv-ui-sh-1:0 2px 0 rgba(0,0,0,.55);
  --pv-ui-sh-2:0 4px 10px rgba(0,0,0,.6);
  --pv-ui-glow:0 0 10px rgba(56,232,255,.45);
  --pv-ui-bevel:inset 0 1px 0 rgba(255,255,255,.10), inset 0 -2px 0 rgba(0,0,0,.35);
  /* sizes */
  --pv-ui-touch:44px; --pv-ui-w:344px; --pv-ui-h:882px; --pv-ui-tabbar-h:64px; --pv-ui-status-h:48px;
  --pv-ui-hazard:repeating-linear-gradient(-45deg,var(--pv-ui-amber) 0 8px,var(--pv-ui-amber-ink) 8px 16px);
  --pv-ui-rivet:radial-gradient(circle at 35% 35%,#7b848d 0 1px,#3a4149 2px,#14181c 3px,transparent 3.5px);
}

*,*::before,*::after{box-sizing:border-box}
.pv-screen{position:relative;width:344px;height:882px;overflow:hidden;background:
  radial-gradient(120% 60% at 50% 0,#1b2026 0,transparent 70%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 2px,transparent 2px 4px),var(--pv-ui-bg);
  color:var(--pv-ui-text);font:400 var(--pv-ui-fs-md)/1.35 var(--pv-ui-font);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent}
.pv-screen__body{flex:1;min-height:0;padding:var(--pv-ui-s3);display:flex;flex-direction:column;gap:var(--pv-ui-s3)}
.pv-scroll{overflow-y:auto;scrollbar-width:none}.pv-scroll::-webkit-scrollbar{display:none}
.pv-safe-bottom{padding-bottom:calc(var(--pv-ui-tabbar-h) + var(--pv-ui-s3))}
.pv-stack{display:flex;flex-direction:column;gap:var(--pv-ui-s2)}
.pv-row{display:flex;align-items:center;gap:var(--pv-ui-s2)}
.pv-grow{flex:1;min-width:0}

/* type */
.pv-h1{font:800 var(--pv-ui-fs-xl)/1.1 var(--pv-ui-font-stencil);text-transform:uppercase;letter-spacing:.06em;margin:0}
.pv-h2{font:700 var(--pv-ui-fs-lg)/1.2 var(--pv-ui-font);margin:0}
.pv-body{font-size:var(--pv-ui-fs-md)}
.pv-small{font-size:var(--pv-ui-fs-sm);color:var(--pv-ui-text-2)}
.pv-num{font-family:var(--pv-ui-font-stencil);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pv-stencil{font:700 var(--pv-ui-fs-xs)/1 var(--pv-ui-font-stencil);text-transform:uppercase;letter-spacing:.16em}
.pv-muted{color:var(--pv-ui-text-2)}.pv-cyan{color:var(--pv-ui-cyan)}.pv-danger{color:var(--pv-ui-red)}

/* icons */
.pv-ico{width:1em;height:1em;flex:none;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pv-ico--lg{width:1.8em;height:1.8em}

/* status bar */
.pv-status{height:var(--pv-ui-status-h);flex:none;display:flex;align-items:center;gap:var(--pv-ui-s2);padding:0 var(--pv-ui-s3);
  background:linear-gradient(var(--pv-ui-metal-800),var(--pv-ui-metal-900));border-bottom:var(--pv-ui-stroke-heavy) solid var(--pv-ui-ink);box-shadow:var(--pv-ui-sh-2)}
.pv-status__title{flex:1;min-width:0;font:800 var(--pv-ui-fs-md)/1 var(--pv-ui-font-stencil);text-transform:uppercase;letter-spacing:.14em;color:var(--pv-ui-sand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 8px;border-radius:var(--pv-ui-r-md);
  background:var(--pv-ui-ink);border:var(--pv-ui-stroke) solid var(--pv-ui-metal-500);font:800 var(--pv-ui-fs-sm)/1 var(--pv-ui-font-stencil);font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--pv-ui-text)}
.pv-chip__icon{width:16px;height:16px;flex:none}
.pv-chip--credits .pv-chip__icon{color:var(--pv-ui-sand)}
.pv-chip--schem .pv-chip__icon{color:var(--pv-ui-cyan)}

/* section header */
.pv-section{display:flex;align-items:center;gap:var(--pv-ui-s2);min-height:24px}
.pv-section__label{font:800 var(--pv-ui-fs-sm)/1 var(--pv-ui-font-stencil);text-transform:uppercase;letter-spacing:.2em;color:var(--pv-ui-sand);white-space:nowrap}
.pv-section::after{content:"";flex:1;height:2px;order:2;background:repeating-linear-gradient(90deg,var(--pv-ui-metal-500) 0 6px,transparent 6px 9px)}
.pv-section::before{content:"";width:6px;height:12px;background:var(--pv-ui-cyan);box-shadow:0 0 0 1.5px var(--pv-ui-ink)}

// mulberry32; state in .s so it can be hashed/inspected.
function Rng(seed){
  if (!(this instanceof Rng)) return new Rng(seed);
  this.s = (seed >>> 0) ^ 0x9E3779B9;
  if (this.s === 0) this.s = 1;
}
Rng.prototype.next = function(){
  var t = (this.s = (this.s + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
Rng.prototype.int = function(n){ return Math.floor(this.next() * n); };
Rng.prototype.range = function(a, b){ return a + (b - a) * this.next(); };
V.Rng = Rng;

(function(){ var G = (typeof window !== 'undefined' ? window : globalThis); var V = G.V = G.V || {};
// Field mods (D2, ch1 pool) + Supply Drop minors. Hook interface: CONTRACT-P1.md "Mods registry".
// Deterministic: randomness only via the rng passed in / api.rng(S).

var D = {
  FRONT_MUL: 0.75, MULTI_DMG: 0.90, MULTI_RATE: 0.85, GAP: 0.12,

};
var RAD = Math.PI / 180;

function equipDmg(S){ return S.tune.HERO_ATK; }          // ATK_total at run start x weapon mult 1
function baseMaxHp(S){ return S.tune.HERO_HP; }          // Hero_BaseMaxHP (DESIGN 3 row 8)
function targetable(e){ return e.hp > 0 && e.st !== 'spawn' && !e.hidden; }
function fl(x){ return Math.max(1, Math.floor(x + 1e-6)); }   // floor, safe for 0.7^n float error
function fx(S, o){ if (S.fx) S.fx.push(o); return o; }
// sim formula: dmg = HERO_ATK x (1+atkAdd) x atkMul x primaryMul x pattern mul; rate = (1+rateAdd) x rateMul

function dmgEnemy(S, e, dmg, api, src){
  dmg = Math.max(1, Math.floor(dmg));
  if (api && api.damageEnemy) return api.damageEnemy(S, e, dmg, false, { dot:true, src:src });
  // fallback when the sim has no api.damageEnemy: no XP/kill bookkeeping (reported to SIM)
  e.hp -= dmg; e.flashT = Math.max(e.flashT || 0, 0.05);

}

// ---- elements (D2 1c, 3d) ----
function applyBurn(S, e){
  if (e.hp <= 0) return;
  if (!(e.burnN > 0)) e.burnCd = D.BURN_DT;              // keep the running tick clock on refresh
  e.burnN = D.BURN_TICKS;
  e.burnDmg = Math.floor(D.BURN_PCT * equipDmg(S));        // re-snapshot
  e.burnT = (e.burnN - 1) * D.BURN_DT + e.burnCd;           // seconds left (renderer reads > 0)
}
function tickBurn(S, dt, api){
  for (var i = 0; i < S.enemies.length; i++) {
    var e = S.enemies[i];
    if (!(e.burnN > 0) || e.hp <= 0) continue;
    e.burnCd -= dt;
    while (e.burnCd <= 1e-9 && e.burnN > 0 && e.hp > 0) {
      e.burnN--; e.burnCd += D.BURN_DT;
      dmgEnemy(S, e, e.burnDmg, api, 'burn');
    }
    e.burnT = e.burnN > 0 ? (e.burnN - 1) * D.BURN_DT + e.burnCd : 0;
  }
}
function applyPoison(S, e){
  if (e.hp <= 0) return;
  var v = Math.floor(D.POISON_PCT * equipDmg(S));
  if (!(e.poisonT > 0)) { e.poisonCd = D.POISON_DT; e.poisonDmg = v; }
  else e.poisonDmg = Math.max(e.poisonDmg || 0, v);       // timer unchanged, value = higher
  e.poisonT = 1e6;                                          // lasts until death / room end
}
function tickPoison(S, dt, api){
  for (var i = 0; i < S.enemies.length; i++) {
    var e = S.enemies[i];
    if (!(e.poisonT > 0) || e.hp <= 0) continue;
    e.poisonCd -= dt;
    while (e.poisonCd <= 1e-9 && e.hp > 0) { e.poisonCd += D.POISON_DT; dmgEnemy(S, e, e.poisonDmg, api, 'poison'); }
  }
}

// ---- travel (D2 3c) ----
function ricoTarget(S, r){
  var best = null, bd = D.RICO_RANGE;
  for (var k = 0; k < S.enemies.length; k++) {
    var o = S.enemies[k];
    if (!targetable(o) || (r.hit && r.hit.indexOf(o.id) >= 0)) continue;
    var d = Math.hypot(o.x - r.x, o.y - r.y);
    if (d < bd) { bd = d; best = o; }                       // line of sight not required (D2 3c-1)
  }
  return best;
}

var M = [
  // ---------- 1a round pattern ----------
  { id:'SK-01', key:'front', name:'Twin barrel', desc:'+1 forward round. All rounds x0.75 damage.',
    max:1, pool:['F', 'BB'], weight:100, hooks:{

        if (f) f.off = -(nf - 1) / 2 * D.FRONT_SPACING;
        for (var i = 1; i < nf; i++) list.push({ ang:0, off:(i - (nf - 1) / 2) * D.FRONT_SPACING, mul:1 });
      } } },
  { id:'SK-02', key:'multi', name:'Double volley', desc:'Fires the volley again 0.12 s later. Dmg x0.9, rate x0.85.',
    max:3, pool:['F', 'BB'], weight:80, echoes:true, hooks:{

  { id:'SK-03', key:'diag', name:'Diagonal rounds', desc:'+1 pair of rounds at 35, then 55, then 75 degrees.',
    max:3, pool:['F'], weight:80, hooks:{
      pattern:function(S, n, list){
        for (var i = 0; i < Math.min(3, n); i++) { var a = D.DIAG[i] * RAD; list.push({ ang:-a, off:0, mul:1 }, { ang:a, off:0, mul:1 }); }
      } } },
  { id:'SK-04', key:'side', name:'Flank rounds', desc:'+1 round left and right (90 degrees).',
    max:3, pool:['F'], weight:70, hooks:{
      pattern:function(S, n, list){
        for (var i = 0; i < n; i++) { var dl = i * D.GAP; list.push({ ang:-Math.PI / 2, off:0, mul:1, delay:dl }, { ang:Math.PI / 2, off:0, mul:1, delay:dl }); }
      } } },
  { id:'SK-05', key:'rear', name:'Rear guard', desc:'+1 round fired straight back.',
    max:3, pool:['F'], weight:60, hooks:{
      pattern:function(S, n, list){ for (var i = 0; i < n; i++) list.push({ ang:Math.PI, off:0, mul:1, delay:i * D.GAP }); } } },
  { id:'SK-06', key:'rico', name:'Ricochet rounds', desc:'Rounds jump to a 2nd machine, up to 3 times (x0.7 each).',
    max:1, pool:['F'], weight:70, hooks:{
      round:function(S, n, r){ r.rico = D.RICO_N; },
      onHit:function(S, n, e, r, api){
        if (r.keep || !(r.rico > 0)) return;
        var o = ricoTarget(S, r);
        if (!o) return;
        var ang = Math.atan2(o.y - r.y, o.x - r.x), sp = Math.hypot(r.vx, r.vy);
        fx(S, { k:'arc', x1:r.x, y1:r.y, x2:o.x, y2:o.y, x:r.x, y:r.y, src:'rico' });
        r.vx = Math.cos(ang) * sp; r.vy = Math.sin(ang) * sp;
        r.dmg = fl(r.dmg * D.RICO_MUL); r.rico--; r.bounces = (r.bounces || 0) + 1;
        r.keep = true;                                      // pierce not spent (D2 3c-1)
      } } },
  { id:'SK-07', key:'pierce', name:'AP rounds', desc:'Rounds pass through machines (x0.67 per hit).',
    max:1, pool:['F'], weight:70, hooks:{
      round:function(S, n, r){ r.pierce = true; },
      onHit:function(S, n, e, r, api){

  // ---------- 1b stat mods ----------

  { id:'SK-10', key:'atk2', name:'Spare cell', desc:'Attack +15%.',

  { id:'SK-11', key:'rate', name:'Fire control', desc:'Attack speed +25%.',
    max:0, pool:['F', 'BB'], weight:100, hooks:{ stats:function(S, n, st){ st.rateAdd += D.RATE * n; } } },
  { id:'SK-12', key:'rate2', name:'Trigger tune', desc:'Attack speed +12.5%.',
    max:4, pool:['SD'], weight:0, hooks:{ stats:function(S, n, st){ st.rateAdd += D.RATE_MINOR * n; } } },
  { id:'SK-13', key:'crit', name:'Crit optics', desc:'Crit chance +10%, crit damage +40%.',
    max:0, pool:['F', 'BB'], weight:100, hooks:{
      stats:function(S, n, st){ st.critAdd += D.CRIT * n; st.critDmgAdd = (st.critDmgAdd || 0) + D.CRIT_DMG * n; } } },
  { id:'SK-14', key:'crit2', name:'Scope tune', desc:'Crit chance +5%, crit damage +20%.',
    max:4, pool:['SD'], weight:0, hooks:{
      stats:function(S, n, st){ st.critAdd += D.CRIT_MINOR * n; st.critDmgAdd = (st.critDmgAdd || 0) + D.CRIT_DMG_MINOR * n; } } },
  { id:'SK-15', key:'armor', name:'Armor plating', desc:'Max HP +20% (120) and heals 120.',
    max:4, pool:['F', 'SD'], weight:90, hooks:{
      stats:function(S, n, st){ st.hpMaxAdd += Math.round(D.HP_UP * baseMaxHp(S)) * n; },
      onPick:function(S, n){
        var h = S.hero, add = Math.round(D.HP_UP * baseMaxHp(S));
        var cap = Math.max(h.maxHp, baseMaxHp(S) + add * n);
        h.hp = Math.min(cap, h.hp + add);
        fx(S, { k:'heal', x:h.x, y:h.y, v:add });
      } } },

  // ---------- 1c elements ----------
  { id:'SK-16', key:'burn', name:'Incendiary rounds', desc:'Hits burn: 27 damage every 0.25 s for 2 s.',
    max:1, pool:['F'], weight:70, hooks:{
      round:function(S, n, r){ r.burn = true; },
      onHit:function(S, n, e, r){ if (r.burn) applyBurn(S, e); },
      tick:function(S, n, dt, api){ tickBurn(S, dt, api); } } },
  { id:'SK-17', key:'poison', name:'Corrosive rounds', desc:'Hits corrode: 52 damage every 1 s until it dies.',
    max:1, pool:['F'], weight:70, hooks:{

  // ---------- 1e sustain / utility ----------
  { id:'SK-27', key:'salvage', name:'Salvage repair', desc:'Each kill heals 9 HP (up to 120 per room).',
    max:1, pool:['F'], weight:60, hooks:{
      onKill:function(S, n, e){
        var h = S.hero, ms = S.modState = S.modState || {};
        var room = S.stage + ':' + S.roomId;
        if (ms.salvRoom !== room) { ms.salvRoom = room; ms.salvHealed = 0; }
        var cap = Math.floor(D.SALVAGE_ROOM_CAP * baseMaxHp(S));
        var v = Math.min(Math.max(1, Math.floor(D.SALVAGE * baseMaxHp(S))), cap - ms.salvHealed, h.maxHp - h.hp);
        if (v <= 0 || h.hp <= 0) return;
        h.hp += v; ms.salvHealed += v;
        fx(S, { k:'heal', x:h.x, y:h.y, v:v });
      } } },
  { id:'SK-33', key:'dodge', name:'Evasion firmware', desc:'20% chance to dodge a hit.',
    max:2, pool:['F'], weight:60, hooks:{
      stats:function(S, n, st){ st.dodge = Math.min(D.DODGE_CAP, (st.dodge || 0) + D.DODGE * n); } } }
];
// copy numbers that depend on tune into desc at load (HERO_ATK/HERO_HP defaults)
(function(){
  var T = V.TUNE_DEFAULTS || { HERO_ATK:150, HERO_HP:600 };
  for (var i = 0; i < M.length; i++) {
    var m = M[i];
    if (m.id === 'SK-16') m.desc = 'Hits burn: ' + Math.floor(D.BURN_PCT * T.HERO_ATK) + ' damage every 0.25 s for 2 s.';
    if (m.id === 'SK-17') m.desc = 'Hits corrode: ' + Math.floor(D.POISON_PCT * T.HERO_ATK) + ' damage every 1 s until it dies.';
    if (m.id === 'SK-15') m.desc = 'Max HP +20% (' + Math.round(D.HP_UP * T.HERO_HP) + ') and heals the same.';
    if (m.id === 'SK-27') m.desc = 'Each kill heals ' + Math.floor(D.SALVAGE * T.HERO_HP) + ' HP (max ' + Math.floor(D.SALVAGE_ROOM_CAP * T.HERO_HP) + ' per room).';
    m.core = D.CORE.indexOf(m.id) >= 0;
  }
})();

// ---- helpers the sim may use ----
function count(S, m){ return (S.hero && S.hero.mods && S.hero.mods[m.key]) || 0; }
function capped(S, m){ return !!m.max && count(S, m) >= m.max; }
function inPool(m, pool){ return m.pool.indexOf(pool) >= 0; }
// Offer k distinct mods from pool ('F' weighted, 'SD' uniform), never a capped one.
// F offers follow D2 2a pity A: at least one core mod when any core is available.
function offer(S, pool, k, rng, opts){
  rng = rng || S.rng; pool = pool || 'F'; k = k || 3;
  var cand = [], i, out = [];
  for (i = 0; i < M.length; i++) if (inPool(M[i], pool) && !capped(S, M[i])) cand.push(i);
  function w(ix){ return pool === 'F' ? (M[ix].weight || 0) : 1; }
  function draw(list){
    var tot = 0, j; for (j = 0; j < list.length; j++) tot += w(list[j]);
    if (tot <= 0) return list.length ? 0 : -1;
    var x = rng.next() * tot;
    for (j = 0; j < list.length; j++) { x -= w(list[j]); if (x < 0) return j; }
    return list.length - 1;
  }
  while (out.length < k && cand.length) { var j = draw(cand); out.push(cand[j]); cand.splice(j, 1); }
  if (pool === 'F' && out.length && !(opts && opts.noPity)) {
    var hasCore = false; for (i = 0; i < out.length; i++) if (M[out[i]].core) hasCore = true;
    var cores = []; for (i = 0; i < cand.length; i++) if (M[cand[i]].core) cores.push(cand[i]);
    if (!hasCore && cores.length) {
      var lo = 0; for (i = 1; i < out.length; i++) if (w(out[i]) < w(out[lo])) lo = i;
      out[lo] = cores[draw(cores)];
    }
  }
  return out;
}
function newStats(){ return { atkAdd:0, atkMul:1, primaryMul:1, rateAdd:0, rateMul:1, critAdd:0, critDmgAdd:0, hpMaxAdd:0, dmgTakenMul:1, moveMul:1, dodge:0, volleys:1 }; }
// Derived stats from all held mods (reference for the sim; same init the hooks expect).
function stats(S){
  var st = newStats();
  for (var i = 0; i < M.length; i++) { var n = count(S, M[i]); if (n > 0 && M[i].hooks.stats) M[i].hooks.stats(S, n, st); }
  return st;
}
function pattern(S){
  var list = [{ ang:0, off:0, mul:1 }];
  for (var i = 0; i < M.length; i++) { var n = count(S, M[i]); if (n > 0 && M[i].hooks.pattern) M[i].hooks.pattern(S, n, list); }
  return list;
}
// Generic dispatcher: V.Mods.call(S, 'onHit', e, r, api) calls every held mod's hook with n prepended.
function call(S, name, a, b, c){
  for (var i = 0; i < M.length; i++) {
    var h = M[i].hooks[name]; if (!h) continue;
    var n = count(S, M[i]); if (n > 0) h(S, n, a, b, c);
  }
}

V.MODS = M;
V.CARDS = V.MODS;
V.Mods = { D:D, offer:offer, stats:stats, newStats:newStats, pattern:pattern, call:call, count:count, capped:capped,
  byId:function(id){ for (var i = 0; i < M.length; i++) if (M[i].id === id) return M[i]; return null; },
  indexOf:function(id){ for (var i = 0; i < M.length; i++) if (M[i].id === id) return i; return -1; } };
})();

<script>
// V.Meta: P1.5 early meta slice (save, credits, one rifle L1-10, three Conditioning stats, debug power, run log).
// Owner META. Load after mods, before sim. Pure data + localStorage (guarded); no network, no Math.random, no Date in stats/cost.
//
// API beyond HOME-CONTRACT.md (read before using):
//   V.Meta.state                     live object (shape in the contract) plus three extra top-level fields:
//                                    buys (Conditioning purchases so far = ladder index), power (0-1), and optional
//                                    schematics/keys (only set by sample(); the real slice never changes them).
//   V.Meta.load(opts) -> state       opts.storage overrides localStorage; opts.fresh ignores the save. '?fresh=1' in the URL also ignores it.
//   V.Meta.save() -> bool            false when there is no storage or it throws.
//   SAVE RULES (F0 #8, 08 section 4). Key 'volley.save.v2' (V.Meta.KEY; v1 held settings, so the shape changed). Settings are NOT in the save.
//     load(): own keys with a lower version are deleted; higher ones are never touched. The text is parsed, then fully validated
//     (V.Meta.validate: types, ranges, known IDs, caps, no unknown fields). Any failure = fresh start, no partial repair.
//   V.Meta.resetSignal               after load(): '' or 'old-version' | 'corrupt' | 'invalid'. When set, show V.Meta.RESET_LINE once
//                                    ("Progress was reset by this update.", 05 3.1: title screen line + one Home toast). Next boot is quiet.
//   V.Meta.storageOk / BLOCKED_LINE  false when storage is missing or throws: the game plays from memory; note = BLOCKED_LINE.
//   V.Meta.readOnly / V.Meta.note    true after load() when a newer build's save exists (a volley.save.vN key with N > 2, or a payload
//                                    v > 2 in our key, shown best-effort): played but never written back; reset() clears it.
//   V.Meta.reset()                   THE one clean reset: fresh state, saved, listeners notified (Settings "Reset save"). Settings survive.
//   V.Meta.settings() / setSetting(k, v)   key 'volley.settings.v1', one JSON object read field by field with defaults. meta.js owns
//                                    .haptics (bool, applied to V.TUNE.HAPTICS); audio.js owns .audio (agent C). Every writer keeps fields it does not own.
//   V.Meta.SAMPLES / SAMPLE_NAMES / loadSample(name, {save})   'fresh' | 'mid' | 'all' (08 rule 8): the debug menu (Intel > Settings,
//                                    ?debug=1 only) and bots use the same three. loadSample saves unless {save:false}.

function layout(){
  var W = G.innerWidth, H = G.innerHeight, st = $('stage'), ins = safeInsets();
  var uw = Math.max(1, W - ins.l - ins.r), uh = Math.max(1, H - ins.t - ins.b);
  var sc = Math.min(uw / FRAME_W, uh / FRAME_H);
  var left = ins.l + (uw - FRAME_W * sc) / 2, top = ins.t + (uh - FRAME_H * sc) / 2;
  var prev = frame0.scale;
  frame0.scale = sc; frame0.left = left; frame0.top = top; frame0.vw = W; frame0.vh = H;
  st.style.width = FRAME_W + 'px'; st.style.height = FRAME_H + 'px';
  st.style.transform = 'translate(' + left + 'px,' + top + 'px) scale(' + sc + ')';
  st.style.setProperty('--pv-scale', String(sc));
  var w = FRAME_W, h = FRAME_H;
  var hud = $('hud').offsetHeight || 62;   // offsetHeight is in frame units (transforms do not change it)
  // Contain fit inside the frame: the room (9x15 tiles) plus the berm below it must sit under the HUD. Safe areas are outside the frame now.
  var oy = hud + 2, s = Math.min(w / 9, (h - oy - BERM_PX) / 15);
  view.w = w; view.h = h; view.dpr = (G.devicePixelRatio || 1) * sc; view.s = s; view.ox = (w - 9 * s) / 2; view.oy = oy;
  view.scale = sc; view.left = left; view.top = top; view.vw = W; view.vh = H;
  if (R) R.resize(w, h, view.dpr);
  UI.placeToast(view);
  if (laidOut && Math.abs(sc - prev) / prev > RESIZE_PAUSE && S && !home && !isEnd() && (S.phase === 'play' || S.phase === 'clear')) pause();
  laidOut = true;
}
// Screen (client) px -> frame units. Input steering is relative, so only the scale matters for drags; taps on DOM are mapped by the browser.
function toFrame(cx, cy){ return { x: (cx - frame0.left) / frame0.scale, y: (cy - frame0.top) / frame0.scale }; }
V.Frame = { W: FRAME_W, H: FRAME_H, toFrame: toFrame, get scale(){ return frame0.scale; }, get left(){ return frame0.left; }, get top(){ return frame0.top; } };

// ---------- events from the sim ----------
function vib(ms){
  var ua = navigator.userActivation;   // vibrate before any tap logs a console error in Chrome
  if (V.TUNE.HAPTICS && ms > 0 && navigator.vibrate && (!ua || ua.hasBeenActive)) { try { navigator.vibrate(ms); } catch (_) {} }
}
function handleEvents(ev, live){
  if (!ev) return;
  var stop = false;
  for (var i = 0; i < ev.length; i++) {
    var e = ev[i];
    switch (e.k) {
      case 'fire': V.Audio.play('fire'); break;
      case 'hit': V.Audio.play('hit'); stop = true; break;
      case 'crit': UI.crit(e.x, e.y, e.dmg, view, S, e.id); stop = true; break;
      case 'kill': V.Audio.play('kill'); vib(V.TUNE.HAPTIC_KILL_MS); stop = true; break;
      case 'hurt': V.Audio.play('hurt'); UI.hurtFlash(); vib(V.TUNE.HAPTIC_HURT_MS); break;
      case 'door': V.Audio.play('door'); awReset(); UI.toast('Stage ' + S.stage + ' clear', 1100); break;
      case 'room': { awReset(); var rm = V.ROOMS && V.ROOMS[S.roomId]; UI.toast('Stage ' + S.stage + (rm ? ': ' + rm.name : ''), 1500); break; }
      case 'levelup': V.Audio.play('levelup'); UI.toast('Level up', 1200); break;
      case 'death': deaths++; break;
      case 'supply': V.Audio.play('door'); break;
      case 'chest': V.Audio.play('levelup'); UI.toast('Cache open', 1400); break;
      case 'boss': UI.toast('Boss: ' + ((S.boss && S.boss.name) || 'incoming'), 1800); break;
      case 'bossphase': V.Audio.play('hurt'); UI.toast('Boss phase 2', 1400); break;
      case 'win': V.Audio.play('levelup'); break;
    }
  }
  if (stop && live && V.TUNE.HITSTOP_MS > 0) hitstopUntil = performance.now() + V.TUNE.HITSTOP_MS;
}
function simStep(inp, live){ V.Sim.step(S, inp); if (V.Scene && V.Scene.ingest) V.Scene.ingest(S.events, S); handleEvents(S.events, live); }

// ---------- overlays ----------
function isEnd(){ return S.phase === 'results' || S.phase === 'dead'; }
function syncPhase(){
  if (S.phase === 'pick' && S.cards) {
    if (!shown.pick) { shown.pick = true; V.Input.release(); UI.cards(S, pick); }
  } else if (shown.pick) { shown.pick = false; UI.show('ovCards', false); }
  if (S.phase === 'supply' && S.supply) {
    if (!shown.supply) { shown.supply = true; V.Input.release(); UI.supply(S, pickSupply); }
  } else if (shown.supply) { shown.supply = false; UI.show('ovSupply', false); }
  // P1: death and boss kill both end in 'results'. A brief 'dead' phase (if the sim has one) shows the same screen.
  if (isEnd()) {
    if (!shown.dead || shown.endPhase !== S.phase) { shown.dead = true; shown.endPhase = S.phase; deadAt = deadAt || performance.now(); V.Input.release(); UI.results(S); }
    var armed = performance.now() - deadAt >= RESULTS_GUARD_MS, ovd = $('ovDead');
    if (ovd.classList.contains('armed') !== armed) ovd.classList.toggle('armed', armed);
  } else if (shown.dead) { shown.dead = false; deadAt = 0; $('ovDead').classList.remove('armed'); UI.show('ovDead', false); }
}
function pickSupply(i){
  if (!S || S.phase !== 'supply') return;
  var f = V.Sim.pickSupply || V.Sim.supply;
  if (f) f(S, i); else V.Sim.pick(S, i);
  if (V.Scene && V.Scene.ingest) V.Scene.ingest(S.events, S);
  handleEvents(S.events, false);
  shown.supply = false; UI.show('ovSupply', false);
  syncPhase();
}
function pick(i){
  if (!S || S.phase !== 'pick') return;
  V.Sim.pick(S, i);
  if (V.Scene && V.Scene.ingest) V.Scene.ingest(S.events, S);
  handleEvents(S.events, false);
  shown.pick = false; UI.show('ovCards', false);
  syncPhase();                                           // another pending level shows the next card screen
}
function restart(){
  S = V.Sim.restart(S); V.Audio.seed(S.seed);
  acc = 0; hitstopUntil = 0; deadAt = 0; moved = false; awReset(); shown.dead = false; UI.show('ovDead', false); shown.pick = false; UI.show('ovCards', false); shown.supply = false; UI.show('ovSupply', false);
  syncPhase(); return S;
}
// Results tap guard: the screen waits RESULTS_GUARD_MS, and only a press that BEGAN after that counts,
// so a finger still on the glass from the fight (or a tap just after the kill) never skips the results.
var RESULTS_GUARD_MS = 1000;
function guardOk(pressT){ return !!(S && isEnd() && deadAt && pressT - deadAt >= RESULTS_GUARD_MS); }
function tryRestart(pressT){ if (guardOk(pressT == null ? performance.now() : pressT)) restart(); }
var resPressAt = 0;

// Handoff with home.js: setHome freezes the sim behind the home screens; start() begins a run at stage 1 (fresh unless S is untouched).
V.Run = {
  setHome: function(on){ home = !!on; if (on) V.Input.release(); acc = 0; last = 0; },
  start: function(){ if (!S) return; if (isEnd() || S.t > 0) restart(); home = false; V.Input.release(); acc = 0; last = 0; moved = false; },
  get home(){ return home; }
};
function pause(){
  if (paused || !S || home) return;
  paused = true; V.Input.release(); V.Audio.setPaused(true); UI.show('ovPause', true);
  if (R) UI.rendererLabel(R, view);   // the card carries the renderer label at once, not only after the next hud() frame (slow host flake)
}
function resume(){
  if (!paused) return;
  paused = false; acc = 0; last = 0; hitstopUntil = 0; V.Audio.setPaused(false); UI.show('ovPause', false);
}

// ---------- auto-walk to the open door (M's pick 3) ----------
var aw = { idle: 0, cancelled: false, on: false };
function awReset(){ aw.idle = 0; aw.cancelled = false; aw.on = false; }
function tileBlocked(S, tx, ty, spikes){
  var a = S.room.solids, cx = tx + 0.5, cy = ty + 0.5;
  for (var i = 0; i < a.length; i++) { var b = a[i]; if (cx > b.x - 0.3 && cx < b.x + b.w + 0.3 && cy > b.y - 0.3 && cy < b.y + b.h + 0.3) return true; }
  if (spikes && S.hazards) for (var j = 0; j < S.hazards.length; j++) { var h = S.hazards[j]; if (cx > h.x && cx < h.x + h.w && cy > h.y && cy < h.y + h.h) return true; }
  return false;
}
function doorPath(S, avoidSpikes){
  var W = S.room.w || 9, H = S.room.h || 15, d = S.room.door, h = S.hero;
  var gx = Math.floor(d.x + d.w / 2), gy = Math.floor(d.y + d.h / 2), sx = Math.min(W - 1, Math.max(0, Math.floor(h.x))), sy = Math.min(H - 1, Math.max(0, Math.floor(h.y)));
  var prev = new Int16Array(W * H).fill(-1), q = [sy * W + sx]; prev[sy * W + sx] = sy * W + sx;
  for (var qi = 0; qi < q.length; qi++) {
    var c = q[qi], cx = c % W, cy = (c / W) | 0;
    if (cx === gx && cy === gy) break;
    var nb = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (var k = 0; k < 4; k++) {
      var nx = cx + nb[k][0], ny = cy + nb[k][1]; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      var ni = ny * W + nx; if (prev[ni] !== -1) continue;
      if (!(nx === gx && ny === gy) && tileBlocked(S, nx, ny, avoidSpikes)) continue;
      prev[ni] = c; q.push(ni);
    }
  }
  var g = gy * W + gx; if (prev[g] === -1) return null;
  var path = []; for (var p = g; p !== sy * W + sx; p = prev[p]) path.push(p); path.reverse();
  return path.map(function(i){ return { x: (i % W) + 0.5, y: ((i / W) | 0) + 0.5 }; });
}
function doorDir(){
  var h = S.hero, d = S.room.door, tx = d.x + d.w / 2, ty = d.y + d.h / 2;
  if (!(V.Sim.clearLine && V.Sim.clearLine(S, h.x, h.y, tx, ty, 0.36))) {
    var path = doorPath(S, true) || doorPath(S, false);
    if (path && path.length) {
      var t = path[0];
      for (var i = path.length - 1; i >= 0; i--) if (V.Sim.clearLine(S, h.x, h.y, path[i].x, path[i].y, 0.36)) { t = path[i]; break; }
      tx = t.x; ty = t.y;
    }
  }
  var dx = tx - h.x, dy = ty - h.y, l = Math.sqrt(dx * dx + dy * dy) || 1;
  return { mx: dx / l, my: dy / l };
}
function autoWalkInput(inp, dtS){
  if (S.phase !== 'clear' || !V.TUNE.AUTO_WALK || aw.cancelled) { aw.idle = 0; return inp; }
  if (V.Input.down || inp.mx || inp.my) { aw.idle = 0; return inp; }
  aw.idle += dtS;
  if (aw.idle < (V.TUNE.AUTO_WALK_DELAY || 0)) return inp;
  var dir = doorDir(), h = S.hero;
  if (!aw.on) { aw.on = true; V.Input.note('aw', h.x * 10, h.y * 10); }
  return dir;
}

// ---------- loop ----------
function frame(ts){
  requestAnimationFrame(frame);
  var dt = last ? ts - last : STEP_MS; last = ts;
  if (!S || !R) return;
  var running = !home && !paused && !frozen && !UI.drawerOpen() && (S.phase === 'play' || S.phase === 'clear');
  if (!paused && !document.hidden) {
    frames++; ft.push(dt); if (ft.length > FT_MAX) ft.shift(); if (dt > 50 && frames > 3) gaps++;
  }
  if (running) {
    if (ts < hitstopUntil) acc = 0;
    else {
      acc += Math.min(dt, 250);
      var n = 0;
      while (acc >= STEP_MS && n < MAX_STEPS) {
        simStep(autoWalkInput(V.Input.read(), 1 / 60), true); acc -= STEP_MS; n++;
        if (hitstopUntil > ts || (S.phase !== 'play' && S.phase !== 'clear')) { acc = 0; break; }
      }
      if (n >= MAX_STEPS) acc = 0;                       // never chase a long stall (L-LOL-2)
    }
  } else if (!paused && !frozen && !UI.drawerOpen()) {
    // pick/dead: the sim may still animate; nothing to step here
  }
  syncPhase();
  draw();
}
function draw(){
  V.Scene.build(S, view, list);
  R.draw(list, view);
  UI.hud(S, R, view);
  if (!moved && (V.Input.active || S.stage > 1)) moved = true;
  UI.howto(!moved && S.phase === 'play', view);
}

function pct(a, p){ if (!a.length) return 0; var b = a.slice().sort(function(x, y){ return x - y; }); return Math.round(b[Math.min(b.length - 1, Math.floor(p * b.length))] * 10) / 10; }
function metrics(){
  return { S: S, renderer: R ? R.name + (R.why ? ' (' + R.why + ')' : '') : 'none', viewport: Math.round(view.w) + 'x' + Math.round(view.h),
    frame: { p50: pct(ft, 0.5), p95: pct(ft, 0.95), max: Math.round(Math.max.apply(null, ft.concat([0])) * 10) / 10, n: ft.length },
    gaps: gaps, deaths: deaths };
}

// ---------- boot ----------
function boot(){
  if (!V.Sim || !V.Scene || !V.Render || !V.TUNE) { fail('Missing parts: ' + ['Sim', 'Scene', 'Render', 'TUNE'].filter(function(k){ return !V[k]; }).join(', ')); return; }
  UI.init({ metrics: metrics, onDrawer: function(on){ if (on) V.Input.release(); acc = 0; last = 0; } });
  var stage = $('stage');
  V.Input.attach(document.body, V.TUNE);   // body, not #stage: in a run a touch that starts in a bar steers too (spec 05 s1)
  layout();
  G.addEventListener('resize', layout);
  if (G.visualViewport) G.visualViewport.addEventListener('resize', layout);

  var seed = Q.has('seed') ? (parseInt(Q.get('seed'), 10) | 0) : (Date.now() % 1000000);
  var stress = parseInt(Q.get('stress') || '0', 10) | 0; if (stress > 0) V.Scene.stress = stress;
  S = V.Sim.create(seed, V.TUNE); V.Audio.seed(seed);

  document.addEventListener('visibilitychange', function(){ if (document.hidden) pause(); });
  G.addEventListener('blur', pause);
  G.addEventListener('pagehide', pause);
  $('ovPause').addEventListener('pointerdown', function(e){ if (e.target.closest && e.target.closest('button')) return; e.preventDefault(); resume(); });
  $('btnHome').addEventListener('click', function(e){ if (guardOk(e.detail === 0 ? performance.now() : (resPressAt > deadAt ? resPressAt : 0)) && V.Home) V.Home.show(); });
  $('btnResume').addEventListener('click', resume);
  $('pauseBtn').addEventListener('click', function(){ pause(); });
  $('btnRestartRun').addEventListener('click', function(e){ e.stopPropagation(); restart(); resume(); });
  $('btnTune').addEventListener('click', function(e){ e.stopPropagation(); UI.openDrawer(true); });
  // Any touch during the clear phase cancels auto-walk for this room.
  stage.addEventListener('pointerdown', function(e){
    if (S && S.phase === 'clear' && !aw.cancelled && !(e.target.closest && e.target.closest('button, .ov, #drawer'))) { aw.cancelled = true; V.Input.note(aw.on ? 'awx' : 'awc', 0, 0); }
  }, true);
  $('ovDead').addEventListener('pointerdown', function(e){ resPressAt = performance.now(); });
  // A click counts only when its press began on this screen after the guard (keyboard clicks have detail 0).
  $('btnRestart').addEventListener('click', function(e){ tryRestart(e.detail === 0 ? performance.now() : (resPressAt > deadAt ? resPressAt : 0)); });
  G.addEventListener('keydown', function(e){
    if (paused && (e.key === ' ' || e.key === 'Enter' || e.key === 'Escape')) { resume(); return; }
    if (S && isEnd() && !e.repeat && (e.key === ' ' || e.key === 'Enter' || e.key === 'r')) tryRestart();
    if (S && S.phase === 'supply' && /^[1-2]$/.test(e.key) && S.supply && +e.key <= S.supply.length) pickSupply(+e.key - 1);
    if (S && S.phase === 'pick' && /^[1-3]$/.test(e.key) && S.cards && +e.key <= S.cards.length) pick(+e.key - 1);
  });

  V.Render.create({ c2d: $('c2d'), cgpu: $('cgpu'), forceCanvas: Q.get('gpu') === '0' }).then(function(r){
    R = r; layout();
    if (R.onChange) R.onChange(function(){ layout(); UI.rendererLabel(R, view); });
    UI.show('ovBoot', false);
    syncPhase();
    requestAnimationFrame(frame);
  }).catch(function(e){ console.error(e); fail('Renderer failed: ' + (e && e.message)); });

  G.__pv = {
    get renderer(){ return R ? R.name : 'none'; },
    get rendererWhy(){ return R ? R.why : ''; },
    get R(){ return R; },
    get S(){ return S; },
    get paused(){ return paused; },
    get view(){ return view; },
    get frame(){ return { scale: frame0.scale, left: frame0.left, top: frame0.top, w: FRAME_W * frame0.scale, h: FRAME_H * frame0.scale, vw: frame0.vw, vh: frame0.vh }; },
    toFrame: toFrame,
    get frozen(){ return frozen; },
    get autoWalk(){ return { idle: aw.idle, cancelled: aw.cancelled, on: aw.on }; },
    get lastCopy(){ return UI.lastCopy; },
    step: function(n, inp){
      n = n || 1; inp = inp || { mx: 0, my: 0 };
      for (var i = 0; i < n; i++) simStep(typeof inp === 'function' ? inp(S) : inp, false);
      syncPhase(); if (R) draw(); return S;
    },
    pick: function(i){ pick(i); return S; },
    doorDir: function(){ return S ? doorDir() : { mx: 0, my: 0 }; },  // same path the auto-walk uses
    pickSupply: function(i){ pickSupply(i); return S; },
    restart: function(){ return restart(); },
    get home(){ return home; },
    readback: function(){ return R && R.readback ? R.readback() : Promise.resolve(null); },
    freeze: function(on){ frozen = on !== false; acc = 0; return frozen; },  // stop real-time stepping (deterministic tests)
    pause: pause, resume: resume,
    drawer: function(on){ UI.openDrawer(on); },
    report: function(){ return UI.report(); },
    metrics: metrics,
    hash: function(){ return V.Sim.hash ? V.Sim.hash(S) : null; },
    tune: V.TUNE,
    input: V.Input,
    audio: V.Audio,
    build: UI.BUILD
  };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
<script>if('serviceWorker' in navigator&&isSecureContext)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e)));try{screen.orientation&&screen.orientation.lock&&matchMedia('(display-mode: fullscreen)').matches&&screen.orientation.lock('portrait').catch(()=>{});}catch(_){}</script>
